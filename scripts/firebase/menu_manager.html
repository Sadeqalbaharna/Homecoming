<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tavern — Menu Manager</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d0b09;
  --bg2:       #151210;
  --bg3:       #1e1a16;
  --border:    #3a2e22;
  --gold:      #c9a96e;
  --gold-bright: #f0c060;
  --text:      #d4bc94;
  --muted:     #7a6a55;
  --green:     #5cb85c;
  --red:       #e74c3c;
  --blue:      #4a90d9;
  --panel-w:   400px;
  --sidebar-w: 200px;
}

body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text);
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── Header ─────────────────────────────────────────────────────────────── */
header { background: var(--bg2); border-bottom: 1px solid var(--border);
         padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
header h1 { color: var(--gold-bright); font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
#searchBox { flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
             padding: 7px 12px; border-radius: 4px; font-size: 14px; font-family: inherit; }
#searchBox::placeholder { color: var(--muted); }
#newBtn { background: var(--bg3); border: 1px solid var(--gold); color: var(--gold-bright);
          padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; white-space: nowrap; }
#newBtn:hover { background: #2a2018; }
#status { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
#statusDot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
#statusDot.ok  { background: var(--green); }
#statusDot.err { background: var(--red); }

/* ── Layout ─────────────────────────────────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
aside { width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
        overflow-y: auto; flex-shrink: 0; }
.cat-item { padding: 10px 16px; cursor: pointer; font-size: 13px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #1e1a16; }
.cat-item:hover { background: var(--bg3); }
.cat-item.active { background: #2a2018; color: var(--gold-bright); border-left: 3px solid var(--gold); }
.cat-count { background: var(--bg3); color: var(--muted); border-radius: 10px;
             padding: 1px 7px; font-size: 11px; }
.cat-item.active .cat-count { background: var(--border); color: var(--gold); }

/* ── Grid ────────────────────────────────────────────────────────────────── */
.grid-wrap { flex: 1; overflow-y: auto; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
        cursor: pointer; transition: border-color .15s; overflow: hidden; }
.card:hover { border-color: var(--gold); }
.card.unavailable { opacity: 0.45; }
.card-img { width: 100%; height: 120px; object-fit: cover; background: var(--bg3);
            display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 28px; }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { padding: 10px; }
.card-name { font-size: 13px; color: var(--gold-bright); margin-bottom: 4px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-price { font-size: 14px; color: var(--text); margin-bottom: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 3px; }
.badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: sans-serif; }
.badge-nuts    { background: #5a3a1a; color: #e8a04a; }
.badge-gluten  { background: #4a3a20; color: #d4a444; }
.badge-dairy   { background: #2a3a50; color: #6ab0e0; }
.badge-eggs    { background: #4a4420; color: #d4c044; }
.badge-fish    { background: #1a3a4a; color: #44b0d0; }
.badge-sesame  { background: #3a2a40; color: #b08ad0; }
.badge-sulfites{ background: #3a1a2a; color: #d06090; }
.badge-veg     { background: #1a3a1a; color: #60d060; }
.badge-vegan   { background: #1a3a20; color: #50e080; }
.badge-gf      { background: #3a1a1a; color: #d06060; }
.badge-new     { background: #3a2a10; color: #f0a030; }
.badge-best    { background: #3a2a10; color: #f0c030; }

.empty-state { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--muted); }

/* ── Edit Panel ──────────────────────────────────────────────────────────── */
.panel { width: var(--panel-w); background: var(--bg2); border-left: 1px solid var(--border);
         display: flex; flex-direction: column; overflow: hidden;
         transform: translateX(100%); transition: transform .25s ease; flex-shrink: 0; }
.panel.open { transform: translateX(0); }

.panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
                display: flex; justify-content: space-between; align-items: center; }
.panel-header h2 { color: var(--gold-bright); font-size: 15px; }
.panel-header button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.panel-header button:hover { color: var(--text); }

.panel-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* Image upload area */
.img-upload { border: 2px dashed var(--border); border-radius: 6px; height: 160px;
              display: flex; align-items: center; justify-content: center;
              cursor: pointer; position: relative; overflow: hidden; transition: border-color .15s; }
.img-upload:hover { border-color: var(--gold); }
.img-upload img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.img-upload .img-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.5);
                            display: flex; flex-direction: column; align-items: center;
                            justify-content: center; gap: 6px; opacity: 0; transition: opacity .15s; }
.img-upload:hover .img-overlay, .img-upload.empty .img-overlay { opacity: 1; }
.img-overlay span { font-size: 28px; }
.img-overlay p { font-size: 12px; color: var(--text); }
#fileInput { display: none; }
.upload-progress { font-size: 12px; color: var(--gold); text-align: center; display: none; }

/* Form fields */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.field input, .field select, .field textarea {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 8px 10px; border-radius: 4px; font-size: 13px; font-family: inherit; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--gold); }
.field textarea { resize: vertical; min-height: 70px; }
.field select option { background: var(--bg3); }

/* Allergen chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
        border: 1px solid var(--border); background: var(--bg3); color: var(--muted);
        transition: all .15s; user-select: none; }
.chip.on { border-color: var(--gold); background: #2a2018; color: var(--gold-bright); }

/* Toggle buttons */
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
          border: 1px solid var(--border); background: var(--bg3); color: var(--muted);
          transition: all .15s; user-select: none; }
.toggle.on { background: #1a3020; border-color: var(--green); color: #80e890; }
.toggle.warn.on { background: #302010; border-color: #c9a96e; color: #f0c060; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Panel footer */
.panel-footer { padding: 14px 18px; border-top: 1px solid var(--border);
                display: flex; gap: 10px; }
.btn-save { flex: 1; background: #2a4a2a; border: 1px solid var(--green);
            color: #80e890; padding: 10px; border-radius: 4px; cursor: pointer;
            font-size: 14px; font-family: inherit; }
.btn-save:hover { background: #335033; }
.btn-del  { background: #3a1a1a; border: 1px solid #8a3030;
            color: #e07070; padding: 10px 16px; border-radius: 4px; cursor: pointer;
            font-size: 14px; font-family: inherit; }
.btn-del:hover { background: #4a2020; }

/* Toast */
#toast { position: fixed; bottom: 24px; right: 24px; background: #2a2018;
         border: 1px solid var(--gold); color: var(--gold-bright); padding: 12px 20px;
         border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .3s;
         pointer-events: none; z-index: 999; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🍺 The Tavern — Menu Manager</h1>
  <input id="searchBox" type="text" placeholder="Search items…" oninput="renderGrid()">
  <button id="newBtn" onclick="openNew()">＋ New Item</button>
  <div id="status"><div id="statusDot"></div><span id="statusText">Connecting…</span></div>
</header>

<div class="main">
  <aside id="sidebar"></aside>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>

  <div class="panel" id="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Edit Item</h2>
      <button onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body">

      <!-- Image -->
      <div class="img-upload empty" id="imgUpload" onclick="document.getElementById('fileInput').click()">
        <img id="imgPreview" src="" style="display:none">
        <div class="img-overlay">
          <span>🖼</span><p>Click or drop image</p>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
      <div class="upload-progress" id="uploadProgress">Uploading…</div>

      <!-- Name & Category -->
      <div class="row2">
        <div class="field"><label>Name</label><input id="fName" type="text"></div>
        <div class="field"><label>Category</label>
          <select id="fCat">
            <option>To Share</option><option>Sandwiches</option><option>Hearty Meals</option>
            <option>Flatbread</option><option>Bowls & Pies</option><option>Big Salad Bowl</option>
            <option>Sweet Tooth</option><option>Kids Meals</option><option>Everyday Drinks</option>
            <option>Signature Creations</option><option>Thematic Creations</option>
          </select>
        </div>
      </div>

      <!-- Price & Sort -->
      <div class="row2">
        <div class="field"><label>Price (BHD)</label><input id="fPrice" type="number" step="0.5" min="0"></div>
        <div class="field"><label>Sort Order</label><input id="fSort" type="number" min="0"></div>
      </div>

      <!-- Description -->
      <div class="field"><label>Description</label><textarea id="fDesc"></textarea></div>

      <!-- Allergens -->
      <div class="field">
        <label>Allergens</label>
        <div class="chips" id="allergenChips">
          <div class="chip" data-a="nuts">🥜 Nuts</div>
          <div class="chip" data-a="gluten">🌾 Gluten</div>
          <div class="chip" data-a="dairy">🥛 Dairy</div>
          <div class="chip" data-a="eggs">🥚 Eggs</div>
          <div class="chip" data-a="fish">🐟 Fish</div>
          <div class="chip" data-a="sesame">🌿 Sesame</div>
          <div class="chip" data-a="sulfites">🍷 Sulfites</div>
        </div>
      </div>

      <!-- Dietary & Status -->
      <div class="field">
        <label>Dietary & Status</label>
        <div class="toggles">
          <div class="toggle" data-t="isVegetarian">🌱 Vegetarian</div>
          <div class="toggle" data-t="isVegan">🌿 Vegan</div>
          <div class="toggle" data-t="canBeVegan">🔄 Vegan Option</div>
          <div class="toggle" data-t="isGlutenFree">🚫🌾 Gluten Free</div>
          <div class="toggle warn" data-t="isNew">✨ New</div>
          <div class="toggle warn" data-t="isBestSeller">⭐ Best Seller</div>
          <div class="toggle" data-t="isAvailable" style="--def-on:1">✅ Available</div>
        </div>
      </div>

      <!-- Kai Notes -->
      <div class="field">
        <label>Kai's Notes</label>
        <textarea id="fKai" placeholder="Tips for Kai when answering questions about this item…"></textarea>
      </div>

    </div>
    <div class="panel-footer">
      <button class="btn-save" onclick="saveItem()">Save</button>
      <button class="btn-del" id="delBtn" onclick="deleteItem()" style="display:none">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ── Config ────────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:            'AIzaSyB5K8_jbh-95R78mz8mp2YunY7wHnIbxWk',
  authDomain:        'kingdom-ac44f.firebaseapp.com',
  databaseURL:       'https://kingdom-ac44f-default-rtdb.europe-west1.firebasedatabase.app',
  projectId:         'kingdom-ac44f',
  storageBucket:     'kingdom-ac44f.firebasestorage.app',
  messagingSenderId: '968566097636',
  appId:             '1:968566097636:android:f561d9a981d215d25a0ef1',
});

const db      = firebase.database();
const storage = firebase.storage();
const auth    = firebase.auth();

// ── State ─────────────────────────────────────────────────────────────────
let allItems      = {};   // key → item object
let activeCategory = 'All';
let editingKey    = null; // null = new item
let pendingImageUrl = null;

const CATEGORIES = [
  'To Share','Sandwiches','Hearty Meals','Flatbread','Bowls & Pies',
  'Big Salad Bowl','Sweet Tooth','Kids Meals','Everyday Drinks',
  'Signature Creations','Thematic Creations',
];
const ALLERGENS = ['nuts','gluten','dairy','eggs','fish','sesame','sulfites'];
const TOGGLES   = ['isVegetarian','isVegan','canBeVegan','isGlutenFree','isNew','isBestSeller','isAvailable'];

// ── Firebase init ─────────────────────────────────────────────────────────
auth.signInAnonymously().catch(() => {});

const dot  = document.getElementById('statusDot');
const stxt = document.getElementById('statusText');

db.ref('menu').on('value', snap => {
  allItems = snap.val() || {};
  dot.className = 'ok'; stxt.textContent = `${Object.keys(allItems).length} items`;
  renderSidebar();
  renderGrid();
}, err => {
  dot.className = 'err'; stxt.textContent = 'Error: ' + err.message;
});

// ── Sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const counts = {};
  CATEGORIES.forEach(c => counts[c] = 0);
  Object.values(allItems).forEach(it => { if (counts[it.category] !== undefined) counts[it.category]++; });
  const total = Object.keys(allItems).length;

  const sb = document.getElementById('sidebar');
  sb.innerHTML = `<div class="cat-item ${activeCategory==='All'?'active':''}" onclick="setCategory('All')">
    <span>All Items</span><span class="cat-count">${total}</span></div>`;
  CATEGORIES.forEach(c => {
    sb.innerHTML += `<div class="cat-item ${activeCategory===c?'active':''}" onclick="setCategory('${c}')">
      <span>${c}</span><span class="cat-count">${counts[c]||0}</span></div>`;
  });
}

function setCategory(cat) {
  activeCategory = cat;
  renderSidebar();
  renderGrid();
}

// ── Grid ──────────────────────────────────────────────────────────────────
function renderGrid() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  let items = Object.values(allItems);
  if (activeCategory !== 'All') items = items.filter(it => it.category === activeCategory);
  if (q) items = items.filter(it => (it.name||'').toLowerCase().includes(q) || (it.description||'').toLowerCase().includes(q));
  items.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));

  const grid = document.getElementById('grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty-state">No items — use ＋ New to add one</div>';
    return;
  }
  grid.innerHTML = items.map(it => cardHtml(it)).join('');
}

function cardHtml(it) {
  const imgHtml = it.imageUrl
    ? `<div class="card-img"><img src="${it.imageUrl}" loading="lazy" onerror="this.parentElement.innerHTML='🍽'"></div>`
    : `<div class="card-img">🍽</div>`;

  const allergenBadges = (it.allergens||[]).map(a => `<span class="badge badge-${a}">${a}</span>`).join('');
  const dietBadges = [
    it.isVegetarian ? '<span class="badge badge-veg">veg</span>' : '',
    it.isVegan      ? '<span class="badge badge-vegan">vegan</span>' : '',
    it.canBeVegan   ? '<span class="badge badge-vegan">vegan-opt</span>' : '',
    it.isGlutenFree ? '<span class="badge badge-gf">gf</span>' : '',
    it.isNew        ? '<span class="badge badge-new">new</span>' : '',
    it.isBestSeller ? '<span class="badge badge-best">★</span>' : '',
  ].join('');

  return `<div class="card ${it.isAvailable===false?'unavailable':''}" onclick="openEdit('${it.key}')">
    ${imgHtml}
    <div class="card-body">
      <div class="card-name">${it.name}</div>
      <div class="card-price">${it.price ? it.price.toFixed(3) + ' BHD' : '—'}</div>
      <div class="badges">${allergenBadges}${dietBadges}</div>
    </div>
  </div>`;
}

// ── Panel open/close ──────────────────────────────────────────────────────
function openEdit(key) {
  const it = allItems[key];
  if (!it) return;
  editingKey = key;
  pendingImageUrl = null;
  document.getElementById('panelTitle').textContent = it.name || 'Edit Item';
  document.getElementById('delBtn').style.display = '';

  // Image
  setPreviewImage(it.imageUrl);

  // Fields
  document.getElementById('fName').value   = it.name || '';
  document.getElementById('fCat').value    = it.category || 'To Share';
  document.getElementById('fPrice').value  = it.price || '';
  document.getElementById('fSort').value   = it.sortOrder || '';
  document.getElementById('fDesc').value   = it.description || '';
  document.getElementById('fKai').value    = it.kaiNotes || '';

  // Allergens
  document.querySelectorAll('#allergenChips .chip').forEach(c => {
    c.classList.toggle('on', (it.allergens||[]).includes(c.dataset.a));
  });

  // Toggles
  document.querySelectorAll('.toggles .toggle').forEach(t => {
    t.classList.toggle('on', !!it[t.dataset.t]);
  });

  openPanel();
}

function openNew() {
  editingKey = null;
  pendingImageUrl = null;
  document.getElementById('panelTitle').textContent = 'New Item';
  document.getElementById('delBtn').style.display = 'none';

  setPreviewImage('');
  document.getElementById('fName').value  = '';
  document.getElementById('fCat').value   = 'To Share';
  document.getElementById('fPrice').value = '';
  document.getElementById('fSort').value  = '';
  document.getElementById('fDesc').value  = '';
  document.getElementById('fKai').value   = '';

  document.querySelectorAll('#allergenChips .chip').forEach(c => c.classList.remove('on'));
  document.querySelectorAll('.toggles .toggle').forEach(t => {
    t.classList.toggle('on', t.dataset.t === 'isAvailable');
  });

  openPanel();
}

function openPanel()  { document.getElementById('panel').classList.add('open'); }
function closePanel() { document.getElementById('panel').classList.remove('open'); }

// ── Image ─────────────────────────────────────────────────────────────────
function setPreviewImage(url) {
  const wrap = document.getElementById('imgUpload');
  const img  = document.getElementById('imgPreview');
  if (url) {
    img.src = url; img.style.display = 'block';
    wrap.classList.remove('empty');
  } else {
    img.src = ''; img.style.display = 'none';
    wrap.classList.add('empty');
  }
}

function handleFile(file) {
  if (!file) return;
  // Local preview immediately
  const reader = new FileReader();
  reader.onload = e => setPreviewImage(e.target.result);
  reader.readAsDataURL(file);

  // Upload to Storage
  const prog = document.getElementById('uploadProgress');
  prog.style.display = 'block';
  prog.textContent = 'Uploading…';

  const key   = editingKey || toKey(document.getElementById('fName').value || 'new-item');
  const ref   = storage.ref(`menu-images/${key}/${Date.now()}-${file.name}`);
  const task  = ref.put(file);

  task.on('state_changed',
    snap => {
      const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
      prog.textContent = `Uploading… ${pct}%`;
    },
    err => { prog.textContent = '❌ Upload failed: ' + err.message; },
    async () => {
      pendingImageUrl = await ref.getDownloadURL();
      setPreviewImage(pendingImageUrl);
      prog.textContent = '✅ Uploaded';
      setTimeout(() => { prog.style.display = 'none'; }, 2000);
    }
  );
}

// Drag & drop
document.getElementById('imgUpload').addEventListener('dragover', e => { e.preventDefault(); });
document.getElementById('imgUpload').addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleFile(file);
});

// Allergen chip toggle
document.querySelectorAll('#allergenChips .chip').forEach(c => {
  c.addEventListener('click', () => c.classList.toggle('on'));
});

// Toggle buttons
document.querySelectorAll('.toggles .toggle').forEach(t => {
  t.addEventListener('click', () => t.classList.toggle('on'));
});

// ── Save ──────────────────────────────────────────────────────────────────
function toKey(name) {
  return name.toLowerCase().replace(/[.#$[\]/]/g,'_').replace(/\s+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}

async function saveItem() {
  const name = document.getElementById('fName').value.trim();
  if (!name) { toast('Name is required'); return; }

  const key = editingKey || toKey(name);
  const existing = allItems[key] || {};

  const allergens = [...document.querySelectorAll('#allergenChips .chip.on')].map(c => c.dataset.a);
  const flags = {};
  document.querySelectorAll('.toggles .toggle').forEach(t => { flags[t.dataset.t] = t.classList.contains('on'); });

  const item = {
    ...existing,
    key,
    name,
    category:    document.getElementById('fCat').value,
    price:       parseFloat(document.getElementById('fPrice').value) || 0,
    sortOrder:   parseInt(document.getElementById('fSort').value)    || 0,
    description: document.getElementById('fDesc').value.trim(),
    kaiNotes:    document.getElementById('fKai').value.trim(),
    allergens,
    ...flags,
    imageUrl:    pendingImageUrl ?? existing.imageUrl ?? '',
    updatedAt:   new Date().toISOString(),
  };
  if (!existing.createdAt) item.createdAt = new Date().toISOString();

  try {
    await db.ref(`menu/${key}`).set(item);
    editingKey = key;
    document.getElementById('panelTitle').textContent = name;
    document.getElementById('delBtn').style.display = '';
    pendingImageUrl = null;
    toast('✅ Saved');
  } catch (err) {
    toast('❌ ' + err.message);
  }
}

// ── Delete ─────────────────────────────────────────────────────────────────
async function deleteItem() {
  if (!editingKey) return;
  if (!confirm(`Delete "${allItems[editingKey]?.name}"?`)) return;
  try {
    await db.ref(`menu/${editingKey}`).remove();
    closePanel();
    toast('Deleted');
  } catch (err) {
    toast('❌ ' + err.message);
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveItem(); }
});
</script>
</body>
</html>
