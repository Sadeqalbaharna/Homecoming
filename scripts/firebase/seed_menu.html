// ── RTDB helpers ───────────────────────────────────────────────────────────
function toKey(name) {
  // RTDB keys can't contain . # $ [ ]
  return name.toLowerCase().replace(/[.#$[\]/]/g, '_').replace(/\s+/g, '_').replace(/_+/g, '_');
}

async function rtdbGet(path) {
  const res = await fetch(`${RTDB}/${path}.json`);
  if (!res.ok) throw new Error(`GET ${path} → ${res.status}`);
  return res.json();
}

async function rtdbPut(path, data) {
  const res = await fetch(`${RTDB}/${path}.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  if (!res.ok) { const e = await res.json(); throw new Error(`${res.status}: ${JSON.stringify(e)}`); }
}

// ── Seed runner ────────────────────────────────────────────────────────────
async function runSeed() {
  const btn   = document.getElementById('seedBtn');
  const force = document.getElementById('forceCheck').checked;
  btn.disabled = true;
  logEl.innerHTML = '';

  log(`🍺  Seeding Tavern menu → RTDB (kingdom-ac44f)`, 'info');
  log(`    Mode: ${force ? 'FORCE OVERWRITE' : 'add-new-only'}`, 'info');
  log('', 'info');

  const progressEl = document.getElementById('progress');
  const barEl      = document.getElementById('progress-bar');
  const labelEl    = document.getElementById('progress-label');
  progressEl.style.display = 'block';
  barEl.style.width = '0%';
  labelEl.textContent = `0 / ${MENU.length}`;

  try {
    // Fetch existing menu from RTDB
    log('Fetching existing items…', 'info');
    const existing = (await rtdbGet('menu')) || {};
    const existingKeys = new Set(Object.keys(existing));
    log(`Found ${existingKeys.size} existing item(s).`, 'info');
    log('', 'info');

    let added = 0, updated = 0, skipped = 0, done = 0;
    const now = new Date().toISOString();

    for (const item of MENU) {
      const key = toKey(item.name);
      const doc = {
        isVegetarian: false, isVegan: false, canBeVegan: false,
        isGlutenFree: false, isNew: false, isBestSeller: false,
        isAvailable: true, imageUrl: '', kaiNotes: '',
        ...item,
        key,
        updatedAt: now,
      };

      labelEl.textContent = `${done} / ${MENU.length}  ✍️  ${item.name}…`;

      try {
        if (existingKeys.has(key) && force) {
          await rtdbPut(`menu/${key}`, { ...existing[key], ...doc });
          log(`  ↻  ${item.name}`, 'ok');
          updated++;
        } else if (!existingKeys.has(key)) {
          doc.createdAt = now;
          await rtdbPut(`menu/${key}`, doc);
          log(`  ＋  ${item.name}`, 'ok');
          added++;
        } else {
          log(`  ·  ${item.name} (exists — skipped)`, 'skip');
          skipped++;
        }
      } catch (itemErr) {
        log(`  ❌  ${item.name} — ${itemErr.message}`, 'err');
      }

      done++;
      const pct = Math.round((done / MENU.length) * 100);
      barEl.style.width = pct + '%';
      labelEl.textContent = `${done} / ${MENU.length}  (${pct}%)`;
    }

    barEl.style.background = '#5cb85c';
    labelEl.textContent = `✅  ${MENU.length} / ${MENU.length} — done`;
    log('', 'info');
    log(`✅  Done — ${added} added, ${updated} updated, ${skipped} skipped`, 'done');

  } catch (err) {
    log(`❌  ${err.message}`, 'err');
    console.error(err);
  }

  btn.disabled = false;
}
</script>
</body>
</html>
