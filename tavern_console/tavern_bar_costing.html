<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Tavern — Bar Costing</title>
<style>
:root{--bg:#070a10;--panel:#0e1626;--line:#1d2b42;--gold:#cfe3ff;--amber:#7fb2ff;
--txt:#efe6d6;--dim:#9c8f7a;--good:#7ee787;--warn:#ffc862;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;
background:linear-gradient(180deg,#0b1220,#070a10);position:sticky;top:0;z-index:10}
h1{font-size:16px;margin:0;color:var(--gold);letter-spacing:.5px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 13px;
border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.4px}
nav button.on{background:var(--amber);color:#06101f;border-color:var(--amber)}
main{padding:18px 20px 60px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:700;color:var(--gold);line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:57px;background:#0a121e;cursor:pointer}
td{padding:8px;border-bottom:1px solid #16233a}
tr:hover td{background:#0c1524}
.num{text-align:right;font-variant-numeric:tabular-nums}
input{background:#080d16;border:1px solid var(--line);color:var(--gold);border-radius:6px;
padding:4px 7px;width:88px;font:inherit;text-align:right}
input:focus{outline:1px solid var(--amber)}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block}
.g{background:rgba(126,231,135,.15);color:var(--good)}
.w{background:rgba(255,200,98,.15);color:var(--warn)}
.b{background:rgba(255,107,107,.15);color:var(--bad)}
.search{background:#080d16;border:1px solid var(--line);color:var(--txt);border-radius:9px;
padding:9px 13px;width:320px;font:inherit;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;color:var(--gold);font-size:15px}
.muted{color:var(--dim);font-size:12px}
.alert{border-left:3px solid var(--bad);padding:11px 14px;background:rgba(255,107,107,.07);
border-radius:0 9px 9px 0;margin-bottom:9px}
.alert b{color:var(--bad)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.bar{height:6px;background:#16233a;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar button,.fake{background:#12203a;border:1px solid var(--line);color:var(--gold);
padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.add{background:var(--amber);color:#06101f;border:0;padding:8px 14px;border-radius:8px;
cursor:pointer;font:inherit;font-weight:700}
.add.sm{padding:5px 11px;font-size:12px;margin-top:8px}
.del{background:transparent;border:1px solid var(--bad);color:var(--bad);padding:6px 12px;
border-radius:8px;cursor:pointer;font:inherit;font-size:12px;margin-left:auto}
.x{background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:14px}
.x:hover{color:var(--bad)}
.hd{display:flex;gap:12px;align-items:center;cursor:pointer}
.hd h3{margin:0;flex:0 1 auto}
.chev{margin-left:auto;color:var(--dim)}
.ed{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;padding:12px;background:#0a1220;border-radius:9px}
.f label{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
input.wide{width:260px;text-align:left}
.totals{display:flex;gap:22px;align-items:center;margin-top:12px;flex-wrap:wrap}
.totals b{font-size:17px}
.li{padding:5px 0;border-bottom:1px solid #16233a}

textarea{width:100%;background:#080d16;border:1px solid var(--line);color:var(--txt);
border-radius:9px;padding:11px;font:12.5px/1.5 ui-monospace,Consolas,monospace;margin-top:10px}
select{background:#080d16;border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:7px 10px;font:inherit}
nav button{padding:5px 8px;font-size:11px}
nav{max-width:62%}

.chip{background:#101a2c;border:1px solid var(--line);color:var(--txt);padding:5px 10px;
border-radius:99px;cursor:pointer;font:inherit;font-size:11.5px;margin-top:8px}
.chip.sel{background:var(--amber);color:#06101f;border-color:var(--amber)}
h4{letter-spacing:.6px}
</style></head><body>

</nav></header>

const IX={},BX={};
const rebuildIX=()=>{for(const k in IX)delete IX[k];DATA.ingredients.forEach(i=>IX[i.code]=i)};
const rebuildBX=()=>{for(const k in BX)delete BX[k];DATA.batch.forEach(b=>BX['B'+b.id]=b)};
DATA.batch.forEach((b,i)=>{if(!b.id)b.id=String(i+1).padStart(3,'0');
  if(b.yieldQty==null)b.yieldQty=1;if(!b.yieldUnit)b.yieldUnit='batch'});
DATA.menu.forEach((m,i)=>{if(!m.id)m.id='M'+i;if(m.weeklySales==null)m.weeklySales=null});

rebuildIX();rebuildBX();

const TARGET=0.20, KEY='tavern-costing-v2';
const money=n=>(n==null||isNaN(n))?'—':(+n).toFixed(3);
const pct=n=>(n==null||isNaN(n))?'—':(n*100).toFixed(1)+'%';
const codeOf=r=>String(r||'').split('_')[0];
const isB=r=>String(r||'').startsWith('B');

// ── persistence + undo ──────────────────────────────────────────────────
// A tool you can lose work in is a tool you won't trust with real decisions.
let UNDO=[];
function snapshot(){UNDO.push(JSON.stringify({ingredients:DATA.ingredients,menu:DATA.menu,batch:DATA.batch}));
  if(UNDO.length>40)UNDO.shift()}
function undo(){if(!UNDO.length){alert('Nothing to undo');return}
  const s=JSON.parse(UNDO.pop());DATA.ingredients=s.ingredients;DATA.menu=s.menu;DATA.batch=s.batch;
  rebuildIX();rebuildBX();save();R()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(
  {ingredients:DATA.ingredients,menu:DATA.menu,batch:DATA.batch,saved:Date.now()}))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;
  const d=JSON.parse(s);if(!d.ingredients)return false;
  DATA.ingredients=d.ingredients;DATA.menu=d.menu;DATA.batch=d.batch;
  rebuildIX();rebuildBX();return d.saved}catch(e){return false}}
function resetAll(){if(confirm('Discard all edits and reload the original workbook data?')){
  localStorage.removeItem(KEY);location.reload()}}
const edit=fn=>{snapshot();fn();rebuildIX();rebuildBX();save();R()};

// ── costing ─────────────────────────────────────────────────────────────
function costPerRu(i){if(!i)return 0;if(i.price==null||!i.ruPerPu)return i.costPerRu??0;
  const y=(i.yield==null||i.yield===0)?1:i.yield;return i.price/i.ruPerPu/y}
function batchCost(b,seen){seen=seen||new Set();if(seen.has(b.id))return 0;seen.add(b.id);
  return b.lines.reduce((s,l)=>s+(l.qty||0)*unitCostOf(l.ref,seen),0)}
function batchUnit(b,seen){const q=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;return batchCost(b,seen)/q}
function unitCostOf(ref,seen){if(isB(ref)){const b=BX[ref];return b?batchUnit(b,seen):0}
  return costPerRu(IX[codeOf(ref)])}
const lineCost=(l,s)=>(l.qty||0)*unitCostOf(l.ref,s);
const itemCost=m=>m.lines.reduce((s,l)=>s+lineCost(l),0);
const fcPct=m=>{const c=itemCost(m);return m.menuPrice?c/m.menuPrice:null};
const nameOf=r=>isB(r)?(BX[r]?'▣ '+BX[r].name:r):(IX[codeOf(r)]?IX[codeOf(r)].name:r);
const unitOf=r=>isB(r)?(BX[r]?BX[r].yieldUnit:''):(IX[codeOf(r)]?(IX[codeOf(r)].recipeUnit||''):'');
const priced=()=>DATA.menu.filter(m=>m.menuPrice>0);
const anomalies=()=>priced().map(m=>({m,f:fcPct(m)})).filter(x=>x.f>1).sort((a,b)=>b.f-a.f);
const band=f=>f==null?['—','']:f>1?[pct(f),'b']:f>TARGET?[pct(f),'w']:[pct(f),'g'];

// ── THE FIX QUEUE ───────────────────────────────────────────────────────
// The most valuable screen here. 132 unpriced ingredients is a list; the same
// list ordered by HOW MANY DISHES EACH ONE BREAKS is an afternoon's work with
// visible payoff. Fix the top ten and you may repair sixty dishes.
function fixQueue(){
  const impact={};
  const touch=(ref,dish)=>{if(isB(ref))return;const c=codeOf(ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(dish)};
  DATA.menu.forEach(m=>m.lines.forEach(l=>touch(l.ref,m.name)));
  DATA.batch.forEach(b=>b.lines.forEach(l=>{if(isB(l.ref))return;const c=codeOf(l.ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).recipes.add(b.name)}));
  // a batch recipe used in dishes propagates its ingredients' breakage upward
  DATA.menu.forEach(m=>m.lines.filter(l=>isB(l.ref)).forEach(l=>{const b=BX[l.ref];
    if(b)b.lines.forEach(bl=>{if(isB(bl.ref))return;const c=codeOf(bl.ref);
      (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(m.name)})}));
  return Object.entries(impact).map(([c,v])=>({ing:IX[c],code:c,
      dishes:[...v.dishes],recipes:[...v.recipes]}))
    .filter(x=>x.ing&&!costPerRu(x.ing))
    .sort((a,b)=>(b.dishes.length+b.recipes.length)-(a.dishes.length+a.recipes.length));
}

// ── MENU ENGINEERING ────────────────────────────────────────────────────
// Food cost % alone is the wrong metric: a 40% dish selling 200/wk beats a 15%
// dish selling 3. Popularity x margin is the decision that matters.
function engineering(){
  const withSales=priced().filter(m=>m.weeklySales>0&&fcPct(m)<=1);
  if(!withSales.length)return null;
  const avgSales=withSales.reduce((s,m)=>s+m.weeklySales,0)/withSales.length;
  const avgGP=withSales.reduce((s,m)=>s+(m.menuPrice-itemCost(m)),0)/withSales.length;
  const cls=m=>{const pop=m.weeklySales>=avgSales, prof=(m.menuPrice-itemCost(m))>=avgGP;
    return pop&&prof?'Star':pop?'Plowhorse':prof?'Puzzle':'Dog'};
  return {avgSales,avgGP,items:withSales.map(m=>({m,k:cls(m),
    gp:m.menuPrice-itemCost(m),weekly:(m.menuPrice-itemCost(m))*m.weeklySales}))
    .sort((a,b)=>b.weekly-a.weekly)};
}
const ADVICE={Star:'Protect. Never discount, never change the recipe.',
  Plowhorse:'Popular but thin. Re-engineer the recipe or nudge the price.',
  Puzzle:'Profitable but ignored. Move it up the menu, rename it, push it.',
  Dog:'Neither popular nor profitable. Cut it.'};

// ── PRICE SHOCK SIMULATOR ───────────────────────────────────────────────
let shock={cat:'ALL',pctv:10};
function simulate(){
  const before=priced().map(m=>({m,c:itemCost(m),f:fcPct(m)}));
  const hit=new Set(DATA.ingredients.filter(i=>shock.cat==='ALL'||(i.category||'')===shock.cat).map(i=>i.code));
  const orig={};hit.forEach(c=>{if(IX[c]){orig[c]=IX[c].price;IX[c].price=(IX[c].price||0)*(1+shock.pctv/100)}});
  const after=priced().map(m=>({m,c:itemCost(m),f:fcPct(m)}));
  hit.forEach(c=>{if(IX[c])IX[c].price=orig[c]});
  return before.map((b,i)=>({m:b.m,c0:b.c,c1:after[i].c,f0:b.f,f1:after[i].f}))
    .filter(x=>x.c1>x.c0+1e-9).sort((a,b)=>(b.f1-b.f0)-(a.f1-a.f0));
}
const categories=()=>['ALL',...new Set(DATA.ingredients.map(i=>i.category).filter(Boolean))];

// ── INVOICE / RECEIPT PARSER ────────────────────────────────────────────
// Paste the text of a supplier invoice. No API key, no OCR service, works
// offline. Each line is matched against the ingredient list by word overlap;
// nothing is applied until you approve it, because a bad auto-match silently
// corrupts every dish using that ingredient.
let invText='', invRows=[];
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function scoreMatch(a,b){
  const A=new Set(norm(a).split(' ').filter(w=>w.length>2));
  const B=new Set(norm(b).split(' ').filter(w=>w.length>2));
  if(!A.size||!B.size)return 0;
  let hit=0;A.forEach(w=>{if(B.has(w))hit++});
  return hit/Math.max(A.size,B.size);
}
function parseInvoice(text){
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(line.length<4)return;
    // numbers that look like money: last plausible decimal on the line
    const nums=line.match(/\d+[.,]\d{1,3}|\d+/g); if(!nums)return;
    const price=parseFloat(nums[nums.length-1].replace(',','.'));
    if(!isFinite(price)||price<=0)return;
    const desc=line.replace(/[\d.,]+\s*$/,'').replace(/^\d+\s*[xX]?\s*/,'').trim();
    if(desc.length<3)return;
    let best=null,bs=0;
    DATA.ingredients.forEach(i=>{const s=scoreMatch(desc,i.name);if(s>bs){bs=s;best=i}});
    out.push({desc,price,match:bs>=0.34?best:null,score:bs,apply:bs>=0.5});
  });
  return out;
}
function applyInvoice(){
  const use=invRows.filter(r=>r.apply&&r.match);
  if(!use.length){alert('Nothing selected to apply.');return}
  if(!confirm(`Update ${use.length} ingredient price(s)?`))return;
  edit(()=>{use.forEach(r=>{const i=IX[r.match.code];if(!i)return;
    i.history=i.history||[];i.history.push({at:Date.now(),from:i.price,to:r.price});
    i.price=r.price;});});
  invRows=[];invText='';R();
}

// ── UNIT-ERROR DETECTOR ─────────────────────────────────────────────────
// The two impossible dishes aren't expensive — someone typed grams where the
// recipe unit is kilos. Rather than just flagging them, work out the likely
// factor and prove it: if dividing by 1000 lands the dish in a sane food-cost
// band, that IS the error. Excel can't do this because it has no notion of
// what a plausible dish costs.
const FACTORS=[1000,100,10];
function unitSuspects(){
  const out=[];
  DATA.menu.forEach((m,mi)=>{
    const total=itemCost(m); if(!total)return;
    const costs=m.lines.map(l=>lineCost(l));
    const med=[...costs].filter(c=>c>0).sort((a,b)=>a-b)[Math.floor(costs.filter(c=>c>0).length/2)]||0;
    m.lines.forEach((l,li)=>{
      const c=lineCost(l); if(!c)return;
      const share=c/total;
      const domin=share>0.7 && med>0 && c>med*10;
      const overprice=m.menuPrice>0 && total>m.menuPrice;
      if(!domin && !overprice) return;
      if(!domin) return;
      // find the factor that lands food cost between 5% and 45%
      let best=null;
      for(const f of FACTORS){
        const t2=total-c+c/f;
        const fc=m.menuPrice?t2/m.menuPrice:null;
        if(fc!=null && fc>=0.05 && fc<=0.45){best={f,newTotal:t2,fc};break}
      }
      out.push({mi,li,dish:m.name,ing:nameOf(l.ref),qty:l.qty,lineCost:c,
        total,share,price:m.menuPrice,fix:best,
        confidence: best? (overprice?'high':'medium') : 'low'});
    });
  });
  return out.sort((a,b)=>b.share-a.share);
}
function applyUnitFix(mi,li,f){
  edit(()=>{const l=DATA.menu[mi].lines[li];l.qty=(l.qty||0)/f});
}

// ── WHERE USED ──────────────────────────────────────────────────────────
// "Chicken went up — what's affected?" is the most common real question and
// the workbook cannot answer it at all.
function whereUsed(code){
  const dishes=[],recipes=[];
  DATA.menu.forEach(m=>{if(m.lines.some(l=>!isB(l.ref)&&codeOf(l.ref)===code))
    dishes.push({name:m.name,cost:itemCost(m),fc:fcPct(m),via:'direct'})});
  DATA.batch.forEach(b=>{if(b.lines.some(l=>!isB(l.ref)&&codeOf(l.ref)===code)){
    recipes.push({name:b.name,cost:batchCost(b)});
    DATA.menu.forEach(m=>{if(m.lines.some(l=>isB(l.ref)&&l.ref==='B'+b.id))
      dishes.push({name:m.name,cost:itemCost(m),fc:fcPct(m),via:'via '+b.name})})}});
  const seen=new Set();
  return {dishes:dishes.filter(d=>{const k=d.name+d.via;if(seen.has(k))return false;seen.add(k);return true}),recipes};
}
let usedCode=null;

// ── BULK REPRICING ──────────────────────────────────────────────────────
// What adopting target margin across the menu is actually worth, in money.
function repricePlan(target){
  return priced().filter(m=>fcPct(m)<=1).map(m=>{
    const c=itemCost(m), sug=c/target, delta=sug-m.menuPrice;
    const wk=m.weeklySales||0;
    return {m,c,cur:m.menuPrice,sug,delta,fc:fcPct(m),weeklyGain:delta*wk};
  }).sort((a,b)=>b.delta-a.delta);
}
function applyReprice(target){
  const plan=repricePlan(target).filter(p=>p.delta>0.01);
  if(!plan.length){alert('Nothing to reprice.');return}
  if(!confirm(`Raise ${plan.length} price(s) to hit ${(target*100).toFixed(0)}% food cost?`))return;
  edit(()=>{plan.forEach(p=>{const i=DATA.menu.indexOf(p.m);
    DATA.menu[i].menuPrice=Math.round(p.sug*4)/4})}); // round to nearest 0.25
}

// ── SCATTER (menu engineering, drawn not tabulated) ─────────────────────
function scatter(E){
  if(!E)return '';
  const W=560,H=300,P=40;
  const xs=E.items.map(x=>x.m.weeklySales), ys=E.items.map(x=>x.gp);
  const xmax=Math.max(...xs)*1.1||1, ymax=Math.max(...ys)*1.1||1;
  const X=v=>P+(v/xmax)*(W-P-12), Y=v=>H-P-(v/ymax)*(H-P-16);
  const col=k=>k==='Star'?'#7ee787':k==='Dog'?'#ff6b6b':'#ffc862';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
  <line x1="${X(E.avgSales)}" y1="10" x2="${X(E.avgSales)}" y2="${H-P}" stroke="#3a2f1c" stroke-dasharray="4 4"/>
  <line x1="${P}" y1="${Y(E.avgGP)}" x2="${W-12}" y2="${Y(E.avgGP)}" stroke="#3a2f1c" stroke-dasharray="4 4"/>
  <text x="${W-14}" y="${Y(E.avgGP)-6}" fill="#9c8f7a" font-size="9" text-anchor="end">avg margin</text>
  <text x="${X(E.avgSales)+4}" y="18" fill="#9c8f7a" font-size="9">avg sales</text>
  ${E.items.map(x=>`<g><circle cx="${X(x.m.weeklySales)}" cy="${Y(x.gp)}" r="5" fill="${col(x.k)}" opacity=".85"><title>${x.m.name} — ${x.k}</title></circle>

// ── PRODUCTION PLANNER / SHOPPING LIST ──────────────────────────────────
// "We expect this many covers — what do I actually buy?" Explodes every dish
// through its batch recipes down to raw purchasable ingredients, converts
// recipe units back to PURCHASE units, and totals the money. This is the one
// that replaces somebody's Sunday afternoon.
let planDays=7;
function explode(){
  const need={}; // code -> recipe-unit qty
  const add=(ref,qty,seen)=>{
    if(!qty)return;
    if(isB(ref)){
      const b=BX[ref]; if(!b)return;
      seen=seen||new Set(); if(seen.has(b.id))return; seen.add(b.id);
      const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
      b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,new Set(seen)));
      return;
    }
    const c=codeOf(ref); need[c]=(need[c]||0)+qty;
  };
  DATA.menu.forEach(m=>{
    const covers=(m.weeklySales||0)*(planDays/7);
    if(!covers)return;
    m.lines.forEach(l=>add(l.ref,(l.qty||0)*covers));
  });
  return Object.entries(need).map(([c,qty])=>{
    const i=IX[c]; if(!i)return null;
    const perPack=i.ruPerPu||1;
    const packs=qty/perPack;
    return {ing:i,qty,packs,cost:qty*costPerRu(i)};
  }).filter(Boolean).sort((a,b)=>b.cost-a.cost);
}

// ── DUPLICATE INGREDIENTS ───────────────────────────────────────────────
// 318 hand-typed ingredients will contain near-duplicates. Each one silently
// splits usage across two codes, so neither shows its true consumption and one
// of them usually has a stale price.
function dupScore(a,b){
  // Deliberately NOT scoreMatch: that one drops tokens of 2 chars or fewer,
  // which made "Recipe 2.9" and "Recipe 3.10" both collapse to {recipe} and
  // score 100%. It produced 5,462 false pairs. Numbers and short tokens are
  // exactly what distinguishes near-identical names, so they must count.
  const tok=x=>norm(x).split(' ').filter(Boolean);
  const A=tok(a),B=tok(b);
  if(A.length<2||B.length<2)return 0;            // one-word names are not evidence
  const SA=new Set(A),SB=new Set(B);
  let hit=0;SA.forEach(w=>{if(SB.has(w))hit++});
  const jac=hit/new Set([...A,...B]).size;
  // any differing NUMBER is a strong signal they are different items
  const nA=A.filter(w=>/\d/.test(w)).join(','), nB=B.filter(w=>/\d/.test(w)).join(',');
  if(nA!==nB) return jac*0.45;
  return jac;
}
function duplicates(){
  const out=[]; const ing=DATA.ingredients;
  for(let a=0;a<ing.length;a++)for(let b=a+1;b<ing.length;b++){
    const s=dupScore(ing[a].name,ing[b].name);
    if(s>=0.62) out.push({a:ing[a],b:ing[b],s,
      usedA:whereUsed(ing[a].code),usedB:whereUsed(ing[b].code)});
  }
  return out.sort((x,y)=>y.s-x.s).slice(0,60);
}
function mergeIng(keepCode,dropCode){
  if(!confirm(`Merge — every recipe using ${IX[dropCode].name} will point at ${IX[keepCode].name}. This cannot be auto-undone beyond Undo.`))return;
  edit(()=>{
    const repoint=l=>{if(!isB(l.ref)&&codeOf(l.ref)===dropCode)l.ref=keepCode+'_'+IX[keepCode].name};
    DATA.menu.forEach(m=>m.lines.forEach(repoint));
    DATA.batch.forEach(b=>b.lines.forEach(repoint));
    const i=DATA.ingredients.findIndex(x=>x.code===dropCode);
    if(i>=0)DATA.ingredients.splice(i,1);
  });
}

// ── DISH COST BREAKDOWN (pareto) ────────────────────────────────────────

// worth more than trimming the other ten.

  return m.lines.map(l=>({name:nameOf(l.ref),cost:lineCost(l),share:lineCost(l)/total}))
    .filter(x=>x.cost>0).sort((a,b)=>b.cost-a.cost);
}

  const errs=unitSuspects().filter(u=>u.confidence!=='low').length;
  const dups=duplicates().length;
  const checks=[
    {k:'Ingredients priced',v:pricedIng,of:used.length,w:3},
    {k:'Dishes with a menu price',v:withPrice,of:dishes,w:3},
    {k:'Dishes with sales data',v:withSales,of:dishes,w:2},
    {k:'Dishes free of unit errors',v:dishes-errs,of:dishes,w:2},
    {k:'Ingredients without duplicates',v:used.length-Math.min(dups,used.length),of:used.length,w:1},
  ];
  const score=checks.reduce((s,c)=>s+(c.of?c.v/c.of:1)*c.w,0)/checks.reduce((s,c)=>s+c.w,0);
  return {score,checks};
}

// ── RECIPE SCALING ──────────────────────────────────────────────────────
let scaleFactor=1;

// ── VERSATILITY ─────────────────────────────────────────────────────────
// How many places an ingredient earns its shelf space.
//
// Two opposite lessons come out of the same number:
//   HIGH — a workhorse. Every dish moves when its price does, so this is where
//          negotiating a better rate actually pays, and where a supplier
//          switch is most dangerous.
//   ONE  — a single-use ingredient. You buy a pack for one dish, use a
//          fraction, and the rest ages in the walk-in. This is where waste
//          lives, and it never shows up in a recipe cost because spoilage
//          isn't an ingredient.
function versatility(){
  return DATA.ingredients.map(i=>{
    const W=whereUsed(i.code);
    const direct=W.dishes.filter(d=>d.via==='direct').length;
    const viaRec=W.dishes.length-direct;
    const uses=W.dishes.length+W.recipes.length;
    // weekly consumption, if sales figures exist
    let weeklyQty=0;
    const add=(ref,qty,mult,seen)=>{
      if(isB(ref)){const b=BX[ref];if(!b)return;
        seen=seen||new Set();if(seen.has(b.id))return;seen.add(b.id);
        const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
        b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,mult,new Set(seen)));return}
      if(codeOf(ref)===i.code) weeklyQty+=qty*mult;
    };
    DATA.menu.forEach(m=>{const s=m.weeklySales||0;if(!s)return;
      m.lines.forEach(l=>add(l.ref,(l.qty||0),s))});
    const c=costPerRu(i);
    return {ing:i,uses,direct,viaRec,recipes:W.recipes.length,
      dishNames:W.dishes.map(d=>d.name),recipeNames:W.recipes.map(r=>r.name),
      cost:c,weeklyQty,weeklySpend:weeklyQty*c,
      kind: uses===0?'unused' : uses===1?'single-use' : uses>=6?'workhorse' : 'specialist'};
  }).filter(v=>v.uses>0).sort((a,b)=>b.uses-a.uses);
}

// ── PHYSICAL INVENTORY COUNT & VARIANCE ─────────────────────────────────
//
// The equation every restaurant runs on, and the only one that finds money:
//
//   expected = opening + received − theoretical usage
//   variance = actual counted − expected
//
// A negative variance is stock that left without being sold: waste, spoilage,
// over-portioning, or theft. It NEVER appears in a recipe cost, which is why a
// costing sheet can say 22% food cost while the P&L says 34%.
//
// ── The unit trap ───────────────────────────────────────────────────────
// Counts are in INVENTORY units (cases, bottles). Recipes consume RECIPE units
// (grams, each). Converting between them wrongly is the classic way this
// feature produces confident nonsense, so it goes through the purchase unit
// both times rather than being fudged:
//     IU = RU ÷ ruPerPu × iuPerPu
let countDays=7, countDraft={}, countRecv={};

function ruToIu(i,qtyRu){
  const ru=i.ruPerPu||1, iu=i.iuPerPu;
  if(!iu) return qtyRu/ru;               // no inventory unit defined → packs
  return qtyRu/ru*iu;
}
// Theoretical consumption over the period, per ingredient, in INVENTORY units.
function theoreticalUsage(){
  const saved=planDays; planDays=countDays;
  const rows=explode(); planDays=saved;
  const out={};
  rows.forEach(r=>{out[r.ing.code]={ru:r.qty,iu:ruToIu(r.ing,r.qty),cost:r.cost}});
  return out;
}
function countRows(){
  const use=theoreticalUsage();
  return DATA.ingredients.map(i=>{
    const opening=i.currentCount!=null?i.currentCount:(i.startCount||0);
    const recv=parseFloat(countRecv[i.code])||0;
    const u=use[i.code]||{iu:0,ru:0};
    const expected=opening+recv-u.iu;
    const actualRaw=countDraft[i.code];
    const actual=(actualRaw===''||actualRaw==null)?null:parseFloat(actualRaw);
    const variance=actual==null?null:actual-expected;
    // value a shortfall at the cost of ONE inventory unit
    const costIu=i.costPerIu!=null&&i.costPerIu>0?i.costPerIu
      :(i.price&&i.iuPerPu?i.price/i.iuPerPu:costPerRu(i)*(i.ruPerPu||1)/(i.iuPerPu||1));
    return {i,opening,recv,used:u.iu,usedRu:u.ru,expected,actual,variance,
      value:variance==null?null:variance*costIu,costIu,
      counted:actual!=null};
  });
}
// Commit: overwrite stock with what was physically counted, and keep the
// variance permanently. Overwriting without recording the discrepancy would
// erase the only evidence that anything went missing.
function commitCount(){
  const rows=countRows().filter(r=>r.counted);
  if(!rows.length){alert('Enter at least one count first.');return}
  const loss=rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0);
  if(!confirm(`Commit ${rows.length} count(s)?\n\nStock levels will be overwritten with the physical figures.\nRecorded shortfall: ${money(Math.abs(loss))}`))return;
  edit(()=>{
    const at=Date.now();
    rows.forEach(r=>{
      const g=DATA.ingredients.find(x=>x.code===r.i.code); if(!g)return;
      g.counts=g.counts||[];
      g.counts.push({at,opening:r.opening,received:r.recv,used:r.used,
        expected:r.expected,actual:r.actual,variance:r.variance,value:r.value});
      g.currentCount=r.actual;          // physical count wins, always
    });
    DATA.countHistory=DATA.countHistory||[];
    DATA.countHistory.push({at,lines:rows.length,
      shortfall:rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0),
      surplus:rows.filter(r=>r.variance>0).reduce((s,r)=>s+r.value,0),
      days:countDays});
  });
  countDraft={};countRecv={};
  view='countres';R();
}
function lastCount(){const h=DATA.countHistory||[];return h.length?h[h.length-1]:null}

// ══ BAR-SPECIFIC ═══════════════════════════════════════════════════════
// A bar is not a kitchen with different ingredients. Three things differ and
// they change the maths:
//   1. Yield is a DIVISION problem — a 700ml bottle at 50ml pours is 14 serves,
//      and getting that wrong misprices every drink made from it.
//   2. Over-pour is the dominant loss. 5ml extra on a 50ml pour is a silent
//      10% cost increase that no recipe, count or invoice will ever show.
//   3. ABV matters — for the guest, for responsible service, sometimes by law.
const POUR_TARGET=0.20;   // bars run tighter than kitchens: ~18-24%

// How many serves a purchase unit yields at a given pour size.
function poursPerBottle(i,pourMl){
  if(!pourMl||i.recipeUnit!=='ml')return null;
  return (i.ruPerPu||0)/pourMl;
}
// Alcohol by volume of a finished drink, and UK-style units.
function drinkABV(m,seen){
  let vol=0, alc=0;
  const walk=(ref,qty,mult,seen)=>{
    if(isB(ref)){const b=BX[ref];if(!b)return;
      seen=seen||new Set();if(seen.has(b.id))return;seen.add(b.id);
      const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
      b.lines.forEach(l=>walk(l.ref,(l.qty||0)*qty/per,mult,new Set(seen)));return}
    const i=IX[codeOf(ref)]; if(!i)return;
    if(i.recipeUnit!=='ml')return;              // garnish/each contributes no volume
    vol+=qty*mult; alc+=qty*mult*((i.abv||0)/100);
  };
  m.lines.forEach(l=>walk(l.ref,(l.qty||0),1));
  return {vol,alc,abv:vol?alc/vol:0,units:alc/10};   // 10ml pure alcohol = 1 unit
}
// ── OVER-POUR SIMULATOR ────────────────────────────────────────────────
// The single most useful number in a bar. Free-pouring drifts high; this puts
// a currency figure on it across the whole drinks list.
let overPour=5;   // ml extra per spirit/liqueur pour
function overPourImpact(){
  const rows=priced().map(m=>{
    const base=itemCost(m);
    let extra=0;
    m.lines.forEach(l=>{
      if(isB(l.ref))return;
      const i=IX[codeOf(l.ref)];
      if(!i||i.recipeUnit!=='ml')return;
      if(!['spirit','liqueur'].includes(i.category||''))return;
      extra+=overPour*costPerRu(i);
    });
    if(!extra)return null;
    const c2=base+extra;
    return {m,base,c2,extra,f0:base/m.menuPrice,f1:c2/m.menuPrice,
      weekly:extra*(m.weeklySales||0)};
  }).filter(Boolean).sort((a,b)=>b.extra-a.extra);
  return {rows,weekly:rows.reduce((s,r)=>s+r.weekly,0)};
}
// ── BOTTLE YIELD TABLE ─────────────────────────────────────────────────
function yieldTable(pourMl){
  return DATA.ingredients.filter(i=>i.recipeUnit==='ml'&&['spirit','liqueur','wine'].includes(i.category||''))
    .map(i=>{const p=poursPerBottle(i,pourMl);
      return {i,pours:p,costPerPour:p?(i.price||0)/p:null,
        revenueAt:(p&&i.price)?((i.price/p)/POUR_TARGET):null};
    }).sort((a,b)=>(b.costPerPour||0)-(a.costPerPour||0));
}

  <div class="muted" style="font-size:11px">${l.ref?nameOf(l.ref):''}</div></td>
  <td class="muted">${unitOf(l.ref)}</td>
  <td class="num"><input value="${l.qty??0}" onchange="setQty('${k}',${o},${li},this.value)"></td>
  <td class="num muted">${uc?uc.toFixed(5):'<span style="color:var(--bad)">0</span>'}</td>
  <td class="num">${money(lineCost(l))}</td>
  <td><button class="x" onclick="delLine('${k}',${o},${li})">✕</button></td></tr>`}).join('')}

function render(){
  const el=document.getElementById('app');
  const P=priced(),A=anomalies(),FQ=fixQueue();
  const sane=P.filter(m=>fcPct(m)<=1);
  const avg=sane.length?sane.reduce((s,m)=>s+fcPct(m),0)/sane.length:0;
  const over=sane.filter(m=>fcPct(m)>TARGET);
  const bar=`<div class="toolbar"><button onclick="undo()">↶ Undo</button>
    <button onclick="exportJSON()">⬇ JSON</button>
    <label class="fake">⬆ Load<input type="file" accept=".json" onchange="importJSON(this)" hidden></label>
    <button onclick="exportCSV()">⬇ CSV</button>
    <button onclick="resetAll()" style="margin-left:auto">↺ Reset to workbook</button>
    <span class="muted" style="align-self:center">auto-saved</span></div>`;

  if(view==='dash'){el.innerHTML=bar+`<div class="kpis">
    <div class="kpi"><div class="v">${DATA.menu.length}</div><div class="l">Drinks</div></div>
    <div class="kpi"><div class="v">${pct(avg)}</div><div class="l">Avg pour cost</div></div>
    <div class="kpi"><div class="v" style="color:${over.length?'var(--warn)':'var(--good)'}">${over.length}</div><div class="l">Over ${pct(TARGET)}</div></div>
    <div class="kpi"><div class="v" style="color:${A.length?'var(--bad)':'var(--good)'}">${A.length}</div><div class="l">Impossible costs</div></div>
    <div class="kpi"><div class="v" style="color:${FQ.length?'var(--warn)':'var(--good)'}">${FQ.length}</div><div class="l">Unpriced stock</div></div>
    <div class="kpi"><div class="v">${DATA.menu.length-P.length}</div><div class="l">Unpriced dishes</div></div></div>
    ${FQ.length?`<div class="card"><h3 style="color:var(--warn)">Start here — ${FQ.length} unpriced ingredients</h3>
      <div class="muted">Ranked by how many dishes each one breaks. Fixing the top ${Math.min(10,FQ.length)} repairs ${new Set(FQ.slice(0,10).flatMap(x=>x.dishes)).size} dishes.</div>
      <button class="add sm" onclick="go('fix')">Open fix queue →</button></div>`:''}
    ${A.length?`<div class="card"><h3 style="color:var(--bad)">⚠ Data errors</h3>
      ${A.map(({m,f})=>`<div class="alert"><b>${m.name}</b> — costs ${money(itemCost(m))}, sells for ${m.menuPrice} → <b>${pct(f)}</b></div>`).join('')}</div>`:''}
    <div class="card"><h3>Profitability — worst first</h3><table><thead><tr><th>Item</th><th class="num">Cost</th><th class="num">Price</th><th class="num">GP</th><th class="num">Food cost</th></tr></thead><tbody>
    ${sane.sort((a,b)=>fcPct(b)-fcPct(a)).map(m=>{const c=itemCost(m),[t,k]=band(fcPct(m));
      return `<tr><td>${m.name}</td><td class="num">${money(c)}</td><td class="num">${m.menuPrice}</td>
      <td class="num" style="color:var(--good)">${money(m.menuPrice-c)}</td><td class="num"><span class="pill ${k}">${t}</span></td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='fix'){el.innerHTML=bar+`<div class="card"><h3>Fix queue — biggest impact first</h3>
    <div class="muted" style="margin-bottom:12px">These cost zero, so every dish and recipe using them is <b>under-costed right now</b>. Enter a price and the fix propagates instantly.</div>
    <table><thead><tr><th>Code</th><th>Ingredient</th><th class="num">Breaks</th><th>Where</th><th class="num">Price</th><th class="num">Units/pack</th></tr></thead><tbody>
    ${FQ.slice(0,80).map(x=>{const gi=DATA.ingredients.indexOf(x.ing);const n=x.dishes.length+x.recipes.length;
      return `<tr><td class="muted">${x.code}</td><td>${x.ing.name}</td>
      <td class="num"><span class="pill ${n>5?'b':n>2?'w':'g'}">${n}</span></td>
      <td class="muted" style="font-size:11.5px">${[...x.dishes.slice(0,3),...x.recipes.slice(0,2)].join(', ')}${n>5?` +${n-5} more`:''}</td>
      <td class="num"><input value="${x.ing.price??0}" onchange="setPrice(${gi},this.value)"></td>
      <td class="num"><input value="${x.ing.ruPerPu??1}" onchange="edit(()=>DATA.ingredients[${gi}].ruPerPu=parseFloat(this.value)||1)"></td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='eng'){const E=engineering();
    el.innerHTML=bar+`<div class="card"><h3>Menu engineering</h3>
    <div class="muted">Food cost % alone misleads: a 40% dish selling 200/week earns far more than a 15% dish selling 3. This ranks by <b>weekly profit</b> — popularity × margin.</div>
    <div class="row" style="margin-top:10px"><label class="fake">⬆ Import sales (CSV: name,weekly qty)<input type="file" accept=".csv,.txt" onchange="importSales(this)" hidden></label></div></div>
    ${!E?`<div class="card"><div class="muted">No sales figures yet. Import a CSV of <b>dish name, weekly quantity</b> from your POS — or type them into the menu items below.</div></div>`:
    `<div class="card">${scatter(E)}</div><div class="card"><table><thead><tr><th>Item</th><th>Class</th><th class="num">GP each</th><th class="num">Weekly qty</th><th class="num">Weekly profit</th><th>What to do</th></tr></thead><tbody>
    ${E.items.map(x=>`<tr><td>${x.m.name}</td>
      <td><span class="pill ${x.k==='Star'?'g':x.k==='Dog'?'b':'w'}">${x.k}</span></td>
      <td class="num">${money(x.gp)}</td><td class="num">${x.m.weeklySales}</td>
      <td class="num"><b>${money(x.weekly)}</b></td>
      <td class="muted" style="font-size:11.5px">${ADVICE[x.k]}</td></tr>`).join('')}
    </tbody></table></div>`}`}

  if(view==='sim'){const S=simulate();
    el.innerHTML=bar+`<div class="card"><h3>Price shock simulator</h3>
    <div class="muted">"If this category goes up X%, what happens to my menu?" — the question supplier increases actually pose.</div>
    <div class="row" style="margin-top:10px">
      <select onchange="shock.cat=this.value;R()">${categories().map(c=>`<option ${c===shock.cat?'selected':''}>${c}</option>`).join('')}</select>
      <input value="${shock.pctv}" style="width:70px" onchange="shock.pctv=parseFloat(this.value)||0;R()"> <span class="muted">% increase</span>
    </div></div>
    <div class="card"><table><thead><tr><th>Item</th><th class="num">Cost now</th><th class="num">Cost after</th><th class="num">Food cost now</th><th class="num">After</th><th class="num">New price for ${pct(TARGET)}</th></tr></thead><tbody>
    ${S.slice(0,60).map(x=>{const[,k1]=band(x.f1);
      return `<tr><td>${x.m.name}</td><td class="num">${money(x.c0)}</td><td class="num">${money(x.c1)}</td>
      <td class="num muted">${pct(x.f0)}</td><td class="num"><span class="pill ${k1}">${pct(x.f1)}</span></td>
      <td class="num" style="color:var(--amber)">${money(x.c1/TARGET)}</td></tr>`}).join('')}
    </tbody></table>${S.length?'':'<div class="muted">No priced dishes affected.</div>'}</div>`}

  if(view==='inv'){el.innerHTML=bar+`<div class="card"><h3>Invoice / receipt extractor</h3>
    <div class="muted">Paste the text of a supplier invoice — from the PDF, or your phone's text recognition. Each line is matched to your ingredients. <b>Nothing is applied until you tick it</b>, because a wrong auto-match silently corrupts every dish using that ingredient.</div>
    <textarea id="invt" rows="7" placeholder="e.g.\n2x Onion White Spain KG      1.450\nGarlic Peeled KG             3.20\nTomato ketchup 5kg          12.75">${invText}</textarea>
    <button class="add sm" onclick="invText=document.getElementById('invt').value;invRows=parseInvoice(invText);R()">Extract lines</button></div>
    ${invRows.length?`<div class="card"><h3>${invRows.length} line(s) found</h3>
    <table><thead><tr><th>Apply</th><th>From invoice</th><th class="num">Price</th><th>Matched ingredient</th><th class="num">Confidence</th><th class="num">Current</th></tr></thead><tbody>
    ${invRows.map((r,i)=>`<tr><td><input type="checkbox" ${r.apply?'checked':''} ${r.match?'':'disabled'} style="width:auto" onchange="invRows[${i}].apply=this.checked"></td>
      <td>${r.desc}</td><td class="num">${r.price}</td>
      <td>${r.match?r.match.name:'<span style="color:var(--bad)">no match</span>'}</td>
      <td class="num"><span class="pill ${r.score>=0.6?'g':r.score>=0.4?'w':'b'}">${(r.score*100).toFixed(0)}%</span></td>
      <td class="num muted">${r.match?money(r.match.price):''}</td></tr>`).join('')}
    </tbody></table>
    <button class="add" onclick="applyInvoice()">Apply ticked prices</button>
    <div class="muted" style="margin-top:8px">Every change is logged to price history, and Undo reverts the lot.</div></div>`:''}`}

  if(view==='hist'){const H=DATA.ingredients.filter(i=>i.history&&i.history.length)
      .flatMap(i=>i.history.map(h=>({i,h}))).sort((a,b)=>b.h.at-a.h.at);
    el.innerHTML=bar+`<div class="card"><h3>Price history</h3>
    <div class="muted">Every change, with direction. This is how you spot creep and hold a supplier to account.</div>
    ${H.length?`<table><thead><tr><th>When</th><th>Ingredient</th><th class="num">From</th><th class="num">To</th><th class="num">Change</th></tr></thead><tbody>
    ${H.slice(0,150).map(({i,h})=>{const d=h.from?((h.to-h.from)/h.from):null;
      return `<tr><td class="muted">${new Date(h.at).toLocaleDateString()}</td><td>${i.name}</td>
      <td class="num muted">${money(h.from)}</td><td class="num">${money(h.to)}</td>
      <td class="num"><span class="pill ${d==null?'':d>0.05?'b':d<0?'g':'w'}">${d==null?'—':(d>0?'+':'')+(d*100).toFixed(1)+'%'}</span></td></tr>`}).join('')}
    </tbody></table>`:'<div class="muted">No changes recorded yet. Edit a price or apply an invoice and it appears here.</div>'}</div>`}

  if(view==='menu'){const list=DATA.menu.map((m,i)=>({m,i})).filter(({m})=>!q||m.name.toLowerCase().includes(q)||(m.group||'').toLowerCase().includes(q));
    el.innerHTML=bar+`<div class="row"><input class="search" placeholder="Search…" oninput="setQ(this.value)" value="${q}"><button class="add" onclick="newMenu()">+ New drink</button></div>
    ${list.map(({m,i})=>{const c=itemCost(m),[t,k]=band(fcPct(m));const o=openM===i;
      return `<div class="card"><div class="hd" onclick="openM=${o?'null':i};R()"><h3>${m.name}</h3>
      <span class="pill ${k}">${t}</span><span class="muted">${money(c)} · ${m.menuPrice||0}</span><span class="chev">${o?'▾':'▸'}</span></div>
      ${o?`<div class="ed">
        <div class="f"><label>Name</label><input class="wide" value="${m.name}" onchange="edit(()=>DATA.menu[${i}].name=this.value)"></div>
        <div class="f"><label>Group</label><input value="${m.group||''}" onchange="edit(()=>DATA.menu[${i}].group=this.value)"></div>
        <div class="f"><label>Weekly sales</label><input value="${m.weeklySales??''}" onchange="edit(()=>DATA.menu[${i}].weeklySales=parseFloat(this.value)||null)"></div></div>
      <table><thead><tr><th>Ingredient / recipe</th><th>Unit</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Line</th><th></th></tr></thead><tbody>${lineRows('m',i,m.lines)}</tbody></table>
      <button class="add sm" onclick="addLine('m',${i})">+ Add ingredient</button>
      <div class="totals"><div><div class="muted">Total cost</div><b>${money(c)}</b></div>
      <div><div class="muted">Sell price</div><input value="${m.menuPrice??0}" onchange="edit(()=>DATA.menu[${i}].menuPrice=parseFloat(this.value)||0)"></div>
      <div><div class="muted">Gross profit</div><b style="color:var(--good)">${m.menuPrice?money(m.menuPrice-c):'—'}</b></div>
      <div><div class="muted">Price for ${pct(TARGET)}</div><b style="color:var(--amber)">${money(c/TARGET)}</b></div>
      <button class="add sm" onclick="printCard('m',${i})">🖨 Spec card</button>`+
      `<div style="width:100%;margin-top:14px"><div class="muted" style="margin-bottom:6px">WHERE THE COST SITS — re-engineering the top line beats trimming the rest</div>
      ${breakdown(m).slice(0,6).map(x=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:4px">
        <span style="width:190px;font-size:12px">${x.name.slice(0,26)}</span>
        <div class="bar" style="flex:1"><i style="width:${x.share*100}%;background:var(--amber)"></i></div>
        <span class="muted" style="width:76px;text-align:right;font-size:11.5px">${money(x.cost)} · ${(x.share*100).toFixed(0)}%</span></div>`).join('')}</div>`+`
      <button class="del" onclick="delMenu(${i})">Delete</button></div>`:''}</div>`}).join('')}<datalist id="picker">${pickList()}</datalist>`}

  if(view==='batch'){const list=DATA.batch.map((b,i)=>({b,i})).filter(({b})=>!q||b.name.toLowerCase().includes(q));
    el.innerHTML=bar+`<div class="row"><input class="search" placeholder="Search…" oninput="setQ(this.value)" value="${q}"><button class="add" onclick="newBatch()">+ New syrup / infusion</button></div>
    <div class="muted" style="margin-bottom:10px">Batch recipes can be used inside menu items — type the recipe name in any ingredient row.</div>
    ${list.map(({b,i})=>{const c=batchCost(b),u=batchUnit(b);const o=openB===i;
      return `<div class="card"><div class="hd" onclick="openB=${o?'null':i};R()"><h3>▣ ${b.name}</h3>
      <span class="muted">${money(c)} batch · ${money(u)}/${b.yieldUnit}</span><span class="chev">${o?'▾':'▸'}</span></div>
      ${o?`<div class="ed">
        <div class="f"><label>Name</label><input class="wide" value="${b.name}" onchange="edit(()=>DATA.batch[${i}].name=this.value)"></div>
        <div class="f"><label>Yield qty</label><input value="${b.yieldQty??1}" onchange="edit(()=>DATA.batch[${i}].yieldQty=parseFloat(this.value)||1)"></div>
        <div class="f"><label>Yield unit</label><input value="${b.yieldUnit||''}" onchange="edit(()=>DATA.batch[${i}].yieldUnit=this.value)"></div></div>
      <table><thead><tr><th>Ingredient / recipe</th><th>Unit</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Line</th><th></th></tr></thead><tbody>${lineRows('b',i,b.lines)}</tbody></table>
      <button class="add sm" onclick="addLine('b',${i})">+ Add ingredient</button>
      <div class="totals"><div><div class="muted">Batch cost</div><b>${money(c)}</b></div>
      <div><div class="muted">Per ${b.yieldUnit}</div><b style="color:var(--amber)">${money(u)}</b></div>
      <button class="add sm" onclick="printCard('b',${i})">🖨 Batch sheet</button>
      <button class="del" onclick="delBatch(${i})">Delete</button></div>`:''}</div>`}).join('')}<datalist id="picker">${pickList()}</datalist>`}

  if(view==='ing'){const VMAP={};versatility().forEach(v=>VMAP[v.ing.code]=v.uses);const list=DATA.ingredients.map((x,i)=>({x,i})).filter(({x})=>!q||x.name.toLowerCase().includes(q)||x.code.includes(q));
    el.innerHTML=bar+`<div class="row"><input class="search" placeholder="Search…" oninput="setQ(this.value)" value="${q}"><button class="add" onclick="newIng()">+ New ingredient</button></div>
    <div class="card"><table><thead><tr><th>Code</th><th>Ingredient</th><th class="num">Price</th><th>Unit</th><th class="num">Units/pack</th><th class="num">Yield %</th><th class="num">Uses</th><th class="num">Cost/unit</th></tr></thead><tbody>
    ${list.map(({x,i})=>{const c=costPerRu(x);return `<tr><td class="muted">${x.code}</td>
      <td><input class="wide" value="${(x.name||'').replace(/"/g,'&quot;')}" onchange="edit(()=>DATA.ingredients[${i}].name=this.value)"></td>
      <td class="num"><input value="${x.price??0}" onchange="setPrice(${i},this.value)"></td>
      <td><input style="width:70px" value="${x.recipeUnit||''}" onchange="edit(()=>DATA.ingredients[${i}].recipeUnit=this.value)"></td>
      <td class="num"><input value="${x.ruPerPu??1}" onchange="edit(()=>DATA.ingredients[${i}].ruPerPu=parseFloat(this.value)||1)"></td>
      <td class="num"><input value="${x.yield!=null?(x.yield*100).toFixed(0):100}" onchange="edit(()=>DATA.ingredients[${i}].yield=(parseFloat(this.value)||100)/100)"></td>
      <td class="num muted">${(VMAP[x.code]||0)||'—'}</td>
      <td class="num" style="color:${c?'var(--gold)':'var(--bad)'}">${c?c.toFixed(5):'no price'}</td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='units'){const U=unitSuspects();
    el.innerHTML=bar+`<div class="card"><h3>Unit-error detector</h3>
    <div class="muted">One ingredient dominating a dish's cost is almost always grams typed where the recipe unit is kilos. Where dividing by a factor lands the dish in a sane food-cost band, that <b>is</b> the error — shown below with the corrected figure. Excel can't spot this because it has no idea what a plausible dish costs.</div></div>
    ${U.length?U.map(u=>`<div class="card"><div class="hd"><h3>${u.dish}</h3>
      <span class="pill ${u.confidence==='high'?'b':'w'}">${u.confidence} confidence</span></div>
      <div class="muted" style="margin:8px 0"><b>${u.ing}</b> — qty ${u.qty} — costs ${money(u.lineCost)}, which is <b>${(u.share*100).toFixed(0)}%</b> of the whole dish (${money(u.total)}${u.price?', sells for '+u.price:''}).</div>
      ${u.fix?`<div class="alert" style="border-color:var(--good);background:rgba(126,231,135,.06)">
        Dividing the quantity by <b>${u.fix.f}</b> gives a dish cost of <b>${money(u.fix.newTotal)}</b> → food cost <b>${pct(u.fix.fc)}</b>, which is plausible.
        <button class="add sm" onclick="applyUnitFix(${u.mi},${u.li},${u.fix.f})">Apply ÷${u.fix.f}</button></div>`
        :`<div class="muted">No single factor lands this in a sane range — needs a human eye.</div>`}
      </div>`).join(''):'<div class="card"><div class="muted">No unit errors detected. </div></div>'}`}

  if(view==='used'){
    const list=DATA.ingredients.filter(i=>!q||(i.name||'').toLowerCase().includes(q)).slice(0,40);
    const W=usedCode?whereUsed(usedCode):null; const ing=usedCode?IX[usedCode]:null;
    el.innerHTML=bar+`<div class="card"><h3>Where used</h3>
    <div class="muted">"This went up — what's affected?" The workbook can't answer that at all.</div>
    <input class="search" placeholder="Search ingredient…" oninput="setQ(this.value)" value="${q}" style="margin-top:10px">
    <div style="display:flex;flex-wrap:wrap;gap:6px">${list.map(i=>`<button class="chip ${usedCode===i.code?'sel':''}" onclick="usedCode='${i.code}';R()">${i.name}</button>`).join('')}</div></div>
    ${W?`<div class="card"><h3>${ing.name}</h3>
      <div class="muted">${money(costPerRu(ing))} per ${ing.recipeUnit||'unit'} · used in ${W.dishes.length} dish(es), ${W.recipes.length} recipe(s)</div>
      ${W.recipes.length?`<h4 style="color:var(--amber);margin:14px 0 4px;font-size:12px">BATCH RECIPES</h4>
      <table><tbody>${W.recipes.map(r=>`<tr><td>▣ ${r.name}</td><td class="num">${money(r.cost)}</td></tr>`).join('')}</tbody></table>`:''}
      ${W.dishes.length?`<h4 style="color:var(--amber);margin:14px 0 4px;font-size:12px">MENU ITEMS</h4>
      <table><thead><tr><th>Dish</th><th>Via</th><th class="num">Cost</th><th class="num">Food cost</th></tr></thead><tbody>
      ${W.dishes.map(d=>{const[t,k]=band(d.fc);return `<tr><td>${d.name}</td><td class="muted">${d.via}</td>
        <td class="num">${money(d.cost)}</td><td class="num"><span class="pill ${k}">${t}</span></td></tr>`}).join('')}
      </tbody></table>`:'<div class="muted" style="margin-top:10px">Not used in any dish or recipe.</div>'}</div>`:''}`}

  if(view==='reprice'){const plan=repricePlan(TARGET);
    const gain=plan.filter(p=>p.delta>0).reduce((s,p)=>s+p.weeklyGain,0);
    const known=plan.filter(p=>p.m.weeklySales>0).length;
    el.innerHTML=bar+`<div class="card"><h3>Repricing to ${pct(TARGET)} food cost</h3>
    <div class="muted">What holding target margin across the menu is worth, in money.</div>
    ${known?`<div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v" style="color:var(--good)">${money(gain)}</div><div class="l">Extra profit / week</div></div>
    <div class="kpi"><div class="v">${money(gain*52)}</div><div class="l">Per year</div></div>
    <div class="kpi"><div class="v">${plan.filter(p=>p.delta>0.01).length}</div><div class="l">Prices to raise</div></div></div>`
    :'<div class="muted" style="margin-top:8px">Import weekly sales to see the money impact.</div>'}
    <button class="add" style="margin-top:12px" onclick="applyReprice(TARGET)">Apply suggested prices (rounded to 0.25)</button></div>
    <div class="card"><table><thead><tr><th>Item</th><th class="num">Cost</th><th class="num">Now</th><th class="num">Suggested</th><th class="num">Change</th><th class="num">Weekly gain</th></tr></thead><tbody>
    ${plan.map(p=>`<tr><td>${p.m.name}</td><td class="num">${money(p.c)}</td><td class="num">${p.cur}</td>
      <td class="num" style="color:var(--amber)">${money(p.sug)}</td>
      <td class="num" style="color:${p.delta>0?'var(--warn)':'var(--good)'}">${p.delta>0?'+':''}${money(p.delta)}</td>
      <td class="num">${p.m.weeklySales?money(p.weeklyGain):'—'}</td></tr>`).join('')}
    </tbody></table></div>`}


  if(view==='plan'){const X=explode();const tot=X.reduce((s,r)=>s+r.cost,0);
    const known=DATA.menu.filter(m=>m.weeklySales>0).length;
    el.innerHTML=bar+`<div class="card"><h3>Production plan & shopping list</h3>
    <div class="muted">Every dish exploded through its batch recipes down to raw purchasable ingredients, converted back to purchase units.</div>
    <div class="row" style="margin-top:10px"><span class="muted">Plan for</span>
      <input value="${planDays}" style="width:66px" onchange="planDays=parseFloat(this.value)||7;R()"><span class="muted">days</span>
      ${known?`<span class="muted">· based on ${known} dish(es) with sales data</span>`:'<span class="pill w">no sales data — import it on the Menu engineering tab</span>'}</div>
    ${X.length?`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="v">${money(tot)}</div><div class="l">Ingredient spend</div></div>
      <div class="kpi"><div class="v">${X.length}</div><div class="l">Lines to order</div></div>
      <div class="kpi"><div class="v">${money(tot/planDays)}</div><div class="l">Per day</div></div></div>`:''}</div>
    ${X.length?`<div class="card"><table><thead><tr><th>Ingredient</th><th class="num">Qty needed</th><th>Unit</th><th class="num">Packs</th><th>Pack</th><th class="num">Cost</th><th class="num">% spend</th></tr></thead><tbody>
    ${X.map(r=>`<tr><td>${r.ing.name}</td><td class="num">${r.qty.toFixed(1)}</td><td class="muted">${r.ing.recipeUnit||''}</td>
      <td class="num"><b>${r.packs<1?r.packs.toFixed(2):Math.ceil(r.packs)}</b></td><td class="muted">${r.ing.purchaseUnit||''}</td>
      <td class="num">${money(r.cost)}</td><td class="num muted">${(r.cost/tot*100).toFixed(1)}%</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="card"><div class="muted">Nothing to plan — no dishes have weekly sales figures yet.</div></div>'}`}

  if(view==='allerg'){
    const list=DATA.ingredients.map((x,i)=>({x,i})).filter(({x})=>!q||(x.name||'').toLowerCase().includes(q));
    el.innerHTML=bar+`<div class="card"><h3>Allergens</h3>
    <div class="muted">Tag once on the ingredient; it rolls up through every batch recipe into every dish. Doing this by hand across 149 recipes is exactly the job that gets got wrong.</div></div>
    <div class="card"><h3>Dishes</h3><table><thead><tr><th>Dish</th><th>Contains</th></tr></thead><tbody>
    ${DATA.menu.filter(m=>m.lines.length).slice(0,60).map(m=>{const A=dishAllergens(m);
      return `<tr><td>${m.name}</td><td>${A.length?A.map(a=>`<span class="pill b">${a}</span> `).join(''):'<span class="muted">none tagged</span>'}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="card"><h3>Tag ingredients</h3>
    <input class="search" placeholder="Search ingredient…" oninput="setQ(this.value)" value="${q}">
    <table><tbody>${list.slice(0,40).map(({x,i})=>`<tr><td style="width:200px">${x.name}</td><td>
      ${ALLERGENS.map(a=>`<button class="chip ${(x.allergens||[]).includes(a)?'sel':''}" onclick="toggleAllergen(${i},'${a}')">${a}</button>`).join('')}
      </td></tr>`).join('')}</tbody></table></div>`}

  if(view==='dupes'){const D=duplicates();
    el.innerHTML=bar+`<div class="card"><h3>Possible duplicate ingredients (${D.length})</h3>
    <div class="muted">Each duplicate silently splits usage across two codes, so neither shows true consumption — and one usually carries a stale price.</div></div>
    ${D.length?D.slice(0,30).map(d=>`<div class="card"><div class="split">
      <div><b>${d.a.name}</b><div class="muted">${d.a.code} · ${money(costPerRu(d.a))}/${d.a.recipeUnit||''} · used in ${d.usedA.dishes.length} dish(es), ${d.usedA.recipes.length} recipe(s)</div>
        <button class="add sm" onclick="mergeIng('${d.a.code}','${d.b.code}')">Keep this one</button></div>
      <div><b>${d.b.name}</b><div class="muted">${d.b.code} · ${money(costPerRu(d.b))}/${d.b.recipeUnit||''} · used in ${d.usedB.dishes.length} dish(es), ${d.usedB.recipes.length} recipe(s)</div>
        <button class="add sm" onclick="mergeIng('${d.b.code}','${d.a.code}')">Keep this one</button></div>
    </div><div class="muted" style="margin-top:6px">${(d.s*100).toFixed(0)}% name similarity</div></div>`).join('')
    :'<div class="card"><div class="muted">No likely duplicates found.</div></div>'}`}

  if(view==='health'){const H=health();
    const c=H.score>0.8?'var(--good)':H.score>0.5?'var(--warn)':'var(--bad)';
    el.innerHTML=bar+`<div class="card"><h3>Data health</h3>
    <div class="muted">How far you can trust any number in this app. Every figure downstream inherits these gaps.</div>
    <div style="font-size:52px;font-weight:700;color:${c};margin:14px 0 4px">${(H.score*100).toFixed(0)}%</div>
    <div class="bar" style="height:10px"><i style="width:${H.score*100}%;background:${c}"></i></div></div>
    <div class="card"><table><thead><tr><th>Check</th><th class="num">Complete</th><th style="width:40%"></th></tr></thead><tbody>
    ${H.checks.map(k=>{const r=k.of?k.v/k.of:1;const cc=r>0.8?'var(--good)':r>0.5?'var(--warn)':'var(--bad)';
      return `<tr><td>${k.k}</td><td class="num">${k.v} / ${k.of}</td>
      <td><div class="bar"><i style="width:${r*100}%;background:${cc}"></i></div></td></tr>`}).join('')}
    </tbody></table></div>`}


  if(view==='vers'){const V=versatility().filter(v=>!q||(v.ing.name||'').toLowerCase().includes(q));
    const all=versatility();
    const work=all.filter(v=>v.kind==='workhorse'), single=all.filter(v=>v.kind==='single-use');
    const spendKnown=all.some(v=>v.weeklySpend>0);
    el.innerHTML=bar+`<div class="card"><h3>Ingredient versatility</h3>
    <div class="muted">How many places each ingredient earns its shelf space. Two opposite lessons from one number: <b>workhorses</b> are where negotiating a better rate pays off across the whole menu — <b>single-use</b> items are where waste hides, because you buy a pack for one dish and the rest ages in the walk-in.</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="v">${work.length}</div><div class="l">Workhorses (6+ uses)</div></div>
      <div class="kpi"><div class="v" style="color:${single.length?'var(--warn)':'var(--good)'}">${single.length}</div><div class="l">Single-use — waste risk</div></div>
      <div class="kpi"><div class="v">${all.length?(all.reduce((s,v)=>s+v.uses,0)/all.length).toFixed(1):0}</div><div class="l">Avg uses / ingredient</div></div>
      <div class="kpi"><div class="v">${money(all.reduce((s,v)=>s+v.weeklySpend,0))}</div><div class="l">Weekly ingredient spend</div></div></div></div>
    ${single.length?`<div class="card"><h3 style="color:var(--warn)">Single-use ingredients (${single.length})</h3>
      <div class="muted" style="margin-bottom:8px">Each of these exists for exactly one dish. If that dish sells slowly, the rest of the pack is shrinkage you never see in a recipe cost.</div>
      <table><thead><tr><th>Ingredient</th><th>Only used in</th><th class="num">Cost/unit</th></tr></thead><tbody>
      ${single.slice(0,25).map(v=>`<tr><td>${v.ing.name}</td>
        <td class="muted">${[...v.dishNames,...v.recipeNames][0]||''}</td>
        <td class="num">${v.cost?money(v.cost):'<span style="color:var(--bad)">no price</span>'}</td></tr>`).join('')}
      </tbody></table></div>`:''}
    <div class="card"><input class="search" placeholder="Search ingredient…" oninput="setQ(this.value)" value="${q}">
    <table><thead><tr><th>Ingredient</th><th class="num">Uses</th><th></th><th>Type</th><th class="num">Dishes</th><th class="num">Recipes</th>${spendKnown?'<th class="num">Weekly qty</th><th class="num">Weekly spend</th>':''}<th class="num">Cost/unit</th></tr></thead><tbody>
    ${V.slice(0,120).map(v=>{const mx=all[0]?all[0].uses:1;
      const kc=v.kind==='workhorse'?'g':v.kind==='single-use'?'w':'';
      return `<tr><td>${v.ing.name}</td><td class="num"><b>${v.uses}</b></td>
      <td style="width:110px"><div class="bar"><i style="width:${v.uses/mx*100}%;background:${v.kind==='workhorse'?'var(--good)':'var(--amber)'}"></i></div></td>
      <td><span class="pill ${kc}">${v.kind}</span></td>
      <td class="num muted">${v.direct}${v.viaRec?`+${v.viaRec}↗`:''}</td>
      <td class="num muted">${v.recipes}</td>
      ${spendKnown?`<td class="num muted">${v.weeklyQty?v.weeklyQty.toFixed(0):'—'}</td><td class="num">${v.weeklySpend?money(v.weeklySpend):'—'}</td>`:''}
      <td class="num">${v.cost?v.cost.toFixed(5):'<span style="color:var(--bad)">0</span>'}</td></tr>`}).join('')}
    </tbody></table>
    <div class="muted" style="margin-top:8px">↗ = used indirectly through a batch recipe</div></div>`}


  if(view==='count'){const rows=countRows();
    const entered=rows.filter(r=>r.counted);
    const short=entered.filter(r=>r.variance<-0.001), over=entered.filter(r=>r.variance>0.001);
    const lossV=short.reduce((s,r)=>s+r.value,0), gainV=over.reduce((s,r)=>s+r.value,0);
    const list=rows.filter(r=>(!q||(r.i.name||'').toLowerCase().includes(q)) && (r.used>0||r.opening>0||r.counted));
    el.innerHTML=bar+`<div class="card"><h3>Physical inventory count</h3>
    <div class="muted"><b>expected = opening + received − theoretical usage.</b> Whatever you actually count overwrites the system figure, and the difference is kept as evidence. A shortfall is stock that left without being sold — waste, over-portioning, spoilage or theft — and it never shows up in a recipe cost. This is why a costing sheet can say 22% while the P&L says 34%.</div>
    <div class="row" style="margin-top:10px"><span class="muted">Period</span>
      <input value="${countDays}" style="width:64px" onchange="countDays=parseFloat(this.value)||7;R()"><span class="muted">days since last count</span>
      ${lastCount()?`<span class="muted">· last counted ${new Date(lastCount().at).toLocaleDateString()}</span>`:'<span class="pill w">first count</span>'}</div>
    ${entered.length?`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="v">${entered.length}</div><div class="l">Counted</div></div>
      <div class="kpi"><div class="v" style="color:var(--bad)">${money(Math.abs(lossV))}</div><div class="l">Shortfall value</div></div>
      <div class="kpi"><div class="v" style="color:var(--good)">${money(gainV)}</div><div class="l">Surplus value</div></div>
      <div class="kpi"><div class="v" style="color:${(lossV+gainV)<0?'var(--bad)':'var(--good)'}">${money(lossV+gainV)}</div><div class="l">Net variance</div></div></div>`:''}
    <button class="add" style="margin-top:12px" onclick="commitCount()">Commit count — overwrite stock</button></div>
    <div class="card"><input class="search" placeholder="Search ingredient…" oninput="setQ(this.value)" value="${q}">
    <table><thead><tr><th>Ingredient</th><th class="num">Opening</th><th class="num">Received</th><th class="num">Used (theor.)</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th class="num">Value</th></tr></thead><tbody>
    ${list.slice(0,150).map(r=>{
      const vc=r.variance==null?'':r.variance<-0.001?'b':r.variance>0.001?'w':'g';
      return `<tr><td>${r.i.name}<div class="muted" style="font-size:10.5px">${r.i.invUnit||r.i.purchaseUnit||''}</div></td>
      <td class="num muted">${r.opening.toFixed(1)}</td>
      <td class="num"><input value="${countRecv[r.i.code]??''}" placeholder="0" onchange="countRecv['${r.i.code}']=this.value;R()"></td>
      <td class="num muted">${r.used?r.used.toFixed(1):'—'}</td>
      <td class="num"><b>${r.expected.toFixed(1)}</b></td>
      <td class="num"><input value="${countDraft[r.i.code]??''}" placeholder="count" onchange="countDraft['${r.i.code}']=this.value;R()"></td>
      <td class="num">${r.variance==null?'—':`<span class="pill ${vc}">${r.variance>0?'+':''}${r.variance.toFixed(1)}</span>`}</td>
      <td class="num">${r.value==null?'—':money(r.value)}</td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='countres'){const H=(DATA.countHistory||[]).slice().reverse();
    const withC=DATA.ingredients.filter(i=>i.counts&&i.counts.length);
    const latest=withC.map(i=>({i,c:i.counts[i.counts.length-1]}))
      .filter(x=>Math.abs(x.c.variance)>0.001).sort((a,b)=>a.c.value-b.c.value);
    el.innerHTML=bar+`<div class="card"><h3>Count history & variance</h3>
    <div class="muted">Where stock went that sales cannot explain.</div></div>
    ${H.length?`<div class="card"><table><thead><tr><th>Date</th><th class="num">Lines</th><th class="num">Days</th><th class="num">Shortfall</th><th class="num">Surplus</th><th class="num">Net</th></tr></thead><tbody>
    ${H.map(h=>`<tr><td>${new Date(h.at).toLocaleString()}</td><td class="num">${h.lines}</td><td class="num muted">${h.days}</td>
      <td class="num" style="color:var(--bad)">${money(Math.abs(h.shortfall))}</td>
      <td class="num" style="color:var(--good)">${money(h.surplus)}</td>
      <td class="num"><b>${money(h.shortfall+h.surplus)}</b></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="card"><div class="muted">No counts committed yet.</div></div>'}
    ${latest.length?`<div class="card"><h3>Biggest discrepancies — last count</h3>
    <table><thead><tr><th>Ingredient</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th class="num">Value</th><th class="num">% off</th></tr></thead><tbody>
    ${latest.slice(0,40).map(({i,c})=>{const p=c.expected?Math.abs(c.variance/c.expected):null;
      return `<tr><td>${i.name}</td><td class="num muted">${c.expected.toFixed(1)}</td><td class="num">${c.actual.toFixed(1)}</td>
      <td class="num"><span class="pill ${c.variance<0?'b':'w'}">${c.variance>0?'+':''}${c.variance.toFixed(1)}</span></td>
      <td class="num">${money(c.value)}</td>
      <td class="num muted">${p==null?'—':(p*100).toFixed(0)+'%'}</td></tr>`}).join('')}
    </tbody></table></div>`:''}`}


  if(view==='pour'){const O=overPourImpact();
    el.innerHTML=bar+`<div class="card"><h3>Over-pour impact</h3>
    <div class="muted">The dominant loss in any bar, and the one nothing else can see. A few extra millilitres on every spirit pour never shows up in a recipe, a stock count or an invoice — it just quietly raises your pour cost. Free-pouring drifts high; jiggers don't.</div>
    <div class="row" style="margin-top:10px"><span class="muted">Assume</span>
      <input value="${overPour}" style="width:64px" onchange="overPour=parseFloat(this.value)||0;R()">
      <span class="muted">ml over per spirit/liqueur pour</span></div>
    ${O.rows.length?`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="v" style="color:var(--bad)">${money(O.rows.reduce((s,r)=>s+r.extra,0)/O.rows.length)}</div><div class="l">Avg extra per drink</div></div>
      <div class="kpi"><div class="v" style="color:var(--bad)">${O.weekly?money(O.weekly):'—'}</div><div class="l">Cost per week</div></div>
      <div class="kpi"><div class="v" style="color:var(--bad)">${O.weekly?money(O.weekly*52):'—'}</div><div class="l">Per year</div></div>
      <div class="kpi"><div class="v">${O.rows.length}</div><div class="l">Drinks affected</div></div></div>
      ${O.weekly?'':'<div class="muted" style="margin-top:8px">Add weekly sales figures to see the money.</div>'}`:''}</div>
    <div class="card"><table><thead><tr><th>Drink</th><th class="num">Cost now</th><th class="num">With over-pour</th><th class="num">Extra</th><th class="num">Pour cost now</th><th class="num">After</th></tr></thead><tbody>
    ${O.rows.map(r=>{const k1=r.f1>POUR_TARGET?'w':'g';
      return `<tr><td>${r.m.name}</td><td class="num">${money(r.base)}</td><td class="num">${money(r.c2)}</td>
      <td class="num" style="color:var(--bad)">+${money(r.extra)}</td>
      <td class="num muted">${pct(r.f0)}</td><td class="num"><span class="pill ${k1}">${pct(r.f1)}</span></td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='yield'){const P=parseFloat(window._pour||50); const Y=yieldTable(P);
    el.innerHTML=bar+`<div class="card"><h3>Bottle yield</h3>
    <div class="muted">Serves per bottle is a division, and getting it wrong misprices every drink made from that bottle. "Revenue needed" is what the bottle must earn to hold ${pct(POUR_TARGET)} pour cost.</div>
    <div class="row" style="margin-top:10px"><span class="muted">Pour size</span>
      <input value="${P}" style="width:64px" onchange="window._pour=this.value;R()"><span class="muted">ml</span></div></div>
    <div class="card"><table><thead><tr><th>Bottle</th><th>Type</th><th class="num">Size</th><th class="num">Bottle cost</th><th class="num">Serves</th><th class="num">Cost / serve</th><th class="num">Price for ${pct(POUR_TARGET)}</th></tr></thead><tbody>
    ${Y.map(y=>`<tr><td>${y.i.name}</td><td class="muted">${y.i.category||''}</td>
      <td class="num muted">${y.i.ruPerPu}ml</td><td class="num">${money(y.i.price)}</td>
      <td class="num"><b>${y.pours?y.pours.toFixed(1):'—'}</b></td>
      <td class="num">${y.costPerPour?money(y.costPerPour):'—'}</td>
      <td class="num" style="color:var(--amber)">${y.revenueAt?money(y.revenueAt):'—'}</td></tr>`).join('')}
    </tbody></table></div>`}

  if(view==='abv'){
    el.innerHTML=bar+`<div class="card"><h3>Strength &amp; units</h3>
    <div class="muted">Computed from the actual spec, including alcohol carried in via syrups and bitters. Garnishes add no volume. One unit = 10ml pure alcohol.</div></div>
    <div class="card"><table><thead><tr><th>Drink</th><th>Group</th><th class="num">Volume</th><th class="num">ABV</th><th class="num">Units</th><th></th></tr></thead><tbody>
    ${DATA.menu.filter(m=>m.lines.length).map(m=>{const A=drinkABV(m);
      const k=A.units>=3?'b':A.units>=2?'w':'g';
      return `<tr><td>${m.name}</td><td class="muted">${m.group}</td>
      <td class="num muted">${A.vol.toFixed(0)} ml</td>
      <td class="num"><b>${(A.abv*100).toFixed(1)}%</b></td>
      <td class="num"><span class="pill ${k}">${A.units.toFixed(1)}</span></td>
      <td style="width:120px"><div class="bar"><i style="width:${Math.min(A.abv*100*3,100)}%;background:${A.abv>0.2?'var(--bad)':'var(--amber)'}"></i></div></td></tr>`}).join('')}
    </tbody></table></div>`}

}
const restored=load();
render();
if(restored)console.log('restored autosave from',new Date(restored).toLocaleString());
</script></body></html>
