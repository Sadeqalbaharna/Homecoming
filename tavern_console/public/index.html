    edit(()=>{
      for(const k of ['ingredients','menu','batch','suppliers','supplierMonths','invoices','payments'])
        DATA[k]=[];
      DATA.week={...WK(),employees:[],purchases:[],salesByDay:[0,0,0,0,0,0,0],
        guests:[0,0,0,0,0,0,0],venue:'',weekStart:'',weekEnd:'',days:['','','','','','','']};
      DATA.rates={vat:0,service:0};
      DATA.countHistory=[];DATA.audit=[];DATA.posMap={};DATA.posRejected={};
      DATA.isDemo=false;
    });
    rebuildIX();rebuildBX();
    return false;   // cleared — the caller may proceed
  }
  return true;      // still demo — refuse
}


// ── HOW DATA GETS IN ────────────────────────────────────────────────────
//
// Four routes, best first. Every venue uses two or three of them, and the
// product's job is to make the cheapest available one obvious.
//
//   1. POS CONNECTION   automatic, nightly, no human
//   2. FILE UPLOAD      the manager exports and drops in            (built)
//   3. PHONE SCAN       invoices and marked-up recipe sheets        (planned)
//   4. TYPING           the emergency exit, never the front door    (built)
//
// ── Why the API key is NOT stored here ──────────────────────────────────
//
// A POS API key reads every sale and, on several platforms, can issue refunds
// and void transactions. This console is a single HTML file with browser-local
// storage: anything kept here is readable by any script on the page and by
// anyone who opens the laptop. Putting a live key in it would be handing out
// the restaurant's till because it was convenient.
//
// So the connection screen captures WHICH POS the venue runs and nothing more.
// The key is entered server-side when the connector for that POS exists.
//
// That is not a stalling tactic — it is the honest state, and it converts a
// missing feature into the most valuable question we can ask: every venue that
// names its POS is a vote for which connector to build first.

function supplierTrend(s){
  const ms=supMonths(); const v=ms.map(m=>(s.months||{})[m]||0);

  const early=v.slice(0,half).filter(x=>x), late=v.slice(-half).filter(x=>x);
  const ea=early.length?early.reduce((a,b)=>a+b,0)/early.length:0;
  const la=late.length?late.reduce((a,b)=>a+b,0)/late.length:0;
  return {series:v,early:ea,late:la,change:ea?(la-ea)/ea:null,active:v.filter(x=>x).length};
}

// ── DRILL-DOWN: WHAT MAKES UP A TOTAL ───────────────────────────────────
//
// The imported monthly figures came from a summary sheet — they are totals with
// no documents behind them. Logged invoices and payments are the documents. If
// those two streams never meet, you have a number you cannot defend and a pile
// of paperwork nobody reconciles.
//
// So every total opens: the documents that support it, and the gap where they
// don't. Same discipline as the stock count — the figure and the evidence for
// the figure live next to each other or neither is worth much.
const MONTH_NAMES=['january','february','march','april','may','june','july',
  'august','september','october','november','december'];
// "July 2026" / "Feb 2025" / "March" -> {m:6,y:2026}
function parseMonthLabel(lab){
  const s=String(lab||'').toLowerCase();
  const mi=MONTH_NAMES.findIndex(n=>s.startsWith(n.slice(0,3)));
  const y=(s.match(/(20\d\d)/)||[])[1];
  return mi<0?null:{m:mi,y:y?+y:null};
}
function docMonth(dateStr){
  const d=new Date(dateStr); if(isNaN(d))return null;
  return {m:d.getMonth(),y:d.getFullYear()};
}
const sameMonth=(a,b)=>a&&b&&a.m===b.m&&(a.y==null||b.y==null||a.y===b.y);

/// Every document for a supplier, oldest first, with a running balance.
function docsFor(name){
  const inv=DATA.invoices.filter(i=>i.supplier===name)
    .map(i=>({...i,kind:'invoice',amount:i.total}));
  const pay=DATA.payments.filter(p=>p.supplier===name)
    .map(p=>({...p,kind:'payment'}));
  const all=[...inv,...pay].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  let bal=0;
  return all.map(d=>{bal+=d.kind==='invoice'?d.amount:-d.amount;return {...d,balance:bal}});
}
/// Documents that fall inside one ledger column.
function docsInMonth(name,label){
  const target=parseMonthLabel(label); if(!target)return [];
  return docsFor(name).filter(d=>sameMonth(docMonth(d.date),target));
}
/// Recorded figure vs the payments actually logged for that month.
function reconcileMonth(s,label){
  const recorded=(s.months||{})[label];
  const docs=docsInMonth(s.name,label);
  const logged=docs.filter(d=>d.kind==='payment').reduce((a,d)=>a+d.amount,0);
  if(recorded==null&&!docs.length)return null;
  return {recorded:recorded??0,logged,docs,
    variance:(recorded??0)-logged,
    matched:Math.abs((recorded??0)-logged)<0.005};
}
/// Whole-supplier reconciliation across every column.
function reconcileSupplier(s){
  const rows=supMonths().map(m=>({month:m,rec:reconcileMonth(s,m)})).filter(x=>x.rec);
  const withDocs=rows.filter(x=>x.rec.docs.length);
  return {rows,withDocs:withDocs.length,
    unmatched:withDocs.filter(x=>!x.rec.matched).length};
}

// ── AUDIT TRAIL ─────────────────────────────────────────────────────────
//
// Who changed what, when. In a kitchen or a bar this is not bureaucracy: when
// a price is wrong, a count is off, or a supplier figure moved, the first
// question is always "who touched this and when" — and an app that can't answer
// it turns an honest mistake into an accusation.
//
// ── Why a bespoke differ rather than a generic one ─────────────────────
// A naive object diff reports index positions: `ingredients[147].price`. That
// is unreadable and, worse, WRONG the moment a row is inserted above. Records
// are therefore matched by IDENTITY — code, id, name — so the log reads
// "Garlic Peeled KG · price 1.450 → 1.600" and stays true no matter how the
// arrays are reordered.
DATA.audit=DATA.audit||[];
const AUDIT_MAX=600;
let WHO=(()=>{try{return localStorage.getItem('cc-user')||''}catch(e){return ''}})();
function setWho(n){
  n=String(n||'').trim(); if(!n)return;
  WHO=n; try{localStorage.setItem('cc-user',n)}catch(e){}
  R();
}
function requireWho(){
  if(WHO)return true;
  const n=prompt('Your name — every change is recorded against it:');
  if(!n||!n.trim())return false;
  setWho(n); return true;
}
const fmtV=v=>v==null||v===''?'(blank)':typeof v==='number'?(+v).toFixed(3).replace(/\.?0+$/,''):String(v).slice(0,40);

/// Compare two collections by a key field and report field-level changes.
function diffBy(before,after,key,label,fields){
  const out=[];
  const B=new Map((before||[]).map(x=>[x[key],x])), A=new Map((after||[]).map(x=>[x[key],x]));
  A.forEach((a,k)=>{
    const b=B.get(k);
    if(!b){out.push({what:`${label} added`,item:a.name||a.supplier||k,detail:''});return}
    fields.forEach(f=>{
      const bv=b[f], av=a[f];
      if(JSON.stringify(bv)!==JSON.stringify(av))
        out.push({what:label,item:b.name||b.supplier||k,detail:`${f} ${fmtV(bv)} → ${fmtV(av)}`});
    });
  });
  B.forEach((b,k)=>{if(!A.has(k))out.push({what:`${label} removed`,item:b.name||b.supplier||k,detail:''})});
  return out;
}
function diffMonths(before,after){
  const out=[];
  const B=new Map((before||[]).map(s=>[s.name,s])), A=new Map((after||[]).map(s=>[s.name,s]));
  A.forEach((a,n)=>{
    const b=B.get(n); if(!b)return;
    const keys=new Set([...Object.keys(b.months||{}),...Object.keys(a.months||{})]);
    keys.forEach(m=>{
      const bv=(b.months||{})[m], av=(a.months||{})[m];
      if(bv!==av)out.push({what:'supplier payment',item:n,detail:`${m} ${fmtV(bv)} → ${fmtV(av)}`});
    });
  });
  return out;
}
function diffLines(before,after,label){
  const out=[];
  const B=new Map((before||[]).map(x=>[x.id||x.name,x])), A=new Map((after||[]).map(x=>[x.id||x.name,x]));
  A.forEach((a,k)=>{
    const b=B.get(k); if(!b)return;
    const bl=(b.lines||[]).length, al=(a.lines||[]).length;
    if(bl!==al)out.push({what:label,item:a.name,detail:`${bl} → ${al} ingredients`});
    else (a.lines||[]).forEach((l,i)=>{
      const p=(b.lines||[])[i]; if(!p)return;
      if(p.qty!==l.qty)out.push({what:label,item:a.name,detail:`${nameOf(l.ref)} qty ${fmtV(p.qty)} → ${fmtV(l.qty)}`});
      if(p.ref!==l.ref)out.push({what:label,item:a.name,detail:`ingredient ${nameOf(p.ref)} → ${nameOf(l.ref)}`});
    });
  });
  return out;
}
function computeDiff(before,after){
  let c=[];
  c=c.concat(diffBy(before.ingredients,after.ingredients,'code','ingredient',
      ['name','price','ruPerPu','yield','recipeUnit','currentCount','category']));
  c=c.concat(diffBy(before.menu,after.menu,'id','item',['name','menuPrice','weeklySales','group','description']));
  c=c.concat(diffLines(before.menu,after.menu,'recipe'));
  c=c.concat(diffBy(before.batch,after.batch,'id','recipe',['name','yieldQty','yieldUnit','group']));
  c=c.concat(diffLines(before.batch,after.batch,'recipe'));
  c=c.concat(diffBy(before.suppliers,after.suppliers,'name','supplier',['note']));
  c=c.concat(diffMonths(before.suppliers,after.suppliers));
  c=c.concat(diffBy(before.invoices,after.invoices,'id','invoice',['supplier','total','date']));
  c=c.concat(diffBy(before.payments,after.payments,'id','payment',['supplier','amount','date','ref']));
  // Prime cost week. Wage rates change quietly and matter a lot, so they are
  // diffed by name like everything else rather than trusted to memory.
  c=c.concat(diffBy((before.week||{}).employees||[],(after.week||{}).employees||[],
      'name','employee',['rate']));
  c=c.concat(diffBy((before.week||{}).purchases||[],(after.week||{}).purchases||[],
      'id','purchase',['supplier','amount','date']));
  return c;
}
function logAudit(before,after){
  const changes=computeDiff(before,after);
  if(!changes.length)return;
  DATA.audit.push({at:Date.now(),who:WHO||'unknown',changes:changes.slice(0,12),
    more:Math.max(0,changes.length-12)});
  if(DATA.audit.length>AUDIT_MAX)DATA.audit.splice(0,DATA.audit.length-AUDIT_MAX);
}
/// Most recent change touching a named record — used for "last edited by".
function lastTouch(name){
  for(let i=DATA.audit.length-1;i>=0;i--){
    const e=DATA.audit[i];
    if(e.changes.some(c=>c.item===name))return e;
  }
  return null;
}

// ── ACCOUNTS, ROLES & LOGIN ─────────────────────────────────────────────
//
// ── What this is honest about ──────────────────────────────────────────
// This file runs on a laptop with no server. Anyone who can open it can open
// devtools, so this is NOT security in the sense of keeping a determined
// person out. It is ACCOUNTABILITY plus ROLE SEPARATION:
//   • identity becomes deliberate rather than a name someone types
//   • a bartender can count stock without being able to reprice the menu
//   • the audit trail records a real account, not a free-text field
// Passwords are salted and SHA-256 hashed so they are not sitting in the file
// as plain text — that protects against shoulder-surfing and casual snooping,
// not against a motivated attacker with the file. Real auth arrives with the
// server-backed build.
//
// ── Roles ──────────────────────────────────────────────────────────────
//   owner    everything, including managing accounts
//   manager  everything operational; cannot add or remove users
//   staff    stock counts and viewing; cannot change prices, recipes or money
const ROLES={
  owner:  {label:'Owner',   perms:['view','count','edit','money','users']},
  manager:{label:'Manager', perms:['view','count','edit','money']},
  staff:  {label:'Staff',   perms:['view','count']},
};
DATA.users=DATA.users||[];
/* ── Sign-in switch ──────────────────────────────────────────────────────
   Off for now — one person, one laptop, no reason to type a password to look
   at your own numbers. Nothing was deleted: accounts, hashing, roles and the
   permission gate on every edit are all still here and still enforced. With
   this false the console just runs as a local owner, so `can()` keeps working,
   the audit trail keeps a name against every change, and turning sign-in back
   on is this one word. Flip it to true when someone else needs their own
   login — a manager who shouldn't see supplier pricing, or staff who count
   stock but don't change recipes. */
const REQUIRE_LOGIN=false;

let SESSION=null;          // {username, role}

const can=p=>!!(SESSION&&(ROLES[SESSION.role]?.perms||[]).includes(p));
const roleLabel=r=>ROLES[r]?.label||r;

async function sha(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(12))]
  .map(b=>b.toString(16).padStart(2,'0')).join('');

async function createUser(username,password,role){
  username=String(username||'').trim().toLowerCase();
  if(!username||!password)throw new Error('Username and password are both required');
  if(password.length<4)throw new Error('Password must be at least 4 characters');
  if(DATA.users.some(u=>u.username===username))throw new Error('That username already exists');
  const salt=newSalt();
  DATA.users.push({username,salt,hash:await sha(salt+password),
    role:role||'staff',created:Date.now()});
  save();
}
async function login(username,password){
  username=String(username||'').trim().toLowerCase();
  const u=DATA.users.find(x=>x.username===username);
  // Same message either way: "no such user" tells an outsider which names exist.
  if(!u)return {ok:false,msg:'Incorrect username or password'};
  const h=await sha(u.salt+password);
  if(h!==u.hash)return {ok:false,msg:'Incorrect username or password'};
  SESSION={username:u.username,role:u.role};
  WHO=u.username;
  try{sessionStorage.setItem('cc-session',JSON.stringify(SESSION))}catch(e){}
  return {ok:true};
}
function logout(){
  SESSION=null;WHO='';
  try{sessionStorage.removeItem('cc-session')}catch(e){}
  R();
}
function restoreSession(){
  try{const s=sessionStorage.getItem('cc-session');
    if(!s)return false; const p=JSON.parse(s);
    const u=DATA.users.find(x=>x.username===p.username);
    if(!u)return false;
    SESSION={username:u.username,role:u.role};WHO=u.username;return true;
  }catch(e){return false}
}
async function changePassword(username,password){
  const u=DATA.users.find(x=>x.username===username); if(!u)return;
  u.salt=newSalt(); u.hash=await sha(u.salt+password); save();
}
function removeUser(username){
  if(SESSION&&SESSION.username===username){alert("You can't delete the account you're signed in as.");return}
  const owners=DATA.users.filter(u=>u.role==='owner');
  const target=DATA.users.find(u=>u.username===username);
  if(target&&target.role==='owner'&&owners.length<2){alert('There must always be at least one owner.');return}
  if(!confirm(`Remove ${username}? Their past changes stay in the log.`))return;
  DATA.users=DATA.users.filter(u=>u.username!==username); save(); R();
}

   future nav entry fails loudly instead of silently showing stale numbers. */
const BUILT=new Set(['dash','health','menu','batch','ing','used','vers','allerg','eng','sim',
  'reprice','hist','count','countres','plan','sup','ap','inv','fix','units','dupes','audit',
  'users','pour','yield','abv','week','labour','purch','tva','today','pos','import','sheets',

/* Role gating already exists above as VIEW_PERM + viewAllowed(); the sidebar
   reuses it rather than keeping a second list that would drift out of step.
   A section the current role cannot open is not rendered at all — a nav full
   of items that alert at you is worse than a shorter nav. */
function navLabel(v){
  for(const [,items] of NAVGROUPS)for(const [id,l] of items)if(id===v)return l;
  return v;
}

/* Rail collapse. Persisted separately from the workbook — it is a preference
   about this screen, not data, and it should survive a reset. */
const RAILKEY='cc-rail-collapsed';
let railed=false;
try{railed=localStorage.getItem(RAILKEY)==='1'}catch(e){}
function applyRail(){
  const sh=document.querySelector('.shell'); if(!sh)return;
  sh.classList.toggle('rail',railed);

  if(b){b.textContent=railed?'⟩⟩':'⟨⟨';
        b.title=railed?'Expand the section list':'Collapse the section list'}

function toggleRail(){
  railed=!railed;

/// Which nav group is expanded.
///
/// Thirty-four sections in a flat list is a wall — a new client reads it as
/// "this is going to take a month" before opening anything. Collapsed into
/// groups it is nine lines, and the one you are working in is the one that is
/// open.
///
/// Accordion rather than free toggling: exactly one group at a time. Multiple
/// open groups drift back toward the flat list within a session, which is the
/// thing this exists to prevent. Navigation opens the target's group on its
/// own, so nobody has to manage it.
const NAVOPENKEY='cc-nav-group';
/// null = never chosen, fall back to whichever group holds the current view.
/// ''   = the user deliberately closed everything; respect that.
/// Distinguishing the two matters: without it, clicking the header of the group
/// you are standing in does nothing, because the fallback silently reopens it.
let navOpen=(()=>{try{const v=localStorage.getItem(NAVOPENKEY);return v===null?null:v}catch(e){return null}})();
function groupOf(v){
  for(const [g,items] of NAVGROUPS)if(items.some(i=>i[0]===v))return g;
  return '';
}
function setNavOpen(g){
  navOpen = (navOpen===g) ? '' : g;      // clicking the open one closes it
  try{localStorage.setItem(NAVOPENKEY,navOpen)}catch(e){}
  drawSide();
}

function drawSide(){
  const aside=document.getElementById('side');
  if(!aside)return;
  if(typeof SESSION!=='undefined'&&!SESSION){aside.style.display='none';return}
  // Limiting the options is the point of the guided flow, so the nav goes.
  // Hidden for the WHOLE flow, not only on the first screen. Choosing a file
  // has to show the column mapper, and arriving there with the full sidebar
  // back is the moment the guided flow stops feeling guided.
  if(typeof inSetup==='function'&&inSetup()){aside.style.display='none';return}
  aside.style.display='';
  applyRail();
  const box=document.getElementById('sidegroups');
  const qEl=document.getElementById('navq');
  const nq=railed?'':((qEl&&qEl.value||'').trim().toLowerCase());
  // A search must never hide a match behind a collapsed header, and the
  // icon-only rail has no labels to collapse — so both bypass the accordion.
  const expandAll = !!nq || railed;
  const active=groupOf(view);
  if(navOpen===null&&active)navOpen=active;

  let h='',shown=0;
  for(const [group,items] of NAVGROUPS){
    const vis=items.filter(([v,l])=>viewAllowed(v)&&!viewGate(v)&&
      (!nq||l.toLowerCase().includes(nq)||group.toLowerCase().includes(nq)));
    if(!vis.length)continue;
    const isOpen = expandAll || navOpen===group;
    const hasActive = group===active;
    h+='<div class="navgroup'+(hasActive?' on':'')+'">'+
       '<span role="button" tabindex="0" onclick="setNavOpen(\''+group.replace(/'/g,"\\'")+'\')">'+
       group+
       (isOpen?'':'<span class="cnt">'+vis.length+'</span>')+
       '<span class="chev">'+(isOpen?'▾':'▸')+'</span></span>';
    if(isOpen){
      for(const [v,l,ic] of vis){
        const wip=!BUILT.has(v);
        const badge = v==='needs' ? (()=>{try{const n=pendingQuestions().length;
          return n?` <span style="background:var(--bad);color:#160d06;border-radius:99px;padding:0 6px;font-size:10px;font-weight:700">${n}</span>`:''}catch(e){return''}})() : '';
        h+='<button class="navitem'+(view===v?' on':'')+(wip?' wip':'')+'"'+
           ' onclick="go(\''+v+'\')" title="'+l+(wip?' (not built yet)':'')+'">'+
           '<span class="ic">'+(ic||'·')+'</span>'+
           '<span class="lb">'+l+badge+'</span>'+
           (wip?'<span class="dot">·</span>':'')+'</button>';
      }
    }
    shown+=vis.length;
  }
  box.innerHTML=shown?h:'<div class="navempty">Nothing matches “'+nq+'”.</div>';
}

function go(v){

  DATA.menu.forEach(m=>{const c=itemCost(m),gp=m.menuPrice?netPrice(m)-c:'';
    rows.push([m.name,m.group,c.toFixed(3),m.menuPrice??'',gp===''?'':gp.toFixed(3),
      m.menuPrice?(fcPct(m)*100).toFixed(1):'',m.weeklySales??'',(gp&&m.weeklySales)?(gp*m.weeklySales).toFixed(2):''])});

function importJSON(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=e=>{try{const d=JSON.parse(e.target.result);snapshot();
    DATA.ingredients=d.ingredients||[];DATA.menu=d.menu||[];DATA.batch=d.batch||[];
    rebuildIX();rebuildBX();save();R()}catch(err){alert('Could not read: '+err.message)}};fr.readAsText(f)}
/// Load a sales export for REVIEW. It does not write anything.
///
/// This function used to fuzzy-match each line against the menu and silently
/// apply any match scoring 0.5 or better. That is the exact threshold that
/// paired "Dirty martini" with "Espresso Martini" and "Bowl O' Chili" with
/// "Bowl of Nuts" on a real export — so it was quietly writing sales
/// volumes onto the wrong dishes, and those volumes then flowed into food cost
/// and variance as numbers nobody could trace back.
///
/// Now it loads into the Sales import screen, where exact matches apply and
/// everything else waits for a human. Same data, one extra click, no silent
/// wrong answers.
function importSales(inp){
  const f=inp.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=e=>{
    const lines=String(e.target.result||'').split(/\r?\n/);
    const rows=[]; let skipped=0;
    for(const l of lines){
      if(!l.trim())continue;
      const p=l.split(/[,;\t]/).map(x=>x.replace(/^"|"$/g,'').trim());
      if(p.length<2){skipped++;continue}
      // name, qty[, revenue] — or name, revenue if only two columns
      const name=p[0];
      const qty=parseFloat(p[1]);
      const total=p.length>2?parseFloat(p[2]):NaN;
      if(!name||!isFinite(qty)){skipped++;continue}
      if(/^(item|name|product|description)$/i.test(name)){skipped++;continue}
      rows.push({code:'C'+rows.length,name,cat:p[3]||'',qty,
        total:isFinite(total)?total:0});
    }
    if(!rows.length){alert('No usable rows found. Expected: name, quantity[, revenue].');return}
    const wks=parseFloat(prompt('How many weeks does this report cover?','1'))||1;
    POS={from:'',to:'',weeks:Math.max(0.1,wks),rows};
    view='pos'; R();
    alert(`Loaded ${rows.length} line(s)${skipped?' ('+skipped+' skipped)':''}.\n\n`+
          `Nothing has been applied yet — exact name matches are ready to apply, `+
          `and anything uncertain is waiting for you to confirm or reject.`);
  };
  fr.readAsText(f);
}

function lineRows(k,o,lines){return lines.map((l,li)=>{const uc=unitCostOf(l.ref);

  return `<tr><td><input list="picker" class="wide recipe-ing" value="${l.ref||''}" onchange="setRef('${k}',${o},${li},this.value)" placeholder="type to search…">
  <div class="muted" style="font-size:11px">${l.ref?nameOf(l.ref):''}</div></td>

      onchange="setQty('${k}',${o},${li},this.value)" onkeydown="lineKey(event,'${k}',${o})"
      title="${picked?`Quantity in ${u||'the recipe unit'} · Enter adds the next line`:'Choose an ingredient first'}">
    <b class="mini" style="min-width:26px;text-align:left;color:var(--amber)">${picked?u:''}</b></span></td>

async function doLogin(){

    // The banner belongs here MORE than on the empty screen: this is where a
    // file actually lands, and without it the mapper looks like a different
    // application that the setup handed you off to.
    el.innerHTML=bar+setupBanner+`${STAGE.kind==='itemsales'?`<div class="card" style="border-color:var(--amber)">
      <h3>How long does this report cover?</h3>
      <div class="mini" style="margin-top:4px">Units are stored per week, so a three-month export has to be divided. Getting this wrong scales every sales figure in the app — it used to be a pop-up box typed blind, which is the worst possible place for a number that matters this much.</div>
      <div class="row" style="margin-top:10px">
        <input type="number" step="any" style="width:90px" value="${STAGE.weeks||1}"
          onchange="STAGE.weeks=Math.max(0.1,+this.value||1);R()"> <span class="mini">week(s)</span>
        ${[['1 week',1],['1 month',4.33],['3 months',13],['1 year',52]].map(([l,v])=>
          `<button class="chip" style="margin:0 0 0 6px" onclick="STAGE.weeks=${v};R()">${l}</button>`).join('')}
      </div></div>`:''}
      <div class="card"><div class="hd"><h3>${spec.label} — check the columns</h3>
      <button class="chip" style="margin-left:auto" onclick="stageCancel()">Cancel</button></div>
    <div class="muted">${STAGE.fromPDF
      ? `Read from <b>${STAGE.fromPDF}</b> — ${STAGE.pdfPages} page(s)${STAGE.pdfTotal&&STAGE.pdfTotal>STAGE.pdfPages?` of ${STAGE.pdfTotal}`:''}, ${STAGE.rows.length} priced line(s) found via <b>${STAGE.how||'pattern matching'}</b>.${STAGE.pdfTotal&&STAGE.pdfTotal>STAGE.pdfPages?` Only the first ${STAGE.pdfPages} pages were read — split the file if you need the rest.`:''} Extraction is a proposal, not a fact: check the names before applying. Anything odd is usually a font encoding rather than a mistake in your menu.`
      : `Header row found at line ${STAGE.headerRow+1}; ${STAGE.rows.length} data row(s) below it. The mapping below is a guess — fix anything wrong before applying.`}</div>
    <table style="margin-top:12px">
      <tr><th>Field</th><th>Column in your file</th><th>First value</th></tr>
      ${spec.fields.map(f=>`<tr>
        <td>${f.label}${f.req?' <span class="pill b">required</span>':''}</td>
        <td><select onchange="stageMap('${f.k}',this.value)" style="max-width:240px">${opts(STAGE.map[f.k])}</select></td>
        <td class="mini">${STAGE.map[f.k]!==undefined&&STAGE.rows[0]?String(STAGE.rows[0][STAGE.map[f.k]]??'').slice(0,30):'—'}</td></tr>`).join('')}
    </table></div>

    ${P.missing.length?`<div class="alert"><b>Cannot import yet.</b> Nothing is mapped to: ${P.missing.join(', ')}. Pick the right column above, or cancel if this file does not contain it.</div>`:''}

    <div class="kpis">
      <div class="kpi"><div class="v">${P.rows.length}</div><div class="l">Rows ready</div></div>
      <div class="kpi"><div class="v" style="color:${P.skipped.length?'var(--warn)':'var(--good)'}">${P.skipped.length}</div><div class="l">Rows skipped</div></div>
      ${STAGE.kind==='purchases'?`<div class="kpi"><div class="v">${m2(P.rows.reduce((s,r)=>s+r.total,0))}</div><div class="l">Total value</div></div>
      <div class="kpi"><div class="v">${new Set(P.rows.map(r=>r.supplier)).size}</div><div class="l">Suppliers</div></div>`:''}
      ${STAGE.kind==='daily'?`<div class="kpi"><div class="v">${m2(P.rows.reduce((s,r)=>s+r.sales,0))}</div><div class="l">Total sales</div></div>`:''}
      ${STAGE.kind==='products'?`<div class="kpi"><div class="v">${P.rows.filter(r=>!DATA.menu.some(m=>pnorm(m.name)===pnorm(r.name))).length}</div><div class="l">New to the console</div></div>`:''}
    </div>

    ${STAGE.kind==='punches'?(()=>{
      const R2=pairPunches(P.rows), W=punchWeek(R2.shifts);
      const total=R2.shifts.reduce((s,x)=>s+x.hours,0);
      return `<div class="card"><h3>Punches paired into shifts</h3>
      <div class="muted">A scanner records events; hours come from pairing them. Anything that could not be paired is listed rather than guessed — a missed clock-out silently becomes a 27-hour shift, and 27 hours at any wage wrecks the labour percentage without looking wrong.</div>
      <div class="kpis" style="margin-top:12px">
        <div class="kpi"><div class="v">${R2.shifts.length}</div><div class="l">Shifts paired</div></div>
        <div class="kpi"><div class="v">${total.toFixed(1)}</div><div class="l">Hours</div></div>
        <div class="kpi"><div class="v">${W.people.length}</div><div class="l">People</div></div>
        <div class="kpi"><div class="v" style="color:${R2.unpaired.length?'var(--bad)':'var(--good)'}">${R2.unpaired.length}</div><div class="l">Unpaired punches</div></div>
        <div class="kpi"><div class="v" style="color:${R2.overlong.length?'var(--bad)':'var(--good)'}">${R2.overlong.length}</div><div class="l">Over ${PUNCH_MAX_HOURS}h — rejected</div></div>
        <div class="kpi"><div class="v">${R2.dropped}</div><div class="l">Double presses ignored</div></div>
      </div>
      ${R2.unpaired.length?`<div class="alert"><b>${R2.unpaired.length} punch(es) could not be paired.</b> Those shifts are missing from the hours below — fix them on the device or type the hours in on the Labour tab.
        ${R2.unpaired.slice(0,6).map(u=>`<div style="margin-top:4px">· <b>${u.emp}</b> ${u.at.toLocaleString()} — ${u.why}</div>`).join('')}
        ${R2.unpaired.length>6?`<div class="mini" style="margin-top:6px">…and ${R2.unpaired.length-6} more.</div>`:''}</div>`:''}
      ${R2.overlong.length?`<div class="alert"><b>${R2.overlong.length} shift(s) longer than ${PUNCH_MAX_HOURS} hours were rejected.</b> Almost always a missed clock-out. Counting them would inflate labour cost with hours nobody worked.
        ${R2.overlong.slice(0,4).map(o=>`<div style="margin-top:4px">· <b>${o.emp}</b> from ${o.at.toLocaleString()} — ${o.hours.toFixed(1)}h</div>`).join('')}</div>`:''}
      ${W.outside.length?`<div class="alert" style="border-color:var(--warn);background:rgba(255,200,98,.06)">
        <b>${W.outside.length} shift(s) fall outside the week set on the Prime cost tab</b> (${(WK().weekStart||'no week set')} to ${(WK().weekEnd||'—')}). They will not be imported. Change the week there, or import a narrower export.</div>`:''}
      ${W.people.length?`<table style="margin-top:10px">
        <tr><th>Person</th>${DOW.map(d=>`<th class="num">${d}</th>`).join('')}<th class="num">Week</th></tr>
        ${W.people.map(p=>`<tr><td>${p.name}</td>${p.hours.map(h=>`<td class="num">${h?h.toFixed(1):'—'}</td>`).join('')}
          <td class="num"><b>${p.hours.reduce((a,b)=>a+b,0).toFixed(1)}</b></td></tr>`).join('')}
      </table>`:'<div class="muted" style="margin-top:10px">No shifts landed in the current week.</div>'}
      </div>`})():''}

    ${P.skipped.length?`<div class="card"><div class="muted"><b>${P.skipped.length} row(s) skipped</b> — a required field was blank or unreadable. Usually subtotal or blank separator lines: ${P.skipped.slice(0,6).map(s=>'"'+s+'"').join(', ')}${P.skipped.length>6?'…':''}</div></div>`:''}

    <div class="card"><h3>Preview — first 15 rows</h3>
    <table style="margin-top:8px">
      <tr>${spec.fields.map(f=>`<th>${f.label}</th>`).join('')}</tr>
      ${P.rows.slice(0,15).map(r=>`<tr>${spec.fields.map(f=>{
        const key={name:'name',price:'price',code:'code',cat:'cat',supplier:'supplier',
          total:'total',date:'date',item:'item',qty:'qty',unit:'unit',sales:'sales',covers:'covers'}[f.k];
        const v=r[key];
        return `<td>${v==null||v===''?'<span class="mini">—</span>':v}</td>`}).join('')}</tr>`).join('')}
    </table></div>

    <div class="toolbar">
      <button class="add" ${P.missing.length||!P.rows.length?'disabled style="opacity:.4"':''} onclick="stageApply()">Apply ${P.rows.length} row(s)</button>
      ${STAGE.kind==='purchases'&&STAGE.map&&STAGE.map.item!=null&&P.rows.length?
        `<button class="add" onclick="buildCatalogue()" title="Turn the line items into inventory ingredients, with their costs">Build ingredient catalogue from these</button>`:''}
      <button onclick="stageCancel()">Cancel</button>
    </div>
    ${STAGE.kind==='purchases'&&STAGE.map&&STAGE.map.item!=null&&P.rows.length?
      `<div class="mini" style="margin-top:8px;color:var(--dim)">Applying logs the spend and updates prices for ingredients you already have. <b>Build ingredient catalogue</b> reads the line items into new inventory ingredients.</div>`:''}`}


  // ── RECIPE SHEETS ─────────────────────────────────────────────────────
  if(view==='sheets'){
    const Q=sheetQueue(), missing=Q.filter(r=>!r.has), have=Q.filter(r=>r.has);
    const picked=Object.keys(sheetPick).filter(k=>sheetPick[k]).length;
    const revMissing=missing.reduce((s,r)=>s+r.weekly,0);
    const revAll=Q.reduce((s,r)=>s+r.weekly,0);
    const row=r=>`<tr>
      <td><input type="checkbox" ${sheetPick[r.m.id]?'checked':''} onchange="sheetToggle('${r.m.id}')" style="width:auto"></td>
      <td>${r.m.name||''}</td>
      <td class="mini">${r.m.group||''}</td>
      <td class="num">${r.m.weeklySales?(+r.m.weeklySales).toFixed(0):'<span class="mini">—</span>'}</td>
      <td class="num">${r.weekly?m2(r.weekly):'<span class="mini">—</span>'}</td>
      <td><span class="pill ${r.has?'g':'b'}">${r.has?r.lines+' line(s)':'no recipe'}</span></td>
      <td><button class="chip" style="margin:0" onclick="printSheets(['${r.m.id}'])">Print</button></td></tr>`;
    el.innerHTML=bar+`<div class="card"><h3>Recipe sheets</h3>
    <div class="muted">Chefs do not fill in web forms. They will mark up paper on the pass, and they will do it in minutes if the paper is already mostly right. These sheets print with the ingredient names and units already on them, so the chef writes <b>only numbers</b> — which is also what makes them readable when they come back as a photo.</div>
    <div class="muted" style="margin-top:8px">A dish that already has a recipe prints <b>with its quantities</b> so the chef corrects rather than authors. A dish with none prints with your own ingredient list down the side, so the names written will actually match.</div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="v">${missing.length}</div><div class="l">Dishes with no recipe</div></div>
      <div class="kpi"><div class="v" style="color:var(--bad)">${m2(revMissing)}</div><div class="l">Weekly revenue uncosted</div></div>
      <div class="kpi"><div class="v">${revAll?pct(revMissing/revAll):'—'}</div><div class="l">Share of revenue</div></div>
      <div class="kpi"><div class="v">${have.length}</div><div class="l">Already costed</div></div>
      <div class="kpi"><div class="v" style="color:var(--amber)">${picked}</div><div class="l">Selected</div></div>
    </div>

    <div class="toolbar">
      <button class="add" onclick="sheetPrintPicked()">Print ${picked} sheet(s)</button>
      <button onclick="printPantry()">🖨 Pantry code list (for the wall)</button>
      <label class="add" style="cursor:pointer">📷 Scan filled sheets back in
        <input type="file" accept="image/*,.pdf" multiple hidden onchange="stageBatch(this,'recipes')"></label>
      <button onclick="sheetTop(10)">Select top 10 uncosted</button>
      <button onclick="sheetTop(20)">Top 20</button>
      <button onclick="sheetPick={};R()">Clear</button>
    </div>

    ${missing.length?`<div class="card"><div class="hd"><h3>Not costed — worth the most first</h3>
      <span class="pill b" style="margin-left:auto">${m2(revMissing)} a week</span></div>
      <div class="muted">Ordered by what they earn, not by menu order. On the first real book this ordering was the whole lesson: the top twenty sellers were 43% of revenue while 114 fully-costed dishes had never sold once.</div>
      <table style="margin-top:10px">
        <tr><th></th><th>Dish</th><th>Group</th><th class="num">Sold / wk</th><th class="num">Revenue / wk</th><th>Recipe</th><th></th></tr>
        ${missing.slice(0,60).map(row).join('')}
      </table>
      ${missing.length>60?`<div class="mini" style="margin-top:8px">Showing the top 60 of ${missing.length}.</div>`:''}</div>`:
      `<div class="alert" style="border-color:var(--good);background:rgba(126,231,135,.06)"><b>Every dish has a recipe.</b> Print sheets below only to verify what is already there.</div>`}

    ${have.length?`<div class="card"><h3>Already costed — print to verify</h3>
      <div class="muted">These print with their current quantities crossed-ready, so a chef can correct drift without starting over.</div>
      <table style="margin-top:10px">
        <tr><th></th><th>Dish</th><th>Group</th><th class="num">Sold / wk</th><th class="num">Revenue / wk</th><th>Recipe</th><th></th></tr>
        ${have.slice(0,40).map(row).join('')}
      </table></div>`:''}`}


  if(view==='users'){
    if(!can('users')){el.innerHTML=bar+'<div class="card"><div class="muted">Only an owner can manage accounts.</div></div>';return}
    if(!REQUIRE_LOGIN){
      el.innerHTML=bar+`<div class="card"><h3>Sign-in is off</h3>
      <div class="muted">The console opens straight into the workbook — no username, no password. You are running as <b>${SESSION.username}</b> with owner permissions, and changes are still recorded against that name in the Change log.</div>
      <div class="muted" style="margin-top:10px">Everything behind sign-in is still built and still working: password hashing, the three roles, and the permission check that sits on every single edit. It is switched off, not removed.</div>
      <div class="alert" style="border-color:var(--warn);background:rgba(255,200,98,.06);margin-top:12px">
        Turn it back on when a second person needs the console — a manager who should not see supplier pricing, or staff who count stock but must not change recipes. One line near the top of the file: <b>const REQUIRE_LOGIN=true</b>.</div>
      <div class="muted" style="margin-top:12px">To change the name your edits are recorded under, use the field at the top of the <b>Change log</b>.</div>
      ${DATA.users.length?`<div class="mini" style="margin-top:10px">${DATA.users.length} account${DATA.users.length>1?'s':''} already exist and will start working again the moment you switch it on.</div>`:''}
      </div>`;
      return;
    }
    el.innerHTML=bar+`<div class="card"><h3>Accounts</h3>
    <div class="muted">Roles decide what each person can change. <b>Staff</b> can count stock and view; <b>Manager</b> can do everything operational; <b>Owner</b> can also manage accounts.</div>
    <div class="ed" style="margin-top:12px">
      <div class="f"><label>Username</label><input id="nu_u"></div>
      <div class="f"><label>Password</label><input id="nu_p" type="password"></div>
      <div class="f"><label>Role</label><select id="nu_r">
        ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div>
      <button class="add sm" style="align-self:end" onclick="addUser()">+ Add account</button>
    </div><div id="nu_err" style="color:var(--bad);font-size:12px"></div></div>
    <div class="card"><table><thead><tr><th>Username</th><th>Role</th><th>Can</th><th>Created</th><th></th></tr></thead><tbody>
    ${DATA.users.map(u=>`<tr><td><b>${u.username}</b>${SESSION.username===u.username?' <span class="muted">(you)</span>':''}</td>
      <td><select onchange="setRole('${u.username}',this.value)" ${SESSION.username===u.username?'disabled':''}>
        ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v.label}</option>`).join('')}</select></td>
      <td class="muted" style="font-size:11px">${(ROLES[u.role]?.perms||[]).join(', ')}</td>
      <td class="muted">${new Date(u.created).toLocaleDateString()}</td>
      <td><button class="add sm" onclick="resetPw('${u.username}')">Reset password</button>
        <button class="x" onclick="removeUser('${u.username}')">✕</button></td></tr>`).join('')}
    </tbody></table></div>`}

}

async function addUser(){
  const e=document.getElementById('nu_err');e.textContent='';
  try{await createUser(document.getElementById('nu_u').value,
    document.getElementById('nu_p').value,document.getElementById('nu_r').value);R()}
  catch(err){e.textContent=err.message}
}
async function resetPw(u){
  const p=prompt(`New password for ${u}:`); if(!p)return;
  if(p.length<4){alert('Password must be at least 4 characters');return}
  await changePassword(u,p); alert(`Password updated for ${u}.`);
}
function setRole(u,r){
  const owners=DATA.users.filter(x=>x.role==='owner');
  const t=DATA.users.find(x=>x.username===u);
  if(t.role==='owner'&&r!=='owner'&&owners.length<2){alert('There must always be at least one owner.');R();return}
  t.role=r; save(); R();
}
const restored=load();
restoreSession();
/// Every launch opens on Start here, which in turn opens on whatever is still
/// missing. A console that always opens on the same screen teaches people to
/// scroll past it.
view='today';
/* With sign-in off, adopt a local owner session so permissions and audit
   attribution keep working rather than being bypassed. WHO is whatever name
   was last set in the change log, so edits stay attributable even with no
   password involved. */
if(!REQUIRE_LOGIN&&!SESSION){
  SESSION={username:WHO||'owner',role:'owner'};
  WHO=WHO||'owner';
}
// ── KEYBOARD ────────────────────────────────────────────────────────────
// Ctrl+K to jump anywhere, Ctrl+Z to undo, Esc to close what is open. Three
// shortcuts, all of them ones people already have in their fingers.
// A debounced write in flight must not die with the tab. Flush on hide.
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('beforeunload',()=>{ if(_saveTimer)saveNow(); });
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'&&_saveTimer)saveNow(); });
}
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='k'){ e.preventDefault(); PALETTE?closePalette():openPalette(); return; }
  const inField=/input|textarea|select/i.test((e.target&&e.target.tagName)||'');
  if((e.ctrlKey||e.metaKey)&&k==='z'&&!e.shiftKey&&!inField){ e.preventDefault(); undo(); return; }
  if((e.ctrlKey||e.metaKey)&&(k==='y'||(k==='z'&&e.shiftKey))&&!inField){ e.preventDefault(); redo(); return; }
  if(k==='escape'){ if(PALETTE){closePalette();return} }
});
// Full first paint: render() alone left the sidebar blank until the first
// interaction (or a rail collapse/expand) called R(). Boot through R so the
// nav, palette host and toasts are all drawn on load.
R();
if(restored)console.log('restored autosave from',new Date(restored).toLocaleString());
// Platform mode only: attach the cloud after first paint so the offline app is
// never blocked on the network. Inert (returns immediately) without a config.
if(typeof bootCloud==='function') bootCloud();
</script></body></html>
