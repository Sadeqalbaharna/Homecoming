// ── DUPLICATE INGREDIENTS ───────────────────────────────────────────────
// 318 hand-typed ingredients will contain near-duplicates. Each one silently
// splits usage across two codes, so neither shows its true consumption and one
// of them usually has a stale price.
function dupScore(a,b){
  // Deliberately NOT scoreMatch: that one drops tokens of 2 chars or fewer,
  // which made "Recipe 2.9" and "Recipe 3.10" both collapse to {recipe} and
  // score 100%. It produced 5,462 false pairs. Numbers and short tokens are
  // exactly what distinguishes near-identical names, so they must count.
  const tok=x=>norm(x).split(' ').filter(Boolean);
  const A=tok(a),B=tok(b);
  if(A.length<2||B.length<2)return 0;            // one-word names are not evidence
  const SA=new Set(A),SB=new Set(B);
  let hit=0;SA.forEach(w=>{if(SB.has(w))hit++});
  const jac=hit/new Set([...A,...B]).size;
  // any differing NUMBER is a strong signal they are different items
  const nA=A.filter(w=>/\d/.test(w)).join(','), nB=B.filter(w=>/\d/.test(w)).join(',');
  if(nA!==nB) return jac*0.45;
  return jac;
}
function duplicates(){
  const out=[]; const ing=ING();
  for(let a=0;a<ing.length;a++)for(let b=a+1;b<ing.length;b++){
    const s=dupScore(ing[a].name,ing[b].name);
    if(s>=0.62) out.push({a:ing[a],b:ing[b],s,
      usedA:whereUsed(ing[a].code),usedB:whereUsed(ing[b].code)});
  }
  return out.sort((x,y)=>y.s-x.s).slice(0,60);
}
function mergeIng(keepCode,dropCode){
  if(!confirm(`Merge — every recipe using ${IX[dropCode].name} will point at ${IX[keepCode].name}. This cannot be auto-undone beyond Undo.`))return;
  edit(()=>{
    const repoint=l=>{if(!isB(l.ref)&&codeOf(l.ref)===dropCode)l.ref=keepCode+'_'+IX[keepCode].name};
    DATA.menu.forEach(m=>m.lines.forEach(repoint));
    DATA.batch.forEach(b=>b.lines.forEach(repoint));
    const i=DATA.ingredients.findIndex(x=>x.code===dropCode);
    if(i>=0)DATA.ingredients.splice(i,1);
  });
}

// ── DISH COST BREAKDOWN (pareto) ────────────────────────────────────────
// Where the money in a dish actually goes. Re-engineering the top line is
// worth more than trimming the other ten.
function breakdown(m){
  const total=itemCost(m); if(!total)return [];
  return m.lines.map(l=>({name:nameOf(l.ref),cost:lineCost(l),share:lineCost(l)/total}))
    .filter(x=>x.cost>0).sort((a,b)=>b.cost-a.cost);
}

// ── DATA HEALTH ─────────────────────────────────────────────────────────
// One number for "how far can I trust anything on this screen".
function health(){
  const usedCodes=new Set();
  MENU().forEach(m=>m.lines.forEach(l=>{if(!isB(l.ref))usedCodes.add(codeOf(l.ref))}));
  BATCH().forEach(b=>b.lines.forEach(l=>{if(!isB(l.ref))usedCodes.add(codeOf(l.ref))}));
  const used=[...usedCodes].map(c=>IX[c]).filter(Boolean);
  const pricedIng=used.filter(i=>costPerRu(i)>0).length;
  const dishes=MENU().length, withPrice=priced().length;
  const withSales=MENU().filter(m=>m.weeklySales>0).length;
  const errs=unitSuspects().filter(u=>u.confidence!=='low').length;
  const dups=duplicates().length;
  const checks=[
    {k:'Ingredients priced',v:pricedIng,of:used.length,w:3},
    {k:'Dishes with a menu price',v:withPrice,of:dishes,w:3},
    {k:'Dishes with sales data',v:withSales,of:dishes,w:2},
    {k:'Dishes free of unit errors',v:dishes-errs,of:dishes,w:2},
    {k:'Ingredients without duplicates',v:used.length-Math.min(dups,used.length),of:used.length,w:1},
  ];
  const score=checks.reduce((s,c)=>s+(c.of?c.v/c.of:1)*c.w,0)/checks.reduce((s,c)=>s+c.w,0);
  return {score,checks};
}

// ── RECIPE SCALING ──────────────────────────────────────────────────────
let scaleFactor=1;

// ── VERSATILITY ─────────────────────────────────────────────────────────
// How many places an ingredient earns its shelf space.
//
// Two opposite lessons come out of the same number:
//   HIGH — a workhorse. Every dish moves when its price does, so this is where
//          negotiating a better rate actually pays, and where a supplier
//          switch is most dangerous.
//   ONE  — a single-use ingredient. You buy a pack for one dish, use a
//          fraction, and the rest ages in the walk-in. This is where waste
//          lives, and it never shows up in a recipe cost because spoilage
//          isn't an ingredient.
function versatility(){
  return ING().map(i=>{
    const W=whereUsed(i.code);
    const direct=W.dishes.filter(d=>d.via==='direct').length;
    const viaRec=W.dishes.length-direct;
    const uses=W.dishes.length+W.recipes.length;
    // weekly consumption, if sales figures exist
    let weeklyQty=0;
    const add=(ref,qty,mult,seen)=>{
      if(isB(ref)){const b=BX[ref];if(!b)return;
        seen=seen||new Set();if(seen.has(b.id))return;seen.add(b.id);
        const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
        b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,mult,new Set(seen)));return}
      if(codeOf(ref)===i.code) weeklyQty+=qty*mult;
    };
    DATA.menu.forEach(m=>{const s=m.weeklySales||0;if(!s)return;
      m.lines.forEach(l=>add(l.ref,(l.qty||0),s))});
    const c=costPerRu(i);
    return {ing:i,uses,direct,viaRec,recipes:W.recipes.length,
      dishNames:W.dishes.map(d=>d.name),recipeNames:W.recipes.map(r=>r.name),
      cost:c,weeklyQty,weeklySpend:weeklyQty*c,
      kind: uses===0?'unused' : uses===1?'single-use' : uses>=6?'workhorse' : 'specialist'};
  }).filter(v=>v.uses>0).sort((a,b)=>b.uses-a.uses);
}

// ── PHYSICAL INVENTORY COUNT & VARIANCE ─────────────────────────────────
//
// The equation every restaurant runs on, and the only one that finds money:
//
//   expected = opening + received − theoretical usage
//   variance = actual counted − expected
//
// A negative variance is stock that left without being sold: waste, spoilage,
// over-portioning, or theft. It NEVER appears in a recipe cost, which is why a
// costing sheet can say 22% food cost while the P&L says 34%.
//
// ── The unit trap ───────────────────────────────────────────────────────
// Counts are in INVENTORY units (cases, bottles). Recipes consume RECIPE units
// (grams, each). Converting between them wrongly is the classic way this
// feature produces confident nonsense, so it goes through the purchase unit
// both times rather than being fudged:
//     IU = RU ÷ ruPerPu × iuPerPu
let countDays=7, countDraft={}, countRecv={};

function ruToIu(i,qtyRu){
  const ru=i.ruPerPu||1, iu=i.iuPerPu;
  if(!iu) return qtyRu/ru;               // no inventory unit defined → packs
  return qtyRu/ru*iu;
}
// Theoretical consumption over the period, per ingredient, in INVENTORY units.
function theoreticalUsage(){
  const saved=planDays; planDays=countDays;
  const rows=explode(); planDays=saved;
  const out={};
  rows.forEach(r=>{out[r.ing.code]={ru:r.qty,iu:ruToIu(r.ing,r.qty),cost:r.cost}});
  return out;
}
function countRows(){
  const use=theoreticalUsage();
  return ING().map(i=>{
    const opening=i.currentCount!=null?i.currentCount:(i.startCount||0);
    const recv=parseFloat(countRecv[i.code])||0;
    const u=use[i.code]||{iu:0,ru:0};
    const expected=opening+recv-u.iu;
    const actualRaw=countDraft[i.code];
    const actual=(actualRaw===''||actualRaw==null)?null:parseFloat(actualRaw);
    const variance=actual==null?null:actual-expected;
    // value a shortfall at the cost of ONE inventory unit
    const costIu=i.costPerIu!=null&&i.costPerIu>0?i.costPerIu
      :(i.price&&i.iuPerPu?i.price/i.iuPerPu:costPerRu(i)*(i.ruPerPu||1)/(i.iuPerPu||1));
    return {i,opening,recv,used:u.iu,usedRu:u.ru,expected,actual,variance,
      value:variance==null?null:variance*costIu,costIu,
      counted:actual!=null};
  });
}
// Commit: overwrite stock with what was physically counted, and keep the
// variance permanently. Overwriting without recording the discrepancy would
// erase the only evidence that anything went missing.
function commitCount(){
  const rows=countRows().filter(r=>r.counted);
  if(!rows.length){alert('Enter at least one count first.');return}
  const loss=rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0);
  if(!confirm(`Commit ${rows.length} count(s)?\n\nStock levels will be overwritten with the physical figures.\nRecorded shortfall: ${money(Math.abs(loss))}`))return;
  editAs('count',()=>{
    const at=Date.now();
    rows.forEach(r=>{
      const g=DATA.ingredients.find(x=>x.code===r.i.code); if(!g)return;
      g.counts=g.counts||[];
      g.counts.push({at,opening:r.opening,received:r.recv,used:r.used,
        expected:r.expected,actual:r.actual,variance:r.variance,value:r.value});
      g.currentCount=r.actual;          // physical count wins, always
    });
    DATA.countHistory=DATA.countHistory||[];
    DATA.countHistory.push({at,lines:rows.length,
      shortfall:rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0),
      surplus:rows.filter(r=>r.variance>0).reduce((s,r)=>s+r.value,0),
      days:countDays});
  });
  countDraft={};countRecv={};
  view='countres';R();
}
function lastCount(){const h=DATA.countHistory||[];return h.length?h[h.length-1]:null}

// ══ BAR-SPECIFIC ═══════════════════════════════════════════════════════
// A bar is not a kitchen with different ingredients. Three things differ and
// they change the maths:
//   1. Yield is a DIVISION problem — a 700ml bottle at 50ml pours is 14 serves,
//      and getting that wrong misprices every drink made from it.
//   2. Over-pour is the dominant loss. 5ml extra on a 50ml pour is a silent
//      10% cost increase that no recipe, count or invoice will ever show.
//   3. ABV matters — for the guest, for responsible service, sometimes by law.
const POUR_TARGET=TARGETS.bar;

// How many serves a purchase unit yields at a given pour size.
function poursPerBottle(i,pourMl){
  if(!pourMl||i.recipeUnit!=='ml')return null;
  return (i.ruPerPu||0)/pourMl;
}
// Alcohol by volume of a finished drink, and UK-style units.
function drinkABV(m,seen){
  let vol=0, alc=0;
  const walk=(ref,qty,mult,seen)=>{
    if(isB(ref)){const b=BX[ref];if(!b)return;
      seen=seen||new Set();if(seen.has(b.id))return;seen.add(b.id);
      const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
      b.lines.forEach(l=>walk(l.ref,(l.qty||0)*qty/per,mult,new Set(seen)));return}
    const i=IX[codeOf(ref)]; if(!i)return;
    if(i.recipeUnit!=='ml')return;              // garnish/each contributes no volume
    vol+=qty*mult; alc+=qty*mult*((i.abv||0)/100);
  };
  m.lines.forEach(l=>walk(l.ref,(l.qty||0),1));
  return {vol,alc,abv:vol?alc/vol:0,units:alc/10};   // 10ml pure alcohol = 1 unit
}
// ── OVER-POUR SIMULATOR ────────────────────────────────────────────────
// The single most useful number in a bar. Free-pouring drifts high; this puts
// a currency figure on it across the whole drinks list.
let overPour=5;
let barPour=50;     // ml, the pour size the yield table is costed at
function setOverPour(v){overPour=Math.max(0,+v||0);R()}
function setBarPour(v){barPour=Math.max(1,+v||1);R()}   // ml extra per spirit/liqueur pour
function overPourImpact(){
  const rows=DATA.menu.filter(m=>m.menuPrice>0&&deptOf(m)==='bar').map(m=>{
    const base=itemCost(m);
    let extra=0;
    m.lines.forEach(l=>{
      if(isB(l.ref))return;
      const i=IX[codeOf(l.ref)];
      if(!i||i.recipeUnit!=='ml')return;
      if(!['spirit','liqueur'].includes(i.category||''))return;
      extra+=overPour*costPerRu(i);
    });
    if(!extra)return null;
    const c2=base+extra;
    return {m,base,c2,extra,f0:base/netPrice(m),f1:c2/netPrice(m),
      weekly:extra*(m.weeklySales||0)};
  }).filter(Boolean).sort((a,b)=>b.extra-a.extra);
  return {rows,weekly:rows.reduce((s,r)=>s+r.weekly,0)};
}
// ── BOTTLE YIELD TABLE ─────────────────────────────────────────────────
function yieldTable(pourMl){
  return DATA.ingredients.filter(i=>deptOf(i)==='bar'&&i.recipeUnit==='ml'&&['spirit','liqueur','wine'].includes(i.category||''))
    .map(i=>{const p=poursPerBottle(i,pourMl);
      return {i,pours:p,costPerPour:p?(i.price||0)/p:null,
        revenueAt:(p&&i.price)?((i.price/p)/POUR_TARGET):null};
    }).sort((a,b)=>(b.costPerPour||0)-(a.costPerPour||0));
}


// ── PRIME COST ──────────────────────────────────────────────────────────
//
// Folded in from the restaurantowner.com Weekly Prime Cost workbook.
//
// Prime cost = cost of sales + total labour. It is the number restaurant
// owners actually manage to, because it is the only large cost that moves
// week to week — rent does not, insurance does not, but food and rotas do.
// Convention puts a healthy full-service prime cost around 60% of sales and
// treats 65% as the ceiling; past that the dining room is working for the
// suppliers and the staff rather than the owner.
//
// ── Why this belongs in THIS app rather than beside it ──────────────────
//
// The costing engine already knows what a dish SHOULD cost — recipes, yields,
// unit conversions, all of it. The prime cost workbook knows what was actually
// spent — invoices and hours. Neither can tell you the gap on its own, and the
// gap is the whole game: theoretical food cost versus actual food cost is
// waste, theft, over-portioning and mispricing, added together and finally
// visible. Two spreadsheets that never spoke now share an ingredient table.
//
// ── What the imported week does and does not contain ────────────────────
//
// Sales arrived as a daily total only — the Food / Liquor / Beer / Wine split
// on the source worksheet is all zeros. So category-level cost percentages
// cannot be computed honestly yet, and the views below say so rather than
// dividing by zero and presenting the result with a straight face.
//
// Labour cost is taken from the workbook's own daily figures, NOT recomputed
// as rate x hours. Those two disagree by about 70 across the week because of a
// weekend premium, and the workbook is the source of truth for what was paid.
const PRIME_TARGET ={good:0.60,warn:0.65};   // prime cost as share of sales
const LABOUR_TARGET={good:0.30,warn:0.35};
const COGS_TARGET  ={good:0.32,warn:0.38};
// ── SALES PER LABOUR HOUR: THE FLOOR SHOULD BE YOURS ────────────────────
//
// This was a flat 25, which is a Western-wage benchmark. On Gulf wage
// structures it flags half a normal week as overstaffed, and an owner whose
// first automated insight is obviously wrong stops reading the rest.
//
// A floor that means something is derived from what an hour of labour
// actually costs HERE: below a certain multiple of your own hourly wage bill,
// a shift is not covering the people standing in it. The multiple is the
// judgement (labour is only part of the cost of being open); the wage is the
// fact, and it comes from the book.
const SPLH_MULTIPLE=6;                      // sales must cover ~6× the wage bill
const SPLH_FALLBACK=25;                     // only when no wage data exists at all
function splhFloor(){
  const s=(DATA.settings||{}).splhFloor;
  if(s>0)return +s;                         // an explicit setting always wins
  const L=weekLabour();
  const perHour=L.hours>0?L.paid/L.hours:0;
  if(!(perHour>0))return SPLH_FALLBACK;
  return Math.round(perHour*SPLH_MULTIPLE*10)/10;
}
const SPLH_FLOOR   =25;                      // legacy constant, kept for old callers
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const m2=n=>(n==null||isNaN(n))?'—':(+n).toFixed(2);
const tgtBand=(v,t)=>v==null?'w':v<=t.good?'g':v<=t.warn?'w':'b';

DATA.week=DATA.week||{"venue":"","weekStart":"","weekEnd":"","taxBenefitRate":0,"days":["","","","","","",""],"salesByDay":[0,0,0,0,0,0,0],"salesByCategory":{"Food":[0,0,0,0,0,0,0],"Liquor":[0,0,0,0,0,0,0],"Bottle Beer":[0,0,0,0,0,0,0],"Draft Beer":[0,0,0,0,0,0,0],"Wine":[0,0,0,0,0,0,0],"Merchandise & Other":[0,0,0,0,0,0,0]},"employees":[],"purchases":[],"purchaseCategories":["Meat","Seafood","Poultry","Dairy","Produce","Bakery","Grocery","Soft Bev.","Liquor","Btl Beer","Dft Beer","Wine","Merch."],"guests":[0,0,0,0,0,0,0]};


// ════════════════════════════════════════════════════════════════════════
// THE DAY LEDGER
//
// "History should stay, and if documents are uploaded, history should be
//  retroactively built based on true data."
//
// Until now the book held ONE WEEK. Uploading ninety days of daily sales kept
// seven and discarded eighty-three, and the message said "7 day(s) matched to
// the current week" — which reads like success. The onboarding asks for three
// months. The app was throwing away nineteen twentieths of it.
//
// ── THE SHAPE ──────────────────────────────────────────────────────────
//
//   LEDGER   every day ever imported, keyed by date, kept forever, with the
//            file it came from and when. Nothing is ever dropped for being
//            outside the current window.
//   WINDOW   the seven days currently being looked at. A projection of the
//            ledger, not a separate truth.
//
// Manual edits happen in the window — that is where the screens are — so the
// window is FLUSHED back to the ledger before it moves. Losing a typed
// correction because someone changed the date range would be a worse bug than
// the one this replaces.
//
// ── WHAT IT REFUSES TO DO ──────────────────────────────────────────────
//
// Analysis over a period with holes in it is not analysis. A month missing
// nine days will happily produce a prime cost, and that prime cost will be
// wrong in a direction nobody can predict. So coverage is computed, and a
// period that is not covered says which days are missing instead of
// answering. Keeping the data and refusing the analysis are different things,
// and the data is always kept.
// ════════════════════════════════════════════════════════════════════════

DATA.ledger=DATA.ledger||{days:{},purchases:[]};

const isoDate=d=>{
  if(!d)return '';
  if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);
  const t=parseDate(d); if(!t)return '';
  const x=new Date(t),p=n=>String(n).padStart(2,'0');
  return `${x.getUTCFullYear()}-${p(x.getUTCMonth()+1)}-${p(x.getUTCDate())}`;
};
const dayAdd=(iso,n)=>{
  const [y,m,d]=String(iso).split('-').map(Number);
  const t=Date.UTC(y,m-1,d)+n*86400000, x=new Date(t), p=v=>String(v).padStart(2,'0');
  return `${x.getUTCFullYear()}-${p(x.getUTCMonth()+1)}-${p(x.getUTCDate())}`;
};
const dayDiff=(a,b)=>{
  const P=s=>{const [y,m,d]=String(s).split('-').map(Number);return Date.UTC(y,m-1,d)};
  return Math.round((P(b)-P(a))/86400000);
};

/// Write one day. Merges rather than replaces, so a sales file and an
/// attendance file for the same day both land without one erasing the other.
function ledgerPut(date,patch,src){
  const iso=isoDate(date); if(!iso)return null;
  const L=DATA.ledger.days;
  const cur=L[iso]||{date:iso,src:[],at:0};
  // A day written by an earlier build, or by a migration, may have no src
  // array at all — and this line used to assume it did.
  if(!Array.isArray(cur.src))cur.src=[];
  for(const k of Object.keys(patch||{})){
    const v=patch[k];
    if(v===undefined||v===null)continue;
    if(k==='hours'||k==='cost'||k==='cats')
      cur[k]=Object.assign({},cur[k]||{},v);
    else cur[k]=v;
  }
  if(src&&!cur.src.includes(src))cur.src.push(src);
  cur.at=Date.now();
  L[iso]=cur;
  return cur;
}

const ledgerDates=()=>Object.keys(DATA.ledger.days||{}).sort();
const ledgerSpan=()=>{const d=ledgerDates();return d.length?{from:d[0],to:d[d.length-1],n:d.length}:null;};

/// Does a day carry the thing being asked about?
const hasSales =d=>!!(d&&(+d.sales>0));
const hasHours =d=>!!(d&&d.hours&&Object.values(d.hours).some(h=>+h>0));

/// Coverage of a period. Returns what is there, what is missing, and why that
/// matters — never a bare percentage.
function coverage(from,to,what){
  const test=what==='hours'?hasHours:hasSales;
  const n=dayDiff(from,to)+1;
  if(!(n>0))return {days:0,have:0,missing:[],pct:0};
  const missing=[];
  let have=0;
  for(let i=0;i<n;i++){
    const iso=dayAdd(from,i);
    if(test(DATA.ledger.days[iso]))have++; else missing.push(iso);
  }
  return {days:n,have,missing,pct:n?have/n:0,from,to};
}

/// Flush the working window back into the ledger. Called before the window
/// moves, and after any import that touched it.
function flushWindow(){
  const w=DATA.week||{}; const days=w.days||[];
  days.forEach((d,i)=>{
    const iso=isoDate(d); if(!iso)return;
    const hours={},cost={};
    for(const e of (w.employees||[])){
      const h=(e.hours||[])[i], c=(e.cost||[])[i];
      if(h!=null&&h!=='')hours[e.name]=+h||0;
      if(c!=null&&c!=='')cost[e.name]=+c||0;
    }
    const cats={};
    for(const [k,arr] of Object.entries(w.salesByCategory||{})) cats[k]=+(arr||[])[i]||0;
    ledgerPut(iso,{sales:+(w.salesByDay||[])[i]||0,guests:+(w.guests||[])[i]||0,
                   hours,cost,cats},'window');
  });
  // Purchases live by date, so they belong to the ledger wholesale.
  const seen=new Set((DATA.ledger.purchases||[]).map(p=>p.id));
  for(const p of (w.purchases||[])) if(p.id&&!seen.has(p.id)){DATA.ledger.purchases.push(p);seen.add(p.id)}
}

/// Rates for each employee, remembered across windows — a wage rate is not a
/// property of a week.
DATA.rateBook=DATA.rateBook||{};
function rememberRates(){ for(const e of ((DATA.week||{}).employees||[]))
  if(e.name&&+e.rate>0)DATA.rateBook[e.name]=+e.rate; }

/// Project seven days starting at `start` out of the ledger into the window.
function loadWindow(start){
  flushWindow(); rememberRates();
  const days=Array.from({length:7},(_,i)=>dayAdd(start,i));
  const recs=days.map(d=>DATA.ledger.days[d]||{});
  const names=[...new Set(recs.flatMap(r=>Object.keys(r.hours||{})))];
  const cats={};
  for(const r of recs) for(const k of Object.keys(r.cats||{})) cats[k]=cats[k]||[0,0,0,0,0,0,0];
  days.forEach((d,i)=>{ const r=DATA.ledger.days[d]||{};
    for(const k of Object.keys(cats)) cats[k][i]=+(r.cats||{})[k]||0; });
  DATA.week=Object.assign({},DATA.week,{
    days, weekStart:days[0], weekEnd:days[6],
    salesByDay:recs.map(r=>+r.sales||0),
    guests:recs.map(r=>+r.guests||0),
    salesByCategory:Object.keys(cats).length?cats:(DATA.week||{}).salesByCategory,
    employees:names.map(n=>({name:n,rate:+DATA.rateBook[n]||0,
      hours:days.map(d=>+((DATA.ledger.days[d]||{}).hours||{})[n]||0),
      cost:days.map(d=>{const c=((DATA.ledger.days[d]||{}).cost||{})[n];
        return c==null?undefined:+c||0})})),
    purchases:(DATA.ledger.purchases||[]).filter(p=>{
      const d=isoDate(p.date); return d&&d>=days[0]&&d<=days[6];}),
  });
  DATA.period={start:days[0],end:days[6]};
  rebuildIX(); rebuildBX();
}

/// The most recent week that has anything in it.
function latestWindowStart(){
  const d=ledgerDates().filter(x=>hasSales(DATA.ledger.days[x])||hasHours(DATA.ledger.days[x]));
  if(!d.length)return (DATA.week&&(DATA.week.days||[])[0])||isoDate(new Date().toISOString());
  return dayAdd(d[d.length-1],-6);
}
function shiftWindow(n){ const s=(DATA.period&&DATA.period.start)||latestWindowStart();
  loadWindow(dayAdd(s,n*7)); R(); }
function gotoWindow(iso){ loadWindow(iso); view='week'; R(); }

/// Month-by-month summary, for the history screen.
function ledgerMonths(){
  const by={};
  for(const iso of ledgerDates()){
    const m=iso.slice(0,7), r=DATA.ledger.days[iso];
    const b=by[m]=by[m]||{month:m,days:0,sales:0,guests:0,hours:0,withSales:0,withHours:0};
    b.days++; b.sales+=+r.sales||0; b.guests+=+r.guests||0;
    const h=Object.values(r.hours||{}).reduce((a,x)=>a+(+x||0),0);
    b.hours+=h;
    if(hasSales(r))b.withSales++; if(hasHours(r))b.withHours++;
  }
  const P=(DATA.ledger.purchases||[]);
  for(const p of P){ const m=isoDate(p.date).slice(0,7); if(by[m])by[m].purch=(by[m].purch||0)+(+p.amount||0); }
  return Object.values(by).sort((a,b)=>a.month.localeCompare(b.month));
}
const daysInMonth=m=>{const [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo,0)).getUTCDate()};

/// A book written before the ledger existed has its one week inside DATA.week
/// and nothing in the ledger. Migrating it costs one flush and means nobody
/// loses the week they had.
function migrateToLedger(){
  if(!DATA.ledger)DATA.ledger={days:{},purchases:[]};
  if(Object.keys(DATA.ledger.days||{}).length)return false;
  const w=DATA.week||{};
  if(!(w.days||[]).some(d=>isoDate(d)))return false;
  flushWindow(); rememberRates();
  DATA.period={start:isoDate((w.days||[])[0]),end:isoDate((w.days||[])[6])};
  return true;
}

const WK=()=>DATA.week||{};
const wkDays=()=>(WK().days||[]);

function weekSales(){
  const d=(WK().salesByDay||[]).map(Number);
  return {byDay:d,total:d.reduce((a,b)=>a+b,0)};
}
function weekPurchases(){
  const inv=WK().purchases||[];
  const byCat={},bySup={};
  let total=0;
  for(const p of inv){
    total+=(+p.amount||0);
    bySup[p.supplier]=(bySup[p.supplier]||0)+(+p.amount||0);
    for(const k in (p.alloc||{}))byCat[k]=(byCat[k]||0)+(+p.alloc[k]||0);
  }
  const BEV=['Liquor','Btl Beer','Dft Beer','Wine'];
  const food=Object.entries(byCat).filter(([k])=>!BEV.includes(k)&&k!=='Merch.')
    .reduce((s,[,v])=>s+v,0);
  const bev=BEV.reduce((s,k)=>s+(byCat[k]||0),0);
  const allocated=Object.values(byCat).reduce((a,b)=>a+b,0);
  return {invoices:inv,total,byCat,bySup,food,bev,
    merch:byCat['Merch.']||0,suppliers:Object.keys(bySup).length,
    allocated,unallocated:total-allocated,
    unallocatedRows:inv.filter(p=>!Object.keys(p.alloc||{}).length)};
}
function weekLabour(){
  const emps=WK().employees||[];
  const rate=+(WK().taxBenefitRate||0);
  const byDay=[0,0,0,0,0,0,0], hoursByDay=[0,0,0,0,0,0,0];
  let base=0,paid=0,hours=0;
  // Cost per day, falling back to rate × hours where no cost was recorded.
  //
  // This used to read e.cost[] and nothing else, so an employee with a rate
  // and hours but no per-day cost array contributed ZERO to labour — and
  // that is precisely what the documented workflow produces: the attendance
  // importer supplies hours, and wage rates are typed separately afterwards.
  // Prime cost came out understated with no warning, which is the most
  // expensive kind of wrong this app can be.
  //
  // The recorded cost still wins where it exists, because it carries overtime
  // premiums and allowances that rate × hours cannot know about.
  const rows=emps.map(e=>{
    const hrs=(e.hours||[]).map(v=>+v||0);
    const rec=(e.cost||[]);
    const rate1=+e.rate||0;
    const dayCost=hrs.map((hh,i)=>{
      const r=+rec[i];
      return (rec[i]!==undefined&&isFinite(r))?r:hh*rate1;
    });
    const h=hrs.reduce((a,b)=>a+b,0);
    const c=dayCost.reduce((a,b)=>a+b,0);
    dayCost.forEach((v,i)=>byDay[i]+=v);
    hrs.forEach((v,i)=>hoursByDay[i]+=v);
    base+=rate1*h; paid+=c; hours+=h;
    return {e,hours:h,cost:c,premium:c-(rate1*h),
            costEstimated:!rec.length&&rate1>0};
  }).sort((a,b)=>b.cost-a.cost);
  const taxes=paid*rate;
  return {rows,byDay,hoursByDay,hours,base,paid,premium:paid-base,taxes,
    total:paid+taxes,taxRate:rate};
}
function primeCost(){
  const s=weekSales(),p=weekPurchases(),l=weekLabour();
  const prime=p.total+l.total;
  const pc=s.total?prime/s.total:null;
  return {sales:s.total,byDay:s.byDay,cogs:p.total,labour:l.total,prime,
    pct:pc, cogsPct:s.total?p.total/s.total:null,
    labourPct:s.total?l.total/s.total:null,
    gross:s.total-prime, p,l,s};
}
/// Sales per labour hour, by day and for the week. The single clearest read
/// on whether a rota matches its trade.
function splh(){
  const s=weekSales(),l=weekLabour();
  return {byDay:l.hoursByDay.map((h,i)=>h?s.byDay[i]/h:null),
    week:l.hours?s.total/l.hours:null,hoursByDay:l.hoursByDay};
}
/// Days that were staffed and took little or nothing. Paying a rota to stand
/// still is the most expensive thing a quiet restaurant does.
function deadDays(){
  const s=weekSales(),l=weekLabour();
  return wkDays().map((d,i)=>({date:d,dow:DOW[i],sales:s.byDay[i],
      hours:l.hoursByDay[i],cost:l.byDay[i],
      splh:l.hoursByDay[i]?s.byDay[i]/l.hoursByDay[i]:null}))
    .filter(x=>x.hours>0&&(x.splh==null||x.splh<splhFloor()))
    .sort((a,b)=>(a.splh==null?-1:a.splh)-(b.splh==null?-1:b.splh));
}
/// THEORETICAL food cost — what the recipes say the week should have cost,
/// given how many of each item sold. Needs weeklySales on the menu; without it
/// this returns null rather than a confident guess.
function theoreticalCost(){
  const items=DATA.menu.filter(m=>(m.weeklySales||0)>0);
  if(!items.length)return null;
  let cost=0,revenue=0;
  const rows=items.map(m=>{
    const c=itemCost(m)*(m.weeklySales||0);
    const r=netPrice(m)*(m.weeklySales||0);
    cost+=c; revenue+=r;
    return {m,units:m.weeklySales||0,cost:c,revenue:r};
  }).sort((a,b)=>b.cost-a.cost);
  return {rows,cost,revenue,covered:items.length,
    totalItems:DATA.menu.length,pct:revenue?cost/revenue:null};
}


// ── THE LIST ────────────────────────────────────────────────────────────
//
// Sadeq: "we simplify the FUCK out of it, we make it a checkable list."
//
// He is right, and the market data agrees: every review roundup of this
// category lands on the same sentence — "manual entry is where most operations
// give up." Everyone sells the analysis. Nobody sells the discipline that feeds
// it. So the thirty analysis tabs stop being the app and become the payoff.
//
// ── Why this is derived and not a written to-do list ────────────────────
//
// A hardcoded checklist is a document, and documents are what this market is
// already drowning in. Every task below is COMPUTED from the data: the console
// already knows Wednesday's sales are missing, that no stock count has ever
// been taken, that 152 menu items have no sales volume. Those facts have been
// sitting in footnotes all along. Turned around and pointed at the operator
// they become the product.
//
// The list therefore empties as you feed it and refills as reality moves. It
// cannot go stale, and it cannot be satisfied by ticking a box that nothing
// checks.
//
// ── The score is not a toy ──────────────────────────────────────────────
//
// Gamification usually means inventing a number and hoping someone cares. Here
// the number is real: completeness literally determines how much of this app
// works. At 0% sales mix, four screens cannot compute at all. The trust score
// is a measure of how much of what you are looking at is true — which is worth
// exactly as much attention as a score can command.
//
// SETUP tasks are separated from recurring ones deliberately. Mixing "price
// your 166 unpriced ingredients" into a daily list would make the daily list
// permanently red, and a list that is always red gets ignored within a week.
const BANDS=['setup','daily','weekly','monthly'];
const BAND_LABEL={setup:'Setup',daily:'Today',weekly:'This week',monthly:'This month'};

/// One thing the system needs, what it unlocks, and how far along it is.
/// `done`/`total` rather than a boolean so partial progress is visible —
/// "202 of 368 priced" motivates in a way "incomplete" never does.
function taskState(){
  const wk=WK(), days=wk.days||[], out=[];
  // An empty collection is NOT a finished job.
  //
  // Found by running the console with no data in it: `0 of 0 ingredients
  // priced` was scoring 100%, so a completely blank book reported a 57% trust
  // score and a setup band that was 5/6 done. The one state where the score
  // most needs to be honest was the one state it flattered hardest — and no
  // amount of use on a full book would ever have shown it.
  //
  // When there is nothing there yet, the task reads as not started and asks
  // for the first item instead of congratulating you on having none.
  const add=(id,band,label,done,total,unlocks,go,emptyLabel)=>{
    const empty=total<=0;
    out.push({id,band,
      label: empty&&emptyLabel?emptyLabel:label,
      done: empty?0:done, total: empty?1:total,
      unlocks, go, empty,
      pct: empty?0:Math.min(1,done/total),
      complete: !empty&&done>=total});
  };

  // ── SETUP: the costing foundation. Everything downstream is guesswork
  //    until these are real. One-time work, shown separately so it can finish.
  const ing=DATA.ingredients||[];
  add('ing-price','setup','Price what you BUY — supplier costs',
      ing.filter(i=>i.price>0).length, ing.length,
      'Every recipe cost, every margin, every variance figure', 'ing',
      'Add your ingredients');
  add('ing-units','setup','Set pack size / unit conversion',
      ing.filter(i=>i.ruPerPu>0).length, ing.length,
      'Cost per gram / per ml — without it a price is just a number', 'ing',
      'Set pack sizes once ingredients exist');
  const menu=DATA.menu||[];
  add('menu-price','setup','Price what you SELL — menu prices',
      menu.filter(m=>m.menuPrice>0).length, menu.length,
      'Food cost %, menu engineering, repricing', 'menu',
      'Add your menu items');
  add('rates','setup','Set your tax and service rates',
      ratesSet()?1:0, 1,
      'Correct food cost, margin and repricing everywhere — until these are ' +
      'set, every percentage is measured against the menu price rather than ' +
      'what you bank', 'pos');
  const imp=impossibleValues();
  add('data-sane','setup','Fix impossible values',
      imp.length?0:1, 1,
      'Correct costs everywhere — a negative price silently flatters every ' +
      'recipe it touches', 'ing');
  add('menu-recipe','setup','Give every menu item a recipe',
      menu.filter(m=>(m.lines||[]).length>0).length, menu.length,
      'What a dish actually costs, and what happens when a supplier moves',
      'menu', 'Add recipes once your menu exists');

  // ── DAILY: the trading record. Small, fast, and the thing that decays.
  add('sales-day','daily','Enter sales for every day',
      (wk.salesByDay||[]).filter(v=>v>0).length, days.length,
      'Prime cost, sales per labour hour, the whole weekly report', 'week');
  add('guests-day','daily','Enter guest counts',
      (wk.guests||[]).filter(v=>v>0).length, days.length,
      'Check average, covers per labour hour, capacity read', 'week');
  add('purch-log','daily','Log invoices as they arrive',
      (wk.purchases||[]).length>0?1:0, 1,
      'Cost of sales, supplier spend, what you owe', 'purch');

  // ── WEEKLY
  const emps=wk.employees||[];
  add('labour-hours','weekly','Enter hours for every employee',
      emps.filter(e=>(e.hours||[]).some(h=>h>0)).length, emps.length,
      'Labour %, prime cost, the overtime premium', 'labour',
      'Add your staff');
  add('sales-mix','weekly','Enter units sold per menu item',
      menu.filter(m=>m.weeklySales>0).length, menu.length,
      'Theoretical vs actual, menu engineering, over-pour totals — three ' +
      'screens that cannot compute without it', 'menu',
      'Add your menu items, then import a sales report');
  const catSum=Object.values(wk.salesByCategory||{})
    .reduce((s,a)=>s+(a||[]).reduce((x,y)=>x+(+y||0),0),0);
  add('sales-split','weekly','Split sales by category',
      catSum>0?1:0, 1,
      'Food cost % and pour cost % separately, instead of one blended number',
      'week');

  // ── MONTHLY
  const lastCountAt=(DATA.countHistory||[]).length
    ? Math.max(...DATA.countHistory.map(c=>c.at||0)) : 0;
  const countFresh=lastCountAt>0&&(Date.now()-lastCountAt)<35*86400000;
  add('stock-count','monthly','Take a physical stock count',
      countFresh?1:0, 1,
      'Real cost of sales instead of purchases, and the variance that exposes ' +
      'waste and theft', 'count');
  add('alloc-spend','monthly','Assign every invoice to a category',
      (wk.purchases||[]).filter(p=>Object.keys(p.alloc||{}).length).length,
      (wk.purchases||[]).length,
      'Accurate food vs beverage cost — unassigned spend silently inflates one ' +
      'of them', 'purch', 'Log your first invoice');
  add('price-review','monthly','Review ingredients with no recent price',
      ing.filter(i=>(i.history||[]).length>0).length, ing.length,
      'Price-shock warnings and repricing suggestions', 'hist',
      'Import purchases to build price history');

  return out;
}

/// Values that are not merely missing but impossible.
///
/// Found the hard way: ingredient 182, "Corn oil -Alfa-4*5LTR PET-SQ", carried a
/// price of -26. Negative money is not a typo the eye catches, because it never
/// makes a dish look wrong — it makes twelve batch recipes look CHEAPER, and a
/// food cost that flatters you is the last thing anyone investigates.
///
/// A missing value blocks a calculation, which is loud. A negative one poisons
/// it quietly, so these are separated from the ordinary "not filled in yet"
/// tasks and shown in red.
function impossibleValues(){
  const out=[];
  for(const i of (DATA.ingredients||[])){
    if(i.price<0)out.push({kind:'ingredient',name:i.name,code:i.code,go:'ing',
      why:`price is ${money(i.price)} — negative money makes every recipe using it look cheaper than it is`});
    if(i.ruPerPu<0)out.push({kind:'ingredient',name:i.name,code:i.code,go:'ing',
      why:'pack size is negative, which inverts every conversion from it'});
    if(i.yield!=null&&i.yield<0)out.push({kind:'ingredient',name:i.name,code:i.code,go:'ing',
      why:'yield is negative'});
    // A yield of 0 means nothing usable comes out. It was silently treated as
    // 1 — no waste at all — so a mistyped zero made every dish using it cost
    // what perfect trim would cost. Cheaper than reality, in the direction
    // nobody checks.
    if(i.yield===0)out.push({kind:'ingredient',name:i.name,code:i.code,go:'ing',
      why:'yield is 0%, which would mean nothing usable comes out of it. Every recipe using this is currently costed as if there were no waste at all — set it to 100 if you meant no loss'});
    if(i.yield!=null&&i.yield>1.0001)out.push({kind:'ingredient',name:i.name,code:i.code,go:'ing',
      why:`yield is ${(i.yield*100).toFixed(0)}%, which means more comes out than went in — every dish using it is costed too cheaply`});
  }
  for(const m of (DATA.menu||[])){
    if(m.menuPrice<0)out.push({kind:'menu item',name:m.name,go:'menu',
      why:'sells for a negative amount'});
    for(const l of (m.lines||[]))if(l.qty<0)out.push({kind:'menu item',name:m.name,go:'menu',
      why:'a recipe line has a negative quantity'});
  }
  // A batch that contains itself cannot be costed at all.
  for(const b of (DATA.batch||[]))
    if(batchInCycle(b))out.push({kind:'batch recipe',name:b.name,code:b.code,go:'batch',
      why:'this batch contains itself, directly or through another batch. Its cost cannot be worked out, so every dish using it is uncosted rather than cheap'});
  for(const b of (DATA.batch||[])){
    if(b.yieldQty<0)out.push({kind:'batch recipe',name:b.name,go:'batch',
      why:'yields a negative quantity'});
    for(const l of (b.lines||[]))if(l.qty<0)out.push({kind:'batch recipe',name:b.name,go:'batch',
      why:'a recipe line has a negative quantity'});
  }
  return out;
}

/// Everything downstream of a broken ingredient, so the blast radius is visible
/// rather than guessed at.
///
/// Batch recipes nest — a sauce inside a marinade inside a dish — so this is a
/// fixed-point closure rather than a single hop. Growing a set until it stops
/// growing also makes it immune to a circular recipe, which a recursive walk
/// would not be.
function blastRadius(code){
  const batch=DATA.batch||[], menu=DATA.menu||[];
  const uses=(lines,hit)=>(lines||[]).some(l=>
    isB(l.ref) ? hit.has(l.ref) : codeOf(l.ref)===code);
  const hit=new Set();
  for(let grew=true; grew;){
    grew=false;
    for(const b of batch){
      const ref='B'+b.id;
      if(hit.has(ref))continue;
      if(uses(b.lines,hit)){hit.add(ref);grew=true}
    }
  }
  return {batches:hit.size,
          menu:menu.filter(m=>uses(m.lines,hit)).length};
}

/// Which records are actually missing the field a task is asking about.
///
/// "Prices not uploaded" after importing a menu full of prices is a fair thing
/// to be annoyed by — there are two different prices in this app and a count
/// alone cannot tell you which one it means. Naming the records ends the
/// argument: either the list is right and here are the six items, or it is
/// wrong and that is a bug worth knowing about.
function taskOffenders(id){
  const ing=DATA.ingredients||[], menu=DATA.menu||[], wk=WK();
  const nm=x=>x.name||'(unnamed)';
  switch(id){
    case 'ing-price':   return ing.filter(i=>!(i.price>0)).map(nm);
    case 'ing-units':   return ing.filter(i=>!(i.ruPerPu>0)).map(nm);
    case 'menu-price':  return menu.filter(m=>!(m.menuPrice>0)).map(nm);
    case 'menu-recipe': return menu.filter(m=>!(m.lines||[]).length).map(nm);
    case 'sales-mix':   return menu.filter(m=>!(m.weeklySales>0)).map(nm);
    case 'labour-hours':return (wk.employees||[]).filter(e=>!(e.hours||[]).some(h=>h>0)).map(nm);
    case 'alloc-spend': return (wk.purchases||[]).filter(p=>!Object.keys(p.alloc||{}).length)
                          .map(p=>p.supplier+' '+(p.amount||0));
    case 'price-review':return ing.filter(i=>!(i.history||[]).length).map(nm);
    case 'sales-day':   return (wk.days||[]).filter((d,i)=>!((wk.salesByDay||[])[i]>0))
                          .map((d,i)=>d||('day '+(i+1)));
    case 'guests-day':  return (wk.days||[]).filter((d,i)=>!((wk.guests||[])[i]>0))
                          .map((d,i)=>d||('day '+(i+1)));
    default: return [];
  }
}
let taskShow='';
function toggleTaskShow(id){ taskShow = taskShow===id?'':id; R(); }

/// Progress for one band. `tasks` counts whole tasks; `pct` is weighted by how
/// far each one has actually got, so 340/368 priced ingredients reads as
/// nearly-done rather than not-done.
function bandState(band){
  const t=taskState().filter(x=>x.band===band);
  if(!t.length)return {band,tasks:0,done:0,pct:1,items:[]};
  return {band,tasks:t.length,done:t.filter(x=>x.complete).length,
    pct:t.reduce((s,x)=>s+x.pct,0)/t.length,items:t};
}

/// How much of what you are looking at is actually true.
///
/// Weighted, because the bands are not equal: without the costing foundation
/// nothing downstream means anything, so setup carries the most.
const TRUST_WEIGHT={setup:0.40,daily:0.25,weekly:0.25,monthly:0.10};
function trustScore(){
  let s=0;
  for(const b of BANDS)s+=bandState(b).pct*(TRUST_WEIGHT[b]||0);
  return s;
}

// ── HOW MUCH OF YOUR MONEY IS ACTUALLY COVERED ─────────────────────────
//
// The trust score counts rows: 20 dishes costed out of 152 is 13%, whether
// those 20 are your best sellers or twenty things nobody orders. On this
// venue's own numbers the top 20 items are 43% of revenue — so the score
// moves by almost nothing for the work that matters most, and points a
// manager at the wrong job.
//
// Revenue coverage answers the question an owner is actually asking: of the
// money coming through the till, how much of it does this app understand?
function revenueCoverage(){
  const menu=(DATA.menu||[]).filter(m=>(m.weeklySales||0)>0);
  const rev=m=>(m.weeklySales||0)*(netPrice(m)||0);
  const total=menu.reduce((s,m)=>s+rev(m),0);
  if(!(total>0))return {total:0,costed:0,pct:null,items:0,itemsCosted:0,top:[]};
  const costedItems=menu.filter(m=>(m.lines||[]).length&&itemCost(m)!==null);
  const costed=costedItems.reduce((s,m)=>s+rev(m),0);
  // What to do next, in money order: the biggest sellers with no recipe.
  const top=menu.filter(m=>!(m.lines||[]).length)
    .sort((a,b)=>rev(b)-rev(a)).slice(0,10)
    .map(m=>({name:m.name,rev:rev(m),share:rev(m)/total}));
  return {total,costed,pct:costed/total,items:menu.length,
          itemsCosted:costedItems.length,
          itemPct:menu.length?costedItems.length/menu.length:0, top};
}

  if(!by('stock-count').complete)out.push(['Count variance','a stock count']);

/// The one thing to do next, and nothing else.
///
/// "Fifteen tasks at 42%" is an accurate summary and a bad instruction. Someone
/// opening this between services has a couple of minutes and needs to be told
/// what to do, singular — so the app opens on whatever is still missing rather
/// than on the same screen every time.
///
/// The order is not the order the tasks were written in. It is the order that
/// makes each next step cheaper, which is the same sequencing the onboarding
/// doc argues for:
///
///   · impossible values first — a negative price makes everything downstream
///     wrong while looking fine, so it jumps the queue
///   · then the rates, because every percentage divides by them
///   · then the things a file can fill, cheapest first
///   · then recipes, which need a chef
///   · then the stock count, which needs a person in a walk-in
const STEP_ORDER=['data-sane','rates','menu-price','ing-price','sales-mix',
  'sales-day','purch-log','labour-hours','ing-units','menu-recipe',
  'sales-split','guests-day','alloc-spend','stock-count','price-review'];

function nextStep(){
  const t=taskState();
  for(const id of STEP_ORDER){
    const x=t.find(y=>y.id===id);
    if(x&&!x.complete)return x;
  }
  return t.find(x=>!x.complete)||null;
}

// ── POS SALES IMPORT ────────────────────────────────────────────────────
//
// A real item-sales export from the till: 271 lines, Jan–Jul 2026, Adliya.
//
// ── Why this cannot be applied automatically ────────────────────────────
//
// Fuzzy name matching on this data produces confident nonsense. Real examples
// from the first pass:
//
//     "Dirty martini"  → "Espresso Martini"   (50% token overlap)
//     "Bowl O' Chili"  → "Bowl of Nuts"       (50%)
//     "Clucking Roast" → "Clucking Waffles"   (50%)
//     "ADD Cheese"     → "Grilled Cheese"     (50%)
//
// Every one of those is wrong, and every one would have written a sales volume
// onto the wrong dish — which then flows into theoretical food cost, menu
// engineering and the variance report as a number nobody can trace back. A
// silent importer would have done more damage than no importer.
//
// So: EXACT name matches are safe and get applied. Everything else is a
// proposal that a human accepts or rejects. Same rule as the invoice scanner,
// for the same reason.
//
// ── The other thing this data revealed ──────────────────────────────────
//
// Only 38 of 152 costed menu items appear in the till at all, and the single
// biggest line in the business — a draught beer at ~9% of all revenue — was not
// in the costing workbook. The recipes that exist were chosen by the workbook,
// not by what sells. That is not a matching bug; it is the finding.
let POS={"from":"","to":"","weeks":1,"rows":[]};

const pnorm=s=>String(s||'').toLowerCase().replace(/&/g,' and ')
  .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const PSTOP=new Set(['the','a','of','with','and','in','on','for','add']);
const ptoks=s=>pnorm(s).split(' ').filter(w=>w.length>2&&!PSTOP.has(w));
function pscore(a,b){
  const A=new Set(ptoks(a)),B=new Set(ptoks(b));
  if(!A.size||!B.size)return 0;
  let n=0; for(const w of A)if(B.has(w))n++;
  return n/Math.max(A.size,B.size);
}
/// Confirmed pairings, by POS item code. Persisted so the review is done once.
DATA.posMap=DATA.posMap||{};
DATA.posRejected=DATA.posRejected||{};

function posMatches(){
  const menu=DATA.menu||[];
  const out=[];
  for(const r of (POS.rows||[])){
    const saved=DATA.posMap[r.code];
    if(saved){ const m=menu.find(x=>String(x.id)===String(saved));
      if(m){out.push({r,m,s:1,how:'confirmed'});continue} }
    if(DATA.posRejected[r.code]){out.push({r,m:null,s:0,how:'rejected'});continue}
    // EXACT means the normalised names are equal — nothing weaker.
    //
    // This was originally "token overlap of 100%", and it was wrong in a way
    // only a test caught: token sets ignore word order, so the till's
    // "Martini Espresso" auto-applied 96 units onto the console's "Espresso
    // Martini" with no human ever seeing it. That pair happens to be the same
    // drink. The next one would not have been, and it would have written a
    // sales volume that nothing downstream could trace back.
    //
    // Word-order variants are now proposals. Confirming one is a single click;
    // un-picking a silently mis-assigned volume three months later is not.
    const exact=menu.find(m=>pnorm(m.name)===pnorm(r.name));
    if(exact){out.push({r,m:exact,s:1,how:'exact'});continue}
    let best=null,bs=0;
    for(const m of menu){const s=pscore(r.name,m.name); if(s>bs){bs=s;best=m}}
    out.push({r,m:bs>=0.34?best:null,s:bs,
      how: bs>=0.6?'likely' : bs>=0.34?'possible' : 'none'});
  }
  return out;
}
function posSummary(){
  const M=posMatches(), rev=(POS.rows||[]).reduce((s,r)=>s+r.total,0);
  const g=k=>M.filter(x=>x.how===k);
  const applied=g('exact').concat(g('confirmed'));
  return {rows:M,revenue:rev,weeks:POS.weeks,
    exact:g('exact').length, confirmed:g('confirmed').length,
    likely:g('likely').length, possible:g('possible').length,
    none:g('none').length, rejected:g('rejected').length,
    appliedRevenue:applied.reduce((s,x)=>s+x.r.total,0),
    coverage:rev?applied.reduce((s,x)=>s+x.r.total,0)/rev:0};
}
/// Write units-per-week onto matched menu items. Only ever from an exact or
/// human-confirmed pairing.
function posApply(){
  if(demoBlocks('Applying sales figures'))return;
  edit(()=>{
    const w=POS.weeks||1;
    for(const x of posMatches()){
      if(x.how!=='exact'&&x.how!=='confirmed')continue;
      if(!x.m)continue;
      x.m.weeklySales=Math.round((x.r.qty/w)*100)/100;
      x.m.posCode=x.r.code;
    }
  });
}

const _catIdx=(()=>{const m={}; for(const c of CATALOG)m[c.n.toLowerCase()]=c; return m})();
const catLookup=name=>_catIdx[String(name||'').trim().toLowerCase()]||null;

/// Apply a catalogue entry to an ingredient — units, category, department and
/// allergens. Never price. Marks the row so the pack size gets a second look.
function catApply(i,entry){
  const x=DATA.ingredients[i]; if(!x||!entry)return false;
  x.name=entry.n;
  x.category=entry.c;
  x.dept=entry.d;
  x.purchaseUnit=entry.pu;
  x.recipeUnit=entry.ru;
  x.ruPerPu=entry.rpp;
  x.invUnit=entry.iu;
  x.iuPerPu=entry.ipp;
  x.packSize=x.packSize||entry.pu;
  if(entry.a)x.allergens=entry.a.split('/').map(s=>s.trim()).filter(Boolean);
  if(x.yield==null)x.yield=1;
  x.fromCatalog=true;      // cleared once the pack size is confirmed
  return true;
}
/// Called when someone types or picks a name on the ingredients tab.
function ingName(i,v){
  edit(()=>{
    const x=DATA.ingredients[i]; if(!x)return;
    const hit=catLookup(v);
    // Only auto-fill a row that has not been priced yet — never overwrite
    // units someone has already set against a real invoice.
    if(hit && !(x.price>0)) catApply(i,hit);
    else x.name=v;
  });
}
function catPrompt(){
  const v=prompt('Paste or type ingredient names, one per line.\n\nAnything in the catalogue arrives with its units already set.');
  if(v==null)return;
  const n=catAddMany(v);
  alert(n?`Added ${n} ingredient(s).`:'Nothing new added.');
}
function catConfirm(i){ edit(()=>{const x=DATA.ingredients[i]; if(x)x.fromCatalog=false}); }
/// Bulk add from the catalogue — the difference between a demo and an install.
function catAddMany(names){
  const list=(names||'').split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!list.length)return 0;
  if(demoBlocks('Adding ingredients'))return 0;
  let n=0;
  edit(()=>{
    for(const nm of list){
      const hit=catLookup(nm);
      if(DATA.ingredients.some(x=>(x.name||'').toLowerCase()===nm.toLowerCase()))continue;
      DATA.ingredients.unshift({code:String(Date.now()+n).slice(-4),name:nm,price:0,
        ruPerPu:1,yield:1,recipeUnit:'g-wt',purchaseUnit:'KG',history:[]});
      if(hit)catApply(0,hit);
      n++;
    }
  });
  return n;
}
function catAddCategory(c){
  const names=CATALOG.filter(x=>x.c===c).map(x=>x.n).join('\n');
  const n=catAddMany(names);
  alert(n?`Added ${n} ${c} item(s). Prices are blank — that is the next job.`
         :`All ${c} items are already in your list.`);
}


// ── FILE IMPORT ─────────────────────────────────────────────────────────
//
// Three imports carry most of an onboarding: the product list (kills the menu
// typing), goods received (kills the ingredient pricing), and daily sales.
//
// ── Why one importer and not three parsers ──────────────────────────────
//
// Every POS lays its exports out differently and none of them are documented.
// Writing three parsers against three guessed layouts produces three things
// that break on the first real file. So this maps COLUMNS BY HEADER NAME, shows
// the mapping it guessed, and lets a human correct it before anything is
// written. A layout nobody anticipated costs two dropdowns instead of a
// rewrite.
//
// It also means the first real Foodics or Sapaad export does not require a code
// change — which is the difference between onboarding a customer this week and
// promising them next month.
//
// ── The rule, again ─────────────────────────────────────────────────────
//
// Nothing writes until a human has seen it. Same discipline as the sales
// import, for the same reason: the failure mode of a silent importer is not an
// error message, it is a plausible wrong number three screens away.

/// Split delimited text into rows. Handles quoted fields containing the
/// delimiter, which is where naive splitting dies on supplier names like
/// "Smith, Jones & Sons Ltd".
function parseDelimited(text){
  const t=String(text||'').replace(/^\uFEFF/,'');
  // Sniff the delimiter across the first several lines, not just the first.
  //
  // Real exports open with a title — "Goods Received Note" — that contains no
  // delimiter at all. Judging from line one alone picked a comma for a
  // semicolon file and parsed the whole thing into one column, silently. What
  // actually identifies a separator is the count that stays CONSISTENT down
  // the body, and it has to ignore delimiters inside quoted fields.
  const lines=t.split(/\r?\n/).filter(l=>l.trim()).slice(0,12);
  let delim=',',bestScore=-1;
  for(const d of [',',';','\t','|']){
    const counts=[];
    for(const l of lines){
      let n=0,q=false;
      for(const ch of l){ if(ch==='"')q=!q; else if(ch===d&&!q)n++ }
      if(n>0)counts.push(n);
    }
    if(!counts.length)continue;
    let mode=counts[0],modeN=0;
    for(const c of counts){const k=counts.filter(x=>x===c).length; if(k>modeN){modeN=k;mode=c}}
    const score=modeN*10+mode;
    if(score>bestScore){bestScore=score;delim=d}
  }
const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++} else q=false }
      else cell+=c;
      continue;
    }
    if(c==='"'){q=true;continue}
    if(c===delim){row.push(cell);cell='';continue}
    if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];continue}
    if(c==='\r')continue;
    cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return {rows:rows.filter(r=>r.some(x=>String(x).trim()!=='')),delim};
}

/// POS exports habitually open with a title, a branch name and a date range
/// before the real header. Pick the row that looks most like column headings:
/// mostly non-numeric, several filled cells, and followed by rows of the same
/// width.
function sniffHeader(rows){
  let best=0,bestScore=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i]||[];
    const filled=r.filter(x=>String(x).trim()!=='').length;
    if(filled<2)continue;
    const wordy=r.filter(x=>String(x).trim()!==''&&isNaN(parseFloat(x))).length;
    const next=rows[i+1]||[];
    const nextFilled=next.filter(x=>String(x).trim()!=='').length;
    const score=wordy*2+filled+(nextFilled>=filled-1?3:0);
    if(score>bestScore){bestScore=score;best=i}
  }
  return best;
}
