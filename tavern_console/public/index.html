/// One call. Returns parsed JSON or throws with something a human can act on.
async function aiJSON(system,user){
  if(!aiReady())throw new Error('AI assist is not switched on.');
  const p=AI_PROVIDERS[DATA.ai.provider];
  if(!p)throw new Error('Unknown provider.');
  const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),
    body:JSON.stringify(p.body(DATA.ai.model,system,user))});
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    if(res.status===401)throw new Error('That API key was rejected.');
    if(res.status===429)throw new Error('Rate limited by the provider — wait a moment and retry.');
    throw new Error(`${p.label} returned ${res.status}. ${t.slice(0,200)}`);
  }
  const raw=p.text(await res.json());
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('The model did not return usable JSON.');
  DATA.ai.calls=(DATA.ai.calls||0)+1; DATA.ai.lastUsed=Date.now(); save();
  return JSON.parse(m[0]);
}

const AI_MENU_SYSTEM =
  'You extract menu items from raw text. Return ONLY JSON: '+
  '{"items":[{"name":string,"price":number,"category":string}]}. '+
  'Rules: price is a number with no currency symbol. category is the section '+
  'heading the item sits under, or "" if none. Skip section headings, '+
  'descriptions, allergen notes, addresses and phone numbers — items only. '+
  'Keep the item name exactly as printed, without dot leaders or trailing '+
  'currency codes. If a line has no price, it is not an item. Do not invent '+
  'items, prices or categories. If you cannot read something, leave it out.';

/// AI extraction of a menu. Falls back to the regex parser if anything fails,
/// so switching AI on can make this better but never worse.
async function aiMenuFromText(text){
  const out=await aiJSON(AI_MENU_SYSTEM, text.slice(0,60000));
  const rows=(out.items||[])
    .filter(x=>x&&x.name&&isFinite(+x.price)&&+x.price>0)
    .map(x=>({name:String(x.name).trim().slice(0,90),
              price:+x.price, cat:String(x.category||'').trim().slice(0,40)}));
  if(!rows.length)throw new Error('The model found no priced items in that file.');
  return rows;
}


// ── READING A MENU BY LOOKING AT IT ─────────────────────────────────────
//
// The first real customer menu had no text in it. Not a scan — a designed menu
// whose type had been converted to outlines on export, so every letter is a
// set of bezier curves. A human reads it perfectly. A parser cannot read it at
// all, because there is nothing there to read.
//
// That is not a rare edge case. Converting text to outlines is the default in
// several design tools, precisely so fonts do not have to travel with the file.
// Any product that only parses PDF text will fail on a large share of real
// restaurant menus and will not be able to say why.
//
// So there is a third route: render the page and look at it.
//
//   real text      → parse it (free, instant, offline)
//   outlines/scan  → render to an image and read it with a vision model
//
// Rendering needs pdf.js, which is loaded from a CDN on demand — only when a
// PDF has defeated the parser, and never on startup. Everything else in this
// console still works with no network.
/// Only needed for providers that cannot take a PDF directly.
///
/// Tried in order, because a single CDN is a single point of failure — and
/// when it failed the message blamed the user's internet, which was working
/// fine. Whatever goes wrong now, the last real error is reported.
const PDFJS_HOSTS=[
  ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
   'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
  ['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
   'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
  ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
   'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
];
let _pdfjs=null;
async function loadPdfJs(){
  if(_pdfjs)return _pdfjs;
  if(window.pdfjsLib){ _pdfjs=window.pdfjsLib; }
  else{
    const tried=[];
    for(const [url,worker] of PDFJS_HOSTS){
      try{
        await new Promise((ok,bad)=>{
          const s=document.createElement('script');
          s.src=url;
          s.onload=()=>window.pdfjsLib?ok():bad(new Error('loaded but exported nothing'));
          s.onerror=()=>bad(new Error('blocked or unreachable'));
          document.head.appendChild(s);
          setTimeout(()=>bad(new Error('timed out')),15000);
        });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker;
        _pdfjs=window.pdfjsLib;
        break;
      }catch(e){ tried.push(new URL(url).hostname+': '+e.message); }
    }
    if(!_pdfjs)throw new Error(
      'Could not load the page renderer from any host.\n\n'+tried.join('\n')+
      '\n\nAn ad blocker or network filter is the usual cause. Using Claude '+
      'instead of OpenAI avoids this entirely — Claude reads the PDF directly.');
  }
  return _pdfjs;
}

/// Render pages to PNG data URLs.
///
/// Capped, deliberately. Every page is an image sent to a paid API, so a
/// forty-page brochure would quietly cost real money. The cap is stated in the
/// UI rather than silently applied.
const PDF_MAX_PAGES=12;
/// Long edge in pixels. Menu type is large; 1600px reads it comfortably and
/// anything beyond that is paying to transmit texture.
const PDF_MAX_EDGE=1600;
/// Pages go as JPEG, not PNG, and the difference is not cosmetic.
///
/// A single page rendered to PNG at 2x came out at 5.3 MB once base64-encoded
/// — over the per-image limit on its own — and twelve pages would have been
/// 62 MB. The request would have failed on the first attempt with an opaque
/// error. The same page as JPEG is about 260 KB. Menus are photographs and
/// textured backgrounds, which is exactly what JPEG is for.
const PDF_JPEG_QUALITY=0.85;
/// Sent a few at a time. Providers cap both image count and total request size,
/// and a batch that fails takes the whole menu with it.
const PDF_BATCH=4;

async function pdfPageImages(buf,onProgress){
  const pdfjs=await loadPdfJs();
  const doc=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise;
  const n=Math.min(doc.numPages,PDF_MAX_PAGES);
  const out=[];
  let bytes=0;
  for(let i=1;i<=n;i++){
    if(onProgress)onProgress(i,n);
    const page=await doc.getPage(i);
    const base=page.getViewport({scale:1});
    const scale=Math.min(2, PDF_MAX_EDGE/Math.max(base.width,base.height));
    const vp=page.getViewport({scale:Math.max(scale,0.5)});
    const cv=document.createElement('canvas');
    cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);  // JPEG has no alpha
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const dataUrl=cv.toDataURL('image/jpeg',PDF_JPEG_QUALITY);
    bytes+=dataUrl.length;
    out.push({page:i,dataUrl});
  }
  return {images:out,total:doc.numPages,rendered:n,bytes};
}

/// Vision message shapes differ by provider; the rest of the flow does not.
function visionBody(provider,model,system,prompt,images){
  if(provider==='anthropic'){
    return {model,max_tokens:8000,system,
      messages:[{role:'user',content:[
        ...images.map(im=>({type:'image',source:{type:'base64',
          media_type:'image/jpeg',data:im.dataUrl.split(',')[1]}})),
        {type:'text',text:prompt}]}]};
  }
  return {model,
    messages:[{role:'system',content:system},
      {role:'user',content:[
        ...images.map(im=>({type:'image_url',image_url:{url:im.dataUrl}})),
        {type:'text',text:prompt}]}],
    response_format:{type:'json_object'}};
}

const AI_VISION_PROMPT =
  'These are pages of a restaurant menu. Extract every item that has a price. '+
  'Return ONLY JSON: {"items":[{"name":string,"price":number,"category":string}]}. '+
  'name is the dish name exactly as printed, without its description. '+
  'price is a number only — strip BHD, BD, currency symbols and any trailing zeros notation. '+
  'category is the section heading the item appears under. '+
  'Ignore descriptions, allergen notes, footnotes such as "vegan option available", '+
  'addresses, phone numbers and social handles. '+
  'If an item shows no price, leave it out. Do not invent items or prices. '+
  'If a price is unclear, leave that item out rather than guessing.';

/// ArrayBuffer → base64, in chunks.
///
/// The one-liner — btoa(String.fromCharCode(...new Uint8Array(buf))) — throws
/// "Maximum call stack size exceeded" on anything past a megabyte or so,
/// because every byte becomes an argument. A 2.8 MB menu would have died on
/// the first line.
function bufToBase64(buf){
  const bytes=new Uint8Array(buf);
  const CH=0x8000; let s='';
  for(let i=0;i<bytes.length;i+=CH)
    s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}

/// Claude reads a PDF directly — no rendering, no pdf.js, no CDN.
///
/// The first version rendered pages in the browser and sent images, which
/// meant loading a PDF renderer from a CDN. Opened from a file:// page that
/// load failed and the whole feature was dead with "needs an internet
/// connection", on a machine that plainly had one.
///
/// Sending the PDF itself removes the entire dependency: the API converts each
/// page to an image on its side, which is exactly what was wanted, and it works
/// on a menu whose text is outlines because it is looking at pages rather than
/// parsing them.
///
/// Limits are 32 MB per request and 100 pages, so a menu is never close.
const PDF_MAX_BYTES=28*1024*1024;    // under the 32 MB request cap, with headroom
async function aiMenuFromPDF(buf,fileName){
  if(!aiReady())throw new Error('AI assist is not switched on.');
  if(DATA.ai.provider!=='anthropic')throw new Error('Direct PDF reading is Claude only.');
  if(buf.byteLength>PDF_MAX_BYTES)
    throw new Error(`That PDF is ${(buf.byteLength/1048576).toFixed(1)} MB. The limit is 28 MB — split it and import the halves.`);
  const p=AI_PROVIDERS.anthropic;
  const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),
    body:JSON.stringify({model:p.model,max_tokens:8000,
      system:'You read restaurant menus and return strict JSON.',
      messages:[{role:'user',content:[
        // The PDF goes before the instruction — the docs are explicit about it.
        {type:'document',source:{type:'base64',media_type:'application/pdf',
          data:bufToBase64(buf)}},
        {type:'text',text:AI_VISION_PROMPT}]}]})});
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    if(res.status===401)throw new Error('That API key was rejected.');
    if(res.status===413)throw new Error('That PDF is too large for one request.');
    if(res.status===429)throw new Error('Rate limited — wait a moment and try again.');
    throw new Error(`Claude returned ${res.status}. ${t.slice(0,300)}`);
  }
  const raw=p.text(await res.json());
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('The model did not return usable JSON.');
  DATA.ai.calls=(DATA.ai.calls||0)+1; DATA.ai.lastUsed=Date.now(); save();
  const seen=new Set(); const rows=[];
  for(const x of (JSON.parse(m[0]).items||[])){
    if(!x||!x.name||!isFinite(+x.price)||+x.price<=0)continue;
    const name=String(x.name).trim().slice(0,90);
    if(seen.has(name.toLowerCase()))continue;
    seen.add(name.toLowerCase());
    rows.push({name,price:+x.price,cat:String(x.category||'').trim().slice(0,40)});
  }
  if(!rows.length)throw new Error('No priced items were found in that menu.');
  return {rows,failed:[]};
}

async function aiVisionBatch(images){
  const p=AI_PROVIDERS[DATA.ai.provider];
  const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),
    body:JSON.stringify(visionBody(DATA.ai.provider,p.model,
      'You read restaurant menus from images and return strict JSON.',
      AI_VISION_PROMPT,images))});
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    if(res.status===401)throw new Error('That API key was rejected.');
    if(res.status===413)throw new Error('Those pages are too large for one request.');
    if(res.status===429)throw new Error('Rate limited — wait a moment and try again.');
    throw new Error(`${p.label} returned ${res.status}. ${t.slice(0,200)}`);
  }
  const raw=p.text(await res.json());
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('The model did not return usable JSON.');
  DATA.ai.calls=(DATA.ai.calls||0)+1; DATA.ai.lastUsed=Date.now();
  return (JSON.parse(m[0]).items||[]);
}

/// Read a whole menu, a few pages per request.
///
/// One partial failure must not lose the rest: a batch that errors is reported
/// and skipped, and whatever the other batches found still lands in the review
/// table. Losing four pages is annoying; losing twelve because page nine had a
/// problem is why people stop trusting a tool.
async function aiMenuFromImages(images,onProgress){
  if(!aiReady())throw new Error('AI assist is not switched on.');
  const batches=[];
  for(let i=0;i<images.length;i+=PDF_BATCH)batches.push(images.slice(i,i+PDF_BATCH));
  const all=[]; const failed=[];
  for(let b=0;b<batches.length;b++){
    if(onProgress)onProgress(b+1,batches.length);
    try{ all.push(...await aiVisionBatch(batches[b])); }
    catch(e){ failed.push(`pages ${batches[b][0].page}–${batches[b][batches[b].length-1].page}: ${e.message}`); }
  }
  save();
  const seen=new Set(); const rows=[];
  for(const x of all){
    if(!x||!x.name||!isFinite(+x.price)||+x.price<=0)continue;
    const name=String(x.name).trim().slice(0,90);
    const k=name.toLowerCase();
    if(seen.has(k))continue;           // the same dish can appear on two pages
    seen.add(k);
    rows.push({name,price:+x.price,cat:String(x.category||'').trim().slice(0,40)});
  }
  if(!rows.length)throw new Error(
    failed.length ? 'Every batch failed. '+failed[0] : 'No priced items were found in those pages.');
  return {rows,failed};
}


// ════════════════════════════════════════════════════════════════════════
// PHOTOGRAPHING PAPER
//
// The plan was once a native phone app that did OCR and posted text here.
// That plan died the day Claude read a menu whose text was outlines: the hard
// part was never the reading, it was getting a picture of the paper. A phone
// browser already takes pictures — `capture="environment"` opens the rear
// camera on iOS and Android — so the app that was going to take months is an
// <input> and a downscaler.
//
// What a photo is allowed to do here is deliberately narrow. It produces rows
// in exactly the shape the column mapper produces, and they land in the same
// review table, behind the same confirm. A misread 4 that should have been a 9
// on a supplier invoice becomes an ingredient price, which becomes a food cost
// percentage, which becomes a decision — and nobody can trace it back to a
// photograph. So the camera gets no privileges the CSV importer does not have.
//
// A native app still earns its place for offline capture and for walking a
// walk-in with a tablet. It does not earn its place for this.
// ════════════════════════════════════════════════════════════════════════

/// Phone cameras shoot 12 MP. Sent raw that is ~4 MB of JPEG per page and
/// several times that as base64, for an image whose text is legible at a
/// fraction of the size. 1600px on the long edge is comfortably enough to read
/// an invoice line and roughly a tenth of the bytes.
const PHOTO_MAX_EDGE=1600, PHOTO_QUALITY=0.8, PHOTO_MAX_COUNT=8;

/// Which imports a photograph can plausibly serve, and what to ask the model.
///
/// Not every kind is here. Attendance comes off a device and daily sales come
/// off a till — photographing either is a worse route to the same file, and
/// offering it would imply the console thinks it is a good idea.
const PHOTO_KINDS={
  purchases:{
    what:'supplier invoices or delivery notes',
    system:'You read supplier invoices and delivery notes and return strict JSON.',
    prompt:
      // ── ONE DOCUMENT, MANY INVOICES ─────────────────────────────────────
      // The realistic way somebody digitises three months of paper is to put
      // the whole folder through a scanner once. That produces a single PDF
      // of sixty pages containing forty different invoices — and reading it
      // as ONE invoice would stamp the first supplier's name onto every line
      // in the file, which is the worst possible failure here because every
      // row looks perfectly plausible afterwards.
      //
      // So the model is asked to find the boundaries, and the boundaries are
      // defined by what actually changes on the paper: a different supplier,
      // a different invoice number, a different date, or a page that starts
      // with a fresh letterhead.
      'These pages may contain SEVERAL DIFFERENT INVOICES from several suppliers — '+
      'a folder of paper scanned in one pass. Find where each invoice starts and '+
      'ends: a new letterhead, a different supplier, a different invoice number or '+
      'a different date all mean a new invoice. A single invoice can also run over '+
      'several pages, in which case keep it as one.\n\n'+
      'Return ONLY JSON: {"invoices":[{"supplier":string,"date":string,'+
      '"invoiceNo":string,"pages":string,'+
      '"items":[{"item":string,"qty":number,"unit":number,"total":number}]}]}\n'+
      'supplier is the company the goods came FROM — the sender, not the restaurant '+
      'being billed. '+
      'date is the invoice date as YYYY-MM-DD if you can determine it, otherwise "". '+
      'invoiceNo is the invoice or delivery-note number if printed, else "". '+
      'pages is which pages this invoice came from, like "1-2" or "3". '+
      'item is the product description as printed; qty is the quantity received; '+
      'unit is the cost of ONE unit; total is the line total. '+
      'Strip all currency symbols and codes — numbers only. '+
      'Do NOT include VAT lines, subtotals, grand totals, delivery charges or '+
      'discounts as items. '+
      'If a field is unreadable leave it out rather than guessing. An omitted line '+
      'is recoverable; an invented price is not. '+
      'NEVER carry a supplier name or a date from one invoice onto another — if you '+
      'cannot tell which invoice a page belongs to, start a new one.'},
  products:{
    what:'a printed menu or price list',
    system:'You read restaurant menus and return strict JSON.',
    prompt:AI_VISION_PROMPT},
  recipes:{
    what:'a filled-in recipe sheet',
    system:'You read handwritten restaurant recipe forms and return strict JSON.',
    prompt:
      'These are photographs of printed recipe forms filled in by hand. '+
      'Return ONLY JSON: {"sheets":[{"formId":string,"portions":number,'+
      '"lines":[{"code":string,"qty":number,"unit":string,"corrected":boolean}]}]}. '+
      'formId is the code printed in the box at the top right, like RS-A1B2C3. '+
      'Each form has up to two tables. '+
      'In the FIRST table the printed number under "We have" is the existing '+
      'quantity: if the chef wrote a number in the boxes beside it, use the '+
      'HANDWRITTEN number and set corrected true; if those boxes are empty, use '+
      'the printed number and set corrected false. '+
      'In the SECOND table both the code and the quantity are handwritten; take '+
      'the ticked unit (g, ml or each). '+
      'Read digits exactly as written. Do not correct a code to one you think is '+
      'more likely. '+
      'If a row is blank, leave it out. If a digit is genuinely unreadable, leave '+
      'that whole row out rather than guessing — a missing line is obvious to the '+
      'person checking, a wrong quantity is not.'}
};

/// Downscale in a canvas, then JPEG. Returns what the vision API wants.
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('That file is not an image this browser can open.'))};
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const {w,h}=fitBox(img.naturalWidth,img.naturalHeight,PHOTO_MAX_EDGE);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const d=c.toDataURL('image/jpeg',PHOTO_QUALITY);
      // BOTH shapes, deliberately: visionBody reads dataUrl, the thumbnails
      // read data. Returning one of them was a crash on the first invoice
      // that no test caught, because nothing called the two together.
      resolve({dataUrl:d,data:d.slice(d.indexOf(',')+1),page:0,w,h});
    };
    img.src=url;
  });
}

/// Pure, so it can be proved without a browser: fit inside a square, never
/// enlarge. A 900px scan of a receipt stays 900px rather than being blown up
/// into a blurrier, larger file.
function fitBox(w,h,max){
  if(w<=0||h<=0)return{w:1,h:1};
  if(w<=max&&h<=max)return{w:Math.round(w),h:Math.round(h)};
  const s=max/Math.max(w,h);
  return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))};
}

/// Model output → the exact shape the column mapper hands to the preview.
///
/// Going through STAGE rather than writing rows directly is the whole safety
/// argument: the preview, the duplicate check, the confirm and the audit line
/// are all already there and all already tested. A second write path would be
/// a second set of bugs.
function photoRowsToStage(kind,items){
  const spec=IMPORT_KINDS[kind]; if(!spec)throw new Error('Unknown import kind.');
  const keys=spec.fields.map(f=>f.k);
  const headers=spec.fields.map(f=>f.label);
  const rows=[]; const seen=new Set();
  for(const it of (items||[])){
    if(!it||typeof it!=='object')continue;
    const row=keys.map(k=>{
      let v=it[k];
      if(v===undefined||v===null)return '';
      if(typeof v==='number')return isFinite(v)?String(v):'';
      return String(v).trim().slice(0,120);
    });
    if(!row.some(c=>c!==''))continue;
    // Every required field must be present. A row missing its supplier or its
    // total is not a partial row, it is a guess wearing a row's clothes.
    const missing=spec.fields.some((f,i)=>f.req&&row[i]==='');
    if(missing)continue;
    const k=row.join('').toLowerCase();
    if(seen.has(k))continue;         // the same line photographed twice
    seen.add(k);
    rows.push(row);
  }
  const map={}; keys.forEach((k,i)=>map[k]=i);
  return {kind,headers,rows,map,headerRow:-1,fromPhoto:true};
}

/// One photo per tap, so there has to be somewhere to put them.
///
/// `capture` and `multiple` cannot both apply to one input — the spec gives
/// `capture` precedence, so a "select several" input that also opens the
/// camera silently returns a single file. Written the obvious way, the button
/// would have promised eight pages and delivered one, on the exact device it
/// was built for.
///
/// So the camera adds to a tray and the tray is sent when the invoice is
/// complete. That is better than the batch upload anyway: an invoice with a
/// second page is the normal case, and you find out you missed it while the
/// paper is still in your hand.
let SHOTS=[];            // {name, dataUrl, w, h}
let SHOTKIND=null;
function dropShot(i){ SHOTS.splice(i,1); if(!SHOTS.length)SHOTKIND=null; R(); }
function clearShots(){ SHOTS=[]; SHOTKIND=null; R(); }

async function addShots(inp,kind){
  const files=[...(inp.files||[])]; inp.value='';
  if(!files.length)return;
  if(SHOTKIND&&SHOTKIND!==kind)clearShots();      // never mix an invoice into a menu
  SHOTKIND=kind;
  PHOTOBUSY={n:files.length,stage:'preparing'}; R();
  try{
    for(const f of files){
      if(SHOTS.length>=PHOTO_MAX_COUNT){
        alert(`That is the limit of ${PHOTO_MAX_COUNT} pages. Read these, then start the next batch.`);
        break;
      }
      if(!/^image\//.test(f.type||''))throw new Error(`"${f.name}" is not an image.`);
      const im=await shrinkImage(f);
      SHOTS.push({name:f.name||('page '+(SHOTS.length+1)),data:im.data,w:im.w,h:im.h});
    }
    PHOTOBUSY=null; view='import'; R();
  }catch(e){
    PHOTOBUSY=null;
    FILEFAIL={file:'photo',short:'That photo could not be prepared.',why:e.message,
      reason:'photo',canVision:false};
    view='import'; R();
  }
}

// ── A STACK OF INVOICES ────────────────────────────────────────────────
//
// A month of goods received is thirty pieces of paper, not one. The obvious
// implementation — put them all in a single request — is the one that must not
// be built: the model would return a flat list of lines with no reliable way
// to say which supplier or which date each came from, and cross-contaminated
// rows are the failure nobody catches, because every line looks plausible.
//
// So it is a queue. One request per invoice, sequentially, and the supplier
// and date on each row can only have come from the document that produced it.
//
// Three properties this has to have, all learned the hard way elsewhere:
//
//   FAILURE IS ISOLATED. Invoice 9 failing must not cost you invoices 1–8.
//                        Each one keeps its own status and its own error.
//   IT CAN BE STOPPED.   Thirty invoices is thirty paid API calls. Anything
//                        that spends per iteration needs a stop that works
//                        mid-run, not a promise that it will finish.
//   DUPLICATES SURFACE.  The same invoice scanned twice is the likeliest
//                        error in a monthly batch. Flagged, not silently
//                        merged and not silently doubled.

let INVBATCH=null;   // {items:[{name,kind,pages|pdf,status,rows,error,dup}], i, stop, calls}

function batchReset(){ INVBATCH=null; R(); }
function batchStop(){ if(INVBATCH)INVBATCH.stop=true; R(); }

/// Every file becomes one invoice. A multi-page PDF is one invoice; a photo is
/// one invoice unless the pages were grouped in the tray first.
async function stageBatch(inp,kind){
  const files=[...(inp.files||[])]; inp.value='';
  if(!files.length)return;
  if(!aiReady()){
    FILEFAIL={file:files.length+' file(s)',short:'Reading invoices needs AI assist switched on.',
      why:'Switch on AI assist above and add a key. If your supplier sends a CSV or '+
          'your POS does goods-received, use that instead — it is free and exact.',
      reason:'nokey',canVision:false};
    view='import'; R(); return;
  }
  if(files.length>BATCH_MAX){
    alert(`That is ${files.length} files. The limit is ${BATCH_MAX} per run — each one is a separate paid call, and a smaller batch is easier to check.`);
    return;
  }
  const gate=authorizeCalls(files.length);
  if(!gate.ok){
    FILEFAIL={file:files.length+' file(s)',short:'Held by the spend limit.',
      why:gate.reason+(gate.needsHuman?'\n\nRaise the lifetime limit on this screen if you want to continue.':''),
      reason:'spend',canVision:false};
    view='import'; R(); return;
  }
  INVBATCH={kind,items:files.map(f=>({name:f.name,file:f,status:'waiting',rows:[],error:''})),
         i:0,stop:false,calls:0,done:false};
  view='import'; R();
  await batchRun();
}

const BATCH_MAX=30;

async function batchRun(){
  const conf=PHOTO_KINDS[INVBATCH.kind];
  for(let i=0;i<INVBATCH.items.length;i++){
    if(INVBATCH.stop){ INVBATCH.items.slice(i).forEach(it=>{if(it.status==='waiting')it.status='stopped'}); break; }
    const it=INVBATCH.items[i]; INVBATCH.i=i; it.status='reading'; R();
    try{
      // The paper is kept BEFORE the reading, so a document survives even when
      // the model fails on it — which is exactly the one you will want to see.
      it.doc=await keepDoc(it.file,INVBATCH.kind);
      const items=await readOneDoc(it.file,conf);
      INVBATCH.calls++;
      if(INVBATCH.kind==='purchases'){
        // A document may hold many invoices. Flatten them into rows, but keep
        // each row tied to the invoice it came from so supplier and date can
        // never bleed between them.
        const invs=normaliseInvoices(items);
        it.invoices=invs;
        const flat=[];
        for(const inv of invs)
          for(const li of (inv.items||[]))
            flat.push({supplier:inv.supplier,date:inv.date,invoiceNo:inv.invoiceNo,
                       item:li.item,qty:li.qty,unit:li.unit,total:li.total});
        const st=photoRowsToStage('purchases',flat);
        it.rows=st.rows; it.headers=st.headers; it.map=st.map;
        it.status=st.rows.length?'ok':'empty';
        it.error=st.rows.length?'':'No complete lines were found in this one.';
        it.note=invs.length>1?`${invs.length} separate invoices found in this file`:'';
      } else if(INVBATCH.kind==='recipes'){
        // A recipe sheet is not rows-and-columns; it is one dish per page.
        it.sheets=(items||[]).map(readRecipeSheet);
        it.rows=[];
        const good=it.sheets.filter(s=>s.dish&&s.lines.length);
        it.status=good.length?'ok':'empty';
        it.error=good.length?'':((it.sheets[0]&&it.sheets[0].problems[0])||'No readable rows on this sheet.');
      }else{
        const st=photoRowsToStage(INVBATCH.kind,items);
        it.rows=st.rows; it.headers=st.headers; it.map=st.map;
        it.status=st.rows.length?'ok':'empty';
        if(!st.rows.length)it.error='No complete lines were found in this one.';
      }
    }catch(e){ it.status='failed'; it.error=e.message; }
    R();
    await new Promise(r=>setTimeout(r,0));
  }
  INVBATCH.done=true;
  batchCollect();
  R();
}

/// One document → the model's raw items. PDF goes as a document block, images
/// go as images; either way it is one invoice per call.
async function readOneDoc(f,conf){
  const g=authorizeCalls(1);
  if(!g.ok)throw new Error(g.reason);
  const p=AI_PROVIDERS[DATA.ai.provider];
  let body;
  if(/\.pdf$/i.test(f.name)){
    if(DATA.ai.provider!=='anthropic')
      throw new Error('PDF invoices need Claude. Photograph it, or switch provider.');
    const buf=await f.arrayBuffer();
    if(buf.byteLength>PDF_MAX_BYTES)throw new Error('That PDF is too large.');
    body={model:p.model,max_tokens:8000,system:conf.system,
      messages:[{role:'user',content:[
        {type:'document',source:{type:'base64',media_type:'application/pdf',data:bufToBase64(buf)}},
        {type:'text',text:conf.prompt}]}]};
  }else{
    if(!/^image\//.test(f.type||''))throw new Error('Not an image or a PDF.');
    const im=await shrinkImage(f);
    body=visionBody(DATA.ai.provider,p.model,conf.system,conf.prompt,[im]);
  }
  const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),body:JSON.stringify(body)});
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    if(res.status===401)throw new Error('API key rejected.');
    if(res.status===413)throw new Error('Too large for one request.');
    if(res.status===429)throw new Error('Rate limited.');
    throw new Error(`${p.label} returned ${res.status}. ${t.slice(0,120)}`);
  }
  const raw=p.text(await res.json());
  const m=raw.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('The model did not return usable JSON.');
  DATA.ai.calls=(DATA.ai.calls||0)+1; DATA.ai.lastUsed=Date.now();
  recordCall('invoice');
  // Three shapes are legitimate depending on what was asked for: a list of
  // invoices (a scanned folder), a list of items (one invoice), or a list of
  // sheets (recipe forms). Reading only `.items` silently returned nothing at
  // all for the first — a paid call that produced an empty result and no error.
  const j=JSON.parse(m[0]);
  return j.invoices||j.items||j.sheets||[];
}

/// An invoice fingerprint: who, when, how much. Two files with the same three
/// are the same piece of paper twice, which is the commonest batch mistake and
/// the one that quietly doubles a month's food cost.
function invoiceKey(rows,map){
  if(!rows.length)return '';
  const sup=(rows[0][map.supplier]||'').toLowerCase().replace(/\s+/g,' ').trim();
  const date=(rows[0][map.date]||'').trim();
  const total=rows.reduce((s,r)=>s+(parseFloat(r[map.total])||0),0).toFixed(2);
  return sup+'|'+date+'|'+total;
}

/// Has this invoice been seen before, in any previous upload?
///
/// The fingerprint check used to run only within a single batch, so the same
/// invoice photographed again next week landed a second time and quietly
/// doubled that supplier's spend. The ledger keeps every purchase, so the
/// check belongs there.
function knownInvoice(supplier,date,total){
  const sup=String(supplier||'').toLowerCase().replace(/\s+/g,' ').trim();
  const d=isoDate(date);
  const t=Math.round((+total||0)*100)/100;
  if(!sup||!(t>0))return null;
  for(const p of (DATA.ledger.purchases||[])){
    if(String(p.supplier||'').toLowerCase().replace(/\s+/g,' ').trim()!==sup)continue;
    if(isoDate(p.date)!==d)continue;
    if(Math.round((+p.amount||0)*100)/100!==t)continue;
    return p;
  }
  return null;
}

/// Merge every successful invoice into ONE review table.
function batchCollect(){
  if(!INVBATCH)return;
  if(INVBATCH.kind==='recipes'){
    RECIPEREAD=[];
    for(const it of INVBATCH.items)
      for(const s of (it.sheets||[])) RECIPEREAD.push(Object.assign({file:it.name},s));
    INVBATCH.staged=RECIPEREAD.filter(s=>s.dish&&s.lines.length).length;
    return;
  }
  const ok=INVBATCH.items.filter(x=>x.status==='ok'&&x.rows.length);
  if(!ok.length){ INVBATCH.staged=0; return; }
  const map=ok[0].map, headers=ok[0].headers;
  const seen=new Map(); const rows=[]; const src=[];
  for(const it of ok){
    const k=invoiceKey(it.rows,map);
    if(k&&seen.has(k)){ it.status='duplicate'; it.dupOf=seen.get(k); continue; }
    // …and against everything ever imported, not just this batch.
    const sup=it.rows[0][map.supplier], dt=it.rows[0][map.date];
    const tot=it.rows.reduce((s,r)=>s+(parseFloat(r[map.total])||0),0);
    const prev=knownInvoice(sup,dt,tot);
    if(prev){ it.status='duplicate'; it.dupOf='an invoice already imported'+(prev.date?' on '+prev.date:''); continue; }
    if(k)seen.set(k,it.name);
    // Every row carries the id of the document it came from. This is the half
    // that must never be lost: the pixels can go missing and the row can still
    // say which invoice produced it.
    for(const r of it.rows){ rows.push(r); src.push(it.doc?it.doc.id:''); }
  }
  INVBATCH.staged=rows.length;
  STAGE={kind:INVBATCH.kind,headers,rows,map,headerRow:-1,fromPhoto:true,fromBatch:true,
         srcDocs:src};
}

/// The whole camera path.
let PHOTOBUSY=null;
async function readShots(){
  const kind=SHOTKIND;
  const files=SHOTS.map((s,i)=>({data:s.data,page:i+1,w:s.w,h:s.h}));
  if(!files.length)return;
  const conf=PHOTO_KINDS[kind];
  if(!conf){alert('Photographs are not a sensible source for this import.');return}
  if(!aiReady()){
    FILEFAIL={file:files.length+' photo(s)',
      short:'Reading a photograph needs AI assist switched on.',
      why:'A photograph has no columns and no text — something has to look at it. '+
          'Switch on AI assist above and add a key, then take the photo again. '+
          'If you have a digital file from the supplier, use that instead: it is '+
          'free, exact, and does not need a key.',
      reason:'nokey',canVision:false};
    view='import'; R(); return;
  }
  PHOTOBUSY={n:files.length,stage:'reading'}; R();
  try{
    const imgs=files;
    const p=AI_PROVIDERS[DATA.ai.provider];
    const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),
      body:JSON.stringify(visionBody(DATA.ai.provider,p.model,conf.system,conf.prompt,imgs))});
    if(!res.ok){
      const t=await res.text().catch(()=>'');
      if(res.status===401)throw new Error('That API key was rejected.');
      if(res.status===413)throw new Error('Those photos are too large for one request. Try fewer at a time.');
      if(res.status===429)throw new Error('Rate limited — wait a moment and try again.');
      throw new Error(`${p.label} returned ${res.status}. ${t.slice(0,200)}`);
    }
    const raw=p.text(await res.json());
    const m=raw.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('The model did not return usable JSON.');
    DATA.ai.calls=(DATA.ai.calls||0)+1; DATA.ai.lastUsed=Date.now(); save();
    const st=photoRowsToStage(kind,JSON.parse(m[0]).items||[]);
    if(!st.rows.length)throw new Error(
      'Nothing readable was found. Every line was missing a field it needs — '+
      'usually the photo is too dark, at too much of an angle, or cut off at the edge.');
    STAGE=st; PHOTOBUSY=null; SHOTS=[]; SHOTKIND=null; view='import'; R();
  }catch(e){
    PHOTOBUSY=null;
    FILEFAIL={file:files.length+' photo(s)',short:'Those photos could not be read.',
      why:e.message+'\n\nNothing has been written. Retake the photo square-on in '+
          'good light with the whole page in frame, or use a digital file from the '+
          'supplier if one exists.',reason:'photo',canVision:false};
    view='import'; R();
  }
}



// ════════════════════════════════════════════════════════════════════════
// KEEPING THE PAPER
//
// "Each import should keep the original jpeg saved on file."
//
// The reason shows up months later: a unit cost looks wrong in November and
// the only way to settle it is to look at the invoice. A number with no
// document behind it cannot be checked, only argued about.
//
// WHERE THE PIXELS GO. Not localStorage — the whole workbook shares a quota of
// a few megabytes there, and one invoice photo would eat it and take the
// recipes down with it. Two stores instead, in order of preference:
//
//   1. A FOLDER ON DISK, where the browser allows it (Chrome and Edge on
//      desktop). Real files, visible in Explorer, picked up by whatever backs
//      that machine up, and untouched by clearing browser data. This is the
//      one that actually survives.
//   2. IndexedDB otherwise — Safari, Firefox, every phone. Room for hundreds
//      of megabytes, but it is still browser storage and it dies to the same
//      "clear data" that takes everything else. Said plainly on screen rather
//      than implied.
//
// WHAT GOES IN THE WORKBOOK is only the link: an id, the filename, when, and
// which import it belonged to. Tiny, always saved, and it survives even when
// the pixels do not — so a row can always say WHICH document produced it even
// if the document itself is gone. That is the half worth protecting.
// ════════════════════════════════════════════════════════════════════════

const DOCDB='costing-console-docs';
let DOC_DIR=null;              // a folder handle, when granted

DATA.docs=DATA.docs||[];       // [{id,name,at,kind,bytes,where}]

const docId=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function idb(){
  return new Promise((res,rej)=>{
    if(typeof indexedDB==='undefined')return rej(new Error('no indexedDB'));
    const r=indexedDB.open(DOCDB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('files'))
      r.result.createObjectStore('files'); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbPut(id,blob){
  const db=await idb();
  return new Promise((res,rej)=>{
    const t=db.transaction('files','readwrite');
    t.objectStore('files').put(blob,id);
    t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error);
  });
}
async function idbGet(id){
  const db=await idb();
  return new Promise((res,rej)=>{
    const t=db.transaction('files','readonly');
    const q=t.objectStore('files').get(id);
    q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
  });
}

function docFileName(rec){
  const d=new Date(rec.at), p=n=>String(n).padStart(2,'0');
  const stem=(rec.name||'doc').replace(/[^\w.\-]+/g,'_').slice(0,60);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${rec.id}_${stem}`;
}

/// Keep one source document. Returns the record that goes in the workbook.
///
/// The ORIGINAL bytes are kept, not the shrunk copy that was sent to the
/// model. The downscaled version is what the machine read; the original is
/// what a human needs when checking whether it read it right, and those are
/// different jobs.
async function keepDoc(file,kind){
  const rec={id:docId(),name:file.name||'photo.jpg',at:Date.now(),kind,
             bytes:file.size||0,where:'none'};
  if(DOC_DIR){
    try{
      const sub=await DOC_DIR.getDirectoryHandle('source-documents',{create:true});
      const fh=await sub.getFileHandle(docFileName(rec),{create:true});
      const w=await fh.createWritable(); await w.write(file); await w.close();
      rec.where='folder'; rec.path='source-documents/'+docFileName(rec);
    }catch(e){ rec.where='none'; }
  }
  if(rec.where==='none'){
    try{ await idbPut(rec.id,file); rec.where='browser'; }
    catch(e){ rec.where='failed'; rec.error=String((e&&e.message)||e).slice(0,120); }
  }
  DATA.docs=DATA.docs||[]; DATA.docs.push(rec); save();
  return rec;
}

/// Get a document back for viewing. Folder first, then browser storage.
async function openDoc(id){
  const rec=(DATA.docs||[]).find(d=>d.id===id);
  if(!rec)return null;
  if(rec.where==='folder'&&DOC_DIR){
    try{
      const sub=await DOC_DIR.getDirectoryHandle('source-documents');
      const fh=await sub.getFileHandle(docFileName(rec));
      return await fh.getFile();
    }catch(e){}
  }
  if(rec.where==='browser'){ try{ return await idbGet(id); }catch(e){} }
  return null;
}
async function viewDoc(id){
  const f=await openDoc(id);
  if(!f){ alert('That document is no longer on this machine. The record of it survives — the file does not.'); return; }
  window.open(URL.createObjectURL(f),'_blank');
}

/// How much paper is kept, and whether any of it is anywhere safe.
function docStats(){
  const d=DATA.docs||[];
  const by=k=>d.filter(x=>x.where===k).length;
  return {n:d.length,folder:by('folder'),browser:by('browser'),failed:by('failed'),
          mb:(d.reduce((s,x)=>s+(x.bytes||0),0)/1048576)};
}

// ════════════════════════════════════════════════════════════════════════
// SPEND GOVERNOR
//
// Ported from spend_governor.dart, which was written for Kai's factory and
// then not applied to the one place in this codebase that actually spends a
// customer's money on a loop. Press Batch on thirty invoices and thirty paid
// calls go out with no ceiling and no total. A tool sold to fix a cash problem
// must not be able to create one.
//
// TWO UNITS, AND ONLY ONE OF THEM IS TRUE.
//
// Calls are counted exactly — the console makes them, so it knows. Money is
// ESTIMATED from a rate the operator can see and change, because published
// per-token prices are not something this file can verify and a confident
// currency figure derived from an unverified rate is precisely the false
// precision the rest of the app refuses to produce. So the cap that actually
// binds is the call count; money is shown as an estimate and labelled as one.
//
// Checked BEFORE the spend, never after. "We went slightly over" is not a
// thing a governor gets to say.
// ════════════════════════════════════════════════════════════════════════

const AI_LIMIT_DEFAULTS={
  perRun:30,       // calls in one batch
  perDay:200,      // calls in a rolling 24h
  lifetime:2000,   // calls before a human decides again
  costPerCall:0.02 // ESTIMATE, editable, currency-agnostic
};

function aiLimits(){ return Object.assign({},AI_LIMIT_DEFAULTS,(DATA.ai&&DATA.ai.limits)||{}); }
function aiLedger(){ DATA.ai=DATA.ai||{}; return DATA.ai.ledger=DATA.ai.ledger||[]; }

/// One entry per call actually made.
function recordCall(kind){
  const l=aiLedger();
  l.push({at:Date.now(),kind:kind||'read'});
  if(l.length>5000)l.splice(0,l.length-5000);
  save();
}

const callsSince=t=>aiLedger().filter(e=>e.at>=t).length;
const callsToday=()=>callsSince(Date.now()-86400000);
const callsEver =()=>aiLedger().length;

/// Extra allowance a human granted, added to the lifetime ceiling. The ledger
/// is never cleared — the record of what was spent survives the decision to
/// spend more, which is the difference between a governor and a reset button.
function grantedCalls(){
  return ((DATA.ai&&DATA.ai.auth)||[]).reduce((s,a)=>s+(+a.extra||0),0);
}

/// THE decision. `want` is how many calls are about to be made.
function authorizeCalls(want){
  const L=aiLimits();
  if(!(L.perRun>0&&L.perDay>=L.perRun&&L.lifetime>=L.perDay))
    return {ok:false,cause:'misconfigured',needsHuman:true,
      reason:'The AI limits contradict each other — per-run must be the smallest and lifetime the largest. Refusing to run rather than guessing which you meant.'};
  if(want>L.perRun)
    return {ok:false,cause:'runTooLarge',needsHuman:false,
      reason:`That is ${want} documents in one go, above the per-run limit of ${L.perRun}. Split it, or raise the limit deliberately.`};
  const today=callsToday();
  if(today+want>L.perDay)
    return {ok:false,cause:'dailyExhausted',needsHuman:false,
      reason:`Daily limit reached: ${today} calls in the last 24 hours against a limit of ${L.perDay}. This clears itself as the window rolls forward.`};
  const ever=callsEver(), cap=L.lifetime+grantedCalls();
  if(ever+want>cap)
    return {ok:false,cause:'lifetimeExhausted',needsHuman:true,
      reason:`Lifetime limit reached: ${ever} calls of ${cap}. Continuing is a decision about money, so it is yours rather than mine.`};
  return {ok:true};
}

/// A human lifting a halt. Timestamped, attributed, and additive.
function grantCalls(extra){
  const n=Math.max(0,Math.floor(+extra||0));
  if(!n)return;
  edit(()=>{ DATA.ai.auth=(DATA.ai.auth||[]);
    DATA.ai.auth.push({by:WHO||'owner',at:Date.now(),extra:n}); });
  R();
}

const estCost=n=>(n*(aiLimits().costPerCall||0));
function spendLine(){
  const ever=callsEver();
  if(!ever)return 'No AI calls made yet.';
  const L=aiLimits();
  return `${callsToday()} call(s) today · ${ever} of ${L.lifetime+grantedCalls()} lifetime · `+
         `about ${estCost(ever).toFixed(2)} spent (estimate at ${L.costPerCall} per call)`;
}

// ════════════════════════════════════════════════════════════════════════
// BACKUPS
//
// Everything in this app lives in localStorage, which is one "clear browsing
// data" from nothing. Months of recipes and a year of purchases are a browser
// setting away from gone, and the person who loses them will not have a copy,
// because manual backups are a thing everyone intends to do.
//
// A browser cannot silently write to disk. What it CAN do, in Chrome and Edge,
// is hold a folder handle the user picked once and keep writing to it. Where
// that is unavailable — Safari, Firefox, and the phone — the honest fallback
// is not silence, it is a visible reminder with a one-tap download.
// ════════════════════════════════════════════════════════════════════════

const BACKUP_STALE_DAYS=7;
let BACKUP_DIR=null;      // FileSystemDirectoryHandle, when granted

const backupSupported=()=>typeof window!=='undefined'&&!!window.showDirectoryPicker;
function lastBackupAt(){ return (DATA.ai&&0)||DATA._lastBackup||0; }
function backupAgeDays(){ const t=DATA._lastBackup||0; return t?(Date.now()-t)/86400000:Infinity; }
function backupStale(){ return backupAgeDays()>BACKUP_STALE_DAYS; }

function backupName(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `costing-console-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`+
         `-${p(d.getHours())}${p(d.getMinutes())}.json`;
}

/// What a backup contains. Deliberately NOT `DATA` wholesale: the API key must
/// never travel in a file that gets emailed to an accountant.
function backupPayload(){
  const out={_format:'costing-console-backup',_version:1,_at:Date.now()};
  for(const k of PERSIST)out[k]=DATA[k];
  out.ai={provider:(DATA.ai||{}).provider,calls:(DATA.ai||{}).calls,
          ledger:(DATA.ai||{}).ledger||[]};   // no key, ever
  return out;
}

function backupDownload(){
  const b=new Blob([JSON.stringify(backupPayload(),null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=backupName(); a.click();
  DATA._lastBackup=Date.now(); save(); R();
}

async function backupChooseFolder(){
  if(!backupSupported()){
    alert('This browser cannot write to a folder. Use "Download a backup" instead — it saves to your Downloads.');
    return;
  }
  try{
    BACKUP_DIR=await window.showDirectoryPicker({mode:'readwrite'});
    await backupToFolder();
  }catch(e){ if(e&&e.name!=='AbortError')alert('That folder could not be used: '+e.message); }
}

async function backupToFolder(){
  if(!BACKUP_DIR)return false;
  try{
    const fh=await BACKUP_DIR.getFileHandle(backupName(),{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify(backupPayload(),null,1));
    await w.close();
    DATA._lastBackup=Date.now(); save(); R();
    return true;
  }catch(e){ return false; }
}

/// Restore. Refuses anything that is not one of ours rather than half-loading
/// it — a partial restore over a live book is worse than no restore.
function restoreBackup(text){
  let d;
  try{ d=JSON.parse(text); }catch(e){ return {ok:false,why:'That file is not readable JSON.'}; }
  if(!d||d._format!=='costing-console-backup')
    return {ok:false,why:'That is not a console backup. Backups start with a marker this one does not have — loading it could half-overwrite your book.'};
  if(!Array.isArray(d.ingredients)||!Array.isArray(d.menu))
    return {ok:false,why:'That backup is missing its ingredients or menu, so it is incomplete.'};
  for(const k of PERSIST) if(d[k]!==undefined) DATA[k]=d[k];
  rebuildIX(); rebuildBX(); saveNow();
  return {ok:true,at:d._at,items:(d.menu||[]).length,ings:(d.ingredients||[]).length};
}



// ── READING A FILLED-IN RECIPE SHEET BACK ──────────────────────────────
//
// The sheet was designed so that only two things are handwritten: a code and
// a number. Everything here is about not letting a misread digit become a
// recipe nobody can trace.
//
// A code that does not exist is REPORTED, not corrected. "Code 047 is not in
// your pantry" is a thing a chef can resolve in five seconds. A silent nearest
// match — 047 becoming 041 because it scored well — produces a recipe with the
// wrong ingredient in it, at a plausible quantity, that nobody will ever
// question.

function findDishByFid(fid){
  const f=String(fid||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  return (DATA.menu||[]).find(m=>_fid(m)===f)||null;
}

/// One sheet as read → what it means for the book. Nothing is written.
function readRecipeSheet(sheet){
  const out={formId:sheet.formId||'',dish:null,portions:+sheet.portions||1,
             lines:[],problems:[]};
  out.dish=findDishByFid(out.formId);
  if(!out.dish){
    out.problems.push(`Form ${out.formId||'(no id read)'} does not match any dish. `+
      `The id is printed top-right — check it was in frame and not written over.`);
    return out;
  }
  for(const L of (sheet.lines||[])){
    const code=String(L.code||'').trim().replace(/\s+/g,'');
    const qty=+L.qty;
    if(!code){ out.problems.push('A row had a quantity but no code — left out.'); continue; }
    if(!(qty>0)){ out.problems.push(`Code ${code} had no usable quantity — left out.`); continue; }
    const ing=IX[code]||(DATA.ingredients||[]).find(i=>String(i.code)===code);
    if(!ing){
      // Deliberately NOT resolved to a near match.
      out.problems.push(`Code ${code} is not in your pantry. Nothing was guessed — `+
        `check the code on the sheet, or add the ingredient first.`);
      continue;
    }
    out.lines.push({code,name:ing.name,qty,unit:ing.recipeUnit||L.unit||'',
                    corrected:!!L.corrected, was:existingQty(out.dish,code)});
  }
  return out;
}
function existingQty(dish,code){
  const l=(dish.lines||[]).find(x=>codeOf(x.ref)===code);
  return l?l.qty:null;
}

/// Apply one sheet. Replaces the dish's lines with what the paper says,
/// because the paper is the chef's answer and a half-merge would leave a
/// recipe that matches neither.
function applyRecipeSheet(read){
  if(!read.dish||!read.lines.length)return {ok:false};
  _editLabel=`the recipe for ${read.dish.name}`;
  edit(()=>{
    const d=(DATA.menu||[]).find(m=>m.id===read.dish.id);
    if(!d)return;
    d.lines=read.lines.map(l=>{
      const ing=IX[l.code]||(DATA.ingredients||[]).find(i=>String(i.code)===l.code);
      return {ref:(ing&&ing.code?ing.code+'_'+ing.name:l.code), qty:l.qty};
    });
    if(read.portions>1)d.portions=read.portions;
  });
  return {ok:true,dish:read.dish.name,n:read.lines.length};
}

let RECIPEREAD=[];
function applyAllSheets(){
  let n=0,d=0;
  for(const s of RECIPEREAD){ if(s.dish&&s.lines.length&&s.accept!==false){
    const r=applyRecipeSheet(s); if(r.ok){n+=r.n;d++;} } }
  RECIPEREAD=[]; INVBATCH=null; view=inSetup()?'today':'menu'; R();
  toast(`${d} dish(es) updated with ${n} ingredient line(s).`,{action:'undo()',actionLabel:'Undo'});
}
function sheetToggleAccept(i){ RECIPEREAD[i].accept=RECIPEREAD[i].accept===false; R(); }


/// The model may answer in either shape, and both are legitimate: a single
/// invoice reads naturally as a flat item list, a scanned folder as a list of
/// invoices. Accepting only one shape would fail on a technicality.
function normaliseInvoices(items){
  if(!items)return [];
  if(Array.isArray(items)&&items.length&&items[0]&&Array.isArray(items[0].items))
    return items.filter(x=>x&&(x.items||[]).length)
      .map(x=>({supplier:String(x.supplier||'').trim(),date:x.date||'',
                invoiceNo:String(x.invoiceNo||'').trim(),pages:x.pages||'',
                items:x.items||[]}));
  // Flat list — group by whatever supplier/date each line carries, because a
  // flat answer to a multi-invoice file still has the right values per line.
  const by=new Map();
  for(const r of (items||[])){
    if(!r||typeof r!=='object')continue;
    const k=(String(r.supplier||'').trim().toLowerCase())+'|'+(r.date||'');
    if(!by.has(k))by.set(k,{supplier:String(r.supplier||'').trim(),date:r.date||'',
                           invoiceNo:'',pages:'',items:[]});
    by.get(k).items.push(r);
  }
  return [...by.values()];
}

/// ── WHICH INVOICES ARE ACTUALLY WORTH PHOTOGRAPHING ────────────────────
///
/// Three months of receipts is two hundred pieces of paper, and the step used
/// to imply you needed all of them. You do not. Two things come out of an
/// invoice: what an ingredient costs NOW, and one older price so a rise is
/// visible. That is the newest and the oldest invoice per supplier — about a
/// dozen documents, for most of the value of the pile.
///
/// So the step reports coverage per supplier rather than counting documents,
/// and says what each supplier is still missing.
function invoiceCoverage(){
  const bySup=new Map();
  const push=(sup,at,priced)=>{
    const k=(sup||'(unknown)').toLowerCase();
    if(!bySup.has(k))bySup.set(k,{supplier:sup||'(unknown)',n:0,first:null,last:null,priced:0});
    const s=bySup.get(k); s.n++; if(priced)s.priced++;
    if(at){ if(!s.first||at<s.first)s.first=at; if(!s.last||at>s.last)s.last=at; }
  };
  for(const p of (DATA.ledger.purchases||[])) push(p.supplier,parseDate(p.date),false);
  for(const i of (DATA.ingredients||[]))
    for(const h of (i.history||[])) if(h.supplier) push(h.supplier,h.at||0,h.price>0);

  const out=[...bySup.values()].map(s=>{
    const spanDays=(s.first&&s.last)?Math.round((s.last-s.first)/86400000):0;
    return {...s, spanDays,
      // A single invoice gives today's price and no drift. Two invoices a
      // month or more apart give both.
      state: s.n===0?'none' : (s.n>1&&spanDays>=25)?'good' : 'thin',
      need: s.n===0?'one recent invoice'
          : (s.n>1&&spanDays>=25)?''
          : 'one older invoice — two months back or more — so a price rise becomes visible'};
  }).sort((a,b)=>(a.state==='good')-(b.state==='good')||b.n-a.n);
  return {suppliers:out,
    good:out.filter(s=>s.state==='good').length,
    thin:out.filter(s=>s.state==='thin').length};
}

// ── TOASTS ──────────────────────────────────────────────────────────────
//
// alert() stops the world and has one button. It is the right tool for "this
// destroys data, are you sure" and the wrong one for "12 rows imported" —
// which is most of what this app was using it for. Worse, a blocking dialog
// after every successful action makes routine work feel like an argument.
//
// A toast says the same thing without interrupting, and it can carry an
// action — which is where the real gain is: "90 days imported · Undo" beats
// finding the Undo button later and hoping it does what you think.
let TOASTS=[];
function toast(msg,opts){
  const o=opts||{};
  const t={id:'t'+Date.now()+Math.random().toString(36).slice(2,5),
    msg:String(msg||''), kind:o.kind||'ok', action:o.action||null,
    actionLabel:o.actionLabel||'', at:Date.now(),
    ms:o.ms||(o.action?9000:5000)};
  TOASTS.push(t);
  if(TOASTS.length>4)TOASTS.shift();
  drawToasts();
  if(typeof setTimeout==='function')setTimeout(()=>dismissToast(t.id),t.ms);
  return t.id;
}
function dismissToast(id){ TOASTS=TOASTS.filter(t=>t.id!==id); drawToasts(); }
function runToast(id){
  const t=TOASTS.find(x=>x.id===id); if(!t)return;
  dismissToast(id);
  if(t.action)try{ (0,eval)(t.action); }catch(e){}
}
function drawToasts(){
  const box=document.getElementById('toasts'); if(!box)return;
  box.innerHTML=TOASTS.map(t=>`<div class="toast ${t.kind}">
    <span>${t.msg}</span>
    ${t.action?`<button onclick="runToast('${t.id}')">${t.actionLabel||'Undo'}</button>`:''}
    <a href="#" class="x" onclick="event.preventDefault();dismissToast('${t.id}')">×</a>
  </div>`).join('');
}

// ── NUMBERS AS PEOPLE TYPE THEM ─────────────────────────────────────────
//
// parseFloat("1,250") is 1. Not NaN — 1. So a thousand-separator silently
// turned twelve hundred and fifty into one, and nothing anywhere said so.
// The same for "BD 4.50", "4.50 BHD", "1 250,50" and "(35)" for negatives,
// all of which appear in real exports.
function num(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).trim();
  if(!s)return null;
  const neg=/^\(.*\)$/.test(s);                       // accounting negatives
  s=s.replace(/[()]/g,'');
  s=s.replace(/[A-Za-z؀-ۿ$£€¥]/g,'').trim(); // currency words and symbols
  s=s.replace(/\s+/g,'');
  // Which separator is the decimal? The LAST one that appears, when both do.
  const lastComma=s.lastIndexOf(','), lastDot=s.lastIndexOf('.');
  if(lastComma>-1&&lastDot>-1){
    if(lastComma>lastDot) s=s.replace(/\./g,'').replace(',','.');
    else                  s=s.replace(/,/g,'');
  }else if(lastComma>-1){
    // A lone comma with exactly three digits after it is a thousands
    // separator; otherwise it is a decimal point in European style.
    s=/,\d{3}$/.test(s)?s.replace(/,/g,''):s.replace(',','.');
  }
  s=s.replace(/[^0-9.\-]/g,'');
  const n=parseFloat(s);
  if(!isFinite(n))return null;
  return neg?-Math.abs(n):n;
}


// ── FOOD-COST COLOUR, ONE PLACE ─────────────────────────────────────────
//
// A food cost means nothing without a target next to it. 32% is healthy on a
// burger and alarming on a spirit. This returns the colour and the verdict so
// every screen judges the same way, against the dish's own department target.
function fcVerdict(m){
  const fc=fcPct(m);
  if(fc==null)return {fc:null,color:'var(--mut)',label:'—'};
  const tgt=(targetFor?targetFor(m):0.35)||0.35;
  const color = fc<=tgt ? 'var(--good)' : fc<=tgt*1.15 ? 'var(--warn)' : 'var(--bad)';
  const label = fc<=tgt ? 'on target' : fc<=tgt*1.15 ? `${((fc-tgt)*100).toFixed(0)}pt over` : 'high';
  return {fc,color,label,tgt};
}

// ── WHAT MOVED SINCE LAST TIME ──────────────────────────────────────────
//
// An owner opening the app does not want to re-read everything; they want to
// know what changed. Every price carries a history, so "what moved" is a query
// over it — the sharpest single screen this data can produce.
function recentChanges(days){
  const since=Date.now()-(days||30)*86400000;
  const out=[];
  for(const i of (DATA.ingredients||[])){
    const h=(i.history||[]).filter(x=>x.price>0&&(x.at||0)>=since).sort((a,b)=>a.at-b.at);
    if(h.length<1)continue;
    // Compare the newest inside the window against the last price BEFORE it.
    const before=(i.history||[]).filter(x=>x.price>0&&(x.at||0)<h[0].at).sort((a,b)=>b.at-a.at)[0];
    const from=before?+before.price:+h[0].price;
    const to=+h[h.length-1].price;
    if(!(from>0)||from===to)continue;
    const pct=(to-from)/from;
    // Which dishes does this ripple into, and by how much per week?
    const dishes=(DATA.menu||[]).filter(m=>(m.lines||[]).some(l=>codeOf(l.ref)===i.code));
    const weeklyHit=dishes.reduce((s,m)=>{
      const line=(m.lines||[]).find(l=>codeOf(l.ref)===i.code);
      const perUnit=(to-from)/(i.ruPerPu||1)/((i.yield==null||i.yield===0)?1:i.yield);
      return s+perUnit*(line?line.qty||0:0)*(m.weeklySales||0);
    },0);
    out.push({name:i.name,from,to,pct,at:h[h.length-1].at,
      dishes:dishes.length,weeklyHit,
      supplier:h[h.length-1].supplier||''});
  }
  return out.sort((a,b)=>Math.abs(b.weeklyHit)-Math.abs(a.weeklyHit));
}

// ── RAISE A WHOLE CATEGORY'S PRICES AT ONCE ─────────────────────────────
//
// "Supplier put everything up 8%." Applying that by hand to forty ingredients
// is exactly the chore that makes the book go stale. Proposes, shows the
// blast radius, writes nothing until confirmed, and is one Undo.
function bulkRaise(pct,category){
  const f=1+(+pct||0)/100;
  const list=(DATA.ingredients||[]).filter(i=>i.price>0&&
    (!category||category==='all'||(i.category||'')===category));
  return list.map(i=>({code:i.code,name:i.name,from:+i.price,to:Math.round(+i.price*f*1000)/1000}));
}
function applyBulkRaise(proposals){
  if(!proposals||!proposals.length)return 0;
  editAs2(`raising ${proposals.length} ingredient price(s)`,()=>{
    for(const p of proposals){
      const i=(DATA.ingredients||[]).find(x=>x.code===p.code);
      if(!i)continue;
      i.history=(i.history||[]).concat({at:Date.now(),price:p.to,was:i.price,src:'bulk price change'});
      i.price=p.to;
    }
    rebuildIX();
  });
  toast(`${proposals.length} price(s) raised`,{action:'undo()',actionLabel:'Undo'});
  return proposals.length;
}

// ── VAT ON WHAT YOU BUY ─────────────────────────────────────────────────
//
// A supplier invoice in a VAT country shows one of two things: the price
// before tax (net), or the price with tax added (gross). And what you can do
// about the tax depends on whether you are registered:
//
//   REGISTERED    you reclaim the VAT you were charged, so your TRUE cost is
//                 the NET figure — the gross price overstates it by the rate.
//   NOT REGISTERED you cannot reclaim it, so the tax is a real cost and the
//                 gross price IS your cost.
//
// Left unhandled, a registered restaurant whose invoices are gross has every
// ingredient priced ~10% too high, which flows straight into food cost — a
// consistent, invisible error across the whole book. But guessing is worse
// than the error: silently stripping VAT off a net invoice understates cost
// by the same amount. So nothing is assumed. The two facts are set once, and
// until they are, the console flags it rather than picking a default that is
// wrong half the time.
function vatCfg(){
  const s=DATA.settings||{};
  return {registered:!!s.vatRegistered, gross:!!s.invoicesGross,
          rate:+s.purchaseVat||0};
}
/// An invoice unit price → the true cost that belongs in the book.
/// Only ever adjusts when BOTH facts point the same way: registered, gross
/// invoice, a rate. Every other combination returns the price untouched,
/// because there is nothing to reclaim or nothing to strip.
function invoiceToCost(price){
  const v=vatCfg();
  if(!(price>0))return price;
  if(v.registered && v.gross && v.rate>0) return price/(1+v.rate);
  return price;
}
/// Is the VAT question still unanswered while it matters? Used to warn rather
/// than to guess.
function vatUnset(){
  const s=DATA.settings||{};
  const hasPurchases=((DATA.ledger&&DATA.ledger.purchases)||[]).length
    || (DATA.ingredients||[]).some(i=>(i.history||[]).some(h=>h.src==='goods received'));
  return hasPurchases && s.vatAsked!==true;
}


// ════════════════════════════════════════════════════════════════════════
// NEEDS YOUR INPUT
//
// "Any confusions should request user input."
//
// The console already refuses to guess in a dozen places — a blank category
// rather than a wrong one, an unmatched sales line held for review, a price
// that cannot be right stopped before it lands. But those refusals were
// scattered: some flagged on one screen, some left as a quiet blank nobody
// returns to. A confusion the app keeps to itself is a confusion that never
// gets resolved.
//
// So they collect here, in one queue, each a real question with a real place
// to answer it. This is not the findings report — that says where the money
// went. This says what the console could not work out on its own and needs a
// human for. Empty is the goal; a number beside it on the dashboard is a
// standing invitation to clear it.
// ════════════════════════════════════════════════════════════════════════
function pendingQuestions(){
  const q=[];
  const ing=DATA.ingredients||[], menu=DATA.menu||[];

  // Impossible values first — they silently corrupt everything downstream.
  for(const x of impossibleValues())
    q.push({kind:'error',title:x.name?`${x.name}: fix an impossible value`:'Fix an impossible value',
      detail:x.why, go:x.go||'ing'});

  // A price the console held because it could not be right.
  if(typeof CATSHOCK!=='undefined'&&CATSHOCK&&CATSHOCK.length)
    q.push({kind:'error',title:`${CATSHOCK.length} price(s) look wrong and were not applied`,
      detail:'A misread decimal, most likely. Confirm or correct them.',go:'catalogue'});

  // Sales lines that matched no dish.
  const unm=((DATA.posRejected||{}).unmatched)||[];
  if(unm.length)
    q.push({kind:'ask',title:`${unm.length} sales line(s) matched no dish`,
      detail:'Point each at the right menu item, or confirm it is not one.',go:'pos'});

  // Punches that could not be paired — missing hours that understate labour.
  const pi=DATA.punchIssues;
  if(pi&&(pi.unpaired||pi.overlong))
    q.push({kind:'ask',title:`${pi.unpaired+pi.overlong} attendance punch(es) could not be paired`,
      detail:(pi.unpaired?`${pi.unpaired} unpaired (someone forgot to clock in or out)`:'')
        +(pi.unpaired&&pi.overlong?'; ':'')
        +(pi.overlong?`${pi.overlong} over the maximum shift length`:'')
        +' — those hours are missing from labour cost. Re-import a corrected file to clear this.',go:'week'});

  // The VAT question, while it changes every cost.
  if(vatUnset())
    q.push({kind:'ask',title:'Say whether your invoices include VAT',
      detail:'Until you do, every ingredient cost could be off by the VAT rate.',go:'settings'});

  // Ingredients the receipts brought in but could not categorise.
  const noCat=ing.filter(i=>i.price>0&&!i.category);
  if(noCat.length)
    q.push({kind:'ask',title:`${noCat.length} ingredient(s) have no category`,
      detail:'Imported from receipts the catalogue did not recognise: '+
        noCat.slice(0,5).map(i=>i.name).join(', ')+(noCat.length>5?`, +${noCat.length-5}`:''),
      go:'ing'});

  // Ingredients with a price but no pack/unit conversion — a price that cannot
  // become a cost per gram.
  const noUnit=ing.filter(i=>i.price>0&&!(i.ruPerPu>0));
  if(noUnit.length)
    q.push({kind:'ask',title:`${noUnit.length} ingredient(s) have a price but no pack size`,
      detail:'Without pack size the price cannot become a cost per gram or ml.',go:'ing'});

  // A recipe that cannot be costed at all (a batch cycle).
  const broken=menu.filter(m=>(m.lines||[]).length&&itemCost(m)===null);
  if(broken.length)
    q.push({kind:'error',title:`${broken.length} dish(es) cannot be costed`,
      detail:'A recipe refers to itself through a batch. '+broken.slice(0,4).map(m=>m.name).join(', '),
      go:'batch'});

  const order={error:0,ask:1};
  return q.sort((a,b)=>(order[a.kind]-order[b.kind]));
}

/// The proposal, on screen, before anything is written.
let CATPROP=null;
function buildCatalogue(){
  if(!STAGE||!STAGE.rows||!STAGE.map){ alert('Read some invoices first.'); return; }
  const m=STAGE.map, fix=STAGE.fix||{};
  const lines=STAGE.rows.map((r,ix)=>{
    const item=r[m.item]||'';
    const fx=fix[ix]||{};                    // a pack size the owner supplied for a line we could not place
    let qty=parseFloat(r[m.qty])||0;
    const total=parseFloat(r[m.total])||0;
    // A rescued line that carries a total but no quantity is one unit — so the
    // total becomes the price of that one unit rather than reading as zero.
    if(fx.pack && qty<=0 && total>0) qty=1;
    return { _ix:ix, item, supplier:r[m.supplier]||'', date:r[m.date]||'',
      unitDesc:fx.pack||'',                  // read by proposeCatalogue as a pack fallback
      qty, unit:parseFloat(r[m.unit])||0, total};
  });
  CATPROP=proposeCatalogue(lines,{method:(DATA.costMethod||'wavg'),now:Date.now()});
  view='catalogue'; R();
}
/// A skipped line, rescued. The invoice never carried a pack size, so the owner
/// supplies it and the catalogue is re-read. Nothing is guessed — the number
/// comes from the person who bought it. Kept on STAGE so it clears the moment a
/// different file is staged.
function catFixPack(ix,val){ if(!STAGE)return; STAGE.fix=STAGE.fix||{}; STAGE.fix[ix]=Object.assign({},STAGE.fix[ix],{pack:val}); }
function catEach(ix){ if(!STAGE)return; STAGE.fix=STAGE.fix||{}; STAGE.fix[ix]={pack:'1 ea'}; buildCatalogue(); }
function catReread(){ buildCatalogue(); }
/// One tap: read the scan straight into inventory. The clean lines go in
/// (applyCatalogue is idempotent, so a re-read never duplicates), price shocks
/// are held above for a yes/no, and lines with no pack size wait in the
/// recovery panel below. Everything written lands in a single undo step, so
/// nothing is lost by acting first and checking after — which is the whole
/// point of "flow straight through".
function stockFromScan(){
  if(!STAGE||!STAGE.rows||!STAGE.map){ alert('Read some invoices first.'); return; }
  buildCatalogue();                       // builds CATPROP, sets view='catalogue'
  const P=CATPROP; if(!P)return;
  if(P.items.length){
    const res=applyCatalogue(P);
    if(res.shocks.length) CATSHOCK=res.shocks;          // held for confirmation, not written
    P.applied={added:res.added,updated:res.updated,suppliers:res.suppliers};
    // Keep only the held shocks as proposal rows, so shockAccept() can still
    // re-apply them; the clean ones are already in.
    const held=new Set((res.shocks||[]).map(s=>canonicalName(s.name)));
    P.items=P.items.filter(it=>held.has(canonicalName(it.name)));
    const uncat=(DATA.ingredients||[]).filter(i=>i.price>0&&!i.category).length;
    toast(`${res.added} added, ${res.updated} updated from your scan.`+
      (P.skipped.length?` ${P.skipped.length} line(s) still need a pack size.`:'')+
      (uncat?` ${uncat} need a category.`:''),
      {action:'undo()',actionLabel:'Undo'});
  }
  R();
}
/// Changing the method re-derives from the same staged invoice rows, so the
/// three answers are always computed from identical evidence.
function catMethod(mth){ DATA.costMethod=mth; buildCatalogue(); }
function catToggle(i){ if(CATPROP)CATPROP.items[i].accept=!CATPROP.items[i].accept; R(); }
function catExpand(i){ CATPROP.items[i]._open=!CATPROP.items[i]._open; R(); }
function catApply(){
  if(!CATPROP)return;
  const n=CATPROP.items.filter(x=>x.accept).length;
  if(!n){ alert('Nothing is ticked.'); return; }
  const res=applyCatalogue(CATPROP);
  if(res.shocks.length){
    // Held, not rejected. The prices that looked sane went in; these are
    // shown with what they were, and go in only if confirmed.
    CATSHOCK=res.shocks;
    R();
    return;
  }
  CATPROP=null; view=inSetup()?'today':'ing'; R();
  const uncat=(DATA.ingredients||[]).filter(i=>i.price>0&&!i.category).length;
  toast(`${res.added} added, ${res.updated} updated, ${res.suppliers} supplier(s).`+
    (uncat?` ${uncat} still need a category.`:''),
    uncat?{action:"go('needs')",actionLabel:'Review'}:{action:'undo()',actionLabel:'Undo'});
}
let CATSHOCK=null;
function shockAccept(){
  if(!CATPROP)return;
  for(const it of CATPROP.items) it.shockOk=true;
  const res=applyCatalogue(CATPROP);
  CATSHOCK=null; CATPROP=null; view=inSetup()?'today':'ing'; R();
  alert(`${res.added} added, ${res.updated} updated.`);
}
function shockReject(){
  CATSHOCK=null; CATPROP=null; view=inSetup()?'today':'ing'; R();
}
