const _h=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
/// Guess which column is which. Exact header match beats a substring match, so
/// a sheet with both "Cost" and "Unit Cost" puts each in the right place.
function autoMap(headers,kind){
  const spec=IMPORT_KINDS[kind]; const map={}; const used=new Set();
  for(const f of spec.fields){
    let pick=-1,pickScore=0;
    headers.forEach((h,i)=>{
      if(used.has(i))return;
      const hh=_h(h); if(!hh)return;
      for(const s of f.syn){
        const score = hh===s?3 : hh.startsWith(s)?2 : hh.includes(s)?1 : 0;
        if(score>pickScore){pickScore=score;pick=i}
      }
    });
    if(pick>=0){map[f.k]=pick;used.add(pick)}
  }
  return map;
}
const _num=v=>{const n=parseFloat(String(v||'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:null};
const _date=v=>{
  const s=String(v||'').trim(); if(!s)return '';
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d=new Date(s); return isNaN(d)?'':d.toISOString().slice(0,10);
};


/// Apply. Additive and idempotent: re-importing the same file updates rather
/// than duplicating, because an onboarding always ends up being run twice.
function stageApply(){
  const P=stagePreview(); if(!P||P.missing.length)return;
  if(demoBlocks('Importing '+P.rows.length+' row(s)'))return;
  const {kind}=STAGE;
  _editLabel=`importing ${P.rows.length} row(s) from ${(IMPORT_KINDS[kind]||{}).label||kind}`;
  let created=0,updated=0,priced=0;
  let outside=0;
  // Which step this file belongs to, and where the book stood before it.
  const setupStep = inSetup() ? (SETUP_STEPS[setupIndex()]||null) : null;
  const beforeState = setupStep ? {trust:trustScore(),
    count:(()=>{try{return setupStep.count()}catch(e){return ''}})()} : null;
  edit(()=>{
    if(kind==='products'){
      for(const r of P.rows){
        const hit=DATA.menu.find(m=>pnorm(m.name)===pnorm(r.name));
        if(hit){ if(hit.menuPrice!==r.price){hit.menuPrice=r.price;updated++} 
          if(r.cat&&!hit.group)hit.group=r.cat; }
        else{
          DATA.menu.push({id:'M'+(Date.now()+created).toString().slice(-7),
            name:r.name,menuPrice:r.price,weeklySales:0,group:r.cat||'',
            posCode:r.code||'',lines:[],
            dept:/whisky|vodka|gin|rum|tequila|beer|wine|liqueur|cocktail|mocktail|shot|spirit|brandy|cognac/i
                 .test(r.cat+' '+r.name)?'bar':'kitchen'});
          created++;
        }
      }
    } else if(kind==='purchases'){
      DATA.week.purchases=DATA.week.purchases||[];
      for(const r of P.rows){
        const id='G'+pnorm(r.supplier).replace(/ /g,'')+'_'+(r.date||'')+'_'+(created+updated);
        const rec={id,supplier:r.supplier,date:isoDate(r.date)||r.date||'',
          amount:r.total,alloc:r.cat?{[r.cat]:r.total}:{}};
        DATA.ledger.purchases=DATA.ledger.purchases||[];
        DATA.ledger.purchases.push(rec);
        // Only the ones inside the window show in the week view; all of them
        // are kept.
        const d=isoDate(rec.date), days=WK().days||[];
        if(d&&days.length&&d>=days[0]&&d<=days[6])DATA.week.purchases.push(rec);
        created++;
        // The quiet win: a receiving line carries a real unit cost.
        if(r.item&&r.unit!=null&&r.unit>0){
          const trueCost=invoiceToCost(r.unit);
          const ing=DATA.ingredients.find(x=>pnorm(x.name)===pnorm(r.item));
          if(ing&&ing.price!==trueCost){
            ing.history=ing.history||[];
            ing.history.push({at:Date.now(),price:trueCost,was:ing.price??null,src:'goods received'});
            ing.price=trueCost; priced++;
          }
        }
      }
    } else if(kind==='itemsales'){
      // Matching stays as strict as it has always been: an EXACT normalised
      // name (or item code) applies, anything else is left for a human. The
      // fuzzy matcher once proposed "Bowl O' Chili → Bowl of Nuts", and a
      // wrong sales volume is worse than none because it flows into food cost
      // as a number nobody can trace back.
      const wks=Math.max(0.1,+(STAGE.weeks||1));
      DATA.salesWeeks=wks;                 // how long the report covers, kept for the findings
      const unmatched=[];
      for(const r of P.rows){
        if(!r.name)continue;
        const byCode=r.code?DATA.menu.find(m=>m.posCode&&pnorm(m.posCode)===pnorm(r.code)):null;
        const hit=byCode||DATA.menu.find(m=>pnorm(m.name)===pnorm(r.name));
        if(!hit){ unmatched.push({name:r.name,qty:r.qty,total:r.total,code:r.code||''}); continue; }
        hit.weeklySales=Math.round(((+r.qty||0)/wks)*100)/100;
        if(r.total!=null&&+r.total>0)hit.posRevenue=+r.total;
        updated++;
      }
      DATA.posRejected=DATA.posRejected||{};
      DATA.posRejected.unmatched=unmatched;
      created=unmatched.length;
    } else if(kind==='punches'){
      // Same correction: a shift is filed under its own date, not discarded
      // for falling outside whichever week happens to be on screen.
      flushWindow();
      const {shifts,unpaired,overlong}=pairPunches(P.rows);
      const seenNames=new Set();
      const byDay={};
      for(const s of shifts){
        const iso=isoDate(s.date); if(!iso){outside++;continue}
        const nm=s.name||s.emp||'(unnamed)';
        seenNames.add(nm);
        byDay[iso]=byDay[iso]||{};
        byDay[iso][nm]=(byDay[iso][nm]||0)+s.hours;
      }
      for(const [iso,hours] of Object.entries(byDay)){
        const rounded={},cost={};
        for(const [n,h] of Object.entries(hours)){
          rounded[n]=Math.round(h*100)/100;
          const rate=+DATA.rateBook[n]||0;
          if(rate>0)cost[n]=+(rate*rounded[n]).toFixed(3);
        }
        ledgerPut(iso,{hours:rounded,cost},STAGE.fileName||'attendance import');
        updated++;
      }
      created=seenNames.size;
      // Keep the "forgot to clock out" problems instead of dropping them. They
      // are missing hours, and missing hours understate labour cost — so they
      // ride into the needs queue until the next clean import clears them.
      DATA.punchIssues=(unpaired.length||overlong.length)
        ? {unpaired:unpaired.length, overlong:overlong.length,
           at:Date.now(), file:STAGE.fileName||'attendance import',
           sample:unpaired.slice(0,5).map(u=>`${u.emp}: ${u.why}`)}
        : null;
      loadWindow(latestWindowStart());
    } else {
      // EVERY row is kept. The old code walked the seven days of the current
      // window and dropped anything outside it — ninety days in, seven days
      // stored, and a message that read like success.
      flushWindow();
      for(const r of P.rows){
        const iso=isoDate(r.date);
        if(!iso){outside++;continue}
        ledgerPut(iso,{sales:+r.sales||0,
          guests:r.covers!=null?+r.covers||0:undefined},STAGE.fileName||'daily import');
        updated++;
      }
      const s=ledgerSpan();
      if(s)loadWindow(latestWindowStart());
    }
  });
  const msg = kind==='itemsales'
      ? `${updated} dish(es) matched by name${created?`. ${created} line(s) matched nothing on your menu and were left alone`:''}.`
    : kind==='punches' ? `${created} employee(s) added, ${updated} updated. Hours are in — wage rates are not in an attendance export, so set those on the Labour tab.`
    : kind==='products' ? `${created} item(s) created, ${updated} price(s) updated.`
    : kind==='purchases' ? `${created} invoice line(s) logged${priced?`, ${priced} ingredient price(s) updated`:''}.`
    : (()=>{const s=ledgerSpan();
        return `${updated} day(s) stored${s?` — history now runs ${s.from} to ${s.to} (${s.n} day(s))`:''}.`;})();
  const extra = outside
    ? `\n\n${outside} row(s) had no readable date and were left out.`
    : (kind==='daily'||kind==='punches')
      ? '\n\nEvery day is kept. The week on screen is just the window you are looking through — move it with the arrows on Prime cost, or open History to see the lot.'
      : '';
  STAGE=null;
  // During setup, applying an import returns to the FLOW rather than dropping
  // you into whichever screen the data landed on. Being thrown at the full
  // dashboard mid-onboarding is how someone loses the thread of what they
  // were doing — and the step they just completed is exactly when the flow is
  // most useful, because it moves on by itself.
  if(setupStep && setupDone(setupStep)){
    // The step this file was for is now finished — show what it bought.
    celebrateStep(setupStep.id,beforeState);
    R();
    return;
  }
  view = inSetup() ? 'today'
       : kind==='daily'?'week':kind==='purchases'?'purch':'menu';
  R();
  // A successful import gets a toast with Undo rather than a dialog: the
  // moment you most want to take something back is the moment it lands.
  toast(msg+(extra?' '+extra.replace(/\n+/g,' '):''),{action:'undo()',actionLabel:'Undo'});
}


// ── PUNCH PAIRING ───────────────────────────────────────────────────────
//
// A fingerprint scanner exports EVENTS, not hours. ZKTeco and its cousins push
// user_id, timestamp and usually an IN/OUT status — and the report layout is
// user-configurable, which is exactly why this goes through the same column
// mapper as everything else rather than assuming a format.
//
// Turning events into hours is where it gets dangerous, because the failure
// modes are silent and expensive:
//
//   · A missed clock-out turns a 9-hour shift into a 27-hour one, and 27 hours
//     at any wage wrecks the labour percentage without looking obviously wrong.
//   · Fingers get pressed twice. Two punches nine seconds apart are one punch.
//   · Night shifts cross midnight, so the out-time is "before" the in-time.
//   · Some devices export no direction at all and expect you to infer it.
//
// So nothing is guessed into existence: unpaired punches and implausible shifts
// are counted and reported rather than quietly summed. Hours you cannot trust
// are worse than hours you do not have, because the first kind gets used.
const PUNCH_DEDUP_SEC=90;      // two reads this close together are one press
const PUNCH_MAX_HOURS=16;      // longer than this is a missed punch, not a shift

const _stamp=v=>{
  const s=String(v||'').trim(); if(!s)return null;
  let m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  const d=new Date(s.replace(' ','T'));
  return isNaN(d)?null:d;
};
const _dir=v=>{
  const s=String(v||'').toLowerCase().trim();
  if(!s)return null;
  if(/^(0|i|in|c\/?in|check ?in|entry|duty on)/.test(s))return 'in';
  if(/^(1|o|out|c\/?out|check ?out|exit|duty off)/.test(s))return 'out';
  return null;
};

/// Pair raw punches into shifts, per employee.
/// Returns {shifts, unpaired, overlong, dropped} — the last three are the
/// honesty channel.
function pairPunches(events){
  const byEmp={};
  for(const e of events){ (byEmp[e.emp]=byEmp[e.emp]||[]).push(e) }
  const shifts=[],unpaired=[],overlong=[];
  let dropped=0;
  for(const emp in byEmp){
    const list=byEmp[emp].slice().sort((a,b)=>a.at-b.at);
    // de-duplicate rapid repeats
    const clean=[];
    for(const p of list){
      const prev=clean[clean.length-1];
      if(prev&&Math.abs(p.at-prev.at)/1000<PUNCH_DEDUP_SEC){dropped++;continue}
      clean.push(p);
    }
    let open=null,alt='in';
    for(const p of clean){
      const dir=p.dir||alt;
      alt = dir==='in'?'out':'in';
      if(dir==='in'){
        if(open)unpaired.push({emp,at:open.at,why:'clocked in twice — no clock-out between'});
        open=p;
      } else {
        if(!open){unpaired.push({emp,at:p.at,why:'clocked out with no clock-in'});continue}
        const hrs=(p.at-open.at)/3600000;
        if(hrs>PUNCH_MAX_HOURS){
          overlong.push({emp,at:open.at,hours:hrs});
          open=null; continue;
        }
        shifts.push({emp,name:p.name||open.name||emp,
          date:new Date(open.at.getTime()-open.at.getTimezoneOffset()*60000)
                 .toISOString().slice(0,10),          // the day the shift STARTED
          hours:Math.round(hrs*100)/100});
        open=null;
      }
    }
    if(open)unpaired.push({emp,at:open.at,why:'clocked in, never clocked out'});
  }
  return {shifts,unpaired,overlong,dropped};
}
/// Roll shifts up into the seven days of the current week.
function punchWeek(shifts){
  const days=WK().days||[];
  const per={},outside=[];
  for(const s of shifts){
    const i=days.indexOf(s.date);
    if(i<0){outside.push(s);continue}
    const k=s.name||s.emp;
    per[k]=per[k]||{name:k,hours:[0,0,0,0,0,0,0]};
    per[k].hours[i]+=s.hours;
  }
  return {people:Object.values(per),outside};
}


// ── PDF TEXT ────────────────────────────────────────────────────────────
//
// Menus and a lot of competitor research arrive as PDF, so the file picker has
// to read them.
//
// ── No library, and that is a deliberate constraint ─────────────────────
//
// The obvious answer is pdf.js, which means either a CDN (this console must
// work with no internet, in a kitchen office, forever) or bundling a megabyte
// into a file that is currently three hundred kilobytes. Neither is worth it
// for the job at hand, which is "pull the text out of a menu".
//
// Instead: PDF text lives in content streams, and those streams are almost
// always zlib-compressed. Every current browser can inflate zlib natively via
// DecompressionStream — no dependency, no download, works offline.
//
// ── What this will and will not do ─────────────────────────────────────
//
// WILL   read any PDF whose text is real text — anything exported from a design
//        tool, a word processor, or a POS report.
// WILL NOT read a scan or a photograph. There are no characters in those, only
//        pixels, and pretending otherwise would return an empty menu with no
//        explanation. It detects that case and says so rather than failing
//        silently — a scanned menu is a job for the phone app, not this.
//
// Font encodings can still mangle the odd character; the review step exists
// precisely because extraction is a proposal, not a fact.

/// PDF filters chain. /Filter [ /ASCII85Decode /FlateDecode ] means the bytes
/// were deflated and THEN ascii85-armoured, so they have to be un-armoured
/// first — found the hard way on the first real PDF tested, which produced
/// zero text because inflate was being handed ascii85.
function ascii85(bytes){
  const s=new TextDecoder('latin1').decode(bytes)
    .replace(/^<~/,'').replace(/~>[\s\S]*$/,'').replace(/\s/g,'');
  const out=[]; let tuple=0,count=0;
  for(const ch of s){
    if(ch==='z'&&count===0){out.push(0,0,0,0);continue}
    const v=ch.charCodeAt(0)-33;
    if(v<0||v>84)continue;
    tuple=tuple*85+v; count++;
    if(count===5){
      out.push((tuple>>>24)&255,(tuple>>>16)&255,(tuple>>>8)&255,tuple&255);
      tuple=0;count=0;
    }
  }
  if(count>0){
    for(let i=count;i<5;i++)tuple=tuple*85+84;
    const b=[(tuple>>>24)&255,(tuple>>>16)&255,(tuple>>>8)&255,tuple&255];
    for(let i=0;i<count-1;i++)out.push(b[i]);
  }
  return new Uint8Array(out);
}
function asciiHex(bytes){
  const s=new TextDecoder('latin1').decode(bytes).replace(/>[\s\S]*$/,'').replace(/[^0-9A-Fa-f]/g,'');
  const out=new Uint8Array(s.length>>1);
  for(let i=0;i<out.length;i++)out[i]=parseInt(s.substr(i*2,2),16);
  return out;
}

async function inflate(bytes){
  for(const fmt of ['deflate','deflate-raw']){
    try{
      const ds=new DecompressionStream(fmt);
      const stream=new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }catch(e){ /* try the next format */ }
  }
  return null;
}

/// Is this actually text, or bytes that happen to decode without throwing?
///
/// Found on a real customer menu: a 2.8MB PDF with 84 embedded JPEGs and no
/// fonts at all. Binary image data contains the byte pair "Tj" often enough by
/// chance that a naive operator check passed, the JPEG was decoded as latin1,
/// and ten rows of mojibake were proposed as menu items with prices. Confident
/// nonsense — the worst possible output, and exactly what the review step is
/// supposed to make impossible.
///
/// Real prose is overwhelmingly letters, digits, spaces and a little
/// punctuation. Decoded binary is not, and the difference is not subtle: menus
/// score above 0.9, JPEG bytes score around 0.35.
function looksLikeText(s){
  if(!s||s.length<20)return false;
  const sample=s.slice(0,4000);
  let good=0;
  for(const ch of sample){
    const c=ch.charCodeAt(0);
    if((c>=32&&c<=126)||c===10||c===13||c===9||(c>=0x600&&c<=0x6FF))good++;
  }
  const ratio=good/sample.length;
  const letters=(sample.match(/[A-Za-z؀-ۿ]/g)||[]).length/sample.length;
  return ratio>0.9 && letters>0.35;
}

/// Pull the readable text out of a PDF.
/// Returns {text, pages, encrypted, images, outlines, reason}.
async function pdfText(buf){
  const bytes=new Uint8Array(buf);
  const latin=new TextDecoder('latin1').decode(bytes);
  if(/\/Encrypt\s/.test(latin))
    return {text:'',pages:0,encrypted:true,looksScanned:false};

  const chunks=[];
  let pages=0, images=0, outlines=0;
  const re=/stream\r?\n?/g; let m;
  while((m=re.exec(latin))!==null){
    const start=m.index+m[0].length;
    const end=latin.indexOf('endstream',start);
    if(end<0)break;   // truncated file — stop rather than spin
    // the object header sits just before the stream keyword
    const head=latin.slice(Math.max(0,m.index-400),m.index);
    if(/\/Image/.test(head)){images++;continue}
    let data=bytes.subarray(start,end);
    // Filters are listed in the order they were APPLIED, so undo them in order.
    const filt=(head.match(/\/Filter\s*(\[[^\]]*\]|\/\w+)/)||[])[1]||'';
    const chain=(filt.match(/\/\w+/g)||[]).map(x=>x.slice(1));
    let ok=true;
    for(const f of chain){
      if(f==='ASCII85Decode')      data=ascii85(data);
      else if(f==='ASCIIHexDecode')data=asciiHex(data);
      else if(f==='FlateDecode'){
        const out=await inflate(data);
        if(!out){ok=false;break}
        data=out;
      }
      else if(f==='DCTDecode'||f==='JPXDecode'||f==='CCITTFaxDecode'){ok=false;break} // images
      else {ok=false;break}   // LZW and friends — rare, and guessing would corrupt
    }
    if(!ok)continue;
    const s=new TextDecoder('latin1').decode(data);
    // A text-showing operator must FOLLOW a string or array, not merely appear.
    // ")Tj" and "]TJ" are structural; a bare "Tj" is a coincidence in binary.
    const showsText=/\)\s*Tj|\]\s*TJ|\)\s*'|\)\s*"/.test(s);
    if(showsText){ pages++; chunks.push(s); }
    else if(/\b[mlchf]\b[\s\S]{0,40}\b[mlc]\b/.test(s)&&/\bcm\b/.test(s)) outlines++;
    re.lastIndex=end+9;
  }

  // Reconstruct lines by VERTICAL position, not by every positioning operator.
  //
  // A menu row is a name at x=60 and a price at x=300 on the same baseline —
  // two separate text ops with a Td between them. Breaking on every Td (the
  // obvious approach, and the first one tried) splits every row in half and
  // produces a list of prices with no dishes attached. Only a change in Y is a
  // new line.
  let text='';
  for(const s of chunks){
    const tok=/\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]+>|-?[\d.]+|\bT[Jjdfm*D]\b|\bET\b|\bBT\b/g;
    let t, line='', nums=[], y=null, first=true;
    const flush=()=>{ if(line.trim()){text+=line.trim()+'\n'} line=''; };
    while((t=tok.exec(s))!==null){
      const v=t[0];
      if(/^-?[\d.]+$/.test(v)){ nums.push(parseFloat(v)); if(nums.length>8)nums.shift(); continue }
      if(v[0]==='('){
        line+=v.slice(1,-1)
          .replace(/\\([nrtbf])/g,(x,c)=>({n:' ',r:'',t:' ',b:'',f:''}[c]))
          .replace(/\\([0-7]{1,3})/g,(x,o)=>String.fromCharCode(parseInt(o,8)))
          .replace(/\\(.)/g,'$1');
        nums=[]; continue;
      }
      if(v[0]==='<'){
        const hex=v.slice(1,-1).replace(/\s/g,'');
        for(let i=0;i+3<hex.length+1;i+=4){
          const c=parseInt(hex.substr(i,4),16);
          if(c>31&&c<0xFFFD)line+=String.fromCharCode(c);
        }
        nums=[]; continue;
      }
      // Track the absolute Y and break only when it actually moves. Many
      // generators emit one BT..ET per string, so a dish and its price are
      // separate text objects sharing a baseline — resetting on ET splits
      // every row in half, which is exactly what happened first time.
      if(v==='Td'||v==='TD'||v==='Tm'){
        const ny = v==='Tm'
          ? (nums.length>=6?nums[nums.length-1]:null)
          : (nums.length>=2?nums[nums.length-1]:null);
        if(ny!=null){
          if(y!=null&&Math.abs(ny-y)>0.5)flush();
          else if(line&&!/\s$/.test(line))line+=' ';   // same baseline, next column
          y=ny;
        }
        first=false; nums=[]; continue;
      }
      if(v==='T*'){ flush(); nums=[]; continue }
      if(v==='ET'){ nums=[]; continue }
      nums=[];
    }
    flush();
  }
  // Refuse anything that is not plausibly text, however it got here.
  if(!looksLikeText(text))text='';
  const reason = text ? ''
    : outlines>0 ? 'outlines'
    : images>0   ? 'scanned'
    : 'none';
  return {text,pages,encrypted:false,images,outlines,reason,
          looksScanned:reason==='scanned'};
}

/// Turn menu text into priced items.
///
/// A menu line is a name followed by a price, with anything between them —
/// dot leaders, spaces, a tab. Section headings have no price, so they become
/// the category for everything under them, which is exactly how a menu is
/// meant to be read.
function parseMenuText(text){
  const out=[]; let cat='';
  const PRICE=/^(.*?)[\s.·…]*?([0-9]{1,4}(?:[.,][0-9]{1,3})?)\s*(?:BD|SR|AED|KWD|QAR|OMR|\$|£|€)?\s*$/i;
  for(let raw of String(text||'').split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim();
    if(!line||line.length>90)continue;
    const m=line.match(PRICE);
    const hasPrice = m && /[0-9]/.test(m[2]) && m[1].trim().length>1;
    if(!hasPrice){
      // A short line with no price and no lowercase run is a section heading.
      if(line.length<=34 && !/[a-z]{4}/.test(line.replace(/[^A-Za-z]/g,'')) || /^[A-Z][A-Z\s&'-]{3,}$/.test(line))
        cat=line.replace(/[^A-Za-z0-9 &'-]/g,'').trim();
      continue;
    }
    // Strip dot leaders and a trailing currency code — "Tuna Melt ......... BD"
    // is a dish called Tuna Melt, not one called "Tuna Melt ......... BD".
    const name=m[1]
      .replace(/[\s.·…_-]{2,}$/,'')
      .replace(/\s*(BD|SR|AED|KWD|QAR|OMR|USD|EUR|GBP|\$|£|€)\s*$/i,'')
      .replace(/[\s.·…_-]+$/,'')
      .trim();
    const price=parseFloat(String(m[2]).replace(',','.'));
    if(!name||!isFinite(price)||price<=0)continue;
    if(/^(total|subtotal|vat|service|page)\b/i.test(name))continue;
    out.push({name,price,cat});
  }
  return out;
}


// ── AI ASSIST ───────────────────────────────────────────────────────────
//
// Optional. Off by default. Never the calculator.
//
// ── Where a model genuinely beats the regex ─────────────────────────────
//
// The deterministic parsers here handle clean input well and fall over on the
// messy half of the real world: a two-column menu with descriptions under each
// dish, an Arabic-English menu, a POS export whose columns are named something
// nobody anticipated, a photographed invoice. Those are language problems, and
// a language model is the right tool.
//
// ── Where it is explicitly NOT allowed ──────────────────────────────────
//
// It does not compute. Not a food cost, not a margin, not a prime cost, not a
// total. Every number this console reports comes from deterministic code with
// tests, because a model that quietly recalculates is a model that will one day
// quietly recalculate wrong, and nobody will be able to tell which figure moved
// or why.
//
// The model's entire job is: read this messy thing, and propose structured rows.
// Those rows land in the same review table as a CSV import, with the same
// human confirmation, and the arithmetic happens afterwards in code.
//
// ── About the key ───────────────────────────────────────────────────────
//
// Stored in this browser. That is a real exposure and it is stated plainly in
// the UI rather than buried: anyone who opens this laptop can read it, and so
// can any script on the page. It is a different risk from a POS key — this one
// can spend money but cannot move yours — which is why it is offered at all and
// the POS key is not.
DATA.ai=DATA.ai||{provider:'',key:'',enabled:false,lastUsed:0,calls:0};


// ── WHEN THE REQUEST NEVER LEAVES ───────────────────────────────────────
//
// A browser reports every network-level failure as the same TypeError, and
// its message is "Failed to fetch". That string was being shown to the user
// verbatim, which tells them nothing and implies the API said no. The API
// never heard from them.
//
// There are only a few real causes and they have different fixes, so the
// console works out which one it is rather than repeating the browser's
// shrug:
//
//   file://        A page opened straight off disk sends "Origin: null", and
//                  the API rejects it before the key is ever looked at. This
//                  is the commonest one and it is invisible — the page works
//                  perfectly right up until it needs the network.
//   an embed       A preview pane or an iframe with a restrictive policy can
//                  block outgoing requests entirely.
//   offline        Genuinely no connection.
//
// The fix for the first two is the same and it is not obvious, so it is
// spelled out: serve the file over http, or open it in a normal browser tab.
const isNetFail=e=>e instanceof TypeError||/failed to fetch|load failed|networkerror/i.test(String(e&&e.message||e));

function netDiagnosis(){
  const proto=(typeof location!=='undefined'&&location.protocol)||'';
  const embedded=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  const offline=(typeof navigator!=='undefined'&&navigator.onLine===false);
  if(offline)
    return 'This computer reports that it is offline. Reading a menu with AI needs a connection.';
  if(proto==='file:')
    return 'This page was opened straight from a file on disk, so the browser sends no origin and the '+
           'API refuses the request before it looks at your key.\n\n'+
           'Fix: serve the file instead of double-clicking it. Run serve.bat next to this file and open '+
           'the address it prints. Everything else works from disk — only the network calls do not.';
  if(embedded)
    return 'This page is running inside a preview pane, which blocks requests to other sites.\n\n'+
           'Fix: open the file in a normal browser tab — or serve it with serve.bat and use that address.';
  return 'The request did not reach the API at all. That is a network or browser-policy problem rather '+
         'than a problem with your key: a firewall, a VPN, an extension blocking requests, or no connection.';
}

/// Wrap any fetch so a network failure explains itself.
async function netFetch(url,opts,what){
  try{ return await fetch(url,opts); }
  catch(e){
    if(isNetFail(e))
      throw new Error(`${what||'That request'} never reached the server.\n\n`+netDiagnosis());
    throw e;
  }
}

const aiReady=()=>!!(DATA.ai&&DATA.ai.enabled&&DATA.ai.provider&&DATA.ai.key);
function setAI(field,v){
  edit(()=>{DATA.ai=DATA.ai||{};
    if(field==='enabled')DATA.ai.enabled=!!v;
