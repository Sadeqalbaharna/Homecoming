// ════════════════════════════════════════════════════════════════════════
// FROM A STACK OF INVOICES TO A PRICED CATALOGUE
//
// The ask: attaching one to three months of receipts should populate item
// names, suppliers, pack sizes and a price per item — and should decide for
// itself whether "black olives" from two suppliers is one ingredient or two.
//
// ── THE IDENTITY PROBLEM, WHICH IS THE WHOLE PROBLEM ───────────────────
//
// An invoice line says BLACK OLIVES PITTED 2.5KG TIN. A different supplier
// says BLK OLIVE 1KG JAR. A recipe says "80 g black olives". Three names, one
// substance, and the recipe cannot be costed until they are connected.
//
// The structure that resolves it is two levels, not one:
//
//   INGREDIENT   the substance, with ONE recipe unit. "Black olives", in kg.
//                Recipes point here. There is exactly one cost per unit.
//   VARIANT      how it was actually bought. Supplier, pack description, pack
//                size, price, date. Many of these per ingredient.
//
// Everything the invoices contain is a variant. The ingredient is derived.
// Keeping them separate is what lets a 2.5 kg tin and a 1 kg jar produce a
// single, comparable cost per kilo — which is the number a recipe needs and
// the number that makes "chicken went up 14%" sayable.
//
// ── WHEN NOT TO MERGE ──────────────────────────────────────────────────
//
// Merging is not always right and getting it wrong is expensive: pitted and
// unpitted olives are different products with different yields, and blending
// their prices produces a cost that matches no purchase anyone ever made.
// So merging happens only when the canonical names match exactly after
// normalisation, and a list of qualifiers (pitted, smoked, organic, frozen…)
// is preserved in the canonical name rather than stripped. Two things that
// differ by a qualifier stay apart.
//
// And nothing is written. The engine PROPOSES; a human confirms. The console
// has been wrong about a name match before — it once proposed Bowl O' Chili →
// Bowl of Nuts — and a wrong ingredient price is worse than a missing one,
// because it flows into food cost as a number nobody can trace back.
// ════════════════════════════════════════════════════════════════════════

/// Units we can convert within. Cross-family conversion is refused, not
/// guessed: grams to millilitres needs a density nobody has recorded.
const UNIT_FAMILY={
  kg:['kg',1000],g:['kg',1],mg:['kg',0.001],lb:['kg',453.592],oz:['kg',28.3495],
  l:['l',1000],ml:['l',1],cl:['l',10],
  ea:['ea',1],pc:['ea',1],pcs:['ea',1],pack:['ea',1],unit:['ea',1],
  doz:['ea',12],dozen:['ea',12],
};
const UNIT_WORDS=Object.keys(UNIT_FAMILY).sort((a,b)=>b.length-a.length);

/// "2.5KG", "12 x 1L", "6X500G", "500 gm", "1 dozen"
///
/// Returns {packs, size, unit, base, total} where total is in the family's
/// base unit (kg, l or ea). A multiplier pack — 12 x 1L — is twelve litres,
/// and reading it as one litre would understate the cost per litre twelve-fold.
function parsePack(desc){
  if(!desc)return null;
  const s=String(desc).toLowerCase()
    .replace(/,/g,'')
    .replace(/(\d)\s*[×✕]\s*/g,'$1 x ')
    .replace(/\bgm?s?\b/g,'g').replace(/\bgrams?\b/g,'g')
    .replace(/\bkgs?\b/g,'kg').replace(/\bkilos?\b/g,'kg')
    .replace(/\blt?r?s?\b/g,'l').replace(/\blitres?\b/g,'l').replace(/\bliters?\b/g,'l')
    .replace(/\bmls?\b/g,'ml')
    .replace(/\bpieces?\b/g,'pc').replace(/\bpcs?\b/g,'pc').replace(/\beach\b/g,'ea');
  const u='(?:'+UNIT_WORDS.join('|')+')';
  // multiplier form first — 12 x 1 l
  let m=new RegExp('(\\d+(?:\\.\\d+)?)\\s*x\\s*(\\d+(?:\\.\\d+)?)\\s*('+u+')\\b').exec(s);
  let packs=1,size=null,unit=null;
  if(m){ packs=+m[1]; size=+m[2]; unit=m[3]; }
  else{
    m=new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+u+')\\b').exec(s);
    if(m){ size=+m[1]; unit=m[2]; }
  }
  if(size===null||!unit||!UNIT_FAMILY[unit])return null;
  if(!(size>0)||!(packs>0))return null;
  const [base,factor]=UNIT_FAMILY[unit];
  return {packs,size,unit,base,total:packs*size*factor/(base==='kg'?1000:base==='l'?1000:1)};
}

/// Qualifiers that change what the thing IS. Kept in the canonical name so
/// two products that differ by one never merge.
const KEEP_QUALIFIERS=['pitted','unpitted','stuffed','sliced','whole','ground','minced',
  'smoked','organic','frozen','fresh','dried','tinned','canned','boneless','skinless',
  'diced','chopped','fillet','breast','thigh','leg','wing','light','dark','white','red',
  'green','black','extra','virgin','skimmed','full','fat','free','low','double','single'];

/// Noise that says nothing about the substance.
const DROP_WORDS=['tin','jar','can','bottle','btl','pack','pkt','packet','box','ctn','carton',
  'bag','case','tray','pouch','sachet','tub','approx','per','net','wt','weight','new',
  'promo','offer','item','product','code','sku','ref','x'];

/// Best-guess category for an invoice item: the invoice's own category if it
/// carried one, else a match against the built-in starter catalogue by name.
/// Returns '' when it genuinely cannot tell — a wrong category is worse than a
/// blank one, because a blank invites a human and a wrong one hides.
let _CATBYNAME=null;
function catByName(name){
  if(!_CATBYNAME){
    _CATBYNAME={};
    try{ for(const c of (typeof CATALOG!=='undefined'?CATALOG:[])){
      const k=canonicalName(c.n); if(k&&c.c&&!_CATBYNAME[k])_CATBYNAME[k]=c.c; } }catch(e){}
  }
  const cn=canonicalName(name);
  if(_CATBYNAME[cn])return _CATBYNAME[cn];
  // token overlap: "chicken thigh" matches the catalogue's "chicken breast"
  // on the shared "chicken", which is the right category even if the cut
  // differs.
  const words=cn.split(' ').filter(w=>w.length>2);
  for(const w of words){
    for(const k in _CATBYNAME) if((' '+k+' ').includes(' '+w+' '))return _CATBYNAME[k];
  }
  return '';
}
function guessCategory(invoiceCat,name){
  const c=String(invoiceCat||'').trim();
  if(c)return c;                 // the invoice said so — trust it
  return catByName(name);        // else infer from the catalogue
}

/// Invoice description → the substance, normalised.
///
/// Strips pack sizes, units, pure numbers, packaging words and punctuation;
/// keeps everything else including qualifiers; expands a few abbreviations
/// that appear on nearly every Gulf invoice.
const ABBREV={blk:'black',wht:'white',grn:'green',veg:'vegetable',chkn:'chicken',
  chk:'chicken',bf:'beef',mzrl:'mozzarella',mozz:'mozzarella',tom:'tomato',
  pot:'potato',onn:'onion',olv:'olive',chz:'cheese',ch:'cheese'};

function canonicalName(desc){
  if(!desc)return '';
  let s=String(desc).toLowerCase()
    .replace(/\(.*?\)/g,' ')
    .replace(/[^a-z0-9.\s]+/g,' ');
  // remove the pack expression wherever it sits
  const u='(?:'+UNIT_WORDS.join('|')+')';
  s=s.replace(new RegExp('\\d+(?:\\.\\d+)?\\s*x\\s*\\d+(?:\\.\\d+)?\\s*'+u+'\\b','g'),' ');
  s=s.replace(new RegExp('\\d+(?:\\.\\d+)?\\s*'+u+'\\b','g'),' ');
  const words=s.split(/\s+/).filter(Boolean)
    .map(w=>ABBREV[w]||w)
    .filter(w=>!DROP_WORDS.includes(w))
    .filter(w=>!/^\d+(\.\d+)?$/.test(w))
    .filter(w=>w.length>1||/^[a-z]$/.test(w)===false);
  // singularise only the crude cases; "olives" and "olive" must meet
  const norm=words.map(w=>w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w);
  return norm.sort().join(' ').trim();
}

/// A display name for the merged ingredient.
///
/// The first version took the longest original description, which left the
/// pack size in the name: an ingredient bought in both 1 kg jars and 2.5 kg
/// tins came out called "Black Olives 2.5kg Tin". The price underneath was
/// per kilo and correct, but the label contradicted it — and a name that
/// names one of several packs is the kind of small wrongness that makes
/// someone distrust the number next to it.
///
/// So the pack expression and the packaging words come out, and everything
/// that describes the SUBSTANCE stays — including qualifiers like pitted or
/// smoked, which are the reason two similar things were kept apart.
///
/// Word order and spelling are taken from the real invoice rather than the
/// canonical form, which is sorted alphabetically and unreadable.
function displayName(descs){
  const u='(?:'+UNIT_WORDS.join('|')+')';
  const clean=d=>String(d||'')
    .replace(/\(.*?\)/g,' ')
    .replace(new RegExp('\\b\\d+(?:\\.\\d+)?\\s*[x×]\\s*\\d+(?:\\.\\d+)?\\s*'+u+'\\b','gi'),' ')
    .replace(new RegExp('\\b\\d+(?:\\.\\d+)?\\s*'+u+'\\b','gi'),' ')
    .replace(/[^A-Za-z0-9'\-\s]+/g,' ')
    .split(/\s+/).filter(Boolean)
    .filter(w=>!DROP_WORDS.includes(w.toLowerCase()))
    .filter(w=>!/^\d+(\.\d+)?$/.test(w))
    .join(' ').trim();

  // The longest description that still says something once cleaned. Longest
  // is the right pick because it is the one carrying the qualifiers.
  const cands=descs.map(clean).filter(Boolean).sort((a,b)=>b.length-a.length);
  const best=cands[0]||String(descs[0]||'').trim()||'(unnamed)';
  // Capitalise after a space or a hyphen only. A word boundary also sits
  // after an apostrophe, so the obvious \b\w gives "Chef'S Selection".
  return best.slice(0,60).toLowerCase()
    .replace(/(^|[\s\-])([a-z])/g,(m,pre,ch)=>pre+ch.toUpperCase());
}

/// ── COST BASIS ────────────────────────────────────────────────────────
///
/// Three answers to "what does a kilo of this cost", and they differ, so the
/// method is the operator's choice rather than a default nobody sees.
///
///   latest   the most recent price paid. Right for repricing a menu today.
///   wavg     weighted by quantity over a window. Right for costing what has
///            actually been going out of the store, and it is the one that
///            stops a single small emergency purchase at a corner shop from
///            setting the price of everything.
///   fifo     the oldest unconsumed layer first.
///
/// AN HONEST LIMIT ON FIFO. True FIFO needs to know what was CONSUMED, and
/// consumption is only knowable from stock counts, which this venue has not
/// taken. What is computed here assumes stock is used in the order it was
/// bought — which is what FIFO means as a policy, but it cannot be verified
/// against reality until counts exist. It is labelled as an assumption on
/// screen rather than presented as measured.
function costBasis(variants,method,opts){
  const o=Object.assign({windowDays:90,now:Date.now()},opts||{});
  const v=variants.filter(x=>x.unitCost>0&&x.qtyBase>0)
                  .sort((a,b)=>(a.at||0)-(b.at||0));
  if(!v.length)return {price:0,method,basis:'no priced purchases'};
  if(method==='latest'){
    const last=v[v.length-1];
    return {price:last.unitCost,method,basis:'last paid '+fmtDate(last.at)+
      (last.supplier?' · '+last.supplier:'')};
  }
  if(method==='fifo'){
    const first=v[0];
    return {price:first.unitCost,method,assumed:true,
      basis:'oldest stock first — assumes nothing has been counted, so '+
            'consumption order is a policy rather than a measurement'};
  }
  // weighted average over the window, falling back to everything if the
  // window is empty — a silent zero here would be far worse than an old price.
  const cut=o.now-o.windowDays*86400000;
  let use=v.filter(x=>(x.at||0)>=cut);
  const windowed=use.length>0;
  if(!use.length)use=v;
  let q=0,c=0;
  for(const x of use){ q+=x.qtyBase; c+=x.qtyBase*x.unitCost; }
  return {price:q>0?c/q:0,method,
    basis:`weighted over ${use.length} purchase(s)`+
          (windowed?` in the last ${o.windowDays} days`:', all on record — none inside the window'),
    n:use.length,qty:q};
}
const fmtDate=t=>{ if(!t)return 'an unknown date';
  const d=new Date(t),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };

/// ── THE PROPOSAL ──────────────────────────────────────────────────────
///
/// Invoice lines in, proposed catalogue out. Nothing is written.
///
/// `lines` are [{supplier,date,item,qty,unit,total}] — exactly what the
/// invoice importer already produces.
function proposeCatalogue(lines,opts){
  const o=Object.assign({method:'wavg',windowDays:90,now:Date.now()},opts||{});
  const groups=new Map();
  const suppliers=new Map();
  const skipped=[];

  for(const L of (lines||[])){
    const desc=String(L.item||'').trim();
    const sup=String(L.supplier||'').trim();
    if(sup)suppliers.set(sup.toLowerCase(),sup);
    if(!desc){ skipped.push({line:L,why:'no item description'}); continue; }

    const pack=parsePack(desc)||parsePack(L.unitDesc||'')||null;
    const qty=+L.qty||0;
    const total=+L.total||0;
    const unitPrice=+L.unit|| (qty>0&&total>0?total/qty:0);

    if(!pack){
      // No pack size means no price per kilo, and inventing one would put a
      // number in the app that nothing on the invoice supports.
      skipped.push({line:L,why:'no pack size in the description — cost per unit cannot be derived',
                    desc,unitPrice});
      continue;
    }
    if(!(unitPrice>0)){ skipped.push({line:L,why:'no price on the line',desc}); continue; }

    const key=canonicalName(desc)+'|'+pack.base;
    if(!groups.has(key))groups.set(key,{key,base:pack.base,descs:[],variants:[],cats:[]});
    const g=groups.get(key);
    g.descs.push(desc);
    if(L.cat)g.cats.push(String(L.cat).trim());
    const qtyBase=(qty>0?qty:1)*pack.total;          // how much substance arrived
    g.variants.push({
      supplier:sup||'(unknown supplier)',
      at:parseDate(L.date),
      desc, packDesc:`${pack.packs>1?pack.packs+' x ':''}${pack.size}${pack.unit}`,
      packTotal:pack.total, qty:qty>0?qty:1,
      qtyBase,
      linePrice:unitPrice,
      // VAT is stripped HERE if it applies, so every downstream figure — the
      // per-kg cost, the weighted average, the price shown — is the true cost.
      unitCost:invoiceToCost(unitPrice)/pack.total   // per kg / per l / per each
    });
  }

  const items=[...groups.values()].map(g=>{
    const cost=costBasis(g.variants,o.method,o);
    const sups=[...new Set(g.variants.map(v=>v.supplier))];
    const packs=[...new Set(g.variants.map(v=>v.packDesc))];
    const prices=g.variants.map(v=>v.unitCost).filter(x=>x>0);
    const spread=prices.length>1?(Math.max(...prices)-Math.min(...prices))/Math.min(...prices):0;
    // Category: the invoice's own if any line carried one, else inferred from
    // the starter catalogue. Editable in the review before anything is saved.
    const invCat=(g.cats||[]).find(Boolean)||'';
    return {
      key:g.key, name:displayName(g.descs), unit:g.base,
      category:guessCategory(invCat,displayName(g.descs)),
      variants:g.variants.sort((a,b)=>(b.at||0)-(a.at||0)),
      suppliers:sups, packs,
      price:cost.price, basis:cost.basis, assumed:!!cost.assumed,
      spread,
      // A wide spread across suppliers is the signal that a merge may be
      // wrong — either it is two different products, or it is a real saving
      // sitting in plain sight. Either way a human should look.
      flag: spread>0.4 ? 'prices differ by '+Math.round(spread*100)+'% across purchases — check these are the same product'
          : sups.length>2 ? null : null,
      accept:true
    };
  }).sort((a,b)=>b.variants.length-a.variants.length);

  return {items,suppliers:[...suppliers.values()].sort(),skipped,
          method:o.method,windowDays:o.windowDays};
}

/// Invoice dates, and the trap in them.
///
/// The obvious implementation calls Date.parse first and only falls back to a
/// regex. That is wrong here, and wrong in a way that hides: Date.parse reads
/// "12/6/2026" as 6 DECEMBER, because the JavaScript default is American
/// month-first. A June invoice then sorts as the most recent one, and the
/// "latest price" and the FIFO layer both come from the wrong purchase — with
/// no error anywhere, because a valid date was produced.
///
/// So numeric slash/dot/dash dates are read DAY-FIRST, which is the Gulf and
/// European convention, and Date.parse is used only for the formats it cannot
/// misread: ISO (2026-07-14) and textual (14 Jul 2026).
///
/// 03/04 is genuinely ambiguous and no rule settles it from the string alone.
/// Day-first is the right default for this venue, and the resolved date is
/// shown on screen so a wrong guess is visible rather than buried.
function parseDate(s){
  if(!s)return 0;
  if(typeof s==='number')return s;
  const str=String(s).trim();

  // ISO first — unambiguous by construction.
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(str);
  if(m)return Date.UTC(+m[1],+m[2]-1,+m[3]);

  // Numeric with separators: day-first, before Date.parse can misread it.
  m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(str);
  if(m){
    let d=+m[1],mo=+m[2],y=+m[3];
    if(y<100)y+=2000;
    // If the first number cannot be a day, it must be the month — an
    // American export still reads correctly rather than returning nothing.
    if(d>12&&mo<=12){ /* day-first, as assumed */ }
    else if(mo>12&&d<=12){ const t=d; d=mo; mo=t; }
    if(mo>=1&&mo<=12&&d>=1&&d<=31)return Date.UTC(y,mo-1,d);
    return 0;
  }

  // Anything textual — "14 Jul 2026", "Jul 14, 2026" — cannot be misread as
  // to WHICH number is the month, but Date.parse returns LOCAL midnight while
  // every branch above returns UTC midnight. In Bahrain that is a three-hour
  // offset, which is a whole day whenever the two are compared or formatted
  // in different zones. So the calendar date is taken and re-anchored to UTC,
  // and every path out of this function now means the same thing.
  const t=Date.parse(str);
  if(isNaN(t))return 0;
  const d=new Date(t);
  return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
}

/// ── A PRICE THAT CANNOT BE RIGHT ───────────────────────────────────────
///
/// The commonest failure when reading a number off paper is the decimal
/// point: 4.50 becomes 45.00, or 450. Nothing checked for it, so a single
/// misread digit multiplied every dish using that ingredient by ten and the
/// app reported it with total confidence.
///
/// A price is queried when it is far from what this ingredient has cost
/// before. Not rejected — food prices genuinely move, and a real doubling is
/// exactly the finding this app exists to surface — but it stops and asks,
/// because a human glancing at "45.000 per kg for onions" resolves it in a
/// second and no algorithm can.
const PRICE_SHOCK=4;          // times, in either direction

function priceShock(ing,newPrice){
  if(!ing||!(newPrice>0))return null;
  const hist=(ing.history||[]).filter(h=>h.price>0).map(h=>+h.price);
  const known=hist.length?hist:(ing.price>0?[+ing.price]:[]);
  if(!known.length)return null;                       // nothing to compare with
  const med=(()=>{const s=known.slice().sort((a,b)=>a-b);
    return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2})();
  if(!(med>0))return null;
  const ratio=newPrice/med;
  if(ratio>=PRICE_SHOCK||ratio<=1/PRICE_SHOCK)
    return {name:ing.name,was:med,now:newPrice,ratio,
      why: ratio>=PRICE_SHOCK
        ? `${ratio.toFixed(1)}× what you have paid before — a misread decimal point looks exactly like this`
        : `a ${(1/ratio).toFixed(1)}× drop from what you have paid before`};
  return null;
}

/// Apply an accepted proposal. Only now does anything get written.
function applyCatalogue(prop){
  let added=0,updated=0,sup=0;
  const shocks=[];
  _editLabel=`adding ${prop.items.filter(x=>x.accept).length} ingredient(s) from invoices`;
  edit(()=>{
    DATA.suppliers=DATA.suppliers||[];
    for(const s of prop.suppliers){
      if(!DATA.suppliers.some(x=>(x.name||x)===s)){ DATA.suppliers.push({name:s}); sup++; }
    }
    for(const it of prop.items){
      if(!it.accept)continue;
      const existing=(DATA.ingredients||[]).find(i=>canonicalName(i.name)===canonicalName(it.name));
      if(existing){
        const shock=priceShock(existing,it.price);
        if(shock&&!it.shockOk){ shocks.push(shock); continue; }
        existing.price=it.price; existing.pu=it.unit; existing.ru=it.unit;
        existing.ruPerPu=existing.ruPerPu||1;
        if(it.category&&!existing.category)existing.category=it.category;
        existing.history=(existing.history||[]).concat(
          it.variants.map(v=>({at:v.at,price:v.unitCost,supplier:v.supplier})));
        existing.basis=it.basis;
        updated++;
      }else{
        DATA.ingredients.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          name:it.name, price:it.price, pu:it.unit, ru:it.unit, ruPerPu:1,
          category:it.category||'',
          basis:it.basis, packs:it.packs, suppliers:it.suppliers,
          history:it.variants.map(v=>({at:v.at,price:v.unitCost,supplier:v.supplier}))});
        added++;
      }
    }
    rebuildIX();
  });
  return {added,updated,suppliers:sup,shocks};
}

// ════════════════════════════════════════════════════════════════════════
// READING EXCEL
//
// "The manager will have almost everything either in excel or paper."
//
// Telling him to open each file and Save As CSV is friction on step one, and
// step one is where people give up. It is also unnecessary: an .xlsx is a zip
// of XML, and the browser can already unzip — DecompressionStream is here for
// PDF content streams and inflates a zip entry just as happily.
//
// So this reads xlsx directly. No library, no CDN, no upload.
//
// WHAT IT HANDLES: shared strings, inline strings, numbers, formula results
// (the cached value, which is what you want — the number the manager can see),
// dates as serials converted back to dates, and gaps in the row where a cell
// simply is not present.
//
// WHAT IT DOES NOT: .xls (the old binary format — genuinely different, and
// rare from a modern POS), macros, charts, or anything but the cell values.
// Multiple sheets are listed and the first non-empty one is used, because a
// POS export with three sheets usually has the data on one and a cover page on
// another.
// ════════════════════════════════════════════════════════════════════════

/// Minimal zip reader. Walks local file headers rather than the central
/// directory — simpler, and correct for the well-formed files Excel writes.
async function unzip(buf){
  const b=new Uint8Array(buf), dv=new DataView(buf);
  const out={};
  let i=0;
  while(i+4<=b.length){
    const sig=dv.getUint32(i,true);
    if(sig!==0x04034b50)break;                     // no more local headers
    const method=dv.getUint16(i+8,true);
    let csize=dv.getUint32(i+18,true);
    const usize=dv.getUint32(i+22,true);
    const nlen=dv.getUint16(i+26,true), elen=dv.getUint16(i+28,true);
    const name=new TextDecoder().decode(b.subarray(i+30,i+30+nlen));
    const flags=dv.getUint16(i+6,true);
    let start=i+30+nlen+elen;
    if(flags&0x08&&!csize){
      // Sizes live in a trailing descriptor. Excel does not normally do this,
      // and guessing where the entry ends would corrupt it — so say so.
      throw new Error('This .xlsx uses streamed entries this reader cannot follow. Save it again from Excel, or export CSV.');
    }
    const raw=b.subarray(start,start+csize);
    if(method===0)      out[name]=raw;
    else if(method===8) out[name]=await inflateRaw(raw);
    // any other method is left out rather than guessed at
    i=start+csize;
  }
  return out;
}

async function inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const xdec=u8=>new TextDecoder().decode(u8);

/// "BC" → 54. Column letters are base-26 with no zero.
function colIndex(ref){
  const m=/^([A-Z]+)/.exec(ref||''); if(!m)return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}

function xmlUnescape(s){
  return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
          .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d))
          .replace(/&amp;/g,'&');
}

/// Shared strings, in order. Rich text splits a string across several <t>
/// runs, so every run inside one <si> is concatenated.
function parseSharedStrings(xml){
  const out=[];
  const re=/<si>([\s\S]*?)<\/si>/g; let m;
  while((m=re.exec(xml))){
    let s='';
    const tre=/<t[^>]*>([\s\S]*?)<\/t>/g; let t;
    while((t=tre.exec(m[1]))) s+=t[1];
    out.push(xmlUnescape(s));
  }
  return out;
}

/// Excel keeps dates as days since 1899-12-30. A POS export full of serial
/// numbers where the dates should be is unreadable, and worse, plausible.
const XL_EPOCH=Date.UTC(1899,11,30);
function serialToDate(n){
  const ms=XL_EPOCH+Math.round(n*86400000);
  const d=new Date(ms);
  const p=x=>String(x).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}

/// Which style ids are dates. Without this a date column comes through as
/// 45123 and nobody can tell what it was.
function dateStyles(stylesXml){
  const fmts={};
  const nf=/<numFmt[^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g; let m;
  while((m=nf.exec(stylesXml||''))) fmts[m[1]]=m[2];
  const builtinDate=new Set(['14','15','16','17','18','19','20','21','22',
                             '45','46','47','27','30','36','50','57']);
  const cx=/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/.exec(stylesXml||'');
  const out=new Set();
  if(!cx)return out;
  const xfs=cx[1].match(/<xf[^>]*\/?>/g)||[];
  xfs.forEach((xf,i)=>{
    const id=(/numFmtId="(\d+)"/.exec(xf)||[])[1];
    if(id===undefined)return;
    const code=fmts[id];
    if(builtinDate.has(id)||(code&&/[ymd]/i.test(code)&&!/[#0]/.test(code.replace(/\[[^\]]*\]/g,''))))
      out.add(String(i));
  });
  return out;
}

/// One worksheet → rows of strings, exactly the shape parseDelimited returns.
function parseSheet(xml,shared,dstyles){
  const rows=[];
  const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let r;
  while((r=rowRe.exec(xml))){
    const cells=[];
    const cRe=/<c([^>]*)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
    while((c=cRe.exec(r[1]))){
      const attr=c[1]||'', inner=c[2]||'';
      const ref=(/r="([A-Z]+\d+)"/.exec(attr)||[])[1]||'';
      const type=(/t="([^"]+)"/.exec(attr)||[])[1]||'n';
      const style=(/s="(\d+)"/.exec(attr)||[])[1];
      let v='';
      if(type==='inlineStr'){
        const tre=/<t[^>]*>([\s\S]*?)<\/t>/g; let t;
        while((t=tre.exec(inner))) v+=t[1];
        v=xmlUnescape(v);
      }else{
        const vm=/<v[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        const raw=vm?xmlUnescape(vm[1]):'';
        if(type==='s')       v=shared[+raw]!==undefined?shared[+raw]:'';
        else if(type==='b')  v=raw==='1'?'TRUE':'FALSE';
        else if(type==='e')  v='';                    // #REF!, #N/A — not data
        else if(raw!==''&&dstyles.has(String(style))&&isFinite(+raw)) v=serialToDate(+raw);
        else                 v=raw;
      }
      const idx=ref?colIndex(ref):cells.length;
      while(cells.length<idx)cells.push('');          // gaps are real
      cells[idx]=v;
    }
    rows.push(cells);
  }
  // Trim trailing all-empty rows — Excel files are full of them.
  while(rows.length&&rows[rows.length-1].every(c=>c===''))rows.pop();
  return rows;
}

/// The whole job: a File → {rows, sheet, sheets}.
async function readXlsx(buf){
  let files;
  try{ files=await unzip(buf); }
  catch(e){ throw new Error(e.message||'That .xlsx could not be opened.'); }
  if(!Object.keys(files).some(n=>/^xl\//.test(n)))
    throw new Error('That file is a zip, but not an Excel workbook.');
  const shared=files['xl/sharedStrings.xml']?parseSharedStrings(xdec(files['xl/sharedStrings.xml'])):[];
  const dstyles=files['xl/styles.xml']?dateStyles(xdec(files['xl/styles.xml'])):new Set();

  const names=[];
  if(files['xl/workbook.xml']){
    const wx=xdec(files['xl/workbook.xml']);
    const re=/<sheet[^>]*name="([^"]*)"/g; let m;
    while((m=re.exec(wx)))names.push(xmlUnescape(m[1]));
  }
  const sheetFiles=Object.keys(files)
    .filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a,b)=>(+a.match(/(\d+)/)[1])-(+b.match(/(\d+)/)[1]));
  if(!sheetFiles.length)throw new Error('That workbook has no worksheets.');

  // The first sheet with more than a title on it. A POS export often opens
  // with a cover page, and silently reading that would give two useless rows
  // and the impression the file was empty.
  let best=null,bestI=0;
  sheetFiles.forEach((f,i)=>{
    const rows=parseSheet(xdec(files[f]),shared,dstyles);
    const filled=rows.filter(r=>r.some(c=>String(c).trim()!=='')).length;
    if(!best||filled>best.filled){best={rows,filled};bestI=i;}
  });
  if(!best||best.filled<2)
    throw new Error('That workbook has no sheet with data on it.');
  return {rows:best.rows,sheet:names[bestI]||('sheet '+(bestI+1)),sheets:names};
}

async function stageXlsx(f,kind){
  try{
    const {rows,sheet}=await readXlsx(await f.arrayBuffer());
    if(rows.length<2)throw new Error('That sheet has only one row.');
    const hi=sniffHeader(rows);
    STAGE={kind,headers:rows[hi],rows:rows.slice(hi+1),
           map:autoMap(rows[hi],kind),headerRow:hi,fromSheet:sheet};
    view='import'; R();
  }catch(e){
    FILEFAIL={file:f.name,short:'That Excel file could not be read.',why:e.message,
      reason:'xlsx',canVision:false};
    view='import'; R();
  }
}

/// Is this a picture rather than a spreadsheet?
///
/// Checked by MIME first and extension second, because Android's file picker
/// reports a type for camera output but a Windows drag-and-drop sometimes does
/// not.
function isImageFile(f){
  if(/^image\//.test(f.type||''))return true;
  return /\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$/i.test(f.name||'');
}

function stageFile(inp,kind){
  const f=inp.files[0]; if(!f)return;
  if(/\.pdf$/i.test(f.name)){ stagePDF(f,kind); return; }
  if(/\.xlsx$/i.test(f.name)){ stageXlsx(f,kind); return; }
  if(/\.xls$/i.test(f.name)){
    FILEFAIL={file:f.name,short:'That is the old Excel format (.xls), which this cannot read.',
      why:'Open it in Excel and use File → Save As → Excel Workbook (.xlsx), or CSV. '+
          'The old binary format is genuinely different and guessing at it would '+
          'produce numbers nobody could trace.',reason:'xls',canVision:false};
    view='import'; R(); return;
  }

  // A photo handed to the CSV importer used to be read as text, which turns
  // JPEG bytes into columns of mojibake and then offers them to you as things
  // to map. That is worse than an error: it looks like the file was read and
  // the header row was simply strange, so the natural next move is to squint
  // and try to pick the right column out of the noise.
  if(isImageFile(f)){
    inp.value='';
    if(PHOTO_KINDS[kind]){ addShots({files:[f],value:''},kind); return; }
    FILEFAIL={file:f.name,short:'That is a picture, and this import needs a file of rows.',
      why:'Photographs can be read for supplier invoices and for menus, but not for '+
          'this import — it comes off a device or a till as a proper export, and '+
          'photographing a screen is a worse route to a file you can already download.',
      reason:'image',canVision:false};
    view='import'; R(); return;
  }

  const fr=new FileReader();
  fr.onload=e=>{
    const txt=e.target.result;
    // Second net, for everything the extension check cannot see: a .csv that
    // is really a zip, an .xlsx renamed, a download that failed halfway.
    if(!looksLikeText(txt)){
      FILEFAIL={file:f.name,short:'That file is not text, so it has no columns to read.',
        why:'Opening it produced bytes rather than words — it is most likely an image, '+
            'an Excel .xlsx, or a compressed file with a .csv name.\n\n'+
            'If it is a spreadsheet, open it and use File → Save As → CSV. '+
            'If it is a photograph of paper, use the Photograph button instead.',
        reason:'binary',canVision:false};
      view='import'; R(); return;
    }
    const {rows}=parseDelimited(txt);
    if(rows.length<2){
      FILEFAIL={file:f.name,short:'That file has no readable rows.',
        why:'Only one line came out of it. If it is a spreadsheet, re-save it as CSV.',
        reason:'norows',canVision:false};
      view='import'; R(); return;
    }
    const hi=sniffHeader(rows);
    STAGE={kind,headers:rows[hi],rows:rows.slice(hi+1),
           map:autoMap(rows[hi],kind),headerRow:hi};
    view='import'; R();
  };
  fr.readAsText(f);
}
/// PDFs skip the column mapper — there are no columns — and land straight in
/// the same review table as everything else.
let LASTPDF=null;
async function stagePDF(f,kind){
  const R2=R;                      // R is shadowed below by the render result
  const buf=await f.arrayBuffer();
  LASTPDF={name:f.name,buf};
  let r;
  try{ r=await pdfText(buf); }
  catch(e){ alert('That PDF could not be read: '+e.message); return; }
  if(r.encrypted){
    alert('That PDF is password-protected, so its text cannot be read.\n\n'+
          'Re-save it without a password, or export the menu as CSV instead.');
    return;
  }
  if(!r.text.trim()){
    const whyShort = r.reason==='outlines'
      ? 'The text was converted to outlines when this menu was exported.'
      : r.reason==='scanned'
      ? 'This PDF is images — a scan or photographs of pages.'
      : 'No readable text was found in this PDF.';
    const why = r.reason==='outlines'
      ? 'The text in this menu was converted to outlines — the letters are '+
        'drawings of letter shapes, not letters. Design tools do this on export '+
        'so fonts do not have to travel with the file.\n\n'+
        'Nothing can read it as text, including this console. Ask whoever made '+
        'the menu to export again with "convert text to outlines" turned off, '+
        'or send the POS product list instead — it is better anyway, because it '+
        'carries the item codes.'
      : r.reason==='scanned'
      ? 'This PDF is images — a scan or photographs of pages. There are pictures '+
        'of letters in it, but no letters.\n\n'+
        'If you have the original file, exporting it as a PDF from the design '+
        'tool rather than scanning a printout will work.'
      : 'No readable text was found in that PDF.';
    if(!aiReady()){
      FILEFAIL={file:f.name,short:whyShort,why,reason:r.reason,
        pages:r.images||0,canVision:true};
      view='import'; R2();
      return;
    }
    // Nothing to parse, but there is something to look at.
    if(!confirm('Read the pages as images instead?\n\n'+
      'Each page is sent to '+AI_PROVIDERS[DATA.ai.provider].label+
      ' and costs a little. Up to '+PDF_MAX_PAGES+' pages.')){
      FILEFAIL={file:f.name,short:whyShort,why,reason:r.reason,
        pages:r.images||0,canVision:true,declined:true};
      view='import'; R2(); return;
    }
    FILEFAIL=null;
    let rows2;
    try{
      // Claude reads the file directly. Only fall back to rendering pages when
      // the provider cannot, which today means OpenAI.
      if(DATA.ai.provider==='anthropic'){
        const el5=document.getElementById('app');
        if(el5)el5.innerHTML='<div class="card"><h3>Reading the menu…</h3>'+
          '<div class="muted">Sending '+(buf.byteLength/1048576).toFixed(1)+
          ' MB to Claude, which reads each page as a picture. A few seconds.</div></div>';
        const V2=await aiMenuFromPDF(buf,f.name);
        STAGE={kind:'products',headers:['Item','Price','Category'],
          rows:V2.rows.map(x=>[x.name,x.price,x.cat]),
          map:{name:0,price:1,cat:2},headerRow:0,fromPDF:f.name,
          pdfPages:0,how:'Claude reading the PDF'};
        FILEFAIL=null; view='import'; R2();
        return;
      }
      const R=await pdfPageImages(buf,(i,n)=>{
        const el2=document.getElementById('app');
        if(el2)el2.innerHTML='<div class="card"><h3>Reading page '+i+' of '+n+'…</h3>'+
          '<div class="muted">Rendering the menu so it can be read as a picture.</div></div>';
      });
      const el3=document.getElementById('app');
      if(el3)el3.innerHTML='<div class="card"><h3>Reading '+R.rendered+' page(s)…</h3>'+
        '<div class="muted">About '+Math.round(R.bytes/1024/1.37)+' KB of images, in batches of '+PDF_BATCH+
        '. This takes a few seconds.</div></div>';
      const V=await aiMenuFromImages(R.images,(b,n)=>{
        const el4=document.getElementById('app');
        if(el4)el4.innerHTML='<div class="card"><h3>Reading pages… batch '+b+' of '+n+'</h3>'+
          '<div class="muted">Sent to '+AI_PROVIDERS[DATA.ai.provider].label+'.</div></div>';
      });
      rows2=V.rows;
      if(V.failed.length)setTimeout(()=>alert(
        V.failed.length+' batch(es) could not be read, so some pages are missing:\n\n'+
        V.failed.join('\n')),100);
      STAGE={kind:'products',headers:['Item','Price','Category'],
        rows:rows2.map(x=>[x.name,x.price,x.cat]),
        map:{name:0,price:1,cat:2},headerRow:0,fromPDF:f.name,
        pdfPages:R.rendered,how:AI_PROVIDERS[DATA.ai.provider].label+' vision',
        pdfTotal:R.total};
      view='import'; R2();
    }catch(e){
      // Four paragraphs of diagnosis do not belong in an alert box — it
      // clips, it scrolls, and there is nothing to click. Same lesson as the
      // PDF failure panel.
      FILEFAIL={file:f.name,short:'That menu could not be read.',why:e.message,
        reason:isNetFail(e)?'network':'vision',canVision:false};
      view='import'; R2();
    }
    return;
  }
  // Deterministic first — it is free, instant and works offline. AI is the
  // upgrade path for the messy half, and it is allowed to REPLACE the result
  // only if it produces more than the regex did.
  let rows=parseMenuText(r.text), how='pattern matching';
  if(aiReady()){
    try{
      const ai=await aiMenuFromText(r.text);
      if(ai.length>=rows.length){ rows=ai; how=AI_PROVIDERS[DATA.ai.provider].label; }
    }catch(e){
      if(!rows.length){ alert('AI extraction failed: '+e.message+
        '\n\nNothing was read from this PDF by pattern matching either.'); return; }
    }
  }
  if(!rows.length){
    alert('Text was read from that PDF, but no priced lines were found.\n\n'+
          'A line has to look like a name followed by a price.');
    return;
  }
  // Present it through the ordinary mapper so the review step is identical.
  STAGE={kind:'products',headers:['Item','Price','Category'],
    rows:rows.map(x=>[x.name,x.price,x.cat]),
    map:{name:0,price:1,cat:2},headerRow:0,fromPDF:f.name,pdfPages:r.pages,how};
  view='import'; R();
}
/// Retry the remembered PDF through the vision path, once a key is in.
async function retryWithVision(){
  if(!LASTPDF){alert('Choose the file again.');return}
  if(!aiReady()){alert('Set a provider and API key first, just above.');return}
  await stagePDF({name:LASTPDF.name,arrayBuffer:async()=>LASTPDF.buf},'products');
}
function stageMap(field,col){ STAGE.map[field]=col===''?undefined:+col; R(); }

/// Delete an ingredient — but never one a recipe is standing on.
///
/// Adding a whole catalogue category is one click, so deleting has to be easy
/// too. What must not be easy is deleting something twelve recipes use: those
/// recipes would keep their line, the line would resolve to nothing, and every
/// dish involved would quietly get cheaper. A cost that falls for no reason is
/// the hardest kind of error to notice, because it looks like good news.
///
/// So: an unused ingredient goes on confirmation. A used one is refused, and
/// says where it is used so the recipes can be fixed first.
function ingUsedBy(code){
  const out=[];
  for(const m of (DATA.menu||[]))
    if((m.lines||[]).some(l=>codeOf(l.ref)===code))out.push(m.name||'(unnamed dish)');
  for(const b of (DATA.batch||[]))
    if((b.lines||[]).some(l=>codeOf(l.ref)===code))out.push('▣ '+(b.name||'(unnamed batch)'));
  return out;
}
function delIng(i){
  const x=(DATA.ingredients||[])[i]; if(!x)return;
  const used=ingUsedBy(x.code);
  if(used.length){
    alert(`"${x.name}" is used by ${used.length} recipe(s):\n\n`+
      used.slice(0,12).join('\n')+(used.length>12?`\n…and ${used.length-12} more`:'')+
      `\n\nRemove it from those first. Deleting it now would leave them costing less than they do.`);
    return;
  }
  if(!confirm(`Delete "${x.name}"? Nothing uses it.`))return;
  snapshot();
  edit(()=>{DATA.ingredients.splice(i,1)});
  rebuildIX(); R();
}

/// Bulk tidy for the commonest mess: a catalogue category added by mistake.
function delUnusedUnpriced(){
  const list=(DATA.ingredients||[]);
  const doomed=list.filter(x=>!(x.price>0)&&!ingUsedBy(x.code).length);
  if(!doomed.length){ alert('Nothing to remove — every ingredient is either priced or used by a recipe.'); return; }
  if(!confirm(`Remove ${doomed.length} ingredient(s) that have no price and are not used by any recipe?\n\n`+
    doomed.slice(0,15).map(x=>'· '+x.name).join('\n')+(doomed.length>15?`\n…and ${doomed.length-15} more`:'')))return;
  snapshot();
  edit(()=>{DATA.ingredients=list.filter(x=>(x.price>0)||ingUsedBy(x.code).length)});
  rebuildIX(); R();
}

function stageCancel(){ STAGE=null; R(); }

/// Turn staged rows into typed records, dropping anything unusable and saying
/// how many were dropped rather than quietly shrinking the count.
function stagePreview(){
  if(!STAGE)return null;
  const {kind,rows,map}=STAGE, spec=IMPORT_KINDS[kind];
  const missing=spec.fields.filter(f=>f.req&&map[f.k]===undefined).map(f=>f.label);
  const get=(r,k)=>map[k]===undefined?'':String(r[map[k]]??'').trim();
  const out=[],skipped=[];
  for(const r of rows){
    if(kind==='products'){
      const name=get(r,'name'), price=_num(get(r,'price'));
      if(!name||price===null){skipped.push(name||'(blank)');continue}
      out.push({name,price,code:get(r,'code'),cat:get(r,'cat')});
    } else if(kind==='purchases'){
      const supplier=get(r,'supplier'), total=_num(get(r,'total'));
      if(!supplier||total===null){skipped.push(supplier||'(blank)');continue}
      out.push({supplier,total,date:_date(get(r,'date')),item:get(r,'item'),
                qty:_num(get(r,'qty')),unit:_num(get(r,'unit')),cat:get(r,'cat')});
    } else if(kind==='itemsales'){
      const name=get(r,'name'), qty=_num(get(r,'qty'));
      if(!name||qty===null){skipped.push(name||'(blank)');continue}
      out.push({name,qty,total:_num(get(r,'total')),code:get(r,'code'),cat:get(r,'cat')});
    } else if(kind==='punches'){
      const emp=get(r,'emp'), at=_stamp(get(r,'stamp'));
      if(!emp||!at){skipped.push(emp||get(r,'stamp')||'(blank)');continue}
      out.push({emp,at,dir:_dir(get(r,'dir')),name:get(r,'name')||''});
    } else {
      const date=_date(get(r,'date')), sales=_num(get(r,'sales'));
      if(!date||sales===null){skipped.push(get(r,'date')||'(blank)');continue}
      out.push({date,sales,covers:_num(get(r,'covers'))});
    }
  }
  return {rows:out,skipped,missing,spec};
}


// ── RECIPE SHEETS ───────────────────────────────────────────────────────
//
// Chefs do not fill in web forms. They will mark up a piece of paper on the
// pass between services, and they will do it in minutes if the paper is
// already mostly right.
//
// ── Two design rules, and the second one is the whole trick ─────────────
//
// 1. NEVER BLANK. A dish that already has a recipe prints WITH its quantities
//    so the chef corrects rather than authors. Correcting is a fraction of the
//    effort and it reads as expertise rather than admin. A dish with no recipe
//    prints with the venue's own ingredient list down the side, so the chef is
//    choosing from a list instead of inventing spellings that will never match.
//
// 2. DESIGNED FOR THE SCANNER, NOT JUST THE CHEF. Because the system generates
//    the sheet, it controls the layout — which turns "OCR an arbitrary
//    document" into "read digits from boxes at known positions". Ingredient
//    names and units are PRE-PRINTED; the chef writes only numbers. Every row
//    carries a stable id, and the sheet carries a form id, so a scan maps back
//    to exact records rather than being re-matched by fuzzy name.
//
//    This is the same discipline as every other import here: make the machine's
//    job easy at the point of capture, rather than clever afterwards.
//
// Sheets are ordered by revenue, because that is the order the effort is worth
// spending in — the top twenty dishes were 43% of revenue on the first real
// book, while 114 costed items had never sold at all.

/// Dishes worth chasing, most valuable first. `needsRecipe` first, then the
/// ones worth verifying.
function sheetQueue(){
  const rows=(DATA.menu||[]).map(m=>{
    const lines=(m.lines||[]).length;
    const weekly=(m.weeklySales||0)*netPrice(m);
    return {m,lines,weekly,has:lines>0};
  }).filter(r=>r.m.name);
  rows.sort((a,b)=>(a.has===b.has? b.weekly-a.weekly : (a.has?1:-1)));
  return rows;
}

/// The reference list printed down the side of a blank sheet: what this venue
/// actually buys, so a chef picks a real name instead of inventing one.
function sheetPantry(dept){
  return (DATA.ingredients||[])
    .filter(i=>i.name && (!dept||dept==='all'||deptOf(i)===dept))
    .sort((a,b)=>String(a.category||'').localeCompare(String(b.category||''))
              || String(a.name).localeCompare(String(b.name)))
    .slice(0,90);
}

const _fid=m=>'RS-'+String(m.id).replace(/[^A-Za-z0-9]/g,'').slice(-6).toUpperCase();

/// Build the printable sheet. Returns HTML for a new window — deliberately not
/// styled like the console, because this is going on paper under a heat lamp.
function recipeSheetHTML(ids){
  const list=sheetQueue().filter(r=>ids.includes(String(r.m.id)));
  const pantry=sheetPantry();
  const cat={};
  for(const i of pantry)(cat[i.category||'Other']=cat[i.category||'Other']||[]).push(i);
  // ── THE DESIGN RULE: THE CHEF WRITES NUMBERS AND NOTHING ELSE ────────
  //
  // The first version had blank rows where a chef wrote the ingredient name
  // by hand. That is the hardest possible thing to read back — handwritten
  // words, in a kitchen, from twenty different hands — and it is the step
  // that decides whether a photographed sheet is usable or a re-typing job.
  //
  // Every ingredient already has a CODE. So the chef writes a code and a
  // number. Digits are the most reliable handwriting there is, a wrong digit
  // fails loudly (no such code) rather than quietly, and the pantry list
  // prints ONCE and goes on the wall instead of down the side of every sheet.
  //
  // Units are ticked, not written, for the same reason.
  //
  // The other half is corrections. A dish that already has a recipe prints
  // with its numbers filled in, because crossing out one wrong number is a
  // fraction of the work of authoring twelve right ones — and it asks the
  // chef to be an expert rather than a data-entry clerk.
  const page=r=>{
    const m=r.m, fid=_fid(m);
    const known=(m.lines||[]).map((l,li)=>{
      const ing=IX[codeOf(l.ref)]; const bat=isB(l.ref)?BX[l.ref]:null;
      return {code: bat?'B'+String(l.ref).replace(/\D/g,'').slice(-3):(ing?ing.code:''),
        name: bat?('▣ '+(bat.name||'')):(ing?ing.name:String(l.ref)),
        unit: bat?(bat.yieldUnit||''):(ing?ing.recipeUnit:''),
        qty: l.qty};
    });
    const blanks=Math.max(6, 18-known.length);
    const dbox=n=>Array.from({length:n},()=>'<span class="d"></span>').join('');
    return `<section class="sheet">
      <div class="reg tl"></div><div class="reg tr"></div><div class="reg bl"></div>
      <div class="hd">
        <div><h1>${m.name||''}</h1>
          <div class="sub">${m.group||''}${m.menuPrice?' · sells for '+(+m.menuPrice).toFixed(3):''}${
            m.weeklySales?' · about '+(+m.weeklySales).toFixed(0)+' sold a week':''}</div></div>
        <div class="fid"><b>${fid}</b><div>form id — do not change</div></div>
      </div>

      <div class="one">Write what goes into <b>ONE PORTION</b> — the plate that leaves the kitchen.</div>

      <p class="ask">${known.length
        ? '<b>These are the numbers we have now.</b> If one is wrong, cross it out and write the right number in the empty box beside it. Leave the rest alone. Add anything missing at the bottom using its code from the pantry list.'
        : '<b>Nothing is recorded for this dish yet.</b> For each ingredient: copy its <b>code</b> from the pantry list on the wall, then write how much goes in one portion. Codes are numbers — no names to write.'}</p>

      ${known.length?`<table class="known">
        <tr><th class="n">#</th><th class="c">Code</th><th>Ingredient</th>
            <th class="was">We have</th><th class="q">If wrong, write it here</th><th class="u">Unit</th></tr>
        ${known.map((k,i)=>`<tr>
          <td class="n">${i+1}</td>
          <td class="c mono">${k.code||''}</td>
          <td class="pre">${k.name}</td>
          <td class="was"><span class="wasv">${k.qty}</span></td>
          <td class="q">${dbox(4)}</td>
          <td class="u">${k.unit||''}</td></tr>`).join('')}
      </table>`:''}

      <table class="blankrows">
        <tr><th class="n">#</th><th class="c">Ingredient code</th><th class="q">How much in one portion</th>
            <th class="ut">Unit — tick one</th></tr>
        ${Array.from({length:blanks},(_,i)=>`<tr>
          <td class="n">${known.length+i+1}</td>
          <td class="c">${dbox(3)}</td>
          <td class="q">${dbox(4)}</td>
          <td class="ut"><span class="tick"></span>g <span class="tick"></span>ml <span class="tick"></span>each</td>
        </tr>`).join('')}
      </table>

      <div class="foot">
        <div>This recipe makes <span class="fbox">${dbox(2)}</span> portion(s)</div>
        <div>Chef <span class="line"></span></div>
        <div>Date <span class="line"></span></div>
      </div>
      <div class="tip">Photograph this page flat, in good light, with all four edges showing.</div>
    </section>`;
  };
  return `<!doctype html><html><head><meta charset="utf-8"><title>Recipe sheets</title>
<style>
*{box-sizing:border-box}
body{font:11pt/1.35 "Helvetica Neue",Arial,sans-serif;color:#000;margin:0;background:#fff}
.sheet{position:relative;padding:14mm 12mm;page-break-after:always;min-height:277mm}
/* Corner marks. A scanner or a vision model uses them to work out how the
   page is rotated and how much it is skewed — free accuracy for three squares. */
.reg{position:absolute;width:7mm;height:7mm;background:#000}
.reg.tl{top:6mm;left:6mm}.reg.tr{top:6mm;right:6mm}.reg.bl{bottom:6mm;left:6mm}
.hd{display:flex;align-items:flex-start;gap:12px;border-bottom:2.5px solid #000;padding-bottom:6px}
h1{font-size:23pt;margin:0;line-height:1.1;letter-spacing:-.3px}
.sub{font-size:9.5pt;color:#444;margin-top:3px}
.fid{margin-left:auto;text-align:right;font:700 15pt/1 "Courier New",monospace;
     border:2px solid #000;padding:5px 8px;white-space:nowrap}
.fid div{font:400 6.5pt/1.2 Arial;letter-spacing:.4px;margin-top:3px;color:#444}
.one{margin:9px 0 0;padding:6px 9px;background:#000;color:#fff;font-size:12pt;letter-spacing:.2px}
.ask{font-size:10pt;margin:8px 0 10px;line-height:1.45}
table{width:100%;border-collapse:collapse;margin-bottom:9px}
th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.6px;text-align:left;
   padding:3px 4px;border-bottom:1.5px solid #000;color:#000}

.n{width:8mm;text-align:center;font-size:9pt;color:#666}
.c{width:26mm}.q{width:34mm}.u{width:16mm;font-size:9pt}
.ut{width:44mm;font-size:9.5pt}
.was{width:20mm}.wasv{font:700 13pt/1 Arial;padding-left:3px}
.pre{font-size:11.5pt;font-weight:600;padding-left:3px}
.mono{font:700 12pt "Courier New",monospace;padding-left:3px}
/* One digit per box. Separated boxes are read far more reliably than a
   single long field, because the reader never has to guess where one
   number ends and the next begins. */
.d{display:inline-block;width:7.5mm;height:9mm;border:1.5px solid #000;margin-right:1.6mm;
   background:#fff;border-radius:1px}
.tick{display:inline-block;width:5mm;height:5mm;border:1.5px solid #000;margin:0 2px 0 7px;
      vertical-align:-1px}
.blankrows th{border-top:2.5px solid #000;padding-top:7px}
.known td{background:#fafafa}
.foot{display:flex;gap:14px;align-items:center;margin-top:12px;padding-top:9px;
      border-top:2.5px solid #000;font-size:10pt}
.fbox{display:inline-block;vertical-align:-2px}
.line{display:inline-block;width:38mm;border-bottom:1.5px solid #000;height:8mm}
.tip{margin-top:9px;font-size:8.5pt;color:#555;font-style:italic}
@media print{.sheet{padding:10mm}body{background:#fff}}
</style></head><body>${list.map(page).join('')}</body></html>`;
}

/// The pantry list. Printed ONCE and stuck on the wall, not repeated down the
/// side of every dish sheet — which is what made the old sheet crowded and
/// still left the chef writing names.
function pantrySheetHTML(dept){
  const pantry=sheetPantry(dept);
  const cat={};
  for(const i of pantry)(cat[i.category||'Other']=cat[i.category||'Other']||[]).push(i);
  const cols=Object.keys(cat).sort().map(c=>`
    <div class="cat"><h2>${c}</h2>
    <table>${cat[c].map(i=>`<tr>
      <td class="code">${i.code||''}</td>
      <td class="nm">${i.name}</td>
      <td class="un">${i.recipeUnit||''}</td></tr>`).join('')}</table></div>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>Pantry codes</title>
<style>

body{font:10pt/1.3 "Helvetica Neue",Arial,sans-serif;margin:0;padding:12mm;color:#000}

<div class="lead">Stick this on the wall. On a recipe sheet, write the <b>code</b> — never the name.
A wrong code is caught the moment it is read back; a misread name is not.</div>
<div class="wrap">${cols}</div></body></html>`;
}
function printPantry(dept){
  const w=window.open('','_blank');
  if(!w){alert('Allow pop-ups to print the pantry list.');return}
  w.document.write(pantrySheetHTML(dept)); w.document.close();
}

function printSheets(ids){
  if(!ids||!ids.length){alert('Pick at least one dish.');return}
  const w=window.open('','_blank');
  if(!w){alert('Allow pop-ups to print the sheets.');return}
  w.document.write(recipeSheetHTML(ids));
  w.document.close();
}
let sheetPick={};
function sheetToggle(id){ sheetPick[id]=!sheetPick[id]; R(); }
function sheetTop(n){
  sheetPick={};
  sheetQueue().filter(r=>!r.has).slice(0,n).forEach(r=>sheetPick[r.m.id]=true);
  R();
}
function sheetPrintPicked(){ printSheets(Object.keys(sheetPick).filter(k=>sheetPick[k])); }
/// One file, the whole menu. A folder of print windows is a chore; a single
/// downloadable document is a thing you email to the kitchen or print in one
/// go. Uncosted dishes first, because those are the ones that need filling.
function downloadAllRecipeSheets(){
  const q=sheetQueue().slice()
    .sort((a,b)=>(a.has?1:0)-(b.has?1:0) || (b.weekly||0)-(a.weekly||0))
    .map(r=>String(r.m.id));
  if(!q.length){ toast('Add your menu first — there are no dishes to make sheets for.',{kind:'warn'}); return; }
  try{
    const html=recipeSheetHTML(q);
    const name=((DATA.setup&&DATA.setup.name)?DATA.setup.name.replace(/[^\w]+/g,'-')+'-':'')+
      'recipe-sheets-'+new Date().toISOString().slice(0,10)+'.html';
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
    toast(`Saved one file with ${q.length} recipe sheet(s) — open it and print, or email it to the kitchen.`);
  }catch(e){ toast('Could not build the sheets: '+e.message,{kind:'bad'}); }
}
/// Still available from the Recipe sheets screen for printing a selection.
function printTopRecipeSheets(){ downloadAllRecipeSheets(); }

// CHARTS
//
// Drawn as inline SVG from the data. No chart library, deliberately: the one
// time this file reached for a CDN it failed on a local page and told the
// user his internet was down while he was plainly online. A drawing routine
// that cannot fail to load is worth more than one with nicer defaults.
//
// The donut uses stroke-dasharray on circles rather than arc paths. Arc paths
// need large-arc flags and sweep directions and go wrong silently at exactly
// 50% and 100%; a dash offset is arithmetic anyone can check.
//
// Every helper below is pure and returns a string, so the geometry is tested
// without a browser.
// ════════════════════════════════════════════════════════════════════════

const CHART_COLORS=['#ffc862','#7fd1a4','#7fb3d1','#d18f7f','#b39ddb','#d1c67f','#8fa8a0'];

/// Share of a whole, as a ring. `segs` is [{label,value,color?}].
function svgDonut(segs,size,thick){
  const S=size||160, T=thick||22, R=(S-T)/2, C=2*Math.PI*R, cx=S/2;
  const vals=(segs||[]).map(s=>Math.max(0,+s.value||0));
  const total=vals.reduce((a,b)=>a+b,0);
  if(!(total>0))
    return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img">
      <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#2a2318" stroke-width="${T}"/>
      <text x="${cx}" y="${cx+4}" text-anchor="middle" fill="#6f6553" font-size="11">no data</text></svg>`;
  let off=0, out='';
  segs.forEach((s,i)=>{
    const v=Math.max(0,+s.value||0); if(!v)return;
    const len=C*(v/total);
    // The FINAL geometry is inline, so a non-animating browser (and the test
    // stub) shows the complete chart. The data-* carry what the reveal needs
    // to draw it on. This is the "degrades to the truth" rule: the animation
    // is decoration over a correct static picture, never a substitute for it.
    out+=`<circle class="donutseg" cx="${cx}" cy="${cx}" r="${R}" fill="none"
      stroke="${s.color||CHART_COLORS[i%CHART_COLORS.length]}" stroke-width="${T}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}"
      data-len="${len.toFixed(2)}" data-c="${C.toFixed(2)}" data-i="${i}"
      transform="rotate(-90 ${cx} ${cx})"><title>${s.label}</title></circle>`;
    off+=len;
  });
  return `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img">
    <circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#2a2318" stroke-width="${T}"/>${out}</svg>`;
}

/// Vertical bars. `rows` is [{label,value}].
function svgBars(rows,w,h){
  const W=w||420, H=h||150, pad=22;
  const vals=(rows||[]).map(r=>Math.max(0,+r.value||0));
  const max=Math.max(0,...vals);
  if(!rows||!rows.length||!(max>0))
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><text x="${W/2}" y="${H/2}"
      text-anchor="middle" fill="#6f6553" font-size="12">no data yet</text></svg>`;
  const bw=(W-pad*2)/rows.length, inner=Math.max(4,bw*0.62);
  let out='';
  rows.forEach((r,i)=>{
    const v=Math.max(0,+r.value||0);
    const bh=Math.max(1,(H-40)*(v/max));
    const x=pad+i*bw+(bw-inner)/2, y=H-24-bh;
    out+=`<rect class="risebar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${inner.toFixed(1)}"
      height="${bh.toFixed(1)}" rx="2" fill="${r.color||'#ffc862'}" opacity="${r.dim?0.4:0.9}"
      style="transform-box:fill-box;transform-origin:bottom;animation:barRise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:${(i*0.05).toFixed(2)}s">
      <title>${r.label}: ${v}</title></rect>
      <text x="${(x+inner/2).toFixed(1)}" y="${H-8}" text-anchor="middle"
      fill="#6f6553" font-size="9">${String(r.label).slice(0,4)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${out}</svg>`;
}

/// Horizontal bars, for things with long names.
function svgHBars(rows,w,rowH){
  const RH=rowH||22, W=w||420;
  if(!rows||!rows.length)
    return `<svg viewBox="0 0 ${W} 40" width="100%" height="40"><text x="${W/2}" y="24"
      text-anchor="middle" fill="#6f6553" font-size="12">no data yet</text></svg>`;
  const max=Math.max(0,...rows.map(r=>Math.max(0,+r.value||0)))||1;
  const labelW=Math.min(160,W*0.42);
  const H=rows.length*RH+6;
  let out='';
  rows.forEach((r,i)=>{
    const v=Math.max(0,+r.value||0);
    const bw=Math.max(1,(W-labelW-70)*(v/max));
    const y=i*RH+4;
    out+=`<text x="0" y="${y+11}" fill="#c9bfa8" font-size="11">${String(r.label).slice(0,26)}</text>
      <rect class="growbar" x="${labelW}" y="${y+2}" width="${bw.toFixed(1)}" height="${RH-8}" rx="2"
        fill="${r.color||'#ffc862'}" opacity=".9"
        style="transform-box:fill-box;transform-origin:left;animation:barGrow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:${(i*0.06).toFixed(2)}s">
        <title>${r.label}: ${v}</title></rect>
      <text x="${(labelW+bw+6).toFixed(1)}" y="${y+11}" fill="#6f6553" font-size="10">${r.note||''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${out}</svg>`;
}

/// A single price line over time.
function svgLine(points,w,h){
  const W=w||300,H=h||60;
  const pts=(points||[]).filter(p=>isFinite(+p));
  if(pts.length<2)return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"></svg>`;
  const min=Math.min(...pts),max=Math.max(...pts),span=(max-min)||1;
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i*(W/(pts.length-1))).toFixed(1)},${(H-4-(H-8)*((p-min)/span)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <path d="${d}" fill="none" stroke="#ffc862" stroke-width="2"/></svg>`;
}

/// Animate a freshly-rendered unlocked report: draw the donut arcs on, count
/// the headline numbers up. Everything it touches already shows its final
/// value in the DOM, so if any of this cannot run the report is simply static
/// and correct — the animation is never load-bearing.
function playUnlocked(){
  if(typeof document==='undefined'||typeof requestAnimationFrame==='undefined')return;
  const root=document.getElementById('app'); if(!root)return;

  // ── ONE PANEL AT A TIME ─────────────────────────────────────────────
  //
  // The report is the sales pitch, so it builds rather than appears. Each
  // top-level block drops in on its own beat, and its charts start the moment
  // it lands — the donut draws, the bars grow, the numbers count up as that
  // panel arrives, not all at once behind a wall of motion.
  //
  // Degrade-to-truth still holds: the ONLY thing JS does is hide-then-reveal.
  // Without JS every block is already visible with its final numbers, so a
  // browser that cannot run this shows the complete, correct report at once.

  // Fire one panel's charts as it appears.
  const playCharts=b=>{
    try{
      b.querySelectorAll('.donutseg').forEach(seg=>{
        if(!seg.animate)return;
        const len=+seg.getAttribute('data-len'), c=+seg.getAttribute('data-c'),
              i=+seg.getAttribute('data-i')||0, off=seg.getAttribute('stroke-dashoffset');
        seg.animate(
          [{strokeDasharray:`0 ${c}`,strokeDashoffset:off},
           {strokeDasharray:`${len} ${c-len}`,strokeDashoffset:off}],
          {duration:1100,delay:i*180,easing:'cubic-bezier(.25,.7,.3,1)',fill:'both'});
      });
    }catch(e){}
    // Restart any bar animations so they grow WHEN the panel lands, not while
    // it was still hidden. Re-applying the same inline animation replays it.
    try{
      b.querySelectorAll('.risebar,.growbar').forEach(el=>{
        const a=el.style.animation; if(!a)return;
        el.style.animation='none'; void el.getBoundingClientRect(); el.style.animation=a;
      });
    }catch(e){}
    // Count this panel's numbers up.
    try{
      b.querySelectorAll('[data-count]').forEach((el,idx)=>{
        const target=parseFloat(el.getAttribute('data-count'));
        if(!isFinite(target))return;
        const suffix=el.getAttribute('data-suffix')||'', dp=+el.getAttribute('data-dp')||0;
        const dur=1200, t0=performance.now(), delay=idx*90;
        const stepf=now=>{
          const p=Math.max(0,Math.min(1,(now-t0-delay)/dur));
          el.textContent=(target*(1-Math.pow(1-p,3))).toFixed(dp)+suffix;
          if(p<1)requestAnimationFrame(stepf); else el.textContent=target.toFixed(dp)+suffix;
        };
        el.textContent='0'+suffix; requestAnimationFrame(stepf);
      });
    }catch(e){}
  };

  try{
    const blocks=[...root.children].filter(b=>b&&b.style);
    blocks.forEach((b,i)=>{
      b.style.opacity='0';
      b.style.transform='translateY(18px)';
      setTimeout(()=>{
        b.style.transition='opacity .7s ease, transform .8s cubic-bezier(.25,.7,.3,1)';
        b.style.opacity='1';
        b.style.transform='none';
        playCharts(b);
      }, 120 + i*380);       // ~380ms between panels — unhurried, one by one
    });
  }catch(e){
    // If anything above failed, never leave the report half-hidden.
    try{ [...root.children].forEach(b=>{if(b&&b.style){b.style.opacity='1';b.style.transform='none';}}); }catch(_){}
  }
}



// ── TIME THE CONSOLE SAVED ──────────────────────────────────────────────
//
// "Streamlined scanning and uploading frees up ~X hours to focus elsewhere."
//
// This is a claim, not a finding, so it is computed from what was actually
// auto-populated and labelled an estimate. Each record the console read from a
// file is a record nobody typed — a per-record minute cost, summed. The rates
// are deliberately conservative (a real person is slower and makes mistakes),
// so the number is a floor, not a boast.
const TYPE_MINUTES={menu:0.5, ingredient:1.5, day:0.4, salesLine:0.25, employee:1.5, invoice:3};
function timeSaved(){
  const menu=(DATA.menu||[]).length;
  const ing=(DATA.ingredients||[]).filter(i=>i.price>0).length;
  const days=(typeof ledgerDates==='function'?ledgerDates().length:0);
  const salesLines=(DATA.menu||[]).filter(m=>(m.weeklySales||0)>0).length;
  const emp=((WK().employees)||[]).filter(e=>(e.hours||[]).some(h=>h>0)).length;
  // Invoices: one "document" of manual entry per distinct supplier+date in the
  // ledger, since that is what a person would have keyed line by line.
  const invSet=new Set(((DATA.ledger&&DATA.ledger.purchases)||[])
    .map(p=>(p.supplier||'')+'|'+(p.date||'')));
  const invoices=invSet.size;
  const parts=[
    {label:'menu items read', n:menu, mins:menu*TYPE_MINUTES.menu},
    {label:'ingredients priced from receipts', n:ing, mins:ing*TYPE_MINUTES.ingredient},
    {label:'invoices read and split', n:invoices, mins:invoices*TYPE_MINUTES.invoice},
    {label:'days of sales imported', n:days, mins:days*TYPE_MINUTES.day},
    {label:'sales figures matched', n:salesLines, mins:salesLines*TYPE_MINUTES.salesLine},
    {label:'staff hours imported', n:emp, mins:emp*TYPE_MINUTES.employee},
  ].filter(p=>p.n>0);
  const mins=Math.round(parts.reduce((s,p)=>s+p.mins,0));
  return {mins, hours:mins/60, parts,
    label: mins<60 ? `${mins} min` : `${(mins/60).toFixed(1)} hr${mins>=120?'s':''}`};
}

/// What the completed steps have actually turned on.
function unlockedNow(){
  const on=[],off=[];
  for(const s of SETUP_STEPS)
    (setupDone(s)?on:off).push({id:s.id,title:s.title.split('—').pop().trim(),unlocks:s.unlocks});
  return {on,off};
}

// THE GUIDED SETUP
//
// "It feels like too much text and it's not streamlined enough."
//
// Correct, and it was my call that made it so. I argued earlier for three
// doors and no wizard, on the grounds that a flow you cannot skip gets
// abandoned at step three with nothing saved. The reasoning was sound and the
// conclusion was wrong for the person who actually has to do this: a manager
// handed a wall of options does not pick the best one, he closes the tab.
//
// So: a wizard, built to avoid the failure that made me distrust wizards.
//
//   NOTHING BLOCKS.        Every step can be skipped, and skipping is on
//                          screen rather than hidden.
//   STEPS COMPLETE THEMSELVES. Done is derived from the DATA, not from having
//                          clicked something. Import a menu any other way and
//                          step one is already ticked when you arrive.
//   IT RESUMES.            Close the laptop at step four and step four is
//                          where it opens.
//   IT ENDS.               There is a last step and a finish, and afterwards
//                          the flow does not reappear uninvited.
//
// The nav is hidden while it runs. Limiting the options IS the feature.
// ════════════════════════════════════════════════════════════════════════

/// Is the guided flow running?
///
/// ── HOW THIS RULE EVOLVED, BECAUSE THE HISTORY IS THE ARGUMENT ─────────
///
/// v1 ended the flow the moment the last step's data arrived, which made the
/// "that's it" screen unreachable — completing the final step dropped you on
/// the dashboard with no acknowledgement you had finished anything.
///
/// v2 ended it when the operator pressed finish, and then never showed it
/// again. That is the standard behaviour and it is wrong here: setup is not
/// one sitting. Somebody uploads a menu on Monday, means to do invoices on
/// Tuesday, and never thinks about it again — because nothing ever asks. The
/// app that knows exactly which four things are missing said nothing about
/// them on eleven consecutive launches.
///
/// v3, this one: OPENING THE APP RESUMES WHATEVER IS OUTSTANDING.
///
/// The distinction that keeps it from being a nag:
///
///   SKIPPED  is a decision. "I don't have attendance sheets." It is
///            remembered forever and never asked about again — until you
///            un-skip it yourself.
///   MISSED   is not a decision. It is a thing you meant to do. It comes back
///            next time you open the app, because that is the only moment you
///            are in a position to do something about it.
///
/// And dismissing lasts for the SESSION, not for good — "skip the whole thing
/// and look around" gets you into the app immediately and does not silently
/// commit you to never being asked again.
let SETUP_DISMISSED=false;
/// Rotate the illustrative examples on a step screen, one at a time. Purely
/// decorative — the first example is always visible without it, so a browser
/// that never runs this loses nothing.
let _exTimer=null,_exI=0;
/// Count the hero money figure up as the break card appears. The per-row
/// stagger is pure CSS (animation-delay), so this only handles the number.
function playBreakHero(){
  if(typeof document==='undefined'||typeof requestAnimationFrame==='undefined')return;
  const el=document.querySelector('.bnum b[data-hero]');
  const tel=document.querySelector('.bnum b[data-htime]');
  if(!el&&!tel)return;
  const money=el?parseFloat(el.getAttribute('data-hero')):null;
  const mins=tel?parseFloat(tel.getAttribute('data-htime')):null;
  // Same easing, same window: money and time climb together as the hero lands.
  const fmtTime=m=>m<60?`${Math.round(m)} min`:`${(m/60).toFixed(1)} hr${m>=120?'s':''}`;
  const dur=1400, t0=performance.now(), start=650;
  if(el)el.textContent='0'; if(tel)tel.textContent=fmtTime(0);
  const step=now=>{
    const p=Math.max(0,Math.min(1,(now-t0-start)/dur));
    const e=1-Math.pow(1-p,3);
    if(el)el.textContent=Math.round((money||0)*e);
    if(tel)tel.textContent=fmtTime((mins||0)*e);
    if(p<1)requestAnimationFrame(step);
    else{ if(el)el.textContent=Math.round(money||0); if(tel)tel.textContent=fmtTime(mins||0); }
  };
  requestAnimationFrame(step);
}
function startExampleRotate(n){
  if(typeof document==='undefined')return;
  if(_exTimer)clearInterval(_exTimer); _exI=0;
  _exTimer=setInterval(()=>{
    const box=document.getElementById('exrot'); if(!box){clearInterval(_exTimer);_exTimer=null;return;}
    const lines=box.querySelectorAll('.exline'); if(lines.length<2)return;
    lines[_exI%lines.length].style.display='none';
    _exI=(_exI+1)%lines.length;
    lines[_exI].style.display='';

}

// ── THE MOMENT AFTER A FILE LANDS ───────────────────────────────────────
//
// Applying an import used to drop you straight onto the next thing, which
// reads as being dumped somewhere — the work vanished and a new demand
// appeared. Nothing acknowledged that anything had happened.
//
// This is the one moment in the whole setup where the person has just paid a
// cost and not yet seen a return, so it is the moment worth spending on: what
// arrived, what it switched on, and how far the book moved.
//
// The numbers here are real. The bar is the actual trust score, the counts are
// counted, and the unlocked lines are the same ones the step promised. A
// celebration screen built on invented numbers is worse than none, because it
// is the first thing a new customer learns not to believe.
let CELEBRATE=null;

function celebrateStep(stepId,before){
  const s=SETUP_STEPS.find(x=>x.id===stepId); if(!s)return;
  CELEBRATE={id:stepId,at:Date.now(),
    from:Math.round((before&&before.trust||0)*100),
    to:Math.round(trustScore()*100),
    countBefore:before&&before.count||'',
    unlocks:s.unlocks, title:s.title, count:(()=>{try{return s.count()}catch(e){return ''}})()};
  SETUP_DISMISSED=false; view='today';
}
function celebrateDone(){ CELEBRATE=null; view='today'; R(); }


/// The teaser shown the moment the sales report lands: which handful of dishes
/// carry the money, and how many never sell. Seeing this before the harder
/// steps is what makes them worth doing — it turns "more admin" into "show me
/// the rest of THIS".
function salesTeaser(){
  const menu=(DATA.menu||[]).filter(m=>m.menuPrice>0);
  const sold=menu.filter(m=>(m.weeklySales||0)>0);
  if(!sold.length)return null;
  const rev=m=>(m.weeklySales||0)*(netPrice(m)||m.menuPrice||0);
  const total=sold.reduce((s,m)=>s+rev(m),0);
  const top=sold.slice().sort((a,b)=>rev(b)-rev(a)).slice(0,5)
    .map(m=>({name:m.name,rev:rev(m),share:total?rev(m)/total:0}));
  const topShare=top.reduce((s,t)=>s+t.share,0);
  const dead=menu.filter(m=>!(m.weeklySales>0));
  return {top,topShare,dead:dead.length,menu:menu.length,
    deadNames:dead.slice(0,6).map(m=>m.name)};
}

}

// ── FORMAT ──────────────────────────────────────────────────────────────
//
// Wipe everything and start from the welcome screen. Built for running the
// whole setup end to end repeatedly, which is the only way to find out what
// the first ten minutes actually feel like.
//
// Three properties, because this is the one button that can destroy a
// customer's year of work:
//
//   IT OFFERS A BACKUP FIRST. Not a warning about backups — an actual file,
//     written before anything is deleted.
//   IT CANNOT BE CLICKED BY ACCIDENT. A confirm() dialog is one stray Enter
//     key. Typing the word is deliberate in a way that pressing OK is not.
//   IT CLEARS EVERYTHING, including the places people forget: the document
//     store in IndexedDB, the saved API key, and the ledger. A "reset" that
//     leaves invoice photos behind is not a reset.
async function formatEverything(word,opts){
  // The API key is KEPT by default, because formatting is mostly a testing
  // action and re-pasting a key forty times is friction with no safety value.
  //
  // But that makes the word "format" a small lie, and this is exactly the
  // button someone would press before handing a laptop to somebody else. So
  // the key surviving is stated on screen, in the confirm prompt, and in the
  // message afterwards — and there is a separate action that takes it too.
  const keepKey = !opts || opts.keepKey!==false;
  if(String(word||'').trim().toUpperCase()!=='FORMAT'){
    alert('Type FORMAT to confirm. Nothing has been deleted.');
    return false;
  }
  const anything=(DATA.menu||[]).length||(DATA.ingredients||[]).length||ledgerDates().length;
  if(anything && confirm('Download a backup first? Strongly recommended — this cannot be undone.'))
    backupDownload();

  // Every durable key, emptied in place. Reassigning DATA would leave every
  // closure in this file pointing at the old object. Shared template so a
  // fresh venue and a formatted book are identical.
  const EMPTY=BLANK_BOOK;
  for(const k of Object.keys(EMPTY)) DATA[k]=JSON.parse(JSON.stringify(EMPTY[k]));
  const prevAI=DATA.ai||{};
  DATA.ai = keepKey
    ? {provider:prevAI.provider||'',key:prevAI.key||'',enabled:!!prevAI.enabled,
       remember:!!prevAI.remember, lastUsed:0,calls:0,ledger:[],auth:[],limits:prevAI.limits}
    : {provider:'',key:'',enabled:false,lastUsed:0,calls:0,ledger:[],auth:[],remember:false};
  delete DATA._lastBackup; delete DATA._lastSaved;

  // Browser storage, including the parts that are not in DATA at all.
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ if(typeof indexedDB!=='undefined'&&indexedDB.deleteDatabase)indexedDB.deleteDatabase(DOCDB); }catch(e){}
  DOC_DIR=null; BACKUP_DIR=null;

  // In-memory state that would otherwise outlive the wipe.
  STAGE=null; INVBATCH=null; CATPROP=null; RESEARCH=null; RECIPEREAD=[];
  SHOTS=[]; SHOTKIND=null; FILEFAIL=null; SAVEFAIL=null; UNDO.length=0;
  SETUP_DISMISSED=false;
  rebuildIX(); rebuildBX(); saveNow();
  view='today'; R();
  if(keepKey&&DATA.ai.key)
    alert('Formatted. Your API key was kept — everything else is gone.\n\n'+
          'If you are passing this machine to someone else, use "Format including the API key" in Settings.');
  return true;
}
function formatPrompt(keepKey){
  const keep = keepKey!==false;
  const w=prompt('This deletes everything in this console — menu, recipes, prices, '+
    'every day of history, and stored invoice photos.\n\n'+
    (keep
      ? 'Your API key is KEPT, so you can run setup again without pasting it.'
      : 'Your API key is DELETED too.')+
    '\n\nType FORMAT to confirm.');
  if(w===null)return;
  formatEverything(w,{keepKey:keep});
}

/// Guard every write path while the demo is loaded.
///
/// Found by walking the most likely first session: a manager picks "Look
/// around first" because it is the lowest-risk door, then uploads his real
/// product list — and ends up with two real dishes sitting among fourteen
/// invented ones, with a food cost built from both. He would have no reason to
/// suspect it; the demo banner is at the top of the page and the damage is in
/// the numbers.
///
/// So the demo is not merely labelled, it is WRITE-BLOCKED. Anything that would
/// mix real data into it stops and offers to clear first. Refusing at the write
/// point rather than only in the UI means a path I did not anticipate is
/// blocked too.
function demoBlocks(what){
  if(!DATA.isDemo)return false;
  const ok=confirm(
    'You are looking at the demo venue.\n\n'+
    (what||'Importing')+' now would mix your real numbers in with invented ones, '+
    'and every cost figure would be built from both.\n\n'+
    'Clear the demo first and start with an empty console?');
