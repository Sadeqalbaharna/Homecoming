<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoard</title>
<style>
:root{--bg:#0d0a07;--panel:#130e08;--line:#2e2415;--gold:#ffe7b0;--amber:#ffc862;
--txt:#efe6d6;--dim:#9c8f7a;--good:#7ee787;--warn:#ffc862;--bad:#ff6b6b;
/* LEDGERLIGHT tokens — the break screen's language, made app-wide:
   an ink-deep card, a hairline dotted leader, and a serif for every
   display figure so numbers read like a ledger, not a form. */
--card:#100b07;--ink:#0b0805;--dot:#3a2e1a;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;
background:linear-gradient(180deg,#140f08,#0b0805);position:sticky;top:0;z-index:10}
h1{font-size:16px;margin:0;color:var(--gold);letter-spacing:.5px}
/* ── Left sidebar navigation ─────────────────────────────────────────────
   26 sections in a wrapping top bar meant scanning three rows of buttons to
   find anything, and no sense of which ones belonged together. Grouped list
   down the left instead: the group headers do the explaining, so the item
   names can stay short. */
.shell{display:flex;align-items:flex-start}
aside{width:218px;flex:0 0 218px;background:#110d07;border-right:1px solid var(--line);
position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:12px 0 48px}
.navfilter{width:calc(100% - 24px);margin:0 12px 6px;background:#0b0906;border:1px solid var(--line);
color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;text-align:left}
.navfilter:focus{outline:1px solid var(--amber)}
.navgroup>span{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;
padding:9px 14px;font:inherit;font-size:9.5px;letter-spacing:1.1px;
text-transform:uppercase;color:#6f6553;font-weight:700;cursor:pointer;text-align:left}
.navgroup>span:hover{color:var(--txt);background:#1a1409}
.navgroup>span .chev{margin-left:auto;font-size:9px;color:#5f5647;transition:none}
.navgroup>span .cnt{font-size:9px;color:#5f5647;font-weight:400}
.navgroup.on>span{color:var(--gold)}
.navgroup.on>span .chev{color:var(--amber)}
.navitem{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;
border-left:2px solid transparent;color:var(--dim);padding:6px 14px;cursor:pointer;
font:inherit;font-size:12.5px;text-align:left}
.navitem:hover{background:#1a1409;color:var(--txt)}
.navitem.on{background:rgba(255,200,98,.1);border-left-color:var(--amber);color:var(--amber);font-weight:700}
.navitem.wip{color:#5f5647}
.navitem .dot{margin-left:auto;font-size:15px;line-height:1;color:#7a6a3f}
.navempty{padding:14px;color:var(--dim);font-size:12px}
/* ── the guided flow ──────────────────────────────────────────────────
   Deliberately unlike the rest of the console: one thing on screen, large
   type, and nothing to click except the next move. A manager opening this
   for the first time should not have to decide anything except whether he
   has the file. */
.wiz{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
/* a slow, dark, living backdrop — two faint amber glows drifting. Flat colour
   under it, so nothing to fail; the glows are the only motion. */
.wiz::before,.wiz::after{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
  filter:blur(100px);opacity:.07;pointer-events:none;z-index:0}
.wiz::before{background:var(--amber);top:-160px;left:-120px;animation:drift1 34s ease-in-out infinite}
.wiz::after{background:var(--good);bottom:-180px;right:-140px;animation:drift2 40s ease-in-out infinite}
@keyframes drift1{50%{transform:translate(70px,50px) scale(1.08)}}
@keyframes drift2{50%{transform:translate(-60px,-40px) scale(1.06)}}
.wizin{max-width:640px;width:100%;position:relative;z-index:1;animation:stepIn .8s cubic-bezier(.25,.7,.3,1) both}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.wiz h1{font-size:38px;line-height:1.12;margin:0 0 14px;color:var(--gold);letter-spacing:-.6px;
  animation:riseIn .8s cubic-bezier(.25,.7,.3,1) both}
.wiz .lead{font-size:20px;line-height:1.5;color:var(--txt);margin:0 0 12px;
  animation:riseIn .8s cubic-bezier(.25,.7,.3,1) .14s both}
.wiz .why{font-size:14px;line-height:1.6;color:var(--dim);margin:0;
  animation:riseIn .8s cubic-bezier(.25,.7,.3,1) .28s both}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}}
/* unlocks as glowing pills instead of a flat line */
.wiz .unlocks{font-size:12.5px;line-height:2.2;color:var(--amber);margin:12px 0 0;font-style:normal}
.wiz .unlocks i{font-style:normal}
.unlockpill{display:inline-block;background:rgba(255,200,98,.10);border:1px solid rgba(255,200,98,.3);
  color:var(--amber);border-radius:99px;padding:3px 11px;margin:3px 5px 0 0;font-size:12px;
  animation:pillPop .55s cubic-bezier(.25,.8,.3,1) both}
.unlockpill:nth-child(2){animation-delay:.16s}.unlockpill:nth-child(3){animation-delay:.32s}
.unlockpill:nth-child(4){animation-delay:.48s}
@keyframes pillPop{from{opacity:0;transform:scale(.8)}}
.wiz .bigin{width:100%;font-size:22px;padding:14px 16px;background:#0b0906;
  border:1px solid var(--line);border-radius:10px;color:var(--txt);margin-top:10px}
.wiz .bigin:focus{outline:1px solid var(--amber)}
/* the primary action breathes, to pull the eye */
.add.big{font-size:16px;padding:13px 24px;position:relative}
.wiz .add.big{animation:cta 4.5s ease-in-out infinite}
@keyframes cta{0%,100%{box-shadow:0 0 0 0 rgba(255,200,98,.0)}50%{box-shadow:0 0 0 4px rgba(255,200,98,.09)}}
/* progress: a real bar with a shimmer, not just pips */
.wizbar{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.wpip{width:30px;height:5px;border-radius:3px;background:#2a2318;display:inline-block;transition:background .3s}
.wpip.ok{background:var(--good)}
.wpip.now{background:var(--amber);box-shadow:0 0 8px rgba(255,200,98,.35);animation:pipPulse 3s ease-in-out infinite}
.wpip.skip{background:#4a4030}
@keyframes pipPulse{50%{opacity:.7}}
.wprog{height:7px;background:#221b10;border-radius:4px;overflow:hidden;margin:0 0 24px}
.wprog>div{height:100%;background:linear-gradient(90deg,#7fd1a4,#ffc862);border-radius:4px;
  transition:width 1.4s cubic-bezier(.25,.7,.3,1);position:relative}
.wprog>div::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  animation:shimmer 4.5s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.wiz::before,.wiz::after,.wizin,.wiz h1,.wiz .lead,.wiz .why,
  .unlockpill,.wiz .add.big,.wpip.now,.wprog>div::after,.binsight{animation:none!important;opacity:1!important}}
/* ── LEDGERLIGHT insight card: hero figure + ledger, side by side ── */
.binsights{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;margin:24px 0 4px;text-align:left}
@media(max-width:720px){.binsights{grid-template-columns:1fr}
  /* On a phone a 6–8 column table cannot fit. Let its card scroll sideways and
     stop cells wrapping, so columns stay readable instead of squashing to
     nothing. Prose kept in .mini/.wrap still wraps. */
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  main table{white-space:nowrap}
  main td .mini,main td.wrap,main th.wrap{white-space:normal}}
.bhero{position:relative;border:1px solid var(--line);border-radius:16px;padding:26px 20px 22px;
  background:#0b0805;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bhero::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,231,135,.14),transparent 62%);top:50%;left:50%;
  transform:translate(-50%,-50%);pointer-events:none}
.bpill{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;font-size:11px;
  letter-spacing:1px;text-transform:uppercase;color:var(--good);border:1px solid rgba(126,231,135,.35);
  border-radius:99px;padding:4px 12px;margin-bottom:14px}
.blive{color:var(--good);opacity:.9;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.bnum{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:68px;line-height:.95;
  color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.bnum b{font-weight:600}
.bcap{position:relative;z-index:1;color:var(--dim);font-size:12.5px;margin-top:16px;max-width:230px}
.bnum2{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.btime b{color:var(--good);font-weight:600}
.btime span{opacity:.85}
.blist{border:1px solid var(--line);border-radius:16px;padding:20px 22px;background:#0f0b07}
.blhd{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--txt);margin-bottom:6px}
.blico{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,200,98,.35);color:var(--amber);
  display:grid;place-items:center;font-size:14px}
.brow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.bri{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid rgba(126,231,135,.3);
  color:var(--good);display:grid;place-items:center;font-size:14px}
.bri.bad{border-color:rgba(255,107,107,.35);color:var(--bad)}
.brt{flex:0 1 auto;font-size:14px;color:var(--txt);line-height:1.35}
.brd{flex:1;border-bottom:1px dotted #3a2e1a;transform:translateY(-2px);min-width:16px}
.bra{color:var(--gold);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
/* the tease: each row waits, then slides in one after another */
.binsight{animation:insIn .55s cubic-bezier(.25,.8,.3,1) both;animation-delay:calc(.35s + var(--bi) * .5s)}
@keyframes insIn{from{opacity:0;transform:translateX(14px)}}
/* ── toasts ── */
.toastbox{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;
  flex-direction:column;gap:8px;max-width:min(420px,92vw)}
.toast{background:#161009;border:1px solid var(--line);border-left:3px solid var(--good);
  border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:13px;color:var(--txt);
  animation:tin .18s ease-out both}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
.toast button{background:transparent;border:1px solid var(--amber);color:var(--amber);
  border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;margin-left:auto}
.toast .x{color:var(--mut);text-decoration:none;font-size:15px;line-height:1}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* ── command palette ── */
.palwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal{width:min(620px,94vw);background:#120d07;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--txt);font:inherit;font-size:17px;padding:15px 17px}
.pal input:focus{outline:none}
.palrow{display:flex;align-items:center;gap:11px;padding:9px 17px;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.04)}
.palrow:hover{background:#1a1409}
.palrow .ic{width:20px;color:var(--amber);text-align:center}
.palrow .sub{margin-left:auto;color:var(--mut);font-size:11.5px}
.palhint{padding:9px 17px;color:var(--mut);font-size:11.5px}
/* sticky headers on the long tables */
thead th{position:sticky;top:0;background:var(--ink);z-index:2;text-transform:uppercase;letter-spacing:.6px;font-size:11px;color:var(--dim)}
/* The one animated thing in the app, and only here: this is the moment
   somebody has just done work and not yet seen anything for it. */
.meter{height:12px;background:#2a2318;border-radius:6px;overflow:hidden;margin-top:22px}
.meter .fill{height:100%;background:linear-gradient(90deg,#7fd1a4,#ffc862);
  border-radius:6px;animation:grow 1.8s cubic-bezier(.25,.7,.3,1) both}
@keyframes grow{from{width:0}}
/* ── the unlocked report: this is the sales pitch, so it moves ── */
@keyframes barRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringPop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.reveal>*{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
.reveal>*:nth-child(1){animation-delay:.02s}
.reveal>*:nth-child(2){animation-delay:.10s}
.reveal>*:nth-child(3){animation-delay:.18s}
.reveal>*:nth-child(4){animation-delay:.26s}
.reveal>*:nth-child(5){animation-delay:.34s}
.reveal>*:nth-child(6){animation-delay:.42s}
.reveal>*:nth-child(7){animation-delay:.50s}
.reveal svg{animation:ringPop .5s ease-out both}
@media(prefers-reduced-motion:reduce){.reveal>*,.reveal svg,.risebar,.growbar,.donutseg{animation:none!important}}
.pop{width:54px;height:54px;border-radius:50%;background:rgba(127,209,164,.14);
  color:#7fd1a4;display:grid;place-items:center;font-size:26px;margin-bottom:16px;
  animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--gold);
border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;margin-left:auto}
main{flex:1;min-width:0;padding:18px 20px 60px;max-width:1500px}
/* Collapsed rail. Icons carry the meaning when labels are hidden, so every
   section has one and the title attribute repeats the name on hover. */
.navitem .ic{width:17px;text-align:center;flex:0 0 17px;font-size:13px}
.shell.rail aside{width:54px;flex:0 0 54px}
.shell.rail .navfilter,.shell.rail .navgroup>span,.shell.rail .lb,
.shell.rail .navempty{display:none}
.shell.rail .navitem{justify-content:center;padding:9px 0;gap:0}
.shell.rail .navgroup{border-top:1px solid #201a10;margin-top:4px;padding-top:4px}
.shell.rail .navgroup:first-of-type{border-top:0}
.railbtn{background:transparent;border:1px solid var(--line);color:var(--dim);
border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12px;margin-left:14px}
.railbtn:hover{color:var(--gold);border-color:var(--amber)}
input[type=range]{width:230px;padding:0;accent-color:var(--amber);text-align:left}
.mini{font-size:11px;color:var(--dim)}
/* ── First run ─────────────────────────────────────────────────────────── */
.hero{background:linear-gradient(180deg,#15100a,#0b0805);border:1px solid var(--line);
border-radius:16px;padding:30px 30px 26px;margin-bottom:16px}
.hero h2{margin:0 0 6px;color:var(--gold);font-size:24px;letter-spacing:.3px}
.hero p{margin:0;color:var(--dim);font-size:14px;max-width:62ch;line-height:1.6}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:20px 0 0}
.door{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
display:flex;flex-direction:column;cursor:pointer;text-align:left}
.door:hover{border-color:var(--amber)}
.door.primary{border-color:var(--amber);background:linear-gradient(180deg,#241a0b,#171208)}
.door .ic2{font-size:22px;line-height:1;margin-bottom:10px;color:var(--amber)}
.door h4{margin:0 0 6px;color:var(--gold);font-size:15px}
.door p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.55;flex:1}
.door .cta{margin-top:12px;color:var(--amber);font-size:12.5px;font-weight:700}
.intake{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1e1810}
.intake:last-child{border-bottom:0}
.intake .tick{width:20px;text-align:center;font-size:15px}
.demobar{background:rgba(255,200,98,.1);border:1px solid var(--warn);border-radius:10px;
padding:9px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;font-size:12.5px}
/* ── The scoreboard ───────────────────────────────────────────────────────
   Sits above every tab. The rings are real progress, not decoration: the
   trust score is literally how much of this app is running on data rather
   than on blanks. */
.score{display:flex;gap:20px;align-items:center;background:linear-gradient(180deg,#140f08,#0b0805);
border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:14px;cursor:pointer}
.score:hover{border-color:var(--amber)}
.rings{display:flex;gap:14px}
.rw{text-align:center}
.ring{width:44px;height:44px;border-radius:50%;position:relative;margin:0 auto;
background:conic-gradient(var(--amber) calc(var(--p) * 1%),#241c10 0)}
.ring.done{background:conic-gradient(var(--good) 100%,#241c10 0)}
.ring i{position:absolute;inset:4px;border-radius:50%;background:#141009;display:grid;
place-items:center;font-style:normal;font-size:11.5px;font-weight:700;color:var(--gold)}
.ring.done i{color:var(--good)}
.rl{font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);margin-top:5px}
.trustwrap{min-width:200px}
.trustbar{height:8px;background:#241c10;border-radius:99px;overflow:hidden;margin-top:5px}
.trustbar i{display:block;height:100%;border-radius:99px;
background:linear-gradient(90deg,#ff6b6b,#ffc862,#7ee787)}
.streak{margin-left:auto;text-align:center;min-width:64px}
.streak b{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--amber);display:block;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tk{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #1e1810}
.tk:last-child{border-bottom:0}
.tk .g{flex:1;min-width:0}
.tk .pb{height:6px;background:#241c10;border-radius:99px;overflow:hidden;margin-top:6px;max-width:340px}
.tk .pb i{display:block;height:100%;border-radius:99px;background:var(--amber)}
.tk.ok .pb i{background:var(--good)}
.tk .n{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;min-width:86px;text-align:right}
@media(max-width:860px){.score{flex-wrap:wrap;gap:12px}.trustwrap{min-width:140px}}
@media(max-width:860px){
  .burger{display:block}
  .shell{flex-direction:column}
  aside{display:none;position:static;width:100%;flex:none;height:auto;
    border-right:0;border-bottom:1px solid var(--line)}
  body.nav-open aside{display:block}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px}
.kpi .v{font-family:var(--serif);font-size:33px;font-weight:600;color:var(--gold);line-height:.98;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:57px;background:#12100a;cursor:pointer}
td{padding:8px;border-bottom:1px solid var(--line)}
tr:hover td{background:#171009}
.num{text-align:right;font-variant-numeric:tabular-nums}
input{background:#0b0906;border:1px solid var(--line);color:var(--gold);border-radius:6px;
padding:4px 7px;width:88px;font:inherit;text-align:right}
input:focus{outline:1px solid var(--amber)}
.pill{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;display:inline-block;text-transform:uppercase;letter-spacing:.9px}
.g{background:rgba(126,231,135,.15);color:var(--good)}
.w{background:rgba(255,200,98,.15);color:var(--warn)}
.b{background:rgba(255,107,107,.15);color:var(--bad)}
.search{background:#0b0906;border:1px solid var(--line);color:var(--txt);border-radius:9px;
padding:9px 13px;width:320px;font:inherit;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 4px;color:var(--gold);font-size:15px;letter-spacing:.3px}
.muted{color:var(--dim);font-size:12px}
.alert{border-left:3px solid var(--bad);padding:11px 14px;background:rgba(255,107,107,.07);
border-radius:0 9px 9px 0;margin-bottom:9px}
.alert b{color:var(--bad)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}

<script>const DATA={"ingredients":[],"menu":[],"batch":[],"suppliers":[],"supplierMonths":[],"invoices":[],"payments":[]};
// ══ COSTING ENGINE v2 ═════════════════════════════════════════════════
const IX={},BX={};
const rebuildIX=()=>{for(const k in IX)delete IX[k];DATA.ingredients.forEach(i=>IX[i.code]=i)};
const rebuildBX=()=>{for(const k in BX)delete BX[k];DATA.batch.forEach(b=>BX['B'+b.id]=b)};
DATA.batch.forEach((b,i)=>{if(!b.id)b.id=String(i+1).padStart(3,'0');
  if(b.yieldQty==null)b.yieldQty=1;if(!b.yieldUnit)b.yieldUnit='batch'});
DATA.menu.forEach((m,i)=>{if(!m.id)m.id='M'+i;if(m.weeklySales==null)m.weeklySales=null});
DATA.ingredients.forEach(i=>{if(!i.history)i.history=[]});
rebuildIX();rebuildBX();

const KEY='hoard-v1';
// ── DEPARTMENTS ─────────────────────────────────────────────────────────
// Kitchen and bar share one engine but not one benchmark: kitchens run ~35%
// food cost, bars ~20% pour cost. Judging a Negroni against a food target
// would call a healthy drink a disaster, so the target follows the item.
const TARGETS={kitchen:0.35,bar:0.20};
let DEPT='all';                       // 'all' | 'kitchen' | 'bar'
const deptOf=o=>o&&o.dept?o.dept:'kitchen';
const targetFor=o=>TARGETS[deptOf(o)]||0.35;
const inDept=o=>DEPT==='all'||deptOf(o)===DEPT;
const MENU=()=>DATA.menu.filter(inDept);
const BATCH=()=>DATA.batch.filter(inDept);
const ING=()=>DATA.ingredients.filter(inDept);
function setDept(d){DEPT=d;openM=null;openB=null;R();}

const money=n=>(n==null||isNaN(n))?'—':(+n).toFixed(3);
const pct=n=>(n==null||isNaN(n))?'—':(n*100).toFixed(1)+'%';
const codeOf=r=>String(r||'').split('_')[0];
const isB=r=>String(r||'').startsWith('B');

// ── persistence + undo ──────────────────────────────────────────────────
// A tool you can lose work in is a tool you won't trust with real decisions.
let UNDO=[]; let _editPerm=null;
const editAs=(p,fn)=>{_editPerm=p;try{edit(fn)}finally{_editPerm=null}};
// ── UNDO ────────────────────────────────────────────────────────────────
//
// Undo used to cover three keys — ingredients, menu, batches — and imports
// did not snapshot at all. So the single most damaging thing a new user can
// do, applying an import with one column mapped wrong across ninety days of
// sales, was the one thing that could not be taken back.
//
// It now covers everything an action can change, and every apply takes a
// snapshot first with a label, so the button can say WHAT it will undo rather
// than asking someone to remember.
const UNDOABLE=['ingredients','menu','batch','week','ledger','rateBook','period',
                'suppliers','supplierMonths','invoices','payments','posMap',
                'posRejected','countHistory','market','docs'];

// A new action invalidates any redo path — you cannot redo into a future that
// no longer follows from the present. Standard, and the thing people expect
// without being able to name it.
let REDO=[];
function snapshot(label){
  const shot={_label:label||''};
  for(const k of UNDOABLE) shot[k]=DATA[k];
  UNDO.push(JSON.stringify(shot));
  REDO.length=0;
  // Ten deep rather than forty: each entry now carries the whole ledger, and
  // forty copies of three months of days is a lot of memory for a history
  // nobody scrolls back through.
  if(UNDO.length>10)UNDO.shift();
}
const undoLabel=()=>{
  if(!UNDO.length)return '';
  try{ return JSON.parse(UNDO[UNDO.length-1])._label||''; }catch(e){ return ''; }
};
function undo(){
  if(!UNDO.length){ toast('Nothing to undo',{kind:'warn'}); return; }
  // The CURRENT state goes onto the redo stack before we roll back, so redo
  // can bring it forward again.
  const cur={_label:'redo'}; for(const k of UNDOABLE)cur[k]=DATA[k];
  REDO.push(JSON.stringify(cur));
  const s=JSON.parse(UNDO.pop());
  for(const k of UNDOABLE) if(s[k]!==undefined) DATA[k]=s[k];
  rebuildIX();rebuildBX();saveNow();R();
  toast(`Undone: ${s._label||'the last change'}`,{action:'redo()',actionLabel:'Redo'});
}
function redo(){
  if(!REDO.length){ toast('Nothing to redo',{kind:'warn'}); return; }
  const cur={_label:'undo'}; for(const k of UNDOABLE)cur[k]=DATA[k];
  UNDO.push(JSON.stringify(cur));
  const s=JSON.parse(REDO.pop());
  for(const k of UNDOABLE) if(s[k]!==undefined) DATA[k]=s[k];
  rebuildIX();rebuildBX();saveNow();R();
  toast('Redone',{action:'undo()',actionLabel:'Undo'});
}
// ── WHAT GETS SAVED ────────────────────────────────────────────────────
//
// This was a hand-written object literal, and it had drifted: seven keys had
// been added to DATA over time and none of them reached storage. Among them
// were `rates` — the VAT, service and levy that every margin in the app
// divides by — and `week`, which is the whole prime-cost week. Import a month
// of labour and purchases, close the tab, and it was gone with no error and
// no warning, because saving had "worked".
//
// So the list is now explicit, and every key of DATA must appear in one of the
// two lists below. `persistCheck()` fails loudly if a new one appears in
// neither, which is the only way this stays fixed — the bug was never that
// somebody wrote the wrong list, it was that adding a key required
// remembering to edit a list somewhere else.

/// Durable: the customer's work. Losing any of it means retyping.
const PERSIST=['users','ingredients','menu','batch','suppliers','supplierMonths',
  'invoices','payments','audit','rates','week','checkLog','posMap','posRejected',
  'docs','firstRunDone','market','costMethod','venueInfo','setup',
  'ledger','period','rateBook','settings'];

/// Deliberately not durable, each for a stated reason.
const TRANSIENT={
  ai:'held separately so the API key can be excluded unless you opt in',
  connection:'describes this session, not the business',
  _lastSaved:'derived',
  _lastBackup:'derived',
};

/// Any key of DATA that is in neither list. Should always be empty.
function persistCheck(){
  return Object.keys(DATA).filter(k=>!PERSIST.includes(k)&&!(k in TRANSIENT));
}

/// The AI block minus the key, unless the operator asked for it to be kept.
///
/// The screen has always warned that the key is "stored in this browser,
/// unencrypted". Until now that was not true — nothing persisted it, so it had
/// to be retyped every session. Warning about a risk you are not taking is its
/// own kind of dishonesty: it teaches people to ignore the warning. Now the
/// choice is explicit and the warning is accurate when it applies.
function aiForStorage(){
  const a=DATA.ai||{};
  const out={provider:a.provider,enabled:a.enabled,calls:a.calls,lastUsed:a.lastUsed,
             remember:!!a.remember,ledger:a.ledger||[],limits:a.limits,auth:a.auth||[]};
  if(a.remember)out.key=a.key;
  return out;
}

// ── SAVING, DEBOUNCED AND WATCHED ───────────────────────────────────────
//
// save() serialises the whole workbook — a year of ledger, all history, the
// menu — and writes it to localStorage. It used to run on EVERY edit(), which
// on a full book means ~600 KB stringified and written on every keystroke in
// a price field. Invisible on a fast laptop; a stutter on the machine a
// manager actually uses, and it gets worse precisely as the app fills up.
//
// So writes are debounced: a burst of edits collapses into one write a moment
// after typing stops. saveNow() still exists for the moments that must not be
// lost — an import applied, a format — where the cost of a lost write is high
// and the write is not on a hot path.
//
// And the size is watched. localStorage caps around 5 MB and the only signal
// used to be a write that had already failed. Now the payload size is checked
// against a soft ceiling, and the console warns while there is still room to
// export, rather than after the door has shut.
let SAVEFAIL=null;
let STORE_BYTES=0;
const STORE_SOFT=4*1024*1024;      // warn here; the hard cap is ~5 MB
let _saveTimer=null;

/// The one serialization format, shared by localStorage AND cloud sync, so a
/// blob written here is byte-identical wherever it lands.
function _serialize(){
  const out={saved:Date.now(),ai:aiForStorage()};
  for(const k of PERSIST)out[k]=DATA[k];
  return out;
}
/// Apply a parsed state object into DATA. Used by load() and by a cloud pull,
/// so both doors write through exactly the same keys.
function _applyState(d){
  if(!d||!d.ingredients)return false;
  for(const k of PERSIST) if(d[k]!==undefined) DATA[k]=d[k];
  if(d.ai)DATA.ai=Object.assign({provider:'',key:'',enabled:false,calls:0},d.ai);
  DATA._lastSaved=d.saved;
  rebuildIX();rebuildBX();
  return d.saved;
}
function saveNow(){
  try{
    const out=_serialize();
    const json=JSON.stringify(out);
    STORE_BYTES=json.length;
    localStorage.setItem(KEY,json);
    DATA._lastSaved=out.saved; SAVEFAIL=null;
    if(typeof CLOUD!=='undefined'&&CLOUD)cloudPushDebounced();   // mirror to cloud, offline-first
    // Warn once per session while there is still headroom to act.
    if(STORE_BYTES>STORE_SOFT && !DATA._storeWarned){
      DATA._storeWarned=true;
      toast(`This book is ${(STORE_BYTES/1048576).toFixed(1)} MB — near the browser's limit. Download a backup and consider archiving old months.`,
        {kind:'warn',action:"go('settings')",actionLabel:'Backups'});
    }
  }catch(e){
    SAVEFAIL=e.message||'storage refused the write';
    // A real quota failure is not a toast to glance past — the work is not
    // being kept. Say it plainly and point at the way out.
    toast(`SAVE FAILED — this browser is out of room and your last change was NOT stored. Download a backup now.`,
      {kind:'bad',action:"backupDownload()",actionLabel:'Back up now',ms:60000});
  }
}
function save(){
  // Debounced. Cheap to call from anywhere; the write happens once things
  // settle. clearTimeout coalesces a whole burst into a single write.
  if(typeof setTimeout!=='function'){ saveNow(); return; }
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveNow,450);
}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return false;
  return _applyState(JSON.parse(s));}catch(e){return false}}
function resetAll(){if(confirm('Discard all edits and reload the original workbook data?')){
localStorage.removeItem(KEY);location.reload()}}

// ── CLOUD SYNC ───────────────────────────────────────────────────────────
//
// The whole platform hangs off one idea: the book is still a single JSON blob,
// exactly what localStorage holds, so "sync" is just mirroring that blob to a
// per-venue slot in the cloud. Local stays the source of truth for speed — a
// write hits localStorage instantly and only then drifts up to the cloud — so
// the app keeps working through the venue's bad wifi and never blocks on a
// network round trip. This is offline-first, not online-with-a-cache.
//
// CLOUD is an ADAPTER, not Firebase. Any backend that can (a) tell us who is
// signed in and (b) get/put a blob per (org, venue) satisfies the contract:
//
//   auth()                         -> {uid,email} | null
//   onAuth(cb)                     -> subscribe to sign-in/out
//   signIn/signUp/signOut          -> Promises
//   listVenues(org)                -> [{id,name,updated}]
//   getBlob(org,venue)             -> {json, updated} | null
//   putBlob(org,venue,json,updated)-> Promise
//
// With no adapter wired, every function below is inert and the app is the
// offline single-file console it has always been. That is what keeps the
// distributable build unchanged.
let CLOUD=null;
let CLOUDSTATE={status:'off', org:null, venue:null, user:null,
                lastPull:0, lastPush:0, pushErr:null, pulling:false};
let _cloudTimer=null;

/// Wire a backend in. Called once at boot when a config is present.
function cloudUse(adapter){ CLOUD=adapter; CLOUDSTATE.status='idle'; return adapter; }
function cloudOn(){ return !!CLOUD; }

/// The exact bytes to sync: the live localStorage format, tagged with the
/// moment the data last actually changed (not "now"), so last-write-wins across
/// devices compares real edit times.
function _cloudBlob(){ const o=_serialize(); o.saved=DATA._lastSaved||o.saved; return JSON.stringify(o); }

/// Pull the active venue's blob. Applies it ONLY if it is newer than what is
/// on this device — so opening a laptop that was edited on a phone catches up,
/// but a stale tab never clobbers fresher local work.
async function cloudPull(){
  if(!CLOUD||!CLOUDSTATE.org||!CLOUDSTATE.venue)return false;
  CLOUDSTATE.pulling=true;
  try{
    const r=await CLOUD.getBlob(CLOUDSTATE.org,CLOUDSTATE.venue);
    CLOUDSTATE.lastPull=Date.now();
    if(!r||!r.json)return false;
    let d; try{ d=JSON.parse(r.json); }catch(e){ return false; }
    if((d.saved||0)>(DATA._lastSaved||0)){
      _applyState(d);
      try{ localStorage.setItem(KEY,r.json); }catch(e){}
      return true;
    }
    return false;
  } finally { CLOUDSTATE.pulling=false; }
}

/// Push the current book up. Local is assumed newest here because push only
/// fires right after a local write.
async function cloudPush(){
  if(!CLOUD||!CLOUDSTATE.org||!CLOUDSTATE.venue)return false;
  const json=_cloudBlob();
  try{
    await CLOUD.putBlob(CLOUDSTATE.org,CLOUDSTATE.venue,json,DATA._lastSaved||Date.now());
    CLOUDSTATE.lastPush=Date.now(); CLOUDSTATE.pushErr=null; return true;
  }catch(e){
    // A failed push is not lost work — the blob is safe in localStorage and the
    // next successful write carries everything up. We just remember it stalled.
    CLOUDSTATE.pushErr=e.message||'sync paused — will retry on the next change';
    return false;
  }
}
function cloudPushDebounced(){
  if(!CLOUD)return;
  if(typeof setTimeout!=='function'){ cloudPush(); return; }
  clearTimeout(_cloudTimer); _cloudTimer=setTimeout(cloudPush,900);
}

/// Open a venue: point sync at (org, venue), catch up from the cloud, and — if
/// the cloud has nothing yet — seed it from whatever is local. Returns whether
/// remote data was applied.
async function cloudOpenVenue(org,venue){
  CLOUDSTATE.org=org; CLOUDSTATE.venue=venue; CLOUDSTATE.status='syncing';
  const pulled=await cloudPull();
  if(!pulled) await cloudPush();          // first run for this venue: seed it
  CLOUDSTATE.status='synced';
  return pulled;
}

// ── FIREBASE ADAPTER + BOOT ──────────────────────────────────────────────
//
// Paste your Firebase web config into CLOUD_CONFIG to turn this file into the
// multi-tenant platform. Leave it blank and NOTHING here runs: the SDK is never
// fetched, no login is shown, and the app is the offline single-file console it
// has always been. That is the switch between the two products, and it is one
// object.  Setup steps: see SETUP.md.
const CLOUD_CONFIG={apiKey:'AIzaSyCAkQDVYaKwdMSjSD_3UuxgKMe_kp1Jw3A',authDomain:'hoard-ac666.firebaseapp.com',projectId:'hoard-ac666',storageBucket:'hoard-ac666.firebasestorage.app',appId:'1:783911286552:web:97306fc1d397312b4e106d'};
const FB_VER='10.12.5';
let FB=null;

/// Load Firebase (only when configured), wire it as the Cloud adapter, and let
/// auth changes drive the app. Browser-only; never runs in the offline build.
async function bootCloud(){
  if(!CLOUD_CONFIG.apiKey) return false;
  try{
    const B='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [A,Au,Fs]=await Promise.all([
      import(B+'firebase-app.js'), import(B+'firebase-auth.js'),
      import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(CLOUD_CONFIG);
    const auth=Au.getAuth(app), db=Fs.getFirestore(app);
    FB={app,auth,db,A,Au,Fs};
    cloudUse({
      auth(){ const u=auth.currentUser; return u?{uid:u.uid,email:u.email}:null; },
      onAuth(cb){ Au.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:u.email}:null)); },
      signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
      signUp:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p),
      google:()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()),
      signOut:()=>Au.signOut(auth),
      // The venue book lives in a Firestore document — Spark-plan friendly, no
      // Cloud Storage or billing needed. One doc per venue: { blob, updated }.
      async getBlob(org,venue){
        const s=await Fs.getDoc(Fs.doc(db,'orgs',org,'venues',venue));
        return s.exists()?{json:s.data().blob||''}:null; },
      async putBlob(org,venue,json,updated){
        await Fs.setDoc(Fs.doc(db,'orgs',org,'venues',venue),{blob:json,updated:updated||Date.now()}); },
      // Who this user is, and which org they belong to. First-ever sign-in
      // mints a fresh org owned by them, with one venue.
      async membership(uid,email){
        const uref=Fs.doc(db,'users',uid);
        let snap=await Fs.getDoc(uref);
        if(!snap.exists()){
          const org=uid;
          await Fs.setDoc(uref,{org,role:'owner',email:email||''});
          await Fs.setDoc(Fs.doc(db,'orgs',org),{owner:uid,name:email||'My venue',
            venues:[{id:'venue1',name:'My venue'}],members:{[uid]:'owner'},created:Date.now()});
          snap=await Fs.getDoc(uref);
        }
        return snap.data();
      },
      async venues(org){ const s=await Fs.getDoc(Fs.doc(db,'orgs',org));
        return s.exists()?(s.data().venues||[]):[]; },
    });
    CLOUD.onAuth(onCloudAuth);
    return true;
  }catch(e){ console.warn('cloud boot failed:',e&&e.message); return false; }
}

/// Auth changed. Signed in → resolve org, open the active venue (which pulls
/// their book down), take a role, paint. Signed out → the login screen.
async function onCloudAuth(u){
  if(!u){ CLOUDSTATE.user=null; SESSION=null; R(); return; }
  CLOUDSTATE.user=u;
  try{
    const m=await CLOUD.membership(u.uid,u.email);
    CLOUDSTATE.org=m.org;
    const vs=await CLOUD.venues(m.org);
    const active=(CLOUDSTATE.venue&&vs.some(v=>v.id===CLOUDSTATE.venue))?CLOUDSTATE.venue
                :((vs[0]&&vs[0].id)||'venue1');
    CLOUDSTATE.venues=vs;
    SESSION={username:u.email||'owner',role:m.role||'owner'}; WHO=SESSION.username;
    await cloudOpenVenue(m.org,active);
  }catch(e){ CLOUDSTATE.pushErr=e&&e.message; }
  R();
}

/// The cloud sign-in screen, shown only in platform mode (config present) while
/// no one is signed in.
function renderCloudLogin(){
  const el=document.getElementById('app'); if(!el)return;
  const connecting=!cloudOn();
  el.innerHTML='<div style="max-width:400px;margin:9vh auto"><div class="card">'+
    '<h3>Sign in</h3>'+
    '<div class="muted">Your venue’s book is stored securely and synced to every device you sign in on.</div>'+
    (connecting?'<div class="mini" style="margin-top:14px">Connecting…</div>':
    '<div class="f" style="margin-top:14px"><label>Email</label><input id="cl_e" class="wide" type="email" autocomplete="email"></div>'+
    '<div class="f" style="margin-top:8px"><label>Password</label><input id="cl_p" class="wide" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')cloudSignIn()"></div>'+
    '<div id="cl_err" style="color:var(--bad);font-size:12px;margin-top:8px;min-height:14px"></div>'+
    '<div style="margin-top:6px"><button class="add" onclick="cloudSignIn()">Sign in</button>'+
    '<button class="chip" style="margin-left:8px" onclick="cloudSignUp()">Create account</button></div>'+
    '<div style="margin-top:10px"><button class="chip" onclick="cloudGoogle()">Continue with Google</button></div>')+
    '</div></div>';
}
const _clErr=m=>{const el=document.getElementById('cl_err'); if(el)el.textContent=m||'';};
async function cloudSignIn(){ try{ await CLOUD.signIn(document.getElementById('cl_e').value,document.getElementById('cl_p').value); }catch(x){ _clErr(x&&x.message||'Sign-in failed'); } }
async function cloudSignUp(){ try{ await CLOUD.signUp(document.getElementById('cl_e').value,document.getElementById('cl_p').value); }catch(x){ _clErr(x&&x.message||'Could not create account'); } }
async function cloudGoogle(){ try{ await CLOUD.google(); }catch(x){ _clErr(x&&x.message||'Google sign-in failed'); } }
function cloudSignOut(){ if(CLOUD)CLOUD.signOut(); }
/// A short, honest status word for the toolbar in platform mode.
function _syncLabel(){
  if(CLOUDSTATE.pushErr)return 'sync paused';
  if(CLOUDSTATE.status==='syncing'||CLOUDSTATE.pulling)return 'syncing…';
  return CLOUDSTATE.lastPush?'synced':'saved';
}

// A fresh, empty book — every durable key at its zero value. Shared by the

// ── costing ─────────────────────────────────────────────────────────────
function costPerRu(i){if(!i)return 0;if(i.price==null||!i.ruPerPu)return i.costPerRu??0;
  const y=(i.yield==null||i.yield===0)?1:i.yield;return i.price/i.ruPerPu/y}
// A batch that contains itself, directly or through another batch, has no
// cost — the sum does not converge. The guard stopped the infinite loop and
// then returned 0, which is a confident answer to an unanswerable question:
// the batch appears free, and every dish built on it gets cheaper.
//
// It returns null now, which propagates as "cannot be costed" rather than as
// "costs nothing", and the cycle is reported by impossibleValues().
function batchCost(b,seen){
  if(!b)return 0;
  seen=seen||new Set();
  if(seen.has(b.id))return null;
  seen.add(b.id);
  let total=0;
  for(const l of (b.lines||[])){
    const uc=unitCostOf(l.ref,seen);
    if(uc===null)return null;
    total+=(l.qty||0)*uc;
  }
  return total;
}
/// Asked fresh rather than cached, because recipes are edited constantly.
function batchInCycle(b,seen){
  if(!b)return false;
  seen=seen||new Set();
  if(seen.has(b.id))return true;
  seen.add(b.id);
  for(const l of (b.lines||[]))
    if(isB(l.ref)){ const nb=BX[l.ref]; if(nb&&batchInCycle(nb,new Set(seen)))return true; }
  return false;
}
function batchUnit(b,seen){const q=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
  const c=batchCost(b,seen); return c===null?null:c/q}
function unitCostOf(ref,seen){if(isB(ref)){const b=BX[ref];return b?batchUnit(b,seen):0}
  return costPerRu(IX[codeOf(ref)])}
// null means "cannot be costed" and must stay null all the way up, or a
// circular batch quietly becomes a free ingredient again.
const lineCost=(l,s)=>{const uc=unitCostOf(l.ref,s);
  return uc===null?null:(l.qty||0)*uc;};
/// A dish containing an uncostable batch is UNCOSTABLE, not cheap. Summing a
/// null as zero is exactly how a circular recipe used to make dishes look
/// good.
const itemCost=m=>{
  let t=0;
  for(const l of (m.lines||[])){ const c=lineCost(l); if(c===null)return null; t+=c; }
  return t;
};
// ── NET REVENUE ─────────────────────────────────────────────────────────
//
// The till export made this unavoidable: achieved price sits at roughly 0.85 of
// the printed menu price, consistently, across almost every line. That is not
// discounting — it is VAT plus service charge. The customer pays 19.00; the
// business banks about 15.57.
//
// Every food-cost percentage in this console was measured against the printed
// price, which means every one of them was flattering by about the same
// margin — a dish reading 24% when the truth is 29%. One of those is
// comfortable and the other is at the ceiling, and the difference was an
// assumption nobody made on purpose.
//
// ── The rule ────────────────────────────────────────────────────────────
//
// `menuPrice` stays GROSS. It is what is printed on the menu and what the guest
// hands over, and changing its meaning would break every screen that displays
// it. `netPrice()` is what reaches the business, and it is what cost ratios and
// margins are measured against — because you cannot pay a supplier out of the
// VAT you are holding for the government.
//
// Anything computed FROM a cost (a suggested price) comes back the other way
// through `grossOf()`, so a recommendation is still something you could print.
//
// ── Defaults are zero, deliberately ─────────────────────────────────────
//
// Rates start at 0, which makes every function below the identity and changes
// nothing until real rates are entered. Guessing at someone's tax rate and
// silently restating their margins would be the same sin in the other
// direction.
DATA.rates=DATA.rates||{vat:0,service:0,levy:0};
if(DATA.rates.levy==null)DATA.rates.levy=0;   // books saved before the levy existed
/// Three deductions, applied in sequence rather than added together.
///
/// They compound: a 10% VAT on top of a 5% service charge on top of a 5%
/// tourism levy is not 20%, it is 1.10 x 1.05 x 1.05 = 21.3%. Summing them
/// would understate what the guest pays and overstate what the business banks
/// — a small error on one dish and a large one across a menu.
const _rateMul=()=>{const r=DATA.rates||{};
  return (1+(+r.vat||0))*(1+(+r.service||0))*(1+(+r.levy||0))};
const netOf=g=>(+g||0)/_rateMul();
const grossOf=n=>(+n||0)*_rateMul();
const netPrice=m=>netOf(m&&m.menuPrice);
const ratesSet=()=>_rateMul()>1.0000001;

const fcPct=m=>{const c=itemCost(m);const p=netPrice(m);return p?c/p:null};
const nameOf=r=>isB(r)?(BX[r]?'▣ '+BX[r].name:r):(IX[codeOf(r)]?IX[codeOf(r)].name:r);
const unitOf=r=>isB(r)?(BX[r]?BX[r].yieldUnit:''):(IX[codeOf(r)]?(IX[codeOf(r)].recipeUnit||''):'');
const priced=()=>DATA.menu.filter(m=>m.menuPrice>0&&inDept(m));
const anomalies=()=>priced().map(m=>({m,f:fcPct(m)})).filter(x=>x.f>1).sort((a,b)=>b.f-a.f);
const band=(f,t)=>{t=t||0.35;return f==null?['—','']:f>1?[pct(f),'b']:f>t?[pct(f),'w']:[pct(f),'g']};

// ── THE FIX QUEUE ───────────────────────────────────────────────────────
// The most valuable screen here. 132 unpriced ingredients is a list; the same
// list ordered by HOW MANY DISHES EACH ONE BREAKS is an afternoon's work with
// visible payoff. Fix the top ten and you may repair sixty dishes.
function fixQueue(){
  const impact={};
  const touch=(ref,dish)=>{if(isB(ref))return;const c=codeOf(ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(dish)};
  DATA.menu.forEach(m=>m.lines.forEach(l=>touch(l.ref,m.name)));
  DATA.batch.forEach(b=>b.lines.forEach(l=>{if(isB(l.ref))return;const c=codeOf(l.ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).recipes.add(b.name)}));
  // a batch recipe used in dishes propagates its ingredients' breakage upward
  DATA.menu.forEach(m=>m.lines.filter(l=>isB(l.ref)).forEach(l=>{const b=BX[l.ref];
    if(b)b.lines.forEach(bl=>{if(isB(bl.ref))return;const c=codeOf(bl.ref);
      (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(m.name)})}));
  return Object.entries(impact).map(([c,v])=>({ing:IX[c],code:c,
      dishes:[...v.dishes],recipes:[...v.recipes]}))
    .filter(x=>x.ing&&!costPerRu(x.ing))
    .sort((a,b)=>(b.dishes.length+b.recipes.length)-(a.dishes.length+a.recipes.length));
}

// ── MENU ENGINEERING ────────────────────────────────────────────────────
// Food cost % alone is the wrong metric: a 40% dish selling 200/wk beats a 15%
// dish selling 3. Popularity x margin is the decision that matters.
function engineering(){
  const withSales=priced().filter(m=>m.weeklySales>0&&fcPct(m)<=1);
  if(!withSales.length)return null;
  const avgSales=withSales.reduce((s,m)=>s+m.weeklySales,0)/withSales.length;
  const gpOf=m=>netPrice(m)-itemCost(m);
  const avgGP=withSales.reduce((s,m)=>s+gpOf(m),0)/withSales.length;
  const cls=m=>{const pop=m.weeklySales>=avgSales, prof=gpOf(m)>=avgGP;
    return pop&&prof?'Star':pop?'Plowhorse':prof?'Puzzle':'Dog'};
  return {avgSales,avgGP,items:withSales.map(m=>({m,k:cls(m),
    gp:gpOf(m),weekly:gpOf(m)*m.weeklySales}))
    .sort((a,b)=>b.weekly-a.weekly)};
}
const ADVICE={Star:'Protect. Never discount, never change the recipe.',
  Plowhorse:'Popular but thin. Re-engineer the recipe or nudge the price.',
  Puzzle:'Profitable but ignored. Move it up the menu, rename it, push it.',
  Dog:'Neither popular nor profitable. Cut it.'};

// ── PRICE SHOCK SIMULATOR ───────────────────────────────────────────────
let shock={cat:'ALL',pctv:10};
function simulate(){
  const before=priced().map(m=>({m,c:itemCost(m),f:fcPct(m)}));
  const hit=new Set(DATA.ingredients.filter(i=>shock.cat==='ALL'||(i.category||'')===shock.cat).map(i=>i.code));
  const orig={};hit.forEach(c=>{if(IX[c]){orig[c]=IX[c].price;IX[c].price=(IX[c].price||0)*(1+shock.pctv/100)}});
  const after=priced().map(m=>({m,c:itemCost(m),f:fcPct(m)}));
  hit.forEach(c=>{if(IX[c])IX[c].price=orig[c]});
  return before.map((b,i)=>({m:b.m,c0:b.c,c1:after[i].c,f0:b.f,f1:after[i].f}))
    .filter(x=>x.c1>x.c0+1e-9).sort((a,b)=>(b.f1-b.f0)-(a.f1-a.f0));
}

// ── INVOICE / RECEIPT PARSER ────────────────────────────────────────────
// Paste the text of a supplier invoice. No API key, no OCR service, works
// offline. Each line is matched against the ingredient list by word overlap;
// nothing is applied until you approve it, because a bad auto-match silently
// corrupts every dish using that ingredient.
let invText='', invRows=[];
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function scoreMatch(a,b){
  const A=new Set(norm(a).split(' ').filter(w=>w.length>2));
  const B=new Set(norm(b).split(' ').filter(w=>w.length>2));
  if(!A.size||!B.size)return 0;
  let hit=0;A.forEach(w=>{if(B.has(w))hit++});
  return hit/Math.max(A.size,B.size);
}
function parseInvoice(text){
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(line.length<4)return;
    // numbers that look like money: last plausible decimal on the line
    const nums=line.match(/\d+[.,]\d{1,3}|\d+/g); if(!nums)return;
    const price=parseFloat(nums[nums.length-1].replace(',','.'));
    if(!isFinite(price)||price<=0)return;
    const desc=line.replace(/[\d.,]+\s*$/,'').replace(/^\d+\s*[xX]?\s*/,'').trim();
    if(desc.length<3)return;
    let best=null,bs=0;
    DATA.ingredients.forEach(i=>{const s=scoreMatch(desc,i.name);if(s>bs){bs=s;best=i}});
    out.push({desc,price,match:bs>=0.34?best:null,score:bs,apply:bs>=0.5});
  });
  return out;
}
function applyInvoice(){
  const use=invRows.filter(r=>r.apply&&r.match);
  if(!use.length){alert('Nothing selected to apply.');return}
  if(!confirm(`Update ${use.length} ingredient price(s)?`))return;
  edit(()=>{use.forEach(r=>{const i=IX[r.match.code];if(!i)return;
    i.history=i.history||[];i.history.push({at:Date.now(),from:i.price,to:r.price});
    i.price=r.price;});});
  invRows=[];invText='';R();
}

// ── UNIT-ERROR DETECTOR ─────────────────────────────────────────────────
// The two impossible dishes aren't expensive — someone typed grams where the
// recipe unit is kilos. Rather than just flagging them, work out the likely
// factor and prove it: if dividing by 1000 lands the dish in a sane food-cost
// band, that IS the error. Excel can't do this because it has no notion of
// what a plausible dish costs.
const FACTORS=[1000,100,10];
function unitSuspects(){
  const out=[];
  DATA.menu.forEach((m,mi)=>{ if(!inDept(m))return;
    const total=itemCost(m); if(!total)return;
    const costs=m.lines.map(l=>lineCost(l));
    const med=[...costs].filter(c=>c>0).sort((a,b)=>a-b)[Math.floor(costs.filter(c=>c>0).length/2)]||0;
    m.lines.forEach((l,li)=>{
      const c=lineCost(l); if(!c)return;
      const share=c/total;
      const domin=share>0.7 && med>0 && c>med*10;
      const overprice=m.menuPrice>0 && total>m.menuPrice;
      if(!domin && !overprice) return;
      if(!domin) return;
      // find the factor that lands food cost between 5% and 45%
      let best=null;
      for(const f of FACTORS){
        const t2=total-c+c/f;
        const fc=netPrice(m)?t2/netPrice(m):null;
        if(fc!=null && fc>=0.05 && fc<=0.45){best={f,newTotal:t2,fc};break}
      }
      out.push({mi,li,dish:m.name,ing:nameOf(l.ref),qty:l.qty,lineCost:c,
        total,share,price:m.menuPrice,fix:best,
        confidence: best? (overprice?'high':'medium') : 'low'});
    });
  });
  return out.sort((a,b)=>b.share-a.share);
}
function applyUnitFix(mi,li,f){
  edit(()=>{const l=DATA.menu[mi].lines[li];l.qty=(l.qty||0)/f});
}

// ── WHERE USED ──────────────────────────────────────────────────────────
// "Chicken went up — what's affected?" is the most common real question and
// the workbook cannot answer it at all.
function whereUsed(code){
  const dishes=[],recipes=[];
  DATA.menu.forEach(m=>{if(inDept(m)&&m.lines.some(l=>!isB(l.ref)&&codeOf(l.ref)===code))
    dishes.push({name:m.name,cost:itemCost(m),fc:fcPct(m),via:'direct'})});
  DATA.batch.forEach(b=>{if(b.lines.some(l=>!isB(l.ref)&&codeOf(l.ref)===code)){
    recipes.push({name:b.name,cost:batchCost(b)});
    DATA.menu.forEach(m=>{if(inDept(m)&&m.lines.some(l=>isB(l.ref)&&l.ref==='B'+b.id))
      dishes.push({name:m.name,cost:itemCost(m),fc:fcPct(m),via:'via '+b.name})})}});
  const seen=new Set();
  return {dishes:dishes.filter(d=>{const k=d.name+d.via;if(seen.has(k))return false;seen.add(k);return true}),recipes};
}

// ── BULK REPRICING ──────────────────────────────────────────────────────
// What adopting target margin across the menu is actually worth, in money.
function repricePlan(){
  return priced().filter(m=>fcPct(m)<=1).map(m=>{
    // cost / target gives the NET price the dish must achieve; gross it back
    // up so the suggestion is a number you could actually print on a menu.
    const c=itemCost(m), sug=grossOf(c/targetFor(m)), delta=sug-m.menuPrice;
    const wk=m.weeklySales||0;
    return {m,c,cur:m.menuPrice,sug,delta,fc:fcPct(m),weeklyGain:delta*wk};
  }).sort((a,b)=>b.delta-a.delta);
}

// ── PRODUCTION PLANNER / SHOPPING LIST ──────────────────────────────────
// "We expect this many covers — what do I actually buy?" Explodes every dish
// through its batch recipes down to raw purchasable ingredients, converts
// recipe units back to PURCHASE units, and totals the money. This is the one
// that replaces somebody's Sunday afternoon.
let planDays=7;
function explode(){
  const need={}; // code -> recipe-unit qty
  const add=(ref,qty,seen)=>{
    if(!qty)return;
    if(isB(ref)){
      const b=BX[ref]; if(!b)return;
      seen=seen||new Set(); if(seen.has(b.id))return; seen.add(b.id);
      const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
      b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,new Set(seen)));
      return;
    }
    const c=codeOf(ref); need[c]=(need[c]||0)+qty;
  };
  DATA.menu.forEach(m=>{
    if(!inDept(m))return;
    const covers=(m.weeklySales||0)*(planDays/7);
    if(!covers)return;
    m.lines.forEach(l=>add(l.ref,(l.qty||0)*covers));
  });
  return Object.entries(need).map(([c,qty])=>{
    const i=IX[c]; if(!i)return null;
    const perPack=i.ruPerPu||1;
    const packs=qty/perPack;
    return {ing:i,qty,packs,cost:qty*costPerRu(i)};
  }).filter(Boolean).sort((a,b)=>b.cost-a.cost);
}
