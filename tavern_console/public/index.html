// ════════════════════════════════════════════════════════════════════════
// FINDINGS
//
// The console has thirty-odd analytical screens. A manager will not read
// thirty screens, and should not have to: the job is to say where the money
// went, in order, with the arithmetic attached.
//
// ── THE THREE RULES ────────────────────────────────────────────────────
//
// 1. EVERY FINDING SHOWS ITS WORKING. Not a claim, a calculation, with the
//    inputs named. A number an owner cannot check is a number they will
//    eventually stop believing — usually at the worst moment.
//
// 2. DATA QUALITY GATES PUBLICATION. A finding whose inputs are too thin is
//    SUPPRESSED, not published with a caveat. The theoretical food cost on
//    this venue's own book reads 161% — an artefact of costing 38 items out
//    of 152 — and printing that with "low confidence" next to it still
//    printed it. The suppressed ones are listed separately with what they
//    need, because "here is what I could not tell you and why" is the part
//    that makes someone finish the setup.
//
// 3. MONEY IS ONLY STATED WHEN IT IS ARITHMETIC. "You paid 5.00/kg from one
//    supplier and 3.60/kg from another; at 300kg that difference is 420" is
//    subtraction over invoices you already have. "Raising this price would
//    earn 310" is a forecast that assumes volume does not move, and volume is
//    the one thing a price change is guaranteed to touch. The first is a
//    finding; the second is not, and is not produced here.
// ════════════════════════════════════════════════════════════════════════

const SEV={high:3,med:2,low:1};

/// Defaults for a finding. Named rather than a one-letter global — `F` is the
/// kind of name that collides with something six months later.
function mkFinding(o){ return Object.assign({severity:'med',money:null,confidence:'measured'},o); }

// ── COMPARING TWO PERIODS ───────────────────────────────────────────────
//
// Everything the report said until now came from one week. The ledger holds
// months, and the findings an owner actually acts on are comparisons: sales
// down against the same month last quarter, labour creeping up three weeks
// running, guests holding while spend per head falls.
//
// The rule that keeps it honest is coverage. A month missing nine days will
// happily produce a total, and that total will be low for a reason that has
// nothing to do with trade. So a comparison is only made when BOTH periods
// are essentially complete, and when they are not, the report says which days
// are missing rather than quietly comparing anyway.
const COMPARE_MIN_COVER=0.9;

function periodTotals(from,to){
  const days=[];
  for(let i=0,n=dayDiff(from,to);i<=n;i++)days.push(dayAdd(from,i));
  let sales=0,guests=0,hours=0,labour=0,n=0;
  for(const d of days){
    const r=DATA.ledger.days[d]; if(!r)continue;
    if(+r.sales>0)n++;
    sales+=+r.sales||0; guests+=+r.guests||0;
    for(const [nm,h] of Object.entries(r.hours||{})){
      hours+=+h||0;
      const c=(r.cost||{})[nm];
      labour+=(c!=null?+c||0:(+DATA.rateBook[nm]||0)*(+h||0));
    }
  }
  const purch=(DATA.ledger.purchases||[])
    .filter(p=>{const d=isoDate(p.date);return d&&d>=from&&d<=to})
    .reduce((s,p)=>s+(+p.amount||0),0);
  return {from,to,days:days.length,withSales:n,sales,guests,hours,labour,purch,
    spend:guests>0?sales/guests:null,
    splh:hours>0?sales/hours:null,
    labourPct:sales>0?labour/sales:null,
    prime:sales>0?(labour+purch)/sales:null};
}

/// The two most recent complete months on record, or null.
function comparableMonths(){
  const ms=ledgerMonths().map(m=>m.month);
  const ok=[];
  for(const m of ms){
    const from=m+'-01', to=m+'-'+String(daysInMonth(m)).padStart(2,'0');
    const c=coverage(from,to,'sales');
    if(c.pct>=COMPARE_MIN_COVER)ok.push({month:m,from,to,cover:c});
  }
  if(ok.length<2)return {pair:null,complete:ok.length,months:ms.length};
  return {pair:[ok[ok.length-2],ok[ok.length-1]],complete:ok.length,months:ms.length};
}

/// Findings that only exist because history is kept.
function trendFindings(){
  const out=[],blocked=[];
  const C=comparableMonths();
  if(!C.pair){
    if(C.months)blocked.push({title:'Month-on-month comparison',
      what:`${C.complete} of ${C.months} month(s) on record are complete enough to compare. A month with days missing produces a total that is low for a reason that has nothing to do with trade`});
    return {out,blocked};
  }
  const [a,b]=C.pair;
  const A=periodTotals(a.from,a.to), B=periodTotals(b.from,b.to);
  const move=(x,y)=>(x>0&&y>0)?(y-x)/x:null;

  const sales=move(A.sales,B.sales);
  if(sales!=null&&Math.abs(sales)>=0.05)
    out.push(mkFinding({id:'trend-sales',severity:sales<0?'high':'low',
      title:`Sales ${sales<0?'down':'up'} ${(Math.abs(sales)*100).toFixed(1)}% on ${a.month}`,
      what:`${b.month} took ${m2(B.sales)} against ${m2(A.sales)}.`,
      evidence:[`${a.month}: ${m2(A.sales)} over ${A.withSales} trading day(s)`,
                `${b.month}: ${m2(B.sales)} over ${B.withSales} trading day(s)`,
                B.guests&&A.guests?`Guests ${A.guests} → ${B.guests}`:''].filter(Boolean),
      working:`(${m2(B.sales)} − ${m2(A.sales)}) ÷ ${m2(A.sales)} = ${(sales*100).toFixed(1)}%`,
      money:sales<0?A.sales-B.sales:null, moneyLabel:sales<0?`less than ${a.month}`:null,
      action:A.guests&&B.guests
        ? (move(A.guests,B.guests)!=null&&Math.abs(move(A.guests,B.guests))>=0.05
            ? 'Guest numbers moved too, so this is footfall rather than pricing.'
            : 'Guest numbers held, so this is spend per head rather than footfall.')
        : 'Add guest counts and this splits into footfall versus spend per head.',
      go:'history'}));

  const spend=move(A.spend,B.spend);
  if(spend!=null&&Math.abs(spend)>=0.05)
    out.push(mkFinding({id:'trend-spend',severity:spend<0?'med':'low',
      title:`Spend per guest ${spend<0?'down':'up'} ${(Math.abs(spend)*100).toFixed(1)}%`,
      what:`${m2(A.spend)} → ${m2(B.spend)} a head.`,
      evidence:[`${a.month}: ${m2(A.sales)} ÷ ${A.guests} guests`,
                `${b.month}: ${m2(B.sales)} ÷ ${B.guests} guests`],
      working:`(${m2(B.spend)} − ${m2(A.spend)}) ÷ ${m2(A.spend)} = ${(spend*100).toFixed(1)}%`,
      action:'The same number of people spending differently is a menu and upsell question, not a marketing one.',
      go:'eng'}));

  const lp=(A.labourPct!=null&&B.labourPct!=null)?B.labourPct-A.labourPct:null;
  if(lp!=null&&Math.abs(lp)>=0.02)
    out.push(mkFinding({id:'trend-labour',severity:lp>0?'high':'low',
      title:`Labour ${lp>0?'up':'down'} ${(Math.abs(lp)*100).toFixed(1)} points of sales`,
      what:`${(A.labourPct*100).toFixed(1)}% in ${a.month} → ${(B.labourPct*100).toFixed(1)}% in ${b.month}.`,
      evidence:[`${a.month}: ${m2(A.labour)} on ${m2(A.sales)}, ${A.hours.toFixed(0)} hours`,
                `${b.month}: ${m2(B.labour)} on ${m2(B.sales)}, ${B.hours.toFixed(0)} hours`],
      working:`${m2(B.labour)} ÷ ${m2(B.sales)} − ${m2(A.labour)} ÷ ${m2(A.sales)} = ${(lp*100).toFixed(1)} points`,
      money:lp>0?lp*B.sales:null, moneyLabel:lp>0?`a month at the new rate`:null,
      action:lp>0&&B.hours>A.hours?'Hours went up as well, so this is the rota rather than wages.'
            :lp>0?'Hours did not rise, so this is sales falling under a fixed rota.':'Hold it.',
      go:'labour'}));
  return {out,blocked};
}

/// Every finding the current data can honestly support.
function findings(){
  const out=[],blocked=[];
  const wk=WK(), menu=DATA.menu||[], ing=DATA.ingredients||[];
  const need=(cond,title,what)=>{ if(!cond){blocked.push({title,what});return false;} return true; };

  // ── 1. Impossible values. Cheapest to fix, silently corrupts everything.
  const imp=impossibleValues();
  if(imp.length) out.push(mkFinding({id:'impossible',severity:'high',title:
    `${imp.length} impossible value${imp.length>1?'s':''} in your data`,
    what:'A negative or zero price makes every recipe that uses it look cheaper than it is.',
    evidence:imp.slice(0,6).map(x=>`${x.name}: ${x.why}`),
    working:'Found by scanning every ingredient and recipe line for values that cannot be true.',
    action:'Fix these first — every other number below is computed from them.',
    go:'ing'}));

  // ── 2. What you bank vs what the menu says.
  const mul=_rateMul();
  if(mul>1.0001){
    const gap=1-1/mul;
    out.push(mkFinding({id:'netgap',severity:'high',title:
      `${(gap*100).toFixed(1)}% of every menu price is not yours`,
      what:'Tax and service come off the top. Costing against the menu price makes every dish look healthier than it is.',
      evidence:[`VAT ${((DATA.rates.vat||0)*100).toFixed(1)}% · service ${((DATA.rates.service||0)*100).toFixed(1)}% · levy ${((DATA.rates.levy||0)*100).toFixed(1)}%`,
        `A dish at 10.000 on the menu banks ${netOf(10).toFixed(3)}`],
      working:`Rates compound rather than add: 1 ÷ (${[1+ +(DATA.rates.vat||0),1+ +(DATA.rates.service||0),1+ +(DATA.rates.levy||0)].map(x=>x.toFixed(2)).join(' × ')}) = ${(1/mul).toFixed(4)}`,
      action:'Nothing to fix — this is already applied everywhere. Worth knowing before you read any percentage below.',
      go:'pos'}));
  }

  // ── 3. Prime cost.
  const P=primeCost();
  if(need(P.sales>0,'Prime cost','sales for the week')){
    if(P.pct!=null){
      // PRIME_TARGET is {good, warn}, not a number — using it directly here
      // would have rendered NaN% on the first screen a manager reads.
      const over=P.pct-PRIME_TARGET.warn;
      out.push(mkFinding({id:'prime',severity:over>0.05?'high':over>0?'med':'low',
        title:`Prime cost is ${(P.pct*100).toFixed(1)}% of sales`,
        what:over>0?`That is ${(over*100).toFixed(1)} points above the ${(PRIME_TARGET.warn*100).toFixed(0)}% benchmark.`
                   :'That is inside the usual benchmark.',
        evidence:[`Sales ${m2(P.sales)}`,`Cost of goods ${m2(P.cogs)} (${P.cogsPct!=null?(P.cogsPct*100).toFixed(1):'—'}%)`,
                  `Labour ${m2(P.labour)} (${P.labourPct!=null?(P.labourPct*100).toFixed(1):'—'}%)`],
        working:`(${m2(P.cogs)} + ${m2(P.labour)}) ÷ ${m2(P.sales)} = ${(P.pct*100).toFixed(1)}%`,
        money: over>0 ? over*P.sales : null,
        moneyLabel: over>0?`per week above benchmark`:null,
        action:over>0?'Look at the labour finding below first — it is usually the faster of the two to move.':'Hold it.',
        go:'week'}));
    }
  }

  // ── 4. Labour that did not meet trade.
  const dead=deadDays();
  if(dead.length){
    const wasted=dead.reduce((s,d)=>s+(d.cost||0),0);
    out.push(mkFinding({id:'deadhours',severity:'high',
      title:`${dead.length} day${dead.length>1?'s':''} staffed below ${m2(splhFloor())} sales per labour hour`,
      what:'Hours rostered against trade that did not arrive.',
      evidence:dead.slice(0,5).map(d=>`${d.dow}: ${d.hours} hours, ${m2(d.sales)} sales`+
        (d.splh==null?' — staffed with no sales at all':` — ${m2(d.splh)}/hr`)),
      working:`Labour cost on those days: ${dead.slice(0,5).map(d=>m2(d.cost||0)).join(' + ')} = ${m2(wasted)}`,
      money:wasted, moneyLabel:'labour cost on those days',
      action:'Compare the rota against the same days last month before cutting — one quiet week is weather, three is a pattern.',
      go:'labour',
      caveat:(DATA.settings||{}).splhFloor>0
        ? `${m2(splhFloor())} is the floor you set.`
        : `${m2(splhFloor())} is worked out from your own wage bill — about ${SPLH_MULTIPLE}× what an hour of your labour costs — not a borrowed benchmark. Change it in Settings if your rent and overheads say otherwise.`}));
  }

  // ── 5. SUPPLIER PRICE COMPARISON — provable money, from your own invoices.
  const sup=supplierSpread();
  for(const s of sup.slice(0,6)){
    out.push(mkFinding({id:'supplier-'+s.name,severity:s.saving>0?'high':'med',
      title:`${s.name}: you pay ${(s.spreadPct*100).toFixed(0)}% more from one supplier than another`,
      what:`Same ingredient, different suppliers, different price per ${s.unit}.`,
      evidence:s.bySupplier.map(b=>`${b.supplier}: ${b.price.toFixed(3)} per ${s.unit} (${b.qty.toFixed(1)} ${s.unit} bought)`),
      working:`Cheapest ${s.min.toFixed(3)} · dearest ${s.max.toFixed(3)} · you bought ${s.totalQty.toFixed(1)} ${s.unit}. `+
              `Buying it all at the cheapest price: ${m2(s.totalQty*s.min)} instead of ${m2(s.spent)}.`,
      money:s.saving, moneyLabel:'over the invoices on record',
      confidence:'measured',
      action:'Check they are genuinely the same product and grade before switching — a price gap this size is sometimes a quality gap.',
      go:'ing'}));
  }

  // ── 6. Price drift.
  const drift=priceDrift();
  for(const d of drift.slice(0,5)){
    out.push(mkFinding({id:'drift-'+d.name,severity:d.pct>0.2?'high':'med',
      title:`${d.name} is up ${(d.pct*100).toFixed(0)}%`,
      what:'Compared with the earliest price on record for it.',
      evidence:[`${d.from.toFixed(3)} on ${fmtDate(d.fromAt)} → ${d.to.toFixed(3)} on ${fmtDate(d.toAt)}`],
      working:`(${d.to.toFixed(3)} − ${d.from.toFixed(3)}) ÷ ${d.from.toFixed(3)} = ${(d.pct*100).toFixed(1)}%`,
      action:'Every dish using this is now costing more than its recipe card says.',
      go:'hist'}));
  }

  // ── 7. What the sales mix reveals: concentration, then dead weight.
  const soldItems=menu.filter(m=>(m.weeklySales||0)>0);
  const sold=soldItems.length;
  if(need(sold>0,'Sales mix','a sales report')){
    // How long the report covers, in plain terms, so the finding can say
    // "in the 7 months your report covers" rather than an abstract count.
    const wks=+(DATA.salesWeeks||POS.weeks||0);
    const winLabel = wks>=8   ? `the ${Math.max(1,Math.round(wks/4.345))} months your sales report covers`
                   : wks>=1.5 ? `the ${Math.round(wks)} weeks your sales report covers`
                   : `your sales report`;

    // Concentration — the short head almost every menu has. Ranks dishes by net
    // revenue (net of tax and service, like everything else) and finds the
    // smallest set that already carries 70% of the money.
    const rev=m=>(m.weeklySales||0)*(netPrice(m)||m.menuPrice||0);
    const ranked=soldItems.slice().sort((a,b)=>rev(b)-rev(a));
    const totalRev=ranked.reduce((s,m)=>s+rev(m),0);
    if(totalRev>0){
      let cum=0,n=0;
      for(const m of ranked){ cum+=rev(m); n++; if(cum/totalRev>=0.7)break; }
      const share=cum/totalRev;
      out.push(mkFinding({id:'concentration',severity:'low',
        title:`${n} of your ${sold} dishes bring in ${(share*100).toFixed(0)}% of sales`,
        what:'A short head carries the menu — these are the dishes worth costing first and protecting hardest.',
        evidence:ranked.slice(0,6).map(m=>`${m.name} — ${m2(rev(m))}/week (${((rev(m)/totalRev)*100).toFixed(0)}%)`),
        working:`Ranked by weekly units × net price; summed until the running total passed 70% of ${m2(totalRev)}/week.`,
        action:'Start your recipes with these — costing the top few covers most of the money.',
        go:'eng'}));
    }

    // Dead weight — items with no recorded sale across the whole report window.
    const deadItems=menu.filter(m=>!(m.weeklySales>0));
    if(deadItems.length) out.push(mkFinding({id:'dead',severity:'med',
      title:`${deadItems.length} menu item${deadItems.length>1?'s':''} didn\u2019t sell in ${winLabel}`,
      what:'They still cost you menu space, prep, stock and training.',
      evidence:deadItems.slice(0,8).map(m=>m.name),
      working:`${menu.length} items on the menu, ${sold} with a recorded sale, ${deadItems.length} with none.`,
      action:'Cutting these shortens the menu and the stock list at the same time.',
      go:'eng'}));
  }

  // ── 8. Where the effort should go.
  if(sold>0){
    const ranked=menu.filter(m=>m.weeklySales>0)
      .map(m=>({m,rev:(m.weeklySales||0)*netPrice(m)||0}))
      .sort((a,b)=>b.rev-a.rev);
    const total=ranked.reduce((s,x)=>s+x.rev,0);
    const top20=ranked.slice(0,20);
    const share=total?top20.reduce((s,x)=>s+x.rev,0)/total:0;
    const uncosted=top20.filter(x=>!(x.m.lines||[]).length);
    if(uncosted.length) out.push(mkFinding({id:'effort',severity:'high',
      title:`${uncosted.length} of your top 20 sellers have no recipe`,
      what:`Those 20 dishes are ${(share*100).toFixed(0)}% of your revenue.`,
      evidence:uncosted.slice(0,8).map(x=>`${x.m.name} — ${m2(x.rev)}/week`),
      working:`Ranked by units sold × net price. Top 20 = ${m2(top20.reduce((s,x)=>s+x.rev,0))} of ${m2(total)}.`,
      action:'Print recipe sheets for exactly these and nothing else.',
      go:'sheets'}));
  }

  // ── 9. Uncategorised spend.
  const unal=(wk.purchases||[]).filter(p=>!Object.keys(p.alloc||{}).length);
  if(unal.length) out.push(mkFinding({id:'unalloc',severity:'med',
    title:`${m2(unal.reduce((s,p)=>s+(+p.amount||0),0))} of purchases not assigned to a category`,
    what:'Unassigned spend lands nowhere, so food cost and pour cost are both understated.',
    evidence:unal.slice(0,6).map(p=>`${p.supplier||'(no supplier)'} ${p.date||''} — ${m2(p.amount||0)}`),
    working:`${unal.length} of ${(wk.purchases||[]).length} invoices have no category.`,
    action:'Assign them on the purchases screen.', go:'purch'}));

  // ── SUPPRESSED, and why.
  // Named menuCovered, not `coverage` — a local by that name shadows the
  // coverage() function for the WHOLE of this scope, so every call to it
  // inside findings() threw. Shadowing a function with a const is invisible
  // until the moment something calls it.
  const costed=menu.filter(m=>(m.lines||[]).length).length;
  const menuCovered=menu.length?costed/menu.length:0;
  if(menuCovered<0.6) blocked.push({title:'Theoretical vs actual food cost',
    what:`only ${(menuCovered*100).toFixed(0)}% of the menu is costed — below 60% this figure says more about which dishes are missing than about the kitchen`});
  if(!(DATA.countHistory||[]).length) blocked.push({title:'Stock variance — waste, over-portioning, theft',
    what:'no stock count has been taken; without one the console can only see spend, not consumption'});
  if(vatUnset()) blocked.push({title:'Whether your ingredient costs are right at all',
    what:'you have imported purchases but not said whether the invoice prices include VAT and whether you reclaim it — until you do, every food cost could be off by the VAT rate. Set it in Settings.'});
  if(!ratesSet()) blocked.push({title:'Every percentage on this page',
    what:'tax and service rates are not set, so margins are measured against the menu price rather than what you bank'});

  // Findings that only exist because the ledger keeps history.
  const T=trendFindings();
  out.push(...T.out); blocked.push(...T.blocked);

  // Say plainly which days the single-week findings above were computed from.
  const wkDaysList=(WK().days||[]).filter(Boolean);
  if(wkDaysList.length){
    const c=coverage(wkDaysList[0],wkDaysList[wkDaysList.length-1],'sales');
    if(c.pct<1)blocked.push({title:'The week being analysed is incomplete',
      what:`${c.have} of ${c.days} days have sales. Everything above that uses the week — prime cost, labour, sales per hour — is understated by whatever happened on ${c.missing.map(d=>d.slice(-5)).join(', ')}`});
  }

  // Revenue coverage, because the row count flatters a half-costed book.
  const RC=revenueCoverage();
  if(RC.pct!=null&&RC.pct<0.6&&RC.top.length)
    out.push(mkFinding({id:'revcover',severity:'high',
      title:`Only ${(RC.pct*100).toFixed(0)}% of your revenue is costed`,
      what:`${RC.itemsCosted} of ${RC.items} selling dishes have a recipe — but dishes are not equal, and these are the ones that matter.`,
      evidence:RC.top.slice(0,6).map(t=>`${t.name} — ${m2(t.rev)}/week, ${(t.share*100).toFixed(1)}% of revenue, no recipe`),
      working:`${m2(RC.costed)} of ${m2(RC.total)} weekly revenue sits on a costed dish.`,
      action:'Cost these six and the app understands most of your money. Print sheets for exactly these.',
      go:'sheets'}));

  out.sort((a,b)=>(SEV[b.severity]-SEV[a.severity])||((b.money||0)-(a.money||0)));
  return {findings:out,blocked,
    money:out.reduce((s,f)=>s+(f.money||0),0),
    trust:trustScore(), revenue:RC};
}

/// Same ingredient, different suppliers. Pure arithmetic over what you paid.
function supplierSpread(){
  const out=[];
  for(const i of (DATA.ingredients||[])){
    const h=(i.history||[]).filter(x=>x.price>0&&x.supplier);
    if(h.length<2)continue;
    const by={};
    for(const x of h){
      const k=x.supplier;
      by[k]=by[k]||{supplier:k,qty:0,spent:0,n:0};
      const q=+x.qty||1;
      by[k].qty+=q; by[k].spent+=q*x.price; by[k].n++;
    }
    const rows=Object.values(by).map(b=>({...b,price:b.qty?b.spent/b.qty:0}))
      .filter(b=>b.price>0).sort((a,b)=>a.price-b.price);
    if(rows.length<2)continue;
    const min=rows[0].price, max=rows[rows.length-1].price;
    if(!(min>0)||max/min<1.08)continue;         // under 8% is noise, not a finding
    const totalQty=rows.reduce((s,b)=>s+b.qty,0);
    const spent=rows.reduce((s,b)=>s+b.spent,0);
    out.push({name:i.name,unit:i.recipeUnit||i.pu||'unit',bySupplier:rows,
      min,max,spreadPct:(max-min)/min,totalQty,spent,
      saving:spent-totalQty*min});
  }
  return out.sort((a,b)=>b.saving-a.saving);
}

/// What has moved since the first price on record.
function priceDrift(){
  const out=[];
  for(const i of (DATA.ingredients||[])){
    const h=(i.history||[]).filter(x=>x.price>0).sort((a,b)=>(a.at||0)-(b.at||0));
    if(h.length<2)continue;
    const from=h[0].price,to=h[h.length-1].price;
    if(!(from>0))continue;
    const pct=(to-from)/from;
    if(Math.abs(pct)<0.1)continue;
    out.push({name:i.name,from,to,pct,fromAt:h[0].at,toAt:h[h.length-1].at});
  }
  return out.sort((a,b)=>b.pct-a.pct);
}


// ════════════════════════════════════════════════════════════════════════
// COMPARING YOUR MENU WITH OTHERS
//
// ── WHAT THIS DELIBERATELY DOES NOT DO ─────────────────────────────────
//
// It does not scrape delivery aggregators. Their terms prohibit it, the data
// is theirs, and building a product on a term-of-service violation is a
// business risk dressed up as a feature.
//
// It does not recommend a price. A recommendation of the form "move this to
// 4.700 and earn 310 more" requires PRICE ELASTICITY — how much volume falls
// when the price rises — and nothing here measures elasticity. Assuming it is
// zero is the one assumption we know to be false about a price change. So the
// output is your POSITION in a band, which is a fact, rather than a
// recommendation, which would be a forecast wearing a fact's clothes.
//
// ── WHAT IT DOES ───────────────────────────────────────────────────────
//
// You collect competitor menus the ordinary way — a PDF from their website, a
// photograph of a menu on the table. The console already reads both. Each one
// becomes a named comparison set. Dishes are matched by name similarity within
// a category, and you see where you sit: the band, the median, and your
// distance from it, per dish.
//
// What you do with that is yours. The app's job is to stop you guessing about
// the part that is knowable.
// ════════════════════════════════════════════════════════════════════════

DATA.market=DATA.market||[];      // [{id,name,area,at,items:[{name,price,category}]}]

// ════════════════════════════════════════════════════════════════════════
// AUTOMATIC RESEARCH
//
// ── WHY THIS COULD NOT BE DONE THE OBVIOUS WAY ─────────────────────────
//
// A browser page cannot fetch another website. The same-origin policy stops
// it, and no amount of code in this file changes that — "just fetch their
// menu page" is not available to a single HTML file, ever.
//
// What IS available: the model API runs searches on its own servers and
// returns results with citations. So the console asks Claude to do the
// looking, and gets back sources it can show. No proxy, no scraper, no
// server of ours, and the same key that already reads menus.
//
// ── THE LINE, NOW ENFORCED IN CODE ─────────────────────────────────────
//
// The rebuttal argued against building on delivery aggregators: their terms
// prohibit it and a product resting on a terms violation is a business risk
// wearing a feature's clothes. That was a paragraph of prose, which is the
// weakest form a rule can take. It is now BLOCKED_SOURCES, passed to the API
// as blocked_domains on every research call. A rule in an argument gets
// forgotten; a rule in the request cannot.
//
// ── WHAT COMES BACK, AND HOW MUCH TO TRUST IT ──────────────────────────
//
// Every price carries the URL it came from and the date it was found. Menu
// prices online go stale, sites keep old PDFs up, and a "menu" page is
// sometimes three years old. So researched sets are labelled as researched,
// dated, and fed through the SAME comparability scoring as menus you
// photograph yourself — a researched price is evidence, not a fact, and it
// competes on equal terms with everything else.
//
// Nothing is written without review.
// ════════════════════════════════════════════════════════════════════════

/// Aggregators, in code rather than in a comment.
const BLOCKED_SOURCES=['talabat.com','deliveroo.com','ubereats.com','doordash.com',
  'jahez.net','hungerstation.com','carriage.com','zomato.com','grubhub.com',
  'justeat.com','foodpanda.com','swiggy.com','glovoapp.com'];

/// Where the venue is. Search results are localised on this, which is the
/// whole point of "similar geo" — a menu price in London says nothing about
/// a menu price in Adliya.
function venueLocation(){
  const v=DATA.venueInfo||{};
  return {city:v.city||'',region:v.region||'',country:(v.country||'').toUpperCase(),
          timezone:v.timezone||(Intl.DateTimeFormat().resolvedOptions().timeZone||'')};
}
function setVenueInfo(k,val){ edit(()=>{DATA.venueInfo=Object.assign({},DATA.venueInfo);
  DATA.venueInfo[k]=val;}); }

/// One research call, with the server-side search tool.
///
/// Handles `pause_turn`: a long search turn can come back paused, and the
/// documented continuation is to send the assistant message back unchanged.
/// Without that loop a slow search looks like an empty result.
// ── WHY THE FIRST SEARCH FOUND NOTHING ─────────────────────────────────
//
// Seventeen sources, zero prices. That is not a bug, it is Bahrain: menus
// live on Instagram as pictures, on Google Maps behind JavaScript, or as a
// PDF linked from a site the search summary never opened.
//
// Search alone only ever sees search-result text. Adding WEB FETCH lets the
// model open what it found — and fetch handles PDFs by processing them the
// same way an attached PDF is processed, which is exactly the "find the menu
// PDF and read it" path. It costs nothing beyond tokens.
//
// ── WHAT STILL WILL NOT WORK, STATED PLAINLY ───────────────────────────
//
// Fetch does not render JavaScript. Instagram, Facebook and Google Maps are
// all JavaScript-rendered, so their menus cannot be read this way no matter
// how the prompt is worded. Their terms also forbid scraping them.
//
// What those platforms ARE good for is finding out WHO exists and where their
// real site is. So the search is told to use them as a directory — venue
// names, areas, and the link to a site or a PDF — and the reading happens on
// whatever it points to. That matches how a person would actually do it.
//
// When a source cannot be read, the reason is reported rather than silently
// producing an empty result, because "their menu is only on Instagram" is a
// useful thing for an owner to know about a competitor.
const JS_ONLY_HOSTS=['instagram.com','facebook.com','fb.com','google.com/maps',
  'maps.app.goo.gl','tiktok.com','linktr.ee'];

async function aiResearch(system,prompt,maxUses,onStep,useFetch){
  if(!aiReady())throw new Error('AI assist is not switched on.');
  if(DATA.ai.provider!=='anthropic')
    throw new Error('Automatic research uses Claude, which runs the search on its own servers. Switch provider to Claude.');
  const g=authorizeCalls(1);
  if(!g.ok)throw new Error(g.reason);

  const p=AI_PROVIDERS.anthropic;
  const loc=venueLocation();
  const tool={type:'web_search_20250305',name:'web_search',max_uses:maxUses||6,
              blocked_domains:BLOCKED_SOURCES};
  if(loc.city||loc.country||loc.region||loc.timezone){
    tool.user_location={type:'approximate'};
    for(const k of ['city','region','country','timezone']) if(loc[k])tool.user_location[k]=loc[k];
  }
  const tools=[tool];
  if(useFetch!==false){
    // Fetch can only open URLs that already appeared in the conversation —
    // which here means URLs the search returned. That is a security property
    // of the API, and it happens to be exactly the workflow wanted.
    tools.push({type:'web_fetch_20250910',name:'web_fetch',
      max_uses:(maxUses||6)*2, blocked_domains:BLOCKED_SOURCES,
      citations:{enabled:true}, max_content_tokens:40000});
  }
  let messages=[{role:'user',content:prompt}];
  let searches=0, fetches=0, guard=0;
  const sources=[], fetched=[], fetchFails=[];
  let text='';

  while(guard++<4){
    if(onStep)onStep(guard,searches);
    const res=await netFetch(p.url,{method:'POST',headers:p.headers(DATA.ai.key),
      body:JSON.stringify({model:p.model,max_tokens:8000,system,messages,tools})});
    if(!res.ok){
      const t=await res.text().catch(()=>'');
      if(res.status===401)throw new Error('That API key was rejected.');
      if(res.status===429)throw new Error('Rate limited — wait a moment and try again.');
      if(res.status===400&&/web search is not enabled/i.test(t))
        throw new Error('Web search is switched off for this API key\'s organisation. It is enabled in the Claude Console under Privacy settings.');
      throw new Error(`Claude returned ${res.status}. ${t.slice(0,200)}`);
    }
    const j=await res.json();
    recordCall('research');
    searches+=(((j.usage||{}).server_tool_use||{}).web_search_requests)||0;
    fetches +=(((j.usage||{}).server_tool_use||{}).web_fetch_requests)||0;

    for(const b of (j.content||[])){
      if(b.type==='text'){
        text+=b.text||'';
        for(const c of (b.citations||[]))
          if(c.url&&!sources.some(s=>s.url===c.url))
            sources.push({url:c.url,title:c.title||'',cited:c.cited_text||''});
      }
      if(b.type==='web_search_tool_result'){
        const cc=b.content;
        if(cc&&cc.type==='web_search_tool_result_error')
          throw new Error('The search failed: '+cc.error_code);
        for(const r of (Array.isArray(cc)?cc:[]))
          if(r.url&&!sources.some(s=>s.url===r.url))
            sources.push({url:r.url,title:r.title||'',age:r.page_age||''});
      }
      if(b.type==='web_fetch_tool_result'){
        const cc=b.content;
        if(cc&&cc.type==='web_fetch_tool_result_error'){
          // A failed fetch is information, not a crash. Which pages could not
          // be opened, and why, is worth showing.
          fetchFails.push({code:cc.error_code});
        }else if(cc&&cc.url){
          fetched.push({url:cc.url,at:cc.retrieved_at||'',
            pdf:!!(cc.content&&cc.content.source&&cc.content.source.media_type==='application/pdf')});
          if(!sources.some(s=>s.url===cc.url))
            sources.push({url:cc.url,title:(cc.content&&cc.content.title)||'',opened:true});
        }
      }
    }
    // A paused turn is continued by sending the assistant message back
    // untouched — encrypted_content included, or the API rejects it.
    if(j.stop_reason==='pause_turn'){
      messages=messages.concat([{role:'assistant',content:j.content}]);
      continue;
    }
    break;
  }
  return {text,sources,searches,fetches,fetched,fetchFails};
}

/// Loose match between two dish names: shared significant words.
function dishSimilarity(a,b){
  const stop=new Set(['the','and','with','of','a','in','on','served','fresh','house','our','style']);
  const w=s=>new Set(String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ')
    .split(/\s+/).filter(x=>x.length>2&&!stop.has(x)));
  const A=w(a),B=w(b);
  if(!A.size||!B.size)return 0;
  let hit=0; for(const x of A) if(B.has(x))hit++;
  return hit/Math.min(A.size,B.size);
}

/// Your menu against every competitor set you have loaded.
///
/// Prices are compared NET of tax and service on your side, because that is
/// what you bank — but a competitor's printed price includes whatever they
/// charge. So the comparison is menu-price to menu-price, which is what a
/// guest sees, and that is stated rather than quietly mixed.
/// HOW COMPARABLE IS THIS COMPARISON?
///
/// The first version hid any dish with fewer than two matches, on the grounds
/// that one match is an anecdote. That is true and it was still the wrong
/// rule: a hard cutoff throws away information and never explains itself, so
/// the reader cannot tell a thin comparison from a strong one among the rows
/// that survived. Four measurable things separate them:
///
///   HOW MANY      one price is a data point; five is a band.
///   HOW MANY VENUES  three dishes off one menu is one opinion. Three
///                    venues is a market. This is the factor most people
///                    forget, and it is the one that matters most.
///   HOW CLOSE THE NAMES  a 0.95 name match is the same dish. A 0.6 match
///                        might be a different dish sharing a word.
///   HOW TIGHT THE PRICES  a band of 6.00–6.50 is a market with a view. A
///                         band of 3.00–14.00 means the matcher has grouped
///                         things that are not the same dish, and the median
///                         of that is arithmetic without meaning.
///
/// The score is the product of four factors so that ANY one of them being bad
/// pulls the result down — which is the correct shape here. Five matches from
/// one venue should not score well just because five is a lot.
function comparability(matches,prices){
  const n=matches.length;
  const venues=new Set(matches.map(o=>o.x.set)).size;
  const avgSim=matches.reduce((s,o)=>s+o.s,0)/n;
  const min=prices[0], max=prices[prices.length-1];
  const spread=min>0?(max-min)/min:1;

  const fCount  = n>=5?1 : n===4?0.9 : n===3?0.8 : n===2?0.6 : 0.3;
  const fVenue  = venues>=4?1 : venues===3?0.95 : venues===2?0.8 : 0.45;
  const fName   = Math.max(0,Math.min(1,(avgSim-0.5)/0.45));
  const fSpread = spread<=0.2?1 : spread<=0.5?0.85 : spread<=1?0.6 : 0.3;

  const score=fCount*fVenue*fName*fSpread;
  const why=[];
  why.push(`${n} comparable dish${n>1?'es':''} across ${venues} venue${venues>1?'s':''}`);
  why.push(avgSim>=0.85?'names match closely'
          :avgSim>=0.7?'names match reasonably'
          :'names only loosely match — check these are the same dish');
  if(n>1) why.push(spread<=0.2?'their prices agree with each other'
          :spread<=0.5?'their prices vary a little'
          :spread<=1?'their prices vary widely'
          :'their prices vary so widely that these are probably not the same dish');
  if(venues===1&&n>1) why.push('all from one venue, so this is one opinion rather than a market');
  return {score,
    label: score>=0.7?'strong' : score>=0.45?'fair' : score>=0.2?'weak' : 'anecdote',
    n,venues,avgSim,spread,why};
}

function marketCompare(minSim){
  const sim=minSim||0.6;
  const sets=DATA.market||[];
  const all=[];
  for(const s of sets) for(const it of (s.items||[]))
    if(it.name&&it.price>0) all.push({set:s.name,area:s.area||'',...it});
  if(!all.length)return {rows:[],sets:sets.length,items:0,above:0,below:0};
  const rows=[];
  for(const m of (DATA.menu||[])){
    if(!(m.menuPrice>0))continue;
    const matches=all.map(x=>({x,s:dishSimilarity(m.name,x.name)}))
      .filter(o=>o.s>=sim).sort((a,b)=>b.s-a.s);
    if(!matches.length)continue;
    const prices=matches.map(o=>+o.x.price).sort((a,b)=>a-b);
    const med=prices.length%2?prices[(prices.length-1)/2]
              :(prices[prices.length/2-1]+prices[prices.length/2])/2;
    const conf=comparability(matches,prices);
    rows.push({dish:m.name,dishId:m.id,dept:m.dept||'',yours:+m.menuPrice,
      n:matches.length,min:prices[0],max:prices[prices.length-1],median:med,
      delta:med?(+m.menuPrice-med)/med:0,
      conf,
      // A single price is not a band and must not be dressed as one. The
      // median of one number is that number, and calling it a median invites
      // it to be read as a market position.
      single:matches.length===1,
      matches:matches.slice(0,6).map(o=>({name:o.x.name,price:+o.x.price,set:o.x.set,sim:o.s,
        portion:o.x.portion||'',includes:o.x.includes||'',asOf:o.x.asOf||''})),
      // A comparison where nobody stated a portion is weaker: two "burgers"
      // at different prices might be a 150g and a 300g. Surfaced, not hidden.
      portionsKnown:matches.filter(o=>o.x.portion).length});
  }
  // Strongest comparisons first, then biggest difference. A large gap you
  // cannot trust should not outrank a solid one.
  rows.sort((a,b)=>(b.conf.score-a.conf.score)||(Math.abs(b.delta)-Math.abs(a.delta)));
  const solid=rows.filter(r=>r.conf.score>=0.45&&!r.single);
  return {rows,sets:sets.length,items:all.length,
    solid:solid.length,
    above:solid.filter(r=>r.delta>0.1).length,
    below:solid.filter(r=>r.delta<-0.1).length};
}

/// A price band as an inline bar. Shows the spread of competitor prices with
/// the median marked and YOUR price pinned — where you sit, at a glance.
/// Pure string; degrades to the numbers that are already in the row.
function bandBar(r){
  const lo=Math.min(r.min,r.yours), hi=Math.max(r.max,r.yours);
  const span=(hi-lo)||1;
  const at=v=>((v-lo)/span*100).toFixed(1);
  const youAbove=r.delta>0.02, youBelow=r.delta<-0.02;
  const youCol=Math.abs(r.delta)<0.1?'var(--good)':youAbove?'var(--warn)':'#7fb3d1';
  return `<div style="margin:14px 0 6px">
    <div style="position:relative;height:8px;background:#221b10;border-radius:4px">
      ${r.single?'':`<div style="position:absolute;left:${at(r.min)}%;width:${(at(r.max)-at(r.min))}%;top:0;height:100%;background:rgba(255,200,98,.22);border-radius:4px"></div>`}
      ${r.single?'':`<div style="position:absolute;left:${at(r.median)}%;top:-3px;width:2px;height:14px;background:var(--amber)" title="median ${r.median.toFixed(3)}"></div>`}
      <div style="position:absolute;left:${at(r.yours)}%;top:-6px;transform:translateX(-50%)">
        <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid ${youCol}"></div>
      </div>
    </div>
    <div class="mini" style="display:flex;justify-content:space-between;margin-top:8px">
      <span>${r.single?'the one price seen':'cheapest '+r.min.toFixed(3)}</span>
      <span style="color:${youCol}"><b>you ${r.yours.toFixed(3)}</b>${r.single?'':` · ${r.delta>0?'+':''}${(r.delta*100).toFixed(0)}% vs median`}</span>
      <span>${r.single?'':'dearest '+r.max.toFixed(3)}</span>
    </div>
  </div>`;
}
