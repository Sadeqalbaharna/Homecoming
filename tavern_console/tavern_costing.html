<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Tavern — Recipe Costing</title>
<style>
:root{--bg:#0d0a07;--panel:#171208;--line:#2e2415;--gold:#ffe7b0;--amber:#ffc862;
--txt:#efe6d6;--dim:#9c8f7a;--good:#7ee787;--warn:#ffc862;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center;
background:linear-gradient(180deg,#1a1409,#0d0a07);position:sticky;top:0;z-index:10}
h1{font-size:16px;margin:0;color:var(--gold);letter-spacing:.5px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 13px;
border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.4px}
nav button.on{background:var(--amber);color:#221a08;border-color:var(--amber)}
main{padding:18px 20px 60px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:26px;font-weight:700;color:var(--gold);line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
padding:9px 8px;border-bottom:1px solid var(--line);position:sticky;top:57px;background:#12100a;cursor:pointer}
td{padding:8px;border-bottom:1px solid #1e1810}
tr:hover td{background:#15110a}
.num{text-align:right;font-variant-numeric:tabular-nums}
input{background:#0b0906;border:1px solid var(--line);color:var(--gold);border-radius:6px;
padding:4px 7px;width:88px;font:inherit;text-align:right}
input:focus{outline:1px solid var(--amber)}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;display:inline-block}
.g{background:rgba(126,231,135,.15);color:var(--good)}
.w{background:rgba(255,200,98,.15);color:var(--warn)}
.b{background:rgba(255,107,107,.15);color:var(--bad)}
.search{background:#0b0906;border:1px solid var(--line);color:var(--txt);border-radius:9px;
padding:9px 13px;width:320px;font:inherit;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;color:var(--gold);font-size:15px}
.muted{color:var(--dim);font-size:12px}
.alert{border-left:3px solid var(--bad);padding:11px 14px;background:rgba(255,107,107,.07);
border-radius:0 9px 9px 0;margin-bottom:9px}
.alert b{color:var(--bad)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.bar{height:6px;background:#241c10;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.toolbar button,.fake{background:#1d1710;border:1px solid var(--line);color:var(--gold);
padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.add{background:var(--amber);color:#221a08;border:0;padding:8px 14px;border-radius:8px;
cursor:pointer;font:inherit;font-weight:700}
.add.sm{padding:5px 11px;font-size:12px;margin-top:8px}
.del{background:transparent;border:1px solid var(--bad);color:var(--bad);padding:6px 12px;
border-radius:8px;cursor:pointer;font:inherit;font-size:12px;margin-left:auto}
.x{background:transparent;border:0;color:var(--dim);cursor:pointer;font-size:14px}
.x:hover{color:var(--bad)}
.hd{display:flex;gap:12px;align-items:center;cursor:pointer}
.hd h3{margin:0;flex:0 1 auto}
.chev{margin-left:auto;color:var(--dim)}
.ed{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;padding:12px;background:#0f0c07;border-radius:9px}
.f label{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
input.wide{width:260px;text-align:left}
.totals{display:flex;gap:22px;align-items:center;margin-top:12px;flex-wrap:wrap}
.totals b{font-size:17px}
.li{padding:5px 0;border-bottom:1px solid #1e1810}

textarea{width:100%;background:#0b0906;border:1px solid var(--line);color:var(--txt);
border-radius:9px;padding:11px;font:12.5px/1.5 ui-monospace,Consolas,monospace;margin-top:10px}
select{background:#0b0906;border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:7px 10px;font:inherit}
nav button{padding:5px 8px;font-size:11px}
nav{max-width:62%}

.chip{background:#1b1610;border:1px solid var(--line);color:var(--txt);padding:5px 10px;
border-radius:99px;cursor:pointer;font:inherit;font-size:11.5px;margin-top:8px}
.chip.sel{background:var(--amber);color:#221a08;border-color:var(--amber)}
h4{letter-spacing:.6px}
</style></head><body>

// ── costing ─────────────────────────────────────────────────────────────
function costPerRu(i){if(!i)return 0;if(i.price==null||!i.ruPerPu)return i.costPerRu??0;
  const y=(i.yield==null||i.yield===0)?1:i.yield;return i.price/i.ruPerPu/y}
function batchCost(b,seen){seen=seen||new Set();if(seen.has(b.id))return 0;seen.add(b.id);
  return b.lines.reduce((s,l)=>s+(l.qty||0)*unitCostOf(l.ref,seen),0)}
function batchUnit(b,seen){const q=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;return batchCost(b,seen)/q}
function unitCostOf(ref,seen){if(isB(ref)){const b=BX[ref];return b?batchUnit(b,seen):0}
  return costPerRu(IX[codeOf(ref)])}
const lineCost=(l,s)=>(l.qty||0)*unitCostOf(l.ref,s);
const itemCost=m=>m.lines.reduce((s,l)=>s+lineCost(l),0);
const fcPct=m=>{const c=itemCost(m);return m.menuPrice?c/m.menuPrice:null};
const nameOf=r=>isB(r)?(BX[r]?'▣ '+BX[r].name:r):(IX[codeOf(r)]?IX[codeOf(r)].name:r);
const unitOf=r=>isB(r)?(BX[r]?BX[r].yieldUnit:''):(IX[codeOf(r)]?(IX[codeOf(r)].recipeUnit||''):'');
const priced=()=>DATA.menu.filter(m=>m.menuPrice>0);
const anomalies=()=>priced().map(m=>({m,f:fcPct(m)})).filter(x=>x.f>1).sort((a,b)=>b.f-a.f);
const band=f=>f==null?['—','']:f>1?[pct(f),'b']:f>TARGET?[pct(f),'w']:[pct(f),'g'];

// ── THE FIX QUEUE ───────────────────────────────────────────────────────
// The most valuable screen here. 132 unpriced ingredients is a list; the same
// list ordered by HOW MANY DISHES EACH ONE BREAKS is an afternoon's work with
// visible payoff. Fix the top ten and you may repair sixty dishes.
function fixQueue(){
  const impact={};
  const touch=(ref,dish)=>{if(isB(ref))return;const c=codeOf(ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(dish)};
  DATA.menu.forEach(m=>m.lines.forEach(l=>touch(l.ref,m.name)));
  DATA.batch.forEach(b=>b.lines.forEach(l=>{if(isB(l.ref))return;const c=codeOf(l.ref);
    (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).recipes.add(b.name)}));
  // a batch recipe used in dishes propagates its ingredients' breakage upward
  DATA.menu.forEach(m=>m.lines.filter(l=>isB(l.ref)).forEach(l=>{const b=BX[l.ref];
    if(b)b.lines.forEach(bl=>{if(isB(bl.ref))return;const c=codeOf(bl.ref);
      (impact[c]=impact[c]||{dishes:new Set(),recipes:new Set()}).dishes.add(m.name)})}));
  return Object.entries(impact).map(([c,v])=>({ing:IX[c],code:c,
      dishes:[...v.dishes],recipes:[...v.recipes]}))
    .filter(x=>x.ing&&!costPerRu(x.ing))
    .sort((a,b)=>(b.dishes.length+b.recipes.length)-(a.dishes.length+a.recipes.length));
}

// ── MENU ENGINEERING ────────────────────────────────────────────────────
// Food cost % alone is the wrong metric: a 40% dish selling 200/wk beats a 15%
// dish selling 3. Popularity x margin is the decision that matters.
function engineering(){
  const withSales=priced().filter(m=>m.weeklySales>0&&fcPct(m)<=1);
  if(!withSales.length)return null;
  const avgSales=withSales.reduce((s,m)=>s+m.weeklySales,0)/withSales.length;
  const avgGP=withSales.reduce((s,m)=>s+(m.menuPrice-itemCost(m)),0)/withSales.length;
  const cls=m=>{const pop=m.weeklySales>=avgSales, prof=(m.menuPrice-itemCost(m))>=avgGP;
    return pop&&prof?'Star':pop?'Plowhorse':prof?'Puzzle':'Dog'};
  return {avgSales,avgGP,items:withSales.map(m=>({m,k:cls(m),
    gp:m.menuPrice-itemCost(m),weekly:(m.menuPrice-itemCost(m))*m.weeklySales}))
    .sort((a,b)=>b.weekly-a.weekly)};
}

// ── INVOICE / RECEIPT PARSER ────────────────────────────────────────────
// Paste the text of a supplier invoice. No API key, no OCR service, works
// offline. Each line is matched against the ingredient list by word overlap;
// nothing is applied until you approve it, because a bad auto-match silently
// corrupts every dish using that ingredient.
let invText='', invRows=[];
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function scoreMatch(a,b){
  const A=new Set(norm(a).split(' ').filter(w=>w.length>2));
  const B=new Set(norm(b).split(' ').filter(w=>w.length>2));
  if(!A.size||!B.size)return 0;
  let hit=0;A.forEach(w=>{if(B.has(w))hit++});
  return hit/Math.max(A.size,B.size);
}
function parseInvoice(text){
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim(); if(line.length<4)return;
    // numbers that look like money: last plausible decimal on the line
    const nums=line.match(/\d+[.,]\d{1,3}|\d+/g); if(!nums)return;
    const price=parseFloat(nums[nums.length-1].replace(',','.'));
    if(!isFinite(price)||price<=0)return;
    const desc=line.replace(/[\d.,]+\s*$/,'').replace(/^\d+\s*[xX]?\s*/,'').trim();
    if(desc.length<3)return;
    let best=null,bs=0;
    DATA.ingredients.forEach(i=>{const s=scoreMatch(desc,i.name);if(s>bs){bs=s;best=i}});
    out.push({desc,price,match:bs>=0.34?best:null,score:bs,apply:bs>=0.5});
  });
  return out;
}
function applyInvoice(){
  const use=invRows.filter(r=>r.apply&&r.match);
  if(!use.length){alert('Nothing selected to apply.');return}
  if(!confirm(`Update ${use.length} ingredient price(s)?`))return;
  edit(()=>{use.forEach(r=>{const i=IX[r.match.code];if(!i)return;
    i.history=i.history||[];i.history.push({at:Date.now(),from:i.price,to:r.price});
    i.price=r.price;});});
  invRows=[];invText='';R();
}

// ── UNIT-ERROR DETECTOR ─────────────────────────────────────────────────
// The two impossible dishes aren't expensive — someone typed grams where the
// recipe unit is kilos. Rather than just flagging them, work out the likely
// factor and prove it: if dividing by 1000 lands the dish in a sane food-cost
// band, that IS the error. Excel can't do this because it has no notion of
// what a plausible dish costs.
const FACTORS=[1000,100,10];
function unitSuspects(){
  const out=[];
  DATA.menu.forEach((m,mi)=>{
    const total=itemCost(m); if(!total)return;
    const costs=m.lines.map(l=>lineCost(l));
    const med=[...costs].filter(c=>c>0).sort((a,b)=>a-b)[Math.floor(costs.filter(c=>c>0).length/2)]||0;
    m.lines.forEach((l,li)=>{
      const c=lineCost(l); if(!c)return;
      const share=c/total;
      const domin=share>0.7 && med>0 && c>med*10;
      const overprice=m.menuPrice>0 && total>m.menuPrice;
      if(!domin && !overprice) return;
      if(!domin) return;
      // find the factor that lands food cost between 5% and 45%
      let best=null;
      for(const f of FACTORS){
        const t2=total-c+c/f;
        const fc=m.menuPrice?t2/m.menuPrice:null;
        if(fc!=null && fc>=0.05 && fc<=0.45){best={f,newTotal:t2,fc};break}
      }
      out.push({mi,li,dish:m.name,ing:nameOf(l.ref),qty:l.qty,lineCost:c,
        total,share,price:m.menuPrice,fix:best,
        confidence: best? (overprice?'high':'medium') : 'low'});
    });
  });
  return out.sort((a,b)=>b.share-a.share);
}
function applyUnitFix(mi,li,f){
  edit(()=>{const l=DATA.menu[mi].lines[li];l.qty=(l.qty||0)/f});
}

  return {dishes:dishes.filter(d=>{const k=d.name+d.via;if(seen.has(k))return false;seen.add(k);return true}),recipes};

// ── PRODUCTION PLANNER / SHOPPING LIST ──────────────────────────────────
// "We expect this many covers — what do I actually buy?" Explodes every dish
// through its batch recipes down to raw purchasable ingredients, converts
// recipe units back to PURCHASE units, and totals the money. This is the one
// that replaces somebody's Sunday afternoon.
let planDays=7;
function explode(){
  const need={}; // code -> recipe-unit qty
  const add=(ref,qty,seen)=>{
    if(!qty)return;
    if(isB(ref)){
      const b=BX[ref]; if(!b)return;
      seen=seen||new Set(); if(seen.has(b.id))return; seen.add(b.id);
      const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
      b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,new Set(seen)));
      return;
    }
    const c=codeOf(ref); need[c]=(need[c]||0)+qty;
  };
  DATA.menu.forEach(m=>{
    const covers=(m.weeklySales||0)*(planDays/7);
    if(!covers)return;
    m.lines.forEach(l=>add(l.ref,(l.qty||0)*covers));
  });
  return Object.entries(need).map(([c,qty])=>{
    const i=IX[c]; if(!i)return null;
    const perPack=i.ruPerPu||1;
    const packs=qty/perPack;
    return {ing:i,qty,packs,cost:qty*costPerRu(i)};
  }).filter(Boolean).sort((a,b)=>b.cost-a.cost);
}

function dishAllergens(m,seen){

}

// ── DUPLICATE INGREDIENTS ───────────────────────────────────────────────
// 318 hand-typed ingredients will contain near-duplicates. Each one silently
// splits usage across two codes, so neither shows its true consumption and one
// of them usually has a stale price.
function dupScore(a,b){
  // Deliberately NOT scoreMatch: that one drops tokens of 2 chars or fewer,
  // which made "Recipe 2.9" and "Recipe 3.10" both collapse to {recipe} and
  // score 100%. It produced 5,462 false pairs. Numbers and short tokens are
  // exactly what distinguishes near-identical names, so they must count.
  const tok=x=>norm(x).split(' ').filter(Boolean);
  const A=tok(a),B=tok(b);
  if(A.length<2||B.length<2)return 0;            // one-word names are not evidence
  const SA=new Set(A),SB=new Set(B);
  let hit=0;SA.forEach(w=>{if(SB.has(w))hit++});
  const jac=hit/new Set([...A,...B]).size;
  // any differing NUMBER is a strong signal they are different items
  const nA=A.filter(w=>/\d/.test(w)).join(','), nB=B.filter(w=>/\d/.test(w)).join(',');
  if(nA!==nB) return jac*0.45;
  return jac;
}
function duplicates(){
  const out=[]; const ing=DATA.ingredients;
  for(let a=0;a<ing.length;a++)for(let b=a+1;b<ing.length;b++){
    const s=dupScore(ing[a].name,ing[b].name);
    if(s>=0.62) out.push({a:ing[a],b:ing[b],s,
      usedA:whereUsed(ing[a].code),usedB:whereUsed(ing[b].code)});
  }
  return out.sort((x,y)=>y.s-x.s).slice(0,60);
}
function mergeIng(keepCode,dropCode){
  if(!confirm(`Merge — every recipe using ${IX[dropCode].name} will point at ${IX[keepCode].name}. This cannot be auto-undone beyond Undo.`))return;
  edit(()=>{
    const repoint=l=>{if(!isB(l.ref)&&codeOf(l.ref)===dropCode)l.ref=keepCode+'_'+IX[keepCode].name};
    DATA.menu.forEach(m=>m.lines.forEach(repoint));
    DATA.batch.forEach(b=>b.lines.forEach(repoint));
    const i=DATA.ingredients.findIndex(x=>x.code===dropCode);
    if(i>=0)DATA.ingredients.splice(i,1);
  });
}

// ── DISH COST BREAKDOWN (pareto) ────────────────────────────────────────
// Where the money in a dish actually goes. Re-engineering the top line is
// worth more than trimming the other ten.
function breakdown(m){
  const total=itemCost(m); if(!total)return [];
  return m.lines.map(l=>({name:nameOf(l.ref),cost:lineCost(l),share:lineCost(l)/total}))
    .filter(x=>x.cost>0).sort((a,b)=>b.cost-a.cost);
}

// ── DATA HEALTH ─────────────────────────────────────────────────────────
// One number for "how far can I trust anything on this screen".
function health(){
  const usedCodes=new Set();
  DATA.menu.forEach(m=>m.lines.forEach(l=>{if(!isB(l.ref))usedCodes.add(codeOf(l.ref))}));
  DATA.batch.forEach(b=>b.lines.forEach(l=>{if(!isB(l.ref))usedCodes.add(codeOf(l.ref))}));
  const used=[...usedCodes].map(c=>IX[c]).filter(Boolean);
  const pricedIng=used.filter(i=>costPerRu(i)>0).length;
  const dishes=DATA.menu.length, withPrice=priced().length;
  const withSales=DATA.menu.filter(m=>m.weeklySales>0).length;
  const errs=unitSuspects().filter(u=>u.confidence!=='low').length;
  const dups=duplicates().length;
  const checks=[
    {k:'Ingredients priced',v:pricedIng,of:used.length,w:3},
    {k:'Dishes with a menu price',v:withPrice,of:dishes,w:3},
    {k:'Dishes with sales data',v:withSales,of:dishes,w:2},
    {k:'Dishes free of unit errors',v:dishes-errs,of:dishes,w:2},
    {k:'Ingredients without duplicates',v:used.length-Math.min(dups,used.length),of:used.length,w:1},
  ];
  const score=checks.reduce((s,c)=>s+(c.of?c.v/c.of:1)*c.w,0)/checks.reduce((s,c)=>s+c.w,0);
  return {score,checks};
}

// ── RECIPE SCALING ──────────────────────────────────────────────────────
let scaleFactor=1;

// ── VERSATILITY ─────────────────────────────────────────────────────────
// How many places an ingredient earns its shelf space.
//
// Two opposite lessons come out of the same number:
//   HIGH — a workhorse. Every dish moves when its price does, so this is where
//          negotiating a better rate actually pays, and where a supplier
//          switch is most dangerous.
//   ONE  — a single-use ingredient. You buy a pack for one dish, use a
//          fraction, and the rest ages in the walk-in. This is where waste
//          lives, and it never shows up in a recipe cost because spoilage
//          isn't an ingredient.
function versatility(){
  return DATA.ingredients.map(i=>{
    const W=whereUsed(i.code);
    const direct=W.dishes.filter(d=>d.via==='direct').length;
    const viaRec=W.dishes.length-direct;
    const uses=W.dishes.length+W.recipes.length;
    // weekly consumption, if sales figures exist
    let weeklyQty=0;
    const add=(ref,qty,mult,seen)=>{
      if(isB(ref)){const b=BX[ref];if(!b)return;
        seen=seen||new Set();if(seen.has(b.id))return;seen.add(b.id);
        const per=(b.yieldQty==null||b.yieldQty===0)?1:b.yieldQty;
        b.lines.forEach(l=>add(l.ref,(l.qty||0)*qty/per,mult,new Set(seen)));return}
      if(codeOf(ref)===i.code) weeklyQty+=qty*mult;
    };
    DATA.menu.forEach(m=>{const s=m.weeklySales||0;if(!s)return;
      m.lines.forEach(l=>add(l.ref,(l.qty||0),s))});
    const c=costPerRu(i);
    return {ing:i,uses,direct,viaRec,recipes:W.recipes.length,
      dishNames:W.dishes.map(d=>d.name),recipeNames:W.recipes.map(r=>r.name),
      cost:c,weeklyQty,weeklySpend:weeklyQty*c,
      kind: uses===0?'unused' : uses===1?'single-use' : uses>=6?'workhorse' : 'specialist'};
  }).filter(v=>v.uses>0).sort((a,b)=>b.uses-a.uses);
}

// ── PHYSICAL INVENTORY COUNT & VARIANCE ─────────────────────────────────
//
// The equation every restaurant runs on, and the only one that finds money:
//
//   expected = opening + received − theoretical usage
//   variance = actual counted − expected
//
// A negative variance is stock that left without being sold: waste, spoilage,
// over-portioning, or theft. It NEVER appears in a recipe cost, which is why a
// costing sheet can say 22% food cost while the P&L says 34%.
//
// ── The unit trap ───────────────────────────────────────────────────────
// Counts are in INVENTORY units (cases, bottles). Recipes consume RECIPE units
// (grams, each). Converting between them wrongly is the classic way this
// feature produces confident nonsense, so it goes through the purchase unit
// both times rather than being fudged:
//     IU = RU ÷ ruPerPu × iuPerPu
let countDays=7, countDraft={}, countRecv={};

function ruToIu(i,qtyRu){
  const ru=i.ruPerPu||1, iu=i.iuPerPu;
  if(!iu) return qtyRu/ru;               // no inventory unit defined → packs
  return qtyRu/ru*iu;
}
// Theoretical consumption over the period, per ingredient, in INVENTORY units.
function theoreticalUsage(){
  const saved=planDays; planDays=countDays;
  const rows=explode(); planDays=saved;
  const out={};
  rows.forEach(r=>{out[r.ing.code]={ru:r.qty,iu:ruToIu(r.ing,r.qty),cost:r.cost}});
  return out;
}
function countRows(){
  const use=theoreticalUsage();
  return DATA.ingredients.map(i=>{
    const opening=i.currentCount!=null?i.currentCount:(i.startCount||0);
    const recv=parseFloat(countRecv[i.code])||0;
    const u=use[i.code]||{iu:0,ru:0};
    const expected=opening+recv-u.iu;
    const actualRaw=countDraft[i.code];
    const actual=(actualRaw===''||actualRaw==null)?null:parseFloat(actualRaw);
    const variance=actual==null?null:actual-expected;
    // value a shortfall at the cost of ONE inventory unit
    const costIu=i.costPerIu!=null&&i.costPerIu>0?i.costPerIu
      :(i.price&&i.iuPerPu?i.price/i.iuPerPu:costPerRu(i)*(i.ruPerPu||1)/(i.iuPerPu||1));
    return {i,opening,recv,used:u.iu,usedRu:u.ru,expected,actual,variance,
      value:variance==null?null:variance*costIu,costIu,
      counted:actual!=null};
  });
}
// Commit: overwrite stock with what was physically counted, and keep the
// variance permanently. Overwriting without recording the discrepancy would
// erase the only evidence that anything went missing.
function commitCount(){
  const rows=countRows().filter(r=>r.counted);
  if(!rows.length){alert('Enter at least one count first.');return}
  const loss=rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0);
  if(!confirm(`Commit ${rows.length} count(s)?\n\nStock levels will be overwritten with the physical figures.\nRecorded shortfall: ${money(Math.abs(loss))}`))return;
  edit(()=>{
    const at=Date.now();
    rows.forEach(r=>{
      const g=DATA.ingredients.find(x=>x.code===r.i.code); if(!g)return;
      g.counts=g.counts||[];
      g.counts.push({at,opening:r.opening,received:r.recv,used:r.used,
        expected:r.expected,actual:r.actual,variance:r.variance,value:r.value});
      g.currentCount=r.actual;          // physical count wins, always
    });
    DATA.countHistory=DATA.countHistory||[];
    DATA.countHistory.push({at,lines:rows.length,
      shortfall:rows.filter(r=>r.variance<0).reduce((s,r)=>s+r.value,0),
      surplus:rows.filter(r=>r.variance>0).reduce((s,r)=>s+r.value,0),
      days:countDays});
  });
  countDraft={};countRecv={};
  view='countres';R();
}
function lastCount(){const h=DATA.countHistory||[];return h.length?h[h.length-1]:null}

    el.innerHTML=bar+`<div class="card"><h3>Physical inventory count</h3>
    <div class="muted"><b>expected = opening + received − theoretical usage.</b> Whatever you actually count overwrites the system figure, and the difference is kept as evidence. A shortfall is stock that left without being sold — waste, over-portioning, spoilage or theft — and it never shows up in a recipe cost. This is why a costing sheet can say 22% while the P&L says 34%.</div>
    <div class="row" style="margin-top:10px"><span class="muted">Period</span>
      <input value="${countDays}" style="width:64px" onchange="countDays=parseFloat(this.value)||7;R()"><span class="muted">days since last count</span>
      ${lastCount()?`<span class="muted">· last counted ${new Date(lastCount().at).toLocaleDateString()}</span>`:'<span class="pill w">first count</span>'}</div>
    ${entered.length?`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="v">${entered.length}</div><div class="l">Counted</div></div>
      <div class="kpi"><div class="v" style="color:var(--bad)">${money(Math.abs(lossV))}</div><div class="l">Shortfall value</div></div>
      <div class="kpi"><div class="v" style="color:var(--good)">${money(gainV)}</div><div class="l">Surplus value</div></div>
      <div class="kpi"><div class="v" style="color:${(lossV+gainV)<0?'var(--bad)':'var(--good)'}">${money(lossV+gainV)}</div><div class="l">Net variance</div></div></div>`:''}
    <button class="add" style="margin-top:12px" onclick="commitCount()">Commit count — overwrite stock</button></div>
    <div class="card"><input class="search" placeholder="Search ingredient…" oninput="setQ(this.value)" value="${q}">
    <table><thead><tr><th>Ingredient</th><th class="num">Opening</th><th class="num">Received</th><th class="num">Used (theor.)</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th class="num">Value</th></tr></thead><tbody>
    ${list.slice(0,150).map(r=>{
      const vc=r.variance==null?'':r.variance<-0.001?'b':r.variance>0.001?'w':'g';
      return `<tr><td>${r.i.name}<div class="muted" style="font-size:10.5px">${r.i.invUnit||r.i.purchaseUnit||''}</div></td>
      <td class="num muted">${r.opening.toFixed(1)}</td>
      <td class="num"><input value="${countRecv[r.i.code]??''}" placeholder="0" onchange="countRecv['${r.i.code}']=this.value;R()"></td>
      <td class="num muted">${r.used?r.used.toFixed(1):'—'}</td>
      <td class="num"><b>${r.expected.toFixed(1)}</b></td>
      <td class="num"><input value="${countDraft[r.i.code]??''}" placeholder="count" onchange="countDraft['${r.i.code}']=this.value;R()"></td>
      <td class="num">${r.variance==null?'—':`<span class="pill ${vc}">${r.variance>0?'+':''}${r.variance.toFixed(1)}</span>`}</td>
      <td class="num">${r.value==null?'—':money(r.value)}</td></tr>`}).join('')}
    </tbody></table></div>`}

  if(view==='countres'){const H=(DATA.countHistory||[]).slice().reverse();
    const withC=DATA.ingredients.filter(i=>i.counts&&i.counts.length);
    const latest=withC.map(i=>({i,c:i.counts[i.counts.length-1]}))
      .filter(x=>Math.abs(x.c.variance)>0.001).sort((a,b)=>a.c.value-b.c.value);
    el.innerHTML=bar+`<div class="card"><h3>Count history & variance</h3>
    <div class="muted">Where stock went that sales cannot explain.</div></div>
    ${H.length?`<div class="card"><table><thead><tr><th>Date</th><th class="num">Lines</th><th class="num">Days</th><th class="num">Shortfall</th><th class="num">Surplus</th><th class="num">Net</th></tr></thead><tbody>
    ${H.map(h=>`<tr><td>${new Date(h.at).toLocaleString()}</td><td class="num">${h.lines}</td><td class="num muted">${h.days}</td>
      <td class="num" style="color:var(--bad)">${money(Math.abs(h.shortfall))}</td>
      <td class="num" style="color:var(--good)">${money(h.surplus)}</td>
      <td class="num"><b>${money(h.shortfall+h.surplus)}</b></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="card"><div class="muted">No counts committed yet.</div></div>'}
    ${latest.length?`<div class="card"><h3>Biggest discrepancies — last count</h3>
    <table><thead><tr><th>Ingredient</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Variance</th><th class="num">Value</th><th class="num">% off</th></tr></thead><tbody>
    ${latest.slice(0,40).map(({i,c})=>{const p=c.expected?Math.abs(c.variance/c.expected):null;
      return `<tr><td>${i.name}</td><td class="num muted">${c.expected.toFixed(1)}</td><td class="num">${c.actual.toFixed(1)}</td>
      <td class="num"><span class="pill ${c.variance<0?'b':'w'}">${c.variance>0?'+':''}${c.variance.toFixed(1)}</span></td>
      <td class="num">${money(c.value)}</td>
      <td class="num muted">${p==null?'—':(p*100).toFixed(0)+'%'}</td></tr>`}).join('')}
    </tbody></table></div>`:''}`}

}
const restored=load();
render();
if(restored)console.log('restored autosave from',new Date(restored).toLocaleString());
</script></body></html>
