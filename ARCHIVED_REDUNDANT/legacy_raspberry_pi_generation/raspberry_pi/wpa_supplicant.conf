country=US
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

network={
    ssid="YOUR_HOTSPOT_NAME"
    psk="YOUR_HOTSPOT_PASSWORD"
    key_mgmt=WPA-PSK
    priority=1
}

# Backup network (optional - add your home WiFi)
network={
    ssid="YOUR_HOME_WIFI_NAME"
    psk="YOUR_HOME_WIFI_PASSWORD"
    key_mgmt=WPA-PSK
    priority=2
}
