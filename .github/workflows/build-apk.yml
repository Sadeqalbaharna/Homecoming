name: Build & Distribute APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Write dart-defines file
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PICOVOICE_API_KEY: ${{ secrets.PICOVOICE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          keys = {
            "OPENAI_API_KEY":      os.environ.get("OPENAI_API_KEY", ""),
            "ELEVENLABS_API_KEY":  os.environ.get("ELEVENLABS_API_KEY", ""),
            "ELEVENLABS_VOICE_ID": os.environ.get("ELEVENLABS_VOICE_ID", ""),
            "PICOVOICE_API_KEY":   os.environ.get("PICOVOICE_API_KEY", ""),
            "GOOGLE_API_KEY":      os.environ.get("GOOGLE_API_KEY", ""),
            "GOOGLE_CSE_ID":       os.environ.get("GOOGLE_CSE_ID", ""),
          }
          # Print key status for CI debugging (never prints values)
          for k, v in keys.items():
            status = f"SET ({len(v)} chars)" if v else "MISSING"
            print(f"  {k}: {status}")
          if not keys["OPENAI_API_KEY"]:
            print("ERROR: OPENAI_API_KEY is empty — check GitHub secret OPEN_API_KEY", file=sys.stderr)
            sys.exit(1)
          with open("dart_defines.json", "w") as f:
            json.dump(keys, f)
          print("dart_defines.json written successfully")
          PYEOF

      - name: Build debug APK
        run: |
          flutter build apk --debug --target=lib/main.dart \
            --dart-define-from-file=dart_defines.json

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:632366966739:android:351bee9e47901e29ac3126
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecoming-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
