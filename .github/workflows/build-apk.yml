name: Build & Distribute APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Write secrets.dart
        env:
          OPENAI_API_KEY:      ${{ secrets.OPEN_API_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PICOVOICE_API_KEY:   ${{ secrets.PICOVOICE_API_KEY }}
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:       ${{ secrets.GOOGLE_CSE_ID }}
        run: |
          cat > lib/secrets.dart << EOF
          // AUTO-GENERATED by CI — do not commit
          const kOpenAIKey         = '${OPENAI_API_KEY}';
          const kElevenLabsKey     = '${ELEVENLABS_API_KEY}';
          const kElevenLabsVoiceId = '${ELEVENLABS_VOICE_ID}';
          const kPicovoiceKey      = '${PICOVOICE_API_KEY}';
          const kGoogleApiKey      = '${GOOGLE_API_KEY}';
          const kGoogleCseId       = '${GOOGLE_CSE_ID}';
          EOF
          echo "secrets.dart written — key lengths:"
          echo "  OPENAI:      ${#OPENAI_API_KEY} chars"
          echo "  ELEVENLABS:  ${#ELEVENLABS_API_KEY} chars"
          echo "  PICOVOICE:   ${#PICOVOICE_API_KEY} chars"
          echo "  GOOGLE:      ${#GOOGLE_API_KEY} chars"

      - name: Build debug APK
        run: flutter build apk --debug --target=lib/main.dart

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:632366966739:android:351bee9e47901e29ac3126
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecoming-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
