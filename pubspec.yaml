name: homecoming_app
description: Overlay avatar app (mobile + desktop)
publish_to: "none"
version: 0.7.5+121

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # UI
  lottie: ^3.1.0
  cupertino_icons: ^1.0.8
  gif: ^2.3.0
  http: ^1.2.0
  # Desktop-specific packages (will be ignored on mobile)
  window_manager: ^0.3.9
  flutter_acrylic: ^1.1.4
  # Net
  dio: ^5.5.0
  html: ^0.15.4
  syncfusion_flutter_pdf: ^27.1.58
  # Audio (choose ONE lib → audioplayers)
  audioplayers: ^6.0.0
  # Voice input - using native Android MediaRecorder via MethodChannel
  permission_handler: ^11.0.0
  # Secure storage for API keys
  flutter_secure_storage: ^9.0.0
  # State management
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  # Storage & data
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  # Firebase Integration
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  cloud_functions: ^5.1.3
  # Use local modified flutter_overlay_window for click-through support
  flutter_overlay_window:
    path: packages/flutter_overlay_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/kai_idle.json
    - assets/avatar/kai_talk.json
    - assets/avatar/images/mage.png
    - assets/audio/record_start.wav
    - assets/audio/record_stop.wav
    # Frame-based animations (lightweight PNG sequences)
    - assets/avatar/idle_frames/
    - assets/avatar/attention_frames/
    - assets/avatar/thinking_frames/
    - assets/avatar/speaking_frames/

