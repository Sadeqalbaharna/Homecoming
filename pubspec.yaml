name: homecoming_app
description: Overlay avatar app (mobile + desktop)
publish_to: "none"
version: 0.9.0+159

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Net
  http: ^1.2.0
  dio: ^5.5.0
  html: ^0.15.4
  syncfusion_flutter_pdf: ^27.1.58
  # Audio
  audioplayers: ^6.0.0
  # Permissions / storage
  permission_handler: ^11.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  # 3D Brain WebView
  webview_flutter: ^4.8.0
  # Folder picker — code workspace (engineer mode)
  file_picker: ^8.1.2
  # Smart home — WebSocket TV control + SSDP discovery
  web_socket_channel: ^3.0.1
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  # Wake word detection (on-device, no API key)
  sherpa_onnx: ^1.10.30
  # Tarball extraction for sherpa model download
  archive: ^3.6.1
  # PCM audio streaming — native EventChannel impl (no external package needed)
  # NFC read/write
  nfc_manager: ^3.3.0
  # Overlay window (local fork)
  flutter_overlay_window:
    path: packages/flutter_overlay_window

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brain/kai_cortex.html
    - assets/avatar/images/mage.png
    - assets/audio/record_start.wav
    - assets/audio/record_stop.wav
    # Frame-based animations (PNG sequences)
    - assets/avatar/idle_frames/
    - assets/avatar/attention_frames/
    - assets/avatar/thinking_frames/
    - assets/avatar/speaking_frames/
    # Flame overlay animation frames (sleep mode)
    - assets/avatar/flame_frames/
    # Sherpa ONNX models downloaded at runtime — no bundled assets needed
    - assets/models/

